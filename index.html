    function exportToExcel(filename, rows) {
      if (!rows || !rows.length) return;
      const cleanRows = rows.map(r => ({
        "Group": r.group,
        "Particulars": r.particulars,
        "Brand": r.brand,
        "Serial No": r.serialNo,
        "Cable Length (m)": r.cableLength,
        "Unit": r.measurementUnit,
        "Opening Qty": r.openingQty,
        "New Purchase": r.newPurchase,
        "Issued Items": r.issueItems,
        "Balance Stock": (Number(r.openingQty || 0) + Number(r.newPurchase || 0)) - (Number(r.issueItems || 0) + Number(r.shortItems || 0) + Number(r.deadItems || 0)),
        "Short Items": r.shortItems,
        "Dead Items": r.deadItems,
        "Min Stock Alert": r.minAlert || 2,
        "Category": r.category,
        "Location": r.location,
        "Last Updated": r.lastUpdated
      }));
      const worksheet = XLSX.utils.json_to_sheet(cleanRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Stock Register");
      XLSX.writeFile(workbook, filename.endsWith('.xlsx') ? filename : filename + '.xlsx');
    }

      const getCurrentMonthYear = () => {
        const d = new Date();

      const sampleFallbackHistory = [

      ];

      // ============================================================
      // Fix #2: Deduplicate on fetch — purane duplicate records UI me nahi dikhenge
      // ============================================================
      const dedupeAssets = (list) => {
        const seen = new Map();
        list.forEach(item => {
          const sig = `${(item.particulars || '').trim().toUpperCase()}|${(item.brand || '').trim().toUpperCase()}|${(item.serialNo || '').trim().toUpperCase()}`;
          const existing = seen.get(sig);
          if (!existing) {
            seen.set(sig, item);
          } else {
            const itemTime = new Date(item.lastUpdated || 0).getTime() || 0;
            const existingTime = new Date(existing.lastUpdated || 0).getTime() || 0;
            if (itemTime > existingTime) seen.set(sig, item);
          }
        });
        return Array.from(seen.values());
      };

      const fetchAllData = async (silent = true) => {
        if (!silent) setIsSyncing(true);
        try {
          const [resAssets, resTemp, resPm, resLogs, resUsers, resHist] = await Promise.allSettled([
            fetch(FIREBASE_DB_URL).then(r => r.json()),
            fetch(FIREBASE_TEMP_URL).then(r => r.json()),
            fetch(FIREBASE_PM_URL).then(r => r.json()),
            fetch(FIREBASE_PM_LOGS_URL).then(r => r.json()),
            fetch(FIREBASE_USERS_URL).then(r => r.json()),
            fetch(FIREBASE_HISTORY_URL).then(r => r.json())
          ]);

          if (resAssets.status === 'fulfilled' && resAssets.value) {
            const loaded = Object.keys(resAssets.value).map(k => ({ ...resAssets.value[k], firebaseKey: k }));
            const deduped = dedupeAssets(loaded);
            setAssets(deduped.length > 0 ? deduped : sampleFallbackAssets);
          } else if (assets.length === 0) {
            setAssets(sampleFallbackAssets);
          }

            setTempDispatches(Object.keys(resTemp.value).map(k => ({ ...resTemp.value[k], firebaseKey: k })));

      const logStockHistory = async (itemName, actionType, details) => {
        const newHistoryItem = {
          id: `hist_${Date.now()}`,
          timestamp: getFormattedDateTime(),
          itemName: itemName.toUpperCase(),
          actionType,
          details
        };
        try {
          await fetch(FIREBASE_HISTORY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newHistoryItem)
          });
          setStockHistory(prev => [newHistoryItem, ...prev]);
        } catch (e) {
          setStockHistory(prev => [newHistoryItem, ...prev]);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(worksheet);

            if (!json || json.length === 0) {
              showToast("Uploaded Excel file is empty.", "error");
              return;
            }

            const importedAssets = json.map((row, idx) => ({
              id: Date.now() + idx,
              group: String(row["Group"] || row["group"] || "GENERAL").toUpperCase(),
              particulars: String(row["Particulars"] || row["particulars"] || "UNNAMED ITEM").toUpperCase(),
              brand: String(row["Brand"] || row["brand"] || "Dell"),
              serialNo: String(row["Serial No"] || row["serialNo"] || ""),
              cableLength: String(row["Cable Length (m)"] || row["cableLength"] || ""),
              measurementUnit: String(row["Unit"] || row["measurementUnit"] || "Piece"),
              openingQty: Number(row["Opening Qty"] || row["openingQty"] || 0),
              newPurchase: Number(row["New Purchase"] || row["newPurchase"] || 0),
              issueItems: Number(row["Issued Items"] || row["issueItems"] || 0),
              shortItems: Number(row["Short Items"] || row["shortItems"] || 0),
              deadItems: Number(row["Dead Items"] || row["deadItems"] || 0),
              minAlert: Number(row["Min Stock Alert"] || row["minAlert"] || 2),
              category: String(row["Category"] || row["category"] || "Consumable"),
              location: String(row["Location"] || row["location"] || "IT Stores"),
              entryMonth: getCurrentMonthYear(),
              lastUpdated: getFormattedDateTime()
            }));

            for (let item of importedAssets) {
              await fetch(FIREBASE_DB_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
              });
              await logStockHistory(item.particulars, 'EXCEL IMPORT', `Imported via Excel spreadsheet. Opening: ${item.openingQty}, Purchase: ${item.newPurchase}`);
            }

            fetchAllData(false);
            showToast(`Successfully imported ${importedAssets.length} items from Excel!`, "success");
          } catch (err) {
            console.error(err);
            showToast("Failed to parse Excel file. Ensure valid column names.", "error");
          }
          if (fileInputRef.current) fileInputRef.current.value = '';
        };
        reader.readAsArrayBuffer(file);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u =>
          (String(u.username).trim().toLowerCase() === String(usernameInput).trim().toLowerCase() ||
           String(u.name).trim().toLowerCase() === String(usernameInput).trim().toLowerCase()) &&
          String(u.pin).trim() === String(pinInput).trim() &&
          u.status === 'Active'
        );

        if (matched) {
          setIsLoggedIn(true);
          setLoggedInUser(matched);
          setLoginError('');
          showToast(`Authenticated as ${matched.name} (${matched.role})`, "success");
        } else {
          setLoginError('Invalid Username or Security PIN code.');
        }
      };

      const [formData, setFormData] = useState({
        group: 'CABLE', particulars: '', brand: 'Dell', customBrand: '', serialNo: '',
        vendor: '', invoiceNo: '', warranty: '', cableLength: '', measurementUnit: 'Piece',
        openingQty: 0, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0,
        minAlert: 2, category: 'Consumable', location: '',
        entryMonth: getCurrentMonthYear(), lastUpdated: getFormattedDateTime()
      });

      // ============================================================
      // Fix #1: Single POST + immediate local state insert + double-click guard
      // ============================================================
      const handleSaveAsset = async (e) => {
        e.preventDefault();
        if (isSavingRef.current) return; // prevent double-click duplicate
        isSavingRef.current = true;

        const timestamped = getFormattedDateTime();
        const finalBrand = formData.brand === 'Other' ? formData.customBrand : formData.brand;

        if (editingAsset) {
          const diffPurchase = Number(formData.newPurchase || 0) - Number(editingAsset.newPurchase || 0);
          const diffIssue = Number(formData.issueItems || 0) - Number(editingAsset.issueItems || 0);

          const updated = {
            ...editingAsset,
            ...formData,
            brand: finalBrand,
            lastUpdated: timestamped
          };
          try {
            if (editingAsset.firebaseKey) {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updated)
              });
            }
            setAssets(prev => prev.map(a =>
              (a.id === editingAsset.id || a.firebaseKey === editingAsset.firebaseKey) ? updated : a
            ));

            if (diffPurchase > 0) {
              await logStockHistory(formData.particulars, `NEW PURCHASE (+${diffPurchase})`, `Stock replenished with ${diffPurchase} new units. Total Purchase is now ${formData.newPurchase}.`);
            }
            if (diffIssue > 0) {
              await logStockHistory(formData.particulars, `CONSUMED / ISSUED (-${diffIssue})`, `Stock consumed/issued increased by ${diffIssue} units. Total Issued is now ${formData.issueItems}.`);
            }

            showToast("Asset specification successfully updated!", "success");
          } catch(err) {
            showToast("Error updating record in database.", "error");
          }
        } else {
          const newAsset = {
            id: Date.now(),
            ...formData,
            brand: finalBrand,
            lastUpdated: timestamped
          };
          try {
            // Single POST — get real Firebase key back
            const postRes = await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newAsset)
            });
            const postData = await postRes.json();
            const savedAsset = { ...newAsset, firebaseKey: postData?.name };

            // Insert directly into local state — no refetch, no race
            setAssets(prev => {
              const exists = prev.some(a => a.firebaseKey === savedAsset.firebaseKey || a.id === savedAsset.id);
              return exists ? prev : [savedAsset, ...prev];
            });

            await logStockHistory(newAsset.particulars, 'INITIAL REGISTRATION', `New item registered. Opening Qty: ${newAsset.openingQty}, Purchase: ${newAsset.newPurchase}`);
            showToast("New asset registered successfully!", "success");
          } catch(err) {
            const localAsset = { ...newAsset };
            setAssets(prev => {
              const exists = prev.some(a => a.id === localAsset.id);
              return exists ? prev : [localAsset, ...prev];
            });
            showToast("Asset saved locally.", "info");
          }
        }

        isSavingRef.current = false;
        setIsModalOpen(false);
        setEditingAsset(null);
      };

      const handleDeleteAsset = async (item) => {
        if (window.confirm(`Permanently remove "${item.particulars}" from active registry?`)) {
          try {
            if (item.firebaseKey) {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${item.firebaseKey}.json`, {
                method: 'DELETE'
              });
            }
            await logStockHistory(item.particulars, 'DELETED ITEM', `Asset particulars "${item.particulars}" deleted from active stock register.`);
            setAssets(prev => prev.filter(a => a.id !== item.id && a.firebaseKey !== item.firebaseKey));
            showToast("Asset record successfully deleted.", "info");
          } catch(err) {
            showToast("Failed to delete record.", "error");
          }
        }
      };

      const summaryMetrics = useMemo(() => {
        let totalItems = 0;
        let totalIssued = 0;
        let totalShort = 0;
        let totalDead = 0;
        let lowStockCount = 0;

        assets.forEach(a => {
          const op = Number(a.openingQty || 0);
          const pur = Number(a.newPurchase || 0);
          const iss = Number(a.issueItems || 0);
          const sh = Number(a.shortItems || 0);
          const dd = Number(a.deadItems || 0);
          const bal = (op + pur) - (iss + sh + dd);
          totalItems += (op + pur);
          totalIssued += iss;
          totalShort += sh;
          totalDead += dd;
          if (bal <= Number(a.minAlert || 2)) lowStockCount++;
        });

        return { totalItems, totalIssued, totalShort, totalDead, lowStockCount };
      }, [assets]);

      const groupCounts = useMemo(() => {
        return assets.reduce((acc, curr) => {
          const g = curr.group || 'OTHER';
          acc[g] = (acc[g] || 0) + 1;
          return acc;
        }, {});
      }, [assets]);

      const filteredAssets = useMemo(() => {
        return assets.filter(item => {
          const searchLower = searchQuery.toLowerCase();
          const matchesSearch = (item.particulars || '').toLowerCase().includes(searchLower) ||
                              (item.group || '').toLowerCase().includes(searchLower) ||
                              (item.serialNo || '').toLowerCase().includes(searchLower) ||
                              (item.brand || '').toLowerCase().includes(searchLower) ||
                              (item.location || '').toLowerCase().includes(searchLower);
          const matchesLocation = locationFilter === 'All' || !locationFilter || (item.location || '').toLowerCase() === locationFilter.toLowerCase();
          const matchesGroup = !selectedGroupFilter || (item.group || '').toLowerCase() === selectedGroupFilter.toLowerCase();
          return matchesSearch && matchesLocation && matchesGroup;
        });
      }, [assets, searchQuery, locationFilter, selectedGroupFilter]);

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const paginatedAssets = useMemo(() => {
        return filteredAssets.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
      }, [filteredAssets, currentPage, itemsPerPage]);

      return (
        <div className="flex h-screen bg-slate-100 text-slate-800 overflow-hidden font-sans">

          {toast.show && (
            <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl border text-xs font-semibold flex items-center gap-2.5 transition-all transform ${
              toast.type === 'success' ? 'bg-slate-900 text-white border-emerald-500/40' :
              toast.type === 'error' ? 'bg-rose-900 text-white border-rose-500/40' :
              'bg-slate-900 text-white border-slate-700'
            }`}>
              <span className={`w-2 h-2 rounded-full ${toast.type === 'success' ? 'bg-emerald-400' : toast.type === 'error' ? 'bg-rose-400' : 'bg-brand-400'}`}></span>
              <span>{toast.msg}</span>
            </div>
          )}

          <input
            type="file"
            ref={fileInputRef}
            onChange={handleFileUpload}
            accept=".xlsx, .xls, .csv"
            className="hidden"
          />

          <aside className="w-72 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 border-r border-slate-800 shrink-0">
            <div className="space-y-4 flex flex-col h-full overflow-hidden">

              <div className="flex items-center gap-3 px-2 py-3 border-b border-slate-800 shrink-0">
                <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-brand-600/30">
                  <Icons.Stock />
                </div>
                <div>
                  <h2 className="text-xs font-black tracking-wider uppercase text-white">ASSET SUITE</h2>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span className="text-[10px] text-slate-400 font-mono">Sync: {lastSyncTime}</span>
                  </div>
                </div>
              </div>

              <nav className="space-y-1 text-xs font-semibold overflow-y-auto pr-1 flex-1">
                {[
                  { id: 'inventory', label: '1. Stock Register', icon: Icons.Stock },
                  { id: 'temp_deploy', label: '2. Temporary Deployment', icon: Icons.Exchange },
                  { id: 'preventive_maint', label: '3. Preventive Maintenance', icon: Icons.Settings },
                  { id: 'stock_ledger', label: '4. Stock Ledger & Analytics', icon: Icons.Report },
                  { id: 'asset_lifecycle', label: '5. Warranty & Lifecycle', icon: Icons.Shield },
                  { id: 'vendors', label: '6. Vendors & Procurement', icon: Icons.Building },
                  { id: 'users', label: '7. Privileges & Access', icon: Icons.Users },
                ].map(tab => {
                  const IconComponent = tab.icon;
                  const isActive = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition cursor-pointer text-left ${
                        isActive
                          ? 'bg-brand-600 text-white font-bold shadow-md shadow-brand-600/25'
                          : 'text-slate-400 hover:bg-slate-800/80 hover:text-white'
                      }`}
                    >
                      <IconComponent />
                      <span>{tab.label}</span>
                    </button>
                  );
                })}
              </nav>

              <div className="bg-slate-800/60 p-3 rounded-2xl border border-slate-700/60 space-y-2 shrink-0">
                <div className="flex justify-between items-center text-[10px] uppercase font-bold text-slate-400">
                  <span>Inventory Health</span>
                  <span className="text-emerald-400 font-mono">99.8%</span>
                </div>
                <div className="grid grid-cols-2 gap-2 text-center">
                  <div className="bg-slate-900/80 p-2 rounded-xl">
                    <div className="text-[10px] text-slate-400">Total Stock</div>
                    <div className="text-sm font-extrabold text-white font-mono">{summaryMetrics.totalItems}</div>
                  </div>
                  <div className="bg-slate-900/80 p-2 rounded-xl">
                    <div className="text-[10px] text-slate-400">Low Stock</div>
                    <div className={`text-sm font-extrabold font-mono ${summaryMetrics.lowStockCount > 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                      {summaryMetrics.lowStockCount}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div className="pt-3 border-t border-slate-800 space-y-2 shrink-0">
              <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/80 flex items-center justify-between">
                <div className="flex items-center gap-2.5 overflow-hidden">
                  <div className="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-xs">
                    {loggedInUser ? loggedInUser.name.charAt(0) : 'A'}
                  </div>
                  <div className="truncate">
                    <div className="text-xs font-bold text-white truncate">{loggedInUser ? loggedInUser.name : 'Super Admin'}</div>
                    <div className="text-[10px] text-indigo-400 font-medium truncate">{loggedInUser ? loggedInUser.role : 'Administrator'}</div>
                  </div>
                </div>
                <button
                  onClick={() => fetchAllData(false)}
                  disabled={isSyncing}
                  title="Manual Sync"
                  className={`p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-700 transition ${isSyncing ? 'animate-spin text-brand-400' : ''}`}
                >
                  <Icons.Refresh />
                </button>
              </div>

              <button
                onClick={() => {
                  setIsLoggedIn(false);
                  setLoggedInUser(null);
                  setPinInput('');
                  setUsernameInput('');
                }}
                className="w-full py-2 bg-slate-800 hover:bg-rose-950/50 hover:text-rose-300 text-slate-400 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 border border-slate-700/60"
              >
                <Icons.SignOut /> Sign Out
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden bg-slate-100 p-6 space-y-4">

            {activeTab === 'inventory' && (
              <div className="flex-1 flex flex-col overflow-hidden space-y-4">

                <div className="bg-white border border-slate-200/90 p-4 rounded-2xl shadow-xs space-y-2.5">
                  <div className="flex justify-between items-center">
                    <div className="text-xs font-extrabold uppercase tracking-wider text-slate-600 flex items-center gap-2">
                      <Icons.Stock /> Stock Control & Auto-Calculation Suite
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setShowHistoryModal(true)}
                        className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold rounded-xl flex items-center gap-1.5 transition"
                      >
                        <Icons.Report /> Stock History / Log ({stockHistory.length})
                      </button>
                      <button
                        onClick={() => fileInputRef.current.click()}
                        className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-bold rounded-xl flex items-center gap-1.5 transition"
                      >
                        <Icons.Upload /> Import Excel
                      </button>
                      <button
                        onClick={() => exportToExcel(`Stock_Register_${Date.now()}.xlsx`, assets)}
                        className="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-bold rounded-xl flex items-center gap-1.5 transition"
                      >
                        <Icons.Download /> Export Excel
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center gap-2.5 overflow-x-auto pb-1 scrollbar-thin">
                    <button
                      onClick={() => setSelectedGroupFilter('')}
                      className={`min-w-[130px] p-2.5 rounded-xl text-left border transition cursor-pointer ${
                        selectedGroupFilter === ''
                          ? 'bg-brand-600 border-brand-600 text-white shadow-sm'
                          : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      <div className="text-xs font-black uppercase">ALL GROUPS</div>
                      <div className={`text-[10px] font-semibold mt-0.5 ${selectedGroupFilter === '' ? 'text-brand-100' : 'text-slate-500'}`}>
                        {assets.length} items logged
                      </div>
                    </button>

                    {Object.keys(groupCounts).map(grp => {
                      const count = groupCounts[grp];
                      const isSelected = selectedGroupFilter.toLowerCase() === grp.toLowerCase();
                      return (
                        <button
                          key={grp}
                          onClick={() => setSelectedGroupFilter(grp)}
                          className={`min-w-[140px] p-2.5 rounded-xl text-left border transition cursor-pointer flex justify-between items-start ${
                            isSelected
                              ? 'bg-brand-600 border-brand-600 text-white shadow-sm'
                              : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                          }`}
                        >
                          <div>
                            <div className="text-xs font-black uppercase tracking-tight">{grp}</div>
                            <div className={`text-[10px] font-semibold mt-0.5 ${isSelected ? 'text-brand-100' : 'text-slate-500'}`}>
                              {count} assets
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <header className="bg-white border border-slate-200/90 p-4 rounded-2xl shadow-xs flex flex-wrap justify-between items-center gap-4">
                  <div className="flex items-center gap-3">
                    <h1 className="text-sm font-extrabold text-slate-900 tracking-wide uppercase">Stock Register (Auto-Updating Balance)</h1>
                    <span className="px-2.5 py-0.5 bg-slate-100 text-slate-600 font-mono text-xs rounded-full font-bold">
                      {filteredAssets.length} Records
                    </span>
                  </div>

                  <div className="flex items-center gap-2.5">
                    <div className="relative">
                      <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <Icons.Search />
                      </span>
                      <input
                        type="text"
                        placeholder="Search particulars, cable, tag..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="pl-9 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium text-slate-800 outline-none focus:ring-2 focus:ring-brand-500 w-64"
                      />
                    </div>

                    <select
                      value={locationFilter}
                      onChange={(e) => setLocationFilter(e.target.value)}
                      className="px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 outline-none"
                    >
                      <option value="All">Location: All</option>
                      <option value="IT Stores">IT Stores</option>
                      <option value="Server Room">Server Room</option>
                      <option value="NOC Room">NOC Room</option>
                      <option value="Design Lab">Design Lab</option>
                    </select>

                    <button
                      onClick={() => {
                        setEditingAsset(null);
                        setFormData({
                          group: 'CABLE', particulars: '', brand: 'Dell', customBrand: '', serialNo: '',
                          vendor: '', invoiceNo: '', warranty: '', cableLength: '', measurementUnit: 'Piece',
                          openingQty: 0, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0,
                          minAlert: 2, category: 'Consumable', location: 'IT Stores',
                          entryMonth: getCurrentMonthYear(), lastUpdated: getFormattedDateTime()
                        });
                        setIsModalOpen(true);
                      }}
                      className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-md shadow-brand-600/20 transition flex items-center gap-1.5"
                    >
                      <Icons.Plus /> Register New Asset / Purchase
                    </button>
                  </div>
                </header>

                <div className="bg-white rounded-2xl shadow-xs border border-slate-200/90 flex-1 flex flex-col overflow-hidden">
                  <div className="overflow-auto flex-1">
                    <table className="w-full text-left border-collapse table-compact text-xs">
                      <thead className="bg-slate-50 text-slate-600 uppercase font-extrabold text-[10px] sticky top-0 z-10 border-b border-slate-200">
                        <tr>
                          <th className="p-3 w-32 text-center">Action</th>
                          <th>Group / Particulars</th>
                          <th>Brand & Specification</th>
                          <th className="text-center">Opening</th>
                          <th className="text-center text-brand-600">New Purchase (+)</th>
                          <th className="text-center text-amber-600">Issued / HR (-)</th>
                          <th className="text-center bg-slate-100 font-black">Net Balance</th>
                          <th className="text-center">Min Alert</th>
                          <th className="text-center">Short</th>
                          <th className="text-center">Dead</th>
                          <th>Location</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                        {loading ? (
                          <tr><td colSpan="11" className="text-center py-14 text-slate-400 font-semibold">Loading stock records...</td></tr>
                        ) : paginatedAssets.length === 0 ? (
                          <tr><td colSpan="11" className="text-center py-14 text-slate-400 font-semibold">No assets found. Click "+ Register New Asset" to add items.</td></tr>
                        ) : (
                          paginatedAssets.map((item) => {
                            const opening = Number(item.openingQty || 0);
                            const purch = Number(item.newPurchase || 0);
                            const issue = Number(item.issueItems || 0);
                            const short = Number(item.shortItems || 0);
                            const dead = Number(item.deadItems || 0);
                            const minAlertQty = Number(item.minAlert || 2);

                            const bal = (opening + purch) - (issue + short + dead);
                            const isLow = bal <= minAlertQty;

                            return (
                              <tr key={item.firebaseKey || `local-${item.id}`} className={`hover:bg-slate-50/80 transition ${isLow ? 'bg-amber-50/30' : ''}`}>
                                <td className="p-2 text-center whitespace-nowrap">
                                  <div className="inline-flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                                    <button
                                      onClick={() => setViewModalItem(item)}
                                      title="Print Asset Slip"
                                      className="p-1 hover:bg-white text-brand-600 rounded-lg transition"
                                    >
                                      <Icons.Eye />
                                    </button>
                                    <button
                                      onClick={() => {
                                        setEditingAsset(item);
                                        setFormData({
                                          group: item.group || 'CABLE',
                                          particulars: item.particulars || '',
                                          brand: ['Dell','HP','Lenovo','Cisco','Logitech','Honeywell'].includes(item.brand) ? item.brand : 'Other',
                                          customBrand: ['Dell','HP','Lenovo','Cisco','Logitech','Honeywell'].includes(item.brand) ? '' : (item.brand || ''),

                  <div><span className="text-slate-400 font-bold block text-[10px] uppercase">Particulars</span> <strong className="text-slate-900 text-sm">{viewModalItem.particulars}</strong></div>
                  <div><span className="text-slate-400 font-bold block text-[10px] uppercase">Asset Group</span> <strong className="text-slate-900">{viewModalItem.group}</strong></div>
                  <div><span className="text-slate-400 font-bold block text-[10px] uppercase">Brand & Specs</span> {viewModalItem.brand === 'Other' ? viewModalItem.customBrand : viewModalItem.brand}</div>
                  <div><span className="text-slate-400 font-bold block text-[10px] uppercase">Net Balance Stock</span> <span className="font-mono font-black text-emerald-600 text-sm">{(Number(viewModalItem.openingQty || 0) + Number(viewModalItem.newPurchase || 0)) - (Number(viewModalItem.issueItems || 0) + Number(viewModalItem.shortItems || 0) + Number(viewModalItem.deadItems || 0))} {viewModalItem.measurementUnit}</span></div>
                </div>

                <div className="pt-8 border-t border-slate-200 grid grid-cols-2 gap-8 text-center text-xs">
                  <div>
                    <div className="h-10 border-b border-dashed border-slate-300"></div>
                    <div className="mt-2 font-bold text-slate-600">Store Officer Signature</div>
                  </div>
                  <div>
                    <div className="h-10 border-b border-dashed border-slate-300"></div>
                    <div className="mt-2 font-bold text-slate-600">Authorized Receiver Signature</div>
                  </div>
                </div>

                <div className="no-print flex justify-end gap-2 pt-4">
                  <button onClick={() => window.print()} className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md transition">
                    Print Official Slip
                  </button>
                  <button onClick={() => setViewModalItem(null)} className="px-4 py-2.5 rounded-xl bg-slate-200 text-slate-700 font-bold text-xs hover:bg-slate-300 transition">
                    Dismiss
                  </button>
                </div>
              </div>
            </div>
          )}

          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-2xl w-full p-6 space-y-4 my-8 text-slate-800">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <h3 className="font-extrabold text-sm text-slate-900">
                    {editingAsset ? 'Update Stock & Purchase Entry' : 'Register New Asset / Stock Purchase'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>

                <form onSubmit={handleSaveAsset} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Asset Group Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. CABLE, MOUSE, KEYBOARD"
                        value={formData.group}
                        onChange={(e) => setFormData({ ...formData, group: e.target.value.toUpperCase() })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-bold text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Item Particulars *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. HDMI CABLE 3M"
                        value={formData.particulars}
                        onChange={(e) => setFormData({ ...formData, particulars: e.target.value.toUpperCase() })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-bold text-slate-900"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Brand Name *</label>
                      <select
                        value={formData.brand}
                        onChange={(e) => setFormData({ ...formData, brand: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-semibold text-slate-900"
                      >
                        <option value="Dell">Dell</option>
                        <option value="HP">HP</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="Cisco">Cisco</option>
                        <option value="Logitech">Logitech</option>
                        <option value="Honeywell">Honeywell</option>
                        <option value="Other">Other (Custom)</option>
                      </select>
                    </div>

                    {formData.brand === 'Other' && (
                      <div>
                        <label className="block font-semibold text-slate-600 mb-1">Custom Brand *</label>
                        <input
                          type="text"
                          required
                          placeholder="Brand Name"
                          value={formData.customBrand}
                          onChange={(e) => setFormData({ ...formData, customBrand: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 font-semibold"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Category *</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-semibold text-slate-900"
                      >
                        <option value="Consumable">Consumable</option>
                        <option value="Non-Consumable">Non-Consumable</option>
                        <option value="Fixed Assets">Fixed Assets</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Assigned Location</label>
                      <input
                        type="text"
                        placeholder="e.g. IT Stores"
                        value={formData.location}
                        onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-semibold text-slate-900"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-4 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Serial / Asset Tag</label>
                      <input
                        type="text"
                        placeholder="e.g. HD-3M-01"
                        value={formData.serialNo}
                        onChange={(e) => setFormData({ ...formData, serialNo: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Cable Length (m)</label>
                      <input
                        type="text"
                        placeholder="e.g. 3.0"
                        value={formData.cableLength}
                        onChange={(e) => setFormData({ ...formData, cableLength: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Unit of Measure</label>
                      <select
                        value={formData.measurementUnit}
                        onChange={(e) => setFormData({ ...formData, measurementUnit: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-semibold text-slate-900"
                      >
                        <option value="Piece">Piece</option>
                        <option value="Meter">Meter</option>
                        <option value="GB">GB</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Min Stock Alert Qty *</label>
                      <input
                        type="number"
                        min="0"
                        required
                        value={formData.minAlert}
                        onChange={(e) => setFormData({ ...formData, minAlert: Number(e.target.value) })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono text-slate-900 font-bold"
                      />
                    </div>
                  </div>

                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                    <div className="text-[11px] font-extrabold text-brand-600 uppercase">
                      Stock Calculation Formula: Net Balance = (Opening + New Purchase) - (Issued + Short + Dead)
                    </div>
                    <div className="grid grid-cols-5 gap-3">
                      <div>
                        <label className="block font-semibold text-slate-600 mb-1">Opening Qty</label>
                        <input
                          type="number"
                          min="0"
                          value={formData.openingQty}
                          onChange={(e) => setFormData({ ...formData, openingQty: Number(e.target.value) })}
                          className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-slate-900"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold text-brand-600 mb-1">New Purchase (+)</label>
                        <input
                          type="number"
                          min="0"
                          value={formData.newPurchase}
                          onChange={(e) => setFormData({ ...formData, newPurchase: Number(e.target.value) })}
                          className="w-full p-2 bg-white border border-brand-300 rounded-lg font-mono font-bold text-brand-600"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold text-amber-600 mb-1">Issued / HR (-)</label>
                        <input
                          type="number"
                          min="0"
                          value={formData.issueItems}
                          onChange={(e) => setFormData({ ...formData, issueItems: Number(e.target.value) })}
                          className="w-full p-2 bg-white border border-amber-300 rounded-lg font-mono font-bold text-amber-600"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold text-slate-600 mb-1">Short</label>
                        <input
                          type="number"
                          min="0"
                          value={formData.shortItems}
                          onChange={(e) => setFormData({ ...formData, shortItems: Number(e.target.value) })}
                          className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-rose-600"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold text-slate-600 mb-1">Dead</label>
                        <input
                          type="number"
                          min="0"
                          value={formData.deadItems}
                          onChange={(e) => setFormData({ ...formData, deadItems: Number(e.target.value) })}
                          className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-slate-400"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-100 transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md shadow-brand-600/20 transition"
                    >
                      {editingAsset ? 'Update Stock & Record History' : 'Save New Purchase'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isTempModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-4 text-slate-800">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <h3 className="font-extrabold text-sm text-slate-900">
                    Issue Item to Department (e.g. HR Department)
                  </h3>
                  <button onClick={() => setIsTempModalOpen(false)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const timestamped = getFormattedDateTime();

                  const newDispatch = {
                    id: `td_${Date.now()}`,
                    ...tempForm,
                    issueDate: timestamped
                  };

                  try {
                    // 1. Save dispatch to Firebase
                    const dispRes = await fetch(FIREBASE_TEMP_URL, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(newDispatch)
                    });
                    const dispData = await dispRes.json();
                    const savedDispatch = { ...newDispatch, firebaseKey: dispData?.name };

                    // 2. Add to local dispatch state immediately
                    setTempDispatches(prev => [savedDispatch, ...prev]);

                    // 3. STRICT asset match — exact serialNo OR exact particulars
                    const searchName = (tempForm.assetName || '').trim().toUpperCase();
                    const searchTag  = (tempForm.assetTagNo || '').trim().toUpperCase();
                    const foundAsset = assets.find(a =>
                      (a.serialNo || '').trim().toUpperCase() === searchTag ||
                      (a.particulars || '').trim().toUpperCase() === searchName
                    );

                    if (foundAsset && foundAsset.firebaseKey) {
                      const qty = Number(tempForm.quantity || 1);
                      const updatedIssued = Number(foundAsset.issueItems || 0) + qty;

                      // 4. PATCH Firebase
                      await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${foundAsset.firebaseKey}.json`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ issueItems: updatedIssued, lastUpdated: timestamped })
                      });

                      // 5. IMMEDIATE local state update — no refetch, no race
                      setAssets(prev => prev.map(a =>
                        a.firebaseKey === foundAsset.firebaseKey
                          ? { ...a, issueItems: updatedIssued, lastUpdated: timestamped }
                          : a
                      ));

                      await logStockHistory(foundAsset.particulars, `CONSUMED / ISSUED (-${qty})`, `Issued ${qty} unit(s) to ${tempForm.department} (Receiver: ${tempForm.receiver})`);
                      showToast(`Issued ${qty} unit(s) of "${foundAsset.particulars}". Balance updated.`, "success");
                    } else {
                      await logStockHistory(tempForm.assetName, `CONSUMED / ISSUED (-${tempForm.quantity})`, `Issued ${tempForm.quantity} unit(s) to ${tempForm.department}. ⚠ No matching stock record — balance NOT auto-updated.`);
                      showToast(`⚠ Dispatch saved, but no matching item found for "${tempForm.assetName}". Please check exact name/tag.`, "error");
                    }
                  } catch(err) {
                    setTempDispatches(prev => [{ ...newDispatch }, ...prev]);
                    showToast("Dispatch saved locally. Check network.", "info");
                  }

                  setIsTempModalOpen(false);
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Item Name / Particulars *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. HDMI CABLE 3M"
                      value={tempForm.assetName}
                      onChange={(e) => setTempForm({ ...tempForm, assetName: e.target.value.toUpperCase() })}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-semibold text-slate-900"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Asset Tag No / Serial *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. HD-3M-01"
                      value={tempForm.assetTagNo}
                      onChange={(e) => setTempForm({ ...tempForm, assetTagNo: e.target.value.toUpperCase() })}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-mono font-bold text-slate-900"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Department (e.g. HR) *</label>
                      <input
                        type="text"
                        required
                        placeholder="HR Department"
                        value={tempForm.department}
                        onChange={(e) => setTempForm({ ...tempForm, department: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none text-slate-900 font-semibold"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Quantity to Deduct *</label>
                      <input
                        type="number"
                        min="1"
                        required
                        value={tempForm.quantity}
                        onChange={(e) => setTempForm({ ...tempForm, quantity: Number(e.target.value) })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-mono font-bold text-amber-600"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Receiver Name *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Mr. Sharma (HR)"
                      value={tempForm.receiver}
                      onChange={(e) => setTempForm({ ...tempForm, receiver: e.target.value })}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none text-slate-900 font-semibold"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button
                      type="button"
                      onClick={() => setIsTempModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-100 transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md shadow-brand-600/20 transition"
                    >
                      Confirm Issue & Deduct Stock
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
