      let h = d.getHours(); const ampm = h>=12?'PM':'AM'; h = h%12||12;

    function exportToCSV(filename, rows) {
      if (!rows || !rows.length) return;
      const keys = Object.keys(rows[0]);
      const csv = keys.join(',') + '\n' + rows.map(r => keys.map(k => {
        let c = r[k] == null ? '' : String(r[k]);
        c = c.replace(/"/g,'""');
        if (c.search(/("|,|\n)/g) >= 0) c = `"${c}"`;
        return c;
      }).join(',')).join('\n');
      const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function exportToPDF(title, rows, meta = {}) {
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
        doc.setFontSize(16); doc.setTextColor(30,41,59);
        doc.text(title, 40, 40);
        doc.setFontSize(9); doc.setTextColor(100,116,139);
        let y = 58;
        Object.entries(meta).forEach(([k,v]) => { doc.text(`${k}: ${v}`, 40, y); y += 12; });
        if (!rows.length) { doc.text('No records', 40, y+10); doc.save(`${title.replace(/\s+/g,'_')}.pdf`); return; }
        const keys = Object.keys(rows[0]);
        const head = [keys.map(k => k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()))];
        const body = rows.map(r => keys.map(k => r[k] == null ? '' : String(r[k])));
        doc.autoTable({ head, body, startY: y+8, styles:{ fontSize:7, cellPadding:3 }, headStyles:{ fillColor:[79,70,229], textColor:255 }, alternateRowStyles:{ fillColor:[248,250,252] }, margin:{ left:40, right:40 } });
        doc.save(`${title.replace(/\s+/g,'_')}_${Date.now()}.pdf`);
      } catch(e) { console.error(e); alert('PDF failed'); }
    }

    async function apiCall(url, method = 'GET', body = null, retries = 2) {
      for (let i = 0; i <= retries; i++) {
        try {
          const opts = { method, headers: { 'Content-Type':'application/json' } };
          if (body) opts.body = JSON.stringify(body);
          const res = await fetch(url, opts);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          if (method === 'DELETE') return true;
          return await res.json();
        } catch (e) {
          if (i === retries) throw e;
          await new Promise(r => setTimeout(r, 400 * (i+1)));
        }
      }
    }

    // Simulated upload (data-URL). Replace body with Firebase Storage SDK for production.
    async function uploadToStorage(file, path) {
      return new Promise((resolve, reject) => {
        if (!file) return reject('No file');
        if (file.size > 5 * 1024 * 1024) return reject('File > 5MB');
        const reader = new FileReader();
        reader.onload = () => resolve({ url: reader.result, name: file.name, size: file.size, type: file.type, path });
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ============ SIGNATURE CAPTURE ============
    function SignatureCapture({ title, onSave, onClose }) {
      const canvasRef = useRef(null);
      const padRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const canvas = canvasRef.current;
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        padRef.current = new window.SignaturePad(canvas, { backgroundColor: 'rgba(255,255,255,0)', penColor: '#1e293b' });
        return () => { padRef.current = null; };
      }, []);

      const handleClear = () => padRef.current?.clear();
      const handleSave = () => {
        if (!padRef.current || padRef.current.isEmpty()) { alert('Please draw a signature'); return; }
        onSave(padRef.current.toDataURL('image/png'));
      };

      return (
        <div className="fixed inset-0 bg-slate-900/70 z-[75] flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-3">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-extrabold text-sm flex items-center gap-2"><I.Signature /> {title || 'Signature'}</h3>
              <button onClick={onClose} className="text-slate-400"><I.X /></button>
            </div>
            <canvas ref={canvasRef} className="sig-canvas w-full h-40" />
            <div className="flex justify-end gap-2">
              <button onClick={handleClear} className="px-3 py-2 border rounded-xl text-xs font-bold">Clear</button>
              <button onClick={onClose} className="px-3 py-2 border rounded-xl text-xs font-bold">Cancel</button>
              <button onClick={handleSave} className="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold">Save Signature</button>
            </div>
          </div>
        </div>
      );
    }

      const [userForm, setUserForm] = useState({ name:'', username:'', pin:'', role:'Store Keeper', department:'IT Operations', status:'Active', mustChangePin:false });

      // Helpers
      const toast = useCallback((msg, type='info') => {

      const askConfirm = (title, message, onConfirm, danger=true) => setConfirmDialog({ open:true, title, message, onConfirm, danger });

      const writeAudit = useCallback(async (action, entity, entityId, extra = {}) => {
        const entry = { id:`a_${Date.now()}`, action, entity, entityId, userId: loggedInUser?.username || 'system', userName: loggedInUser?.name || 'System', timestamp: fmtDT(), ...extra };
        try { await apiCall(URLS.auditLogs, 'POST', entry); } catch(e) {}

      const perms = useMemo(() => {
        if (!loggedInUser) return ROLE_PERMS['Store Keeper'];
        return ROLE_PERMS[loggedInUser.role] || ROLE_PERMS['Store Keeper'];
      }, [loggedInUser]);

      // Theme
      useEffect(() => {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'dark') { setDarkMode(true); document.documentElement.classList.add('dark'); }
      }, []);
      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
        localStorage.setItem(THEME_KEY, darkMode ? 'dark' : 'light');
      }, [darkMode]);

      // Session restore
      useEffect(() => {
        try {
          const raw = localStorage.getItem(SESSION_KEY);
          if (raw) {
            const s = JSON.parse(raw);
            if (s.expires > Date.now() && s.user) {
              setLoggedInUser(s.user); setIsLoggedIn(true);
              if (s.user.mustChangePin) setForcePinChange(true);
            } else localStorage.removeItem(SESSION_KEY);
          }
        } catch(e) {}
      }, []);

      const saveSession = (user) => localStorage.setItem(SESSION_KEY, JSON.stringify({ user, expires: Date.now() + 8*3600*1000 }));

      // Fetch — backward compatible; naye nodes optional hain
      const fetchAll = useCallback(async (silent = true) => {
        if (!silent) setIsSyncing(true);
        try {
          const r = await Promise.allSettled([
            apiCall(URLS.assets), apiCall(URLS.temp), apiCall(URLS.pm),
            apiCall(URLS.pmLogs), apiCall(URLS.users), apiCall(URLS.auditLogs),
            apiCall(URLS.slaConfig), apiCall(URLS.slaQueue)
          ]);
          if (r[0].status === 'fulfilled' && r[0].value) {
            const arr = Object.keys(r[0].value).map(k => ({ ...r[0].value[k], firebaseKey:k }));
            setAssets(arr.length ? arr.filter(a => !a.isDeleted) : FALLBACK_ASSETS);
          } else if (assets.length === 0) setAssets(FALLBACK_ASSETS);
          if (r[1].status === 'fulfilled' && r[1].value) setTempDispatches(Object.keys(r[1].value).map(k => ({ ...r[1].value[k], firebaseKey:k })).filter(x => !x.isDeleted));
          if (r[2].status === 'fulfilled' && r[2].value) setPmSchedules(Object.keys(r[2].value).map(k => ({ ...r[2].value[k], firebaseKey:k })).filter(x => !x.isDeleted));
          if (r[3].status === 'fulfilled' && r[3].value) setPmAuditLogs(Object.keys(r[3].value).map(k => ({ ...r[3].value[k], firebaseKey:k })));
          if (r[4].status === 'fulfilled' && r[4].value) {
            const arr = Object.keys(r[4].value).map(k => ({ ...r[4].value[k], firebaseKey:k }));
            setUsers(arr.length ? arr : FALLBACK_USERS);
          }
          if (r[5].status === 'fulfilled' && r[5].value) setAuditLogs(Object.keys(r[5].value).map(k => ({ ...r[5].value[k], firebaseKey:k })));
          if (r[6].status === 'fulfilled' && r[6].value) setSlaConfig({ ...DEFAULT_SLA_CONFIG, ...r[6].value });
          if (r[7].status === 'fulfilled' && r[7].value) setSlaQueue(Object.keys(r[7].value).map(k => ({ ...r[7].value[k], firebaseKey:k })));
          const now = new Date();
          setLastSyncTime(`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`);
        } catch(e) { console.error(e); }
        finally { setLoading(false); if (!silent) { setIsSyncing(false); toast('Sync complete!', 'success'); } }
      }, [assets.length, toast]);

      useEffect(() => {
        fetchAll(true);
        const id = setInterval(() => { if (!document.hidden) fetchAll(true); }, 8000);
        return () => clearInterval(id);
      }, []);

      // Keyboard shortcuts
      useEffect(() => {
        const handler = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setSearchPaletteOpen(true); }
          if (e.key === 'Escape') {
            setIsModalOpen(false); setIsTempModalOpen(false); setIsPmModalOpen(false);
            setIsUserModalOpen(false); setViewModalItem(null); setSearchPaletteOpen(false);
            setShowMovementReportModal(false); setShowStockReportModal(false); setShowPmReportModal(false);
            setConfirmDialog(d => ({ ...d, open:false })); setNotifOpen(false); setSignatureModal(s => ({ ...s, open:false }));
          }
          if (!isLoggedIn || isModalOpen || isTempModalOpen || isPmModalOpen) return;
          const tag = document.activeElement?.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if (e.key.toLowerCase() === 'n' && activeTab === 'inventory') { e.preventDefault(); openNewAsset(); }
          if (e.key === '/') { e.preventDefault(); document.querySelector('#stock-search')?.focus(); }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [isLoggedIn, isModalOpen, isTempModalOpen, isPmModalOpen, activeTab]);

      // Login — IDENTICAL logic (plain pin compare, unchanged)
      const handleLogin = async (e) => {
        e.preventDefault();
        if (Date.now() < lockoutUntil) { setLoginError(`Locked. Wait ${Math.ceil((lockoutUntil-Date.now())/1000)}s.`); return; }
        const matched = users.find(u =>
          (String(u.username).trim().toLowerCase() === String(usernameInput).trim().toLowerCase() ||
           String(u.name).trim().toLowerCase() === String(usernameInput).trim().toLowerCase()) &&
          String(u.pin).trim() === String(pinInput).trim() && u.status === 'Active'
        );
        try { await apiCall(URLS.loginLogs, 'POST', { id:`l_${Date.now()}`, username: usernameInput, success: !!matched, timestamp: fmtDT() }); } catch(e) {}
        if (matched) {
          setIsLoggedIn(true); setLoggedInUser(matched); setLoginError(''); setLoginAttempts(0);
          saveSession(matched);
          if (matched.mustChangePin) setForcePinChange(true);
          toast(`Welcome ${matched.name}`, 'success');
          writeAudit('LOGIN', 'user', matched.username, {});
        } else {
          const a = loginAttempts + 1; setLoginAttempts(a);
          if (a >= 5) { setLockoutUntil(Date.now()+30000); setLoginError('Too many attempts. Locked 30s.'); setLoginAttempts(0); }
          else setLoginError(`Invalid credentials. ${5-a} attempts left.`);
        }
      };

      const handlePinChange = async (e) => {
        e.preventDefault();
        if (!/^\d{4,6}$/.test(newPinValue)) { toast('PIN must be 4-6 digits', 'error'); return; }
        const updated = { ...loggedInUser, pin: newPinValue, mustChangePin: false };
        try {
          if (loggedInUser.firebaseKey) await apiCall(`${BASE}/system_users/${loggedInUser.firebaseKey}.json`, 'PUT', updated);
          setUsers(users.map(u => u.username === loggedInUser.username ? updated : u));
          setLoggedInUser(updated); saveSession(updated);
          setForcePinChange(false); setNewPinValue('');
          toast('PIN updated', 'success');

      const handleLogout = () => {
        setIsLoggedIn(false); setLoggedInUser(null); setPinInput(''); setUsernameInput('');

      // Derived
      const summary = useMemo(() => {
        let totalItems=0, totalIssued=0, totalShort=0, totalDead=0, lowStock=0, totalBalance=0;
        assets.forEach(a => {
          const op=+a.openingQty||0, pur=+a.newPurchase||0, iss=+a.issueItems||0, sh=+a.shortItems||0, dd=+a.deadItems||0;
          const bal = (op+pur)-(iss+sh+dd);
          totalItems += (op+pur); totalIssued += iss; totalShort += sh; totalDead += dd; totalBalance += bal;
          if (bal <= (+a.minAlert||2)) lowStock++;
        });
        return { totalItems, totalIssued, totalShort, totalDead, lowStock, totalBalance };
      }, [assets]);

      const pendingLoans = useMemo(() => tempDispatches.filter(d => d.status !== 'Return Back'), [tempDispatches]);
      const overdueLoans = useMemo(() => pendingLoans.filter(d => d.expectedReturnDate && new Date(d.expectedReturnDate) < new Date()), [pendingLoans]);
      const overduePm = useMemo(() => pmSchedules.filter(p => p.status !== 'Completed' && p.dueDate && new Date(p.dueDate) < new Date()), [pmSchedules]);
      const pmCompletionPct = useMemo(() => !pmSchedules.length ? 100 : Math.round((pmSchedules.filter(p => p.status === 'Completed').length / pmSchedules.length) * 100), [pmSchedules]);

      const groupCounts = useMemo(() => assets.reduce((acc,a) => { const g=a.group||'OTHER'; acc[g]=(acc[g]||0)+1; return acc; }, {}), [assets]);

      const filteredAssets = useMemo(() => {
        let arr = assets.filter(item => {
          const q = searchQuery.toLowerCase();
          const ms = !q || (item.particulars||'').toLowerCase().includes(q) || (item.group||'').toLowerCase().includes(q) ||
                     (item.serialNo||'').toLowerCase().includes(q) || (item.brand||'').toLowerCase().includes(q) || (item.location||'').toLowerCase().includes(q);
          const ml = locationFilter==='All' || !locationFilter || (item.location||'').toLowerCase()===locationFilter.toLowerCase();
          const mg = !selectedGroupFilter || (item.group||'').toLowerCase()===selectedGroupFilter.toLowerCase();
          const op=+item.openingQty||0, pur=+item.newPurchase||0, iss=+item.issueItems||0, sh=+item.shortItems||0, dd=+item.deadItems||0;
          const mlow = !lowStockOnly || (op+pur)-(iss+sh+dd) <= (+item.minAlert||2);
          return ms && ml && mg && mlow;
        });
        arr.sort((a,b) => {
          const k = sortConfig.key;
          let av = a[k], bv = b[k];
          if (k === 'balance') {
            av = (+a.openingQty||0)+(+a.newPurchase||0)-(+a.issueItems||0)-(+a.shortItems||0)-(+a.deadItems||0);

          if (typeof av === 'string') av = av.toLowerCase();
          if (typeof bv === 'string') bv = bv.toLowerCase();
          if (av < bv) return sortConfig.dir === 'asc' ? -1 : 1;
          if (av > bv) return sortConfig.dir === 'asc' ? 1 : -1;
          return 0;
        });
        return arr;

            if (editingAsset.firebaseKey) await apiCall(`${BASE}/assets/${editingAsset.firebaseKey}.json`, 'PUT', updated);

          const newAsset = { id: Date.now(), ...formData, brand: finalBrand, lastUpdated: ts };
          try {
            await apiCall(URLS.assets, 'POST', newAsset);

      const deleteAsset = (item) => askConfirm('Delete Asset?', `Remove "${item.particulars}"?`, async () => {
        try {
          if (item.firebaseKey) await apiCall(`${BASE}/assets/${item.firebaseKey}.json`, 'PUT', { ...item, isDeleted:true, deletedAt: fmtDT(), deletedBy: loggedInUser?.username });
          setAssets(assets.filter(a => a.id !== item.id && a.firebaseKey !== item.firebaseKey));

        setConfirmDialog(d => ({ ...d, open:false }));

      const bulkDelete = () => {
        if (!selectedIds.length) return;
        askConfirm('Bulk Delete?', `Delete ${selectedIds.length} items?`, async () => {
          for (const id of selectedIds) {
            const item = assets.find(a => (a.firebaseKey === id || String(a.id) === String(id)));
            if (item?.firebaseKey) { try { await apiCall(`${BASE}/assets/${item.firebaseKey}.json`, 'PUT', { ...item, isDeleted:true, deletedAt: fmtDT() }); } catch(e) {} }
          }
          setAssets(assets.filter(a => !selectedIds.includes(a.firebaseKey) && !selectedIds.includes(String(a.id))));
          setSelectedIds([]); toast(`${selectedIds.length} deleted`, 'info');
          setConfirmDialog(d => ({ ...d, open:false }));
        });
      };

      const quickReturn = async (item) => {
        const ts = fmtDT();
        const updated = { ...item, status:'Return Back', returnDate: ts };
        try {
          if (item.firebaseKey) await apiCall(`${BASE}/temp_dispatches/${item.firebaseKey}.json`, 'PUT', updated);
          setTempDispatches(tempDispatches.map(d => (d.id === item.id || d.firebaseKey === item.firebaseKey) ? updated : d));
          toast(`"${item.assetName}" returned`, 'success'); writeAudit('RETURN', 'dispatch', item.id, { assetName:item.assetName });
        } catch(e) { toast('Return failed', 'error'); }
      };

      const quickCompletePm = async (item) => {
        const ts = fmtDT();
        const updated = { ...item, status:'Completed', completedAt: ts };
        try {
          if (item.firebaseKey) await apiCall(`${BASE}/pm_schedules/${item.firebaseKey}.json`, 'PUT', updated);
          setPmSchedules(pmSchedules.map(p => (p.id === item.id || p.firebaseKey === item.firebaseKey) ? updated : p));
          toast(`PM for ${item.department} completed`, 'success'); writeAudit('PM_COMPLETE', 'pm', item.id, { department:item.department });
        } catch(e) { toast('Failed', 'error'); }
      };

      const toggleSort = (key) => setSortConfig(s => ({ key, dir: s.key === key && s.dir === 'asc' ? 'desc' : 'asc' }));

      const exportAssetsCSV = () => {
        if (!perms.canExport) { toast('No export permission', 'error'); return; }
        exportToCSV(`Assets_${Date.now()}.csv`, filteredAssets); toast('CSV exported', 'success');
      };
      const exportAssetsPDF = () => {
        if (!perms.canExport) { toast('No export permission', 'error'); return; }
        exportToPDF('Stock Register Report', filteredAssets.map(a => ({
          Group:a.group, Particulars:a.particulars, Brand:a.brand, Serial:a.serialNo,
          Opening:a.openingQty, Purchase:a.newPurchase, Issued:a.issueItems,
          Balance:(+a.openingQty||0)+(+a.newPurchase||0)-(+a.issueItems||0)-(+a.shortItems||0)-(+a.deadItems||0),
          Location:a.location, Category:a.category
        })), { 'Generated By': loggedInUser?.name || 'System', 'Generated At': fmtDT(), 'Total': filteredAssets.length });

          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-auto">

                  <tr key={u.firebaseKey||u.id}>

                    <td>{u.department}</td>
                    <td><span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${u.status==='Active'?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'}`}>{u.status}</span></td>
                    <td>
                      {perms.canManageUsers && (
                        <div className="inline-flex gap-1">
                          <button onClick={()=>{setEditingUser(u);setUserForm({name:u.name||'',username:u.username||'',pin:u.pin||'',role:u.role||'Store Keeper',department:u.department||'',status:u.status||'Active',mustChangePin:u.mustChangePin||false});setIsUserModalOpen(true);}} className="p-1 bg-slate-100 dark:bg-slate-800 rounded"><I.Edit /></button>
                          <button onClick={()=>{askConfirm('Delete User?',`Remove ${u.name}?`,async()=>{if(u.firebaseKey)await apiCall(`${BASE}/system_users/${u.firebaseKey}.json`,'DELETE');setUsers(users.filter(x=>x.id!==u.id&&x.firebaseKey!==u.firebaseKey));toast('Deleted','info');setConfirmDialog(d=>({...d,open:false}));});}} className="p-1 bg-slate-100 dark:bg-slate-800 text-rose-600 rounded"><I.Trash /></button>
                        </div>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );

      // ===== REPORTS =====
      const ReportsView = (
        <div className="flex-1 overflow-auto p-6 space-y-4">
          <h1 className="text-sm font-extrabold uppercase">Reports Hub</h1>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            {[
              { t:'Stock Register', d:'All assets', fn:()=>exportAssetsPDF() },
              { t:'Temporary Dispatches', d:'Pending/returned', fn:()=>exportToPDF('Temp Dispatches', tempDispatches, { 'Generated At': fmtDT() }) },
              { t:'PM Compliance', d:'Month-wise', fn:()=>exportToPDF('PM Schedule', pmSchedules, { 'Generated At': fmtDT() }) },
              { t:'Low Stock', d:'Reorder suggestions', fn:()=>{
                const low = assets.filter(a => { const b=(+a.openingQty||0)+(+a.newPurchase||0)-(+a.issueItems||0)-(+a.shortItems||0)-(+a.deadItems||0); return b <= (+a.minAlert||2); });
                exportToPDF('Low Stock', low.map(a => ({ Particulars:a.particulars, Balance:(+a.openingQty||0)+(+a.newPurchase||0)-(+a.issueItems||0)-(+a.shortItems||0)-(+a.deadItems||0), MinAlert:a.minAlert, Suggested:Math.max(0,(+a.minAlert||2)*2-((+a.openingQty||0)+(+a.newPurchase||0)-(+a.issueItems||0))) })), { 'Generated At': fmtDT() });
              } },
              { t:'Audit Trail', d:'All changes', fn:()=>exportToPDF('Audit Log', auditLogs.slice(0,200), { 'Generated At': fmtDT() }) },
              { t:'Dept Distribution', d:'Assets per dept', fn:()=>exportToPDF('Dept Distribution', Object.entries(tempDispatches.reduce((acc,d)=>{acc[d.department]=(acc[d.department]||0)+(+d.quantity||0);return acc;},{})).map(([k,v])=>({Department:k,Assets:v})), { 'Generated At': fmtDT() }) },

              <button key={i} onClick={r.fn} className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 text-left hover:border-brand-500 hover:shadow-md transition">
                <div className="font-extrabold text-xs">{r.t}</div><div className="text-[11px] text-slate-500 mb-2">{r.d}</div>
                <div className="text-[10px] font-bold text-brand-600 flex items-center gap-1"><I.Download /> Generate PDF</div>
              </button>
            ))}
          </div>
        </div>
      );

      // ===== SLA =====
      const updateSlaConfig = async (patch) => {
        const updated = { ...slaConfig, ...patch };
        setSlaConfig(updated);
        try { await apiCall(URLS.slaConfig, 'PUT', updated); toast('SLA config saved', 'success'); } catch(e) { toast('Save failed', 'error'); }
      };

      const generateAlertPreview = (type) => {
        const t = slaConfig.templates?.[type];
        if (!t) return { subject:'', body:'' };
        const sample = {
          item: assets[0]?.particulars || 'Sample Item', balance:'2', min:'5',
          asset: pendingLoans[0]?.assetName || 'Laptop', tag: pendingLoans[0]?.assetTagNo || 'TAG-001',
          receiver: pendingLoans[0]?.receiver || 'John Doe', department: pendingLoans[0]?.department || 'IT',
          days: overdueLoans[0] ? daysAgo(overdueLoans[0].expectedReturnDate) : 5,
          dept: overduePm[0]?.department || 'HR', equipment: overduePm[0]?.equipmentName || 'PC', due: overduePm[0]?.dueDate || '2026-01-01',
          date: new Date().toISOString().split('T')[0],
          low: summary.lowStock, loans: overdueLoans.length, pm: overduePm.length, pending: pendingLoans.length
        };
        const render = (s) => s.replace(/\{(\w+)\}/g, (_,k) => sample[k] ?? `{${k}}`);
        return { subject: render(t.subject), body: render(t.body) };
      };

      const enqueueSlaAlert = async (type) => {
        const preview = generateAlertPreview(type);
        const entry = { id:`q_${Date.now()}`, type, to: slaConfig.recipients, subject: preview.subject, body: preview.body, status:'Queued', createdAt: fmtDT() };
        try { await apiCall(URLS.slaQueue, 'POST', entry); setSlaQueue(prev => [entry, ...prev]); toast('Alert queued (email hook placeholder)', 'success'); writeAudit('SLA_QUEUE','alert',entry.id,{type}); }
        catch(e) { toast('Queue failed', 'error'); }
      };

      const SlaView = (
        <div className="flex-1 overflow-auto p-6 space-y-4">
          <div className="flex justify-between items-center">
            <div><h1 className="text-sm font-extrabold uppercase">SLA & Email Alerts</h1><p className="text-xs text-slate-500">Configure automatic email notifications (hook placeholder)</p></div>
            <label className="flex items-center gap-2 text-xs font-bold"><input type="checkbox" checked={slaConfig.enabled} onChange={e=>updateSlaConfig({ enabled: e.target.checked })} /> Enabled</label>
          </div>
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
            <div>
              <label className="block text-xs font-bold mb-1">Recipients (comma-separated)</label>
              <input value={slaConfig.recipients} onChange={e=>setSlaConfig({...slaConfig,recipients:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs font-mono" />
            </div>
            <div className="text-[11px] p-3 bg-amber-50 dark:bg-amber-950/30 rounded-xl text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800">
              <strong>Integration Note:</strong> UI + queue placeholder. Real emails ke liye <code>sla_queue</code> node ko Firebase Function (Nodemailer/SendGrid) se connect karein.
            </div>
            <button onClick={()=>updateSlaConfig({})} className="px-4 py-2 bg-brand-600 text-white text-xs font-bold rounded-xl">Save Configuration</button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {[
              { k:'lowStock', l:'Low Stock Alert', desc:'Balance <= minAlert' },
              { k:'overdueLoan', l:'Overdue Loan Alert', desc:'expectedReturnDate passed' },
              { k:'overduePm', l:'Overdue PM Alert', desc:'dueDate passed' },
              { k:'dailyDigest', l:'Daily Digest', desc:'Morning summary' }
            ].map(t => {
              const preview = generateAlertPreview(t.k);
              return (
                <div key={t.k} className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2">
                  <div className="flex justify-between items-center">
                    <div className="font-extrabold text-xs">{t.l}</div>
                    <button onClick={()=>enqueueSlaAlert(t.k)} className="px-2 py-1 bg-brand-50 dark:bg-brand-900/20 text-brand-700 dark:text-brand-300 rounded-lg text-[10px] font-bold flex items-center gap-1"><I.Mail /> Queue Test</button>
                  </div>
                  <div className="text-[10px] text-slate-500">{t.desc}</div>
                  <div className="bg-slate-50 dark:bg-slate-800 p-2 rounded-lg text-[10px] space-y-1">
                    <div><strong>Subject:</strong> {preview.subject}</div>
                    <div className="line-clamp-2"><strong>Body:</strong> {preview.body}</div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
            <div className="flex justify-between items-center mb-3">
              <h3 className="text-xs font-bold uppercase">Alert Queue ({slaQueue.length})</h3>
              <button onClick={async()=>{ if(!slaQueue.length) return; askConfirm('Clear Queue?',`Remove all ${slaQueue.length} queued alerts?`, async()=>{ await apiCall(URLS.slaQueue, 'PUT', null); setSlaQueue([]); toast('Queue cleared','info'); setConfirmDialog(d=>({...d,open:false})); }); }} className="text-[10px] font-bold text-rose-600 hover:underline">Clear All</button>
            </div>
            <div className="max-h-64 overflow-auto space-y-1">
              {slaQueue.length === 0 ? <div className="text-center py-6 text-xs text-slate-400">No queued alerts</div> :
                slaQueue.map((q,i) => (
                  <div key={q.id||i} className="text-[11px] p-2 bg-slate-50 dark:bg-slate-800 rounded-lg flex justify-between items-center">
                    <div className="truncate"><span className="font-mono text-brand-600 font-bold">[{q.type}]</span> {q.subject}</div>
                    <div className="flex items-center gap-2">
                      <span className="text-slate-400 font-mono text-[10px]">{q.createdAt}</span>
                      <button onClick={async()=>{
                        if(q.firebaseKey) await apiCall(`${BASE}/sla_queue/${q.firebaseKey}.json`,'DELETE');
                        setSlaQueue(slaQueue.filter(x=>x.id!==q.id));
                      }} className="text-rose-600"><I.X /></button>
                    </div>
                  </div>
                ))
              }
            </div>
          </div>
        </div>
      );

      const viewMap = { dashboard: DashboardView, inventory: InventoryView, temp_deploy: TempView, preventive_maint: PmView, stock_ledger: LedgerView, asset_lifecycle: LifecycleView, vendors: VendorsView, users: UsersView, reports: ReportsView, sla: SlaView };
      const activeView = viewMap[activeTab] || DashboardView;

      return (
        <div className="flex h-screen bg-slate-100 dark:bg-slate-950 overflow-hidden font-sans">
          {ToastStack}
          {Sidebar}
          {sidebarOpen && <div className="fixed inset-0 bg-slate-900/60 z-30 md:hidden" onClick={()=>setSidebarOpen(false)}></div>}
          <main className="flex-1 flex flex-col overflow-hidden">
            {TopBar}
            {activeView}
          </main>

          {/* Search Palette */}
          {searchPaletteOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-start justify-center p-4 pt-20" onClick={()=>setSearchPaletteOpen(false)}>
              <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-xl w-full animate-scale-in" onClick={e=>e.stopPropagation()}>
                <div className="p-3 border-b border-slate-200 dark:border-slate-700 flex items-center gap-2">
                  <I.Search />
                  <input autoFocus type="text" placeholder="Search across modules..." value={paletteQuery} onChange={e=>setPaletteQuery(e.target.value)} className="flex-1 bg-transparent outline-none text-sm" />
                  <button onClick={()=>setSearchPaletteOpen(false)} className="text-slate-400"><I.X /></button>
                </div>
                <div className="max-h-80 overflow-auto p-2">
                  {(() => {
                    const q = paletteQuery.toLowerCase();
                    const matchedAssets = assets.filter(a => !q || (a.particulars||'').toLowerCase().includes(q) || (a.serialNo||'').toLowerCase().includes(q)).slice(0,5);

                      <>

                        {matchedPm.length > 0 && <div className="text-[10px] font-bold uppercase text-slate-400 px-2 py-1 mt-2">PM Tasks</div>}
                        {matchedPm.map(p => <div key={p.id} onClick={()=>{setActiveTab('preventive_maint');setSearchPaletteOpen(false);}} className="px-2 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded text-xs cursor-pointer">{p.department} · {p.equipmentName}</div>)}
                        {matchedUsers.length > 0 && <div className="text-[10px] font-bold uppercase text-slate-400 px-2 py-1 mt-2">Users</div>}
                        {matchedUsers.map(u => <div key={u.id} onClick={()=>{setActiveTab('users');setSearchPaletteOpen(false);}} className="px-2 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded text-xs cursor-pointer">@{u.username} · {u.name}</div>)}
                      </>
                    );
                  })()}
                </div>
              </div>
            </div>
          )}

          {/* Asset View Modal */}
          {viewModalItem && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 overflow-auto">
              <div id="printable-slip" className="bg-white rounded-3xl shadow-2xl max-w-xl w-full p-8 space-y-5 text-slate-800 my-8">
                <div className="flex justify-between border-b pb-3">
                  <div>
                    <div className="text-[10px] font-black text-brand-600">IT INFRASTRUCTURE DEPARTMENT</div>
                    <h2 className="text-lg font-black">ASSET VERIFICATION SLIP</h2>
                    <p className="text-[11px] text-slate-500 font-mono">ID: IT-SLIP-{viewModalItem.id}</p>
                  </div>
                  <button onClick={()=>setViewModalItem(null)} className="no-print text-slate-400 text-lg">✕</button>
                </div>
                <div className="grid grid-cols-2 gap-3 text-xs bg-slate-50 p-4 rounded-xl">
                  <div><span className="text-slate-400 text-[10px] uppercase block">Particulars</span><strong>{viewModalItem.particulars}</strong></div>
                  <div><span className="text-slate-400 text-[10px] uppercase block">Group</span>{viewModalItem.group}</div>
                  <div><span className="text-slate-400 text-[10px] uppercase block">Brand</span>{viewModalItem.brand}</div>
                  <div><span className="text-slate-400 text-[10px] uppercase block">Serial</span><span className="font-mono">{viewModalItem.serialNo||'N/A'}</span></div>
                  <div><span className="text-slate-400 text-[10px] uppercase block">Location</span>{viewModalItem.location||'—'}</div>
                  <div><span className="text-slate-400 text-[10px] uppercase block">Category</span>{viewModalItem.category}</div>
                </div>
                <div className="flex justify-center"><canvas id="qr-canvas"></canvas></div>
                <div className="pt-4 border-t grid grid-cols-2 gap-6 text-center text-xs">
                  <div><div className="h-10 border-b border-dashed"></div><div className="mt-1 font-bold">Store Signature</div></div>
                  <div>
                    <div className="h-10 border-b border-dashed flex items-center justify-center">
                      <button onClick={()=>setSignatureModal({ open:true, title:'Receiver Signature', onSave:(data)=>{
                        setViewModalItem({ ...viewModalItem, _receiverSig: data }); setSignatureModal(s=>({...s,open:false}));
                      }})} className="no-print text-brand-600 text-[10px] font-bold"><I.Signature /> Capture</button>
                      {viewModalItem._receiverSig && <img src={viewModalItem._receiverSig} alt="sig" className="h-8 object-contain" />}
                    </div>
                    <div className="mt-1 font-bold">Receiver Signature</div>
                  </div>
                </div>
                <div className="no-print flex justify-end gap-2">
                  <button onClick={()=>window.print()} className="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold">Print</button>
                  <button onClick={()=>setViewModalItem(null)} className="px-4 py-2 bg-slate-200 rounded-xl text-xs font-bold">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* Asset Add/Edit Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 overflow-auto">
              <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl max-w-2xl w-full p-6 my-8 space-y-4 animate-scale-in">
                <div className="flex justify-between border-b pb-3"><h3 className="font-extrabold text-sm">{editingAsset?'Edit Asset':'Register Asset'}</h3><button onClick={()=>setIsModalOpen(false)}>✕</button></div>
                <form onSubmit={saveAsset} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block font-semibold mb-1">Group *</label><input required value={formData.group} onChange={e=>setFormData({...formData,group:e.target.value.toUpperCase()})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold" /></div>
                    <div><label className="block font-semibold mb-1">Particulars *</label><input required value={formData.particulars} onChange={e=>setFormData({...formData,particulars:e.target.value.toUpperCase()})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold" /></div>
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    <div><label className="block font-semibold mb-1">Brand *</label><select value={formData.brand} onChange={e=>setFormData({...formData,brand:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold"><option>Dell</option><option>HP</option><option>Lenovo</option><option>Cisco</option><option>Logitech</option><option>Honeywell</option><option>Other</option></select></div>
                    {formData.brand==='Other' && <div><label className="block font-semibold mb-1">Custom *</label><input required value={formData.customBrand} onChange={e=>setFormData({...formData,customBrand:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>}
                    <div><label className="block font-semibold mb-1">Category</label><select value={formData.category} onChange={e=>setFormData({...formData,category:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl"><option>Consumable</option><option>Non-Consumable</option><option>Fixed Assets</option></select></div>
                    <div><label className="block font-semibold mb-1">Location</label><input value={formData.location} onChange={e=>setFormData({...formData,location:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    <div><label className="block font-semibold mb-1">Serial</label><input value={formData.serialNo} onChange={e=>setFormData({...formData,serialNo:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono" /></div>
                    <div><label className="block font-semibold mb-1">Cable (m)</label><input value={formData.cableLength} onChange={e=>setFormData({...formData,cableLength:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono" /></div>
                    <div><label className="block font-semibold mb-1">Unit</label><select value={formData.measurementUnit} onChange={e=>setFormData({...formData,measurementUnit:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl"><option>Piece</option><option>Meter</option><option>GB</option></select></div>
                  </div>
                  <div className="grid grid-cols-5 gap-2 bg-slate-50 dark:bg-slate-800 p-3 rounded-xl">
                    {[['openingQty','Opening'],['newPurchase','Purchase'],['issueItems','Issued'],['shortItems','Short'],['deadItems','Dead']].map(([k,l])=>(
                      <div key={k}><label className="block font-semibold text-[10px] mb-1">{l}</label><input type="number" min="0" value={formData[k]} onChange={e=>setFormData({...formData,[k]:+e.target.value})} className="w-full p-1.5 bg-white dark:bg-slate-900 border rounded-lg font-mono font-bold" /></div>
                    ))}
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={()=>setIsModalOpen(false)} className="px-4 py-2 rounded-xl border font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-brand-600 text-white font-bold">{editingAsset?'Update':'Save'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Temp Modal */}
          {isTempModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 overflow-auto">
              <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-3 animate-scale-in my-8">
                <div className="flex justify-between border-b pb-2"><h3 className="font-extrabold text-sm">{editingTempItem?'Edit Dispatch':'Issue Temp Asset'}</h3><button onClick={()=>setIsTempModalOpen(false)}>✕</button></div>
                <form onSubmit={async e=>{
                  e.preventDefault();
                  const ts = fmtDT();
                  const payload = { ...tempForm, lastUpdated: ts, issueDate: editingTempItem?.issueDate || ts };
                  try {
                    if (editingTempItem && editingTempItem.firebaseKey) await apiCall(`${BASE}/temp_dispatches/${editingTempItem.firebaseKey}.json`, 'PUT', { ...editingTempItem, ...payload });
                    else await apiCall(URLS.temp, 'POST', { id:`td_${Date.now()}`, ...payload });
                    await fetchAll(true);
                    toast(editingTempItem?'Updated':'Issued', 'success');
                    writeAudit(editingTempItem?'UPDATE':'CREATE', 'dispatch', payload.assetTagNo);
                  } catch(e) { toast('Failed','error'); }
                  setIsTempModalOpen(false); setEditingTempItem(null);
                }} className="space-y-2 text-xs">
                  <div><label className="block font-semibold mb-1">Asset Name *</label><input required value={tempForm.assetName} onChange={e=>setTempForm({...tempForm,assetName:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                  <div><label className="block font-semibold mb-1">Tag *</label><input required value={tempForm.assetTagNo} onChange={e=>setTempForm({...tempForm,assetTagNo:e.target.value.toUpperCase()})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono" /></div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="block font-semibold mb-1">Dept *</label><input required value={tempForm.department} onChange={e=>setTempForm({...tempForm,department:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                    <div><label className="block font-semibold mb-1">Qty *</label><input type="number" min="1" required value={tempForm.quantity} onChange={e=>setTempForm({...tempForm,quantity:+e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono" /></div>
                  </div>
                  <div><label className="block font-semibold mb-1">Receiver *</label><input required value={tempForm.receiver} onChange={e=>setTempForm({...tempForm,receiver:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                  <div><label className="block font-semibold mb-1">Expected Return</label><input type="date" value={tempForm.expectedReturnDate} onChange={e=>setTempForm({...tempForm,expectedReturnDate:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono" /></div>
                  <div><label className="block font-semibold mb-1">Status</label><select value={tempForm.status} onChange={e=>setTempForm({...tempForm,status:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold"><option>Temporary Given</option><option>Return Back</option></select></div>
                  <div>
                    <label className="block font-semibold mb-1 flex items-center justify-between">
                      <span>Receiver Signature</span>
                      <button type="button" onClick={()=>setSignatureModal({ open:true, title:'Receiver Signature', onSave:(data)=>{setTempForm({...tempForm, receiverSignature:data}); setSignatureModal(s=>({...s,open:false}));}})} className="text-[10px] font-bold text-brand-600 flex items-center gap-1"><I.Signature /> Capture</button>
                    </label>
                    {tempForm.receiverSignature ? (
                      <div className="relative">
                        <img src={tempForm.receiverSignature} alt="sig" className="w-full h-20 object-contain border rounded-xl bg-white" />
                        <button type="button" onClick={()=>setTempForm({...tempForm,receiverSignature:''})} className="absolute top-1 right-1 p-1 bg-rose-600 text-white rounded"><I.X /></button>
                      </div>
                    ) : <div className="h-16 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl flex items-center justify-center text-[10px] text-slate-400">Click Capture</div>}
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t"><button type="button" onClick={()=>setIsTempModalOpen(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button><button type="submit" className="px-5 py-2 bg-brand-600 text-white rounded-xl font-bold">Save</button></div>
                </form>
              </div>
            </div>
          )}

          {/* PM Modal */}
          {isPmModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 overflow-auto">
              <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl max-w-3xl w-full p-6 my-8 space-y-4 animate-scale-in">
                <div className="flex justify-between border-b pb-3"><h3 className="font-extrabold text-sm">{editingPmItem?'Update PM':'Schedule PM'}</h3><button onClick={()=>setIsPmModalOpen(false)}>✕</button></div>
                <form onSubmit={async e=>{
                  e.preventDefault();
                  const ts = fmtDT();
                  try {
                    if (editingPmItem && editingPmItem.firebaseKey) {
                      await apiCall(`${BASE}/pm_schedules/${editingPmItem.firebaseKey}.json`, 'PUT', { ...editingPmItem, ...pmForm, lastModified: ts });
                      await apiCall(URLS.pmLogs, 'POST', { id:`log_${Date.now()}`, timestamp:ts, department:pmForm.department, action:'Updated' });
                    } else {
                      await apiCall(URLS.pm, 'POST', { id:`pm_${Date.now()}`, ...pmForm, createdDate:ts });
                      if (pmForm.recurring) {
                        for (let i=1;i<=3;i++) {
                          const idx = MONTHS.findIndex(m => m.code === pmForm.targetMonth);
                          const next = MONTHS[(idx + i*(pmForm.recurrenceMonths||1)) % 12];
                          if (next) await apiCall(URLS.pm, 'POST', { id:`pm_${Date.now()}_${i}`, ...pmForm, targetMonth:next.code, slotRange:next.slots[0], status:'Scheduled', createdDate:ts, isRecurring:true });
                        }
                      }
                    }
                    await fetchAll(true);
                    toast('PM saved','success');
                  } catch(e) { toast('Save failed','error'); }
                  setIsPmModalOpen(false); setEditingPmItem(null);
                }} className="space-y-3 text-xs">
                  <div className="grid grid-cols-3 gap-2">
                    <div><label className="block font-semibold mb-1">Month *</label><select value={pmForm.targetMonth} onChange={e=>{const m=e.target.value;const o=MONTHS.find(x=>x.code===m);setPmForm({...pmForm,targetMonth:m,slotRange:o.slots[0]});}} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold">{MONTHS.map(m=><option key={m.code} value={m.code}>{m.name}</option>)}</select></div>
                    <div><label className="block font-semibold mb-1">Slot *</label><select value={pmForm.slotRange} onChange={e=>setPmForm({...pmForm,slotRange:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold">{(MONTHS.find(m=>m.code===pmForm.targetMonth)?.slots||[]).map(s=><option key={s}>{s}</option>)}</select></div>
                    <div><label className="block font-semibold mb-1">Due *</label><input type="date" required value={pmForm.dueDate} onChange={e=>setPmForm({...pmForm,dueDate:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono" /></div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="block font-semibold mb-1">Dept *</label><input required value={pmForm.department} onChange={e=>setPmForm({...pmForm,department:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                    <div><label className="block font-semibold mb-1">Equipment *</label><input required value={pmForm.equipmentName} onChange={e=>setPmForm({...pmForm,equipmentName:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="block font-semibold mb-1">Processor</label><input value={pmForm.cpuProcessor} onChange={e=>setPmForm({...pmForm,cpuProcessor:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono text-[11px]" /></div>
                    <div><label className="block font-semibold mb-1">IP</label><input value={pmForm.systemIP} onChange={e=>setPmForm({...pmForm,systemIP:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono" /></div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div><label className="block font-semibold mb-1">Assignee</label><input value={pmForm.assignedTo||''} onChange={e=>setPmForm({...pmForm,assignedTo:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                    <div><label className="block font-semibold mb-1">AntiVirus</label><input value={pmForm.antiVirus} onChange={e=>setPmForm({...pmForm,antiVirus:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                    <div><label className="block font-semibold mb-1">Status</label><select value={pmForm.status} onChange={e=>setPmForm({...pmForm,status:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold"><option>Scheduled</option><option>In Progress</option><option>Completed</option></select></div>
                  </div>
                  <div className="bg-slate-50 dark:bg-slate-800 p-3 rounded-xl">
                    <div className="font-bold mb-2 text-[11px]">PM Checklist</div>
                    <div className="grid grid-cols-2 gap-1">
                      {PM_CHECKLIST.map((task,i)=>(<label key={i} className="flex items-center gap-1.5 text-[11px]"><input type="checkbox" checked={pmForm.checklist?.[task]||false} onChange={e=>setPmForm({...pmForm,checklist:{...(pmForm.checklist||{}),[task]:e.target.checked}})} /> {task}</label>))}
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="block font-semibold mb-1">Notes Before</label><textarea rows="2" value={pmForm.notesBefore} onChange={e=>setPmForm({...pmForm,notesBefore:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                    <div><label className="block font-semibold mb-1">Notes After</label><textarea rows="2" value={pmForm.notesAfter} onChange={e=>setPmForm({...pmForm,notesAfter:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                  </div>
                  <div>
                    <label className="block font-semibold mb-1 flex items-center gap-2"><I.Camera /> Maintenance Photos ({pmForm.photos?.length||0})</label>
                    <input type="file" accept="image/*" multiple onChange={async e=>{
                      const files = Array.from(e.target.files||[]);
                      const uploaded = [];
                      for (const f of files) {
                        try { const up = await uploadToStorage(f, `pm/${Date.now()}_${f.name}`); uploaded.push({ url:up.url, name:up.name, size:up.size, type:up.type, uploadedAt: fmtDT() }); }
                        catch(err) { toast(`Upload failed: ${err}`,'error'); }
                      }
                      setPmForm(f => ({ ...f, photos: [...(f.photos||[]), ...uploaded] }));
                      toast(`${uploaded.length} photo(s) attached`,'success');
                    }} className="w-full text-[11px] file:mr-2 file:px-3 file:py-1.5 file:rounded-lg file:border-0 file:bg-brand-600 file:text-white file:text-xs file:font-bold" />
                    {pmForm.photos?.length>0 && (
                      <div className="grid grid-cols-4 gap-1 mt-2">
                        {pmForm.photos.map((p,i)=>(
                          <div key={i} className="relative group">
                            <img src={p.url} alt={p.name} className="w-full h-16 object-cover rounded border" />
                            <button type="button" onClick={()=>setPmForm(f=>({...f,photos:f.photos.filter((_,x)=>x!==i)}))} className="absolute top-0 right-0 bg-rose-600 text-white rounded text-[9px] p-0.5 opacity-0 group-hover:opacity-100"><I.X /></button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  {!editingPmItem && <label className="flex items-center gap-2 text-[11px] font-semibold"><input type="checkbox" checked={pmForm.recurring} onChange={e=>setPmForm({...pmForm,recurring:e.target.checked})} /> Recurring every {pmForm.recurrenceMonths} months (next 3)</label>}
                  <div className="flex justify-end gap-2 pt-2 border-t"><button type="button" onClick={()=>setIsPmModalOpen(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button><button type="submit" className="px-5 py-2 bg-brand-600 text-white rounded-xl font-bold">Save</button></div>
                </form>
              </div>
            </div>
          )}

          {/* User Modal — SAME fields (pin plaintext retained) */}
          {isUserModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-3">
                <div className="flex justify-between border-b pb-2"><h3 className="font-extrabold text-sm">{editingUser?'Edit User':'Add User'}</h3><button onClick={()=>setIsUserModalOpen(false)}>✕</button></div>
                <form onSubmit={async e=>{
                  e.preventDefault();
                  try {
                    if (editingUser && editingUser.firebaseKey) await apiCall(`${BASE}/system_users/${editingUser.firebaseKey}.json`, 'PUT', { ...editingUser, ...userForm });
                    else await apiCall(URLS.users, 'POST', { id:`u_${Date.now()}`, ...userForm });
                    await fetchAll(true); toast('User saved','success');
                  } catch(e) { toast('Save failed','error'); }
                  setIsUserModalOpen(false); setEditingUser(null);
                }} className="space-y-2 text-xs">
                  <div><label className="block font-semibold mb-1">Name *</label><input required value={userForm.name} onChange={e=>setUserForm({...userForm,name:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                  <div><label className="block font-semibold mb-1">Username *</label><input required value={userForm.username} onChange={e=>setUserForm({...userForm,username:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono" /></div>
                  <div><label className="block font-semibold mb-1">PIN (4-6 digits) *</label><input required pattern="\d{4,6}" value={userForm.pin} onChange={e=>setUserForm({...userForm,pin:e.target.value.replace(/\D/g,'')})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono text-center tracking-widest" /></div>
                  <div><label className="block font-semibold mb-1">Role</label><select value={userForm.role} onChange={e=>setUserForm({...userForm,role:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold">{Object.keys(ROLE_PERMS).map(r=><option key={r}>{r}</option>)}</select></div>
                  <div><label className="block font-semibold mb-1">Department</label><input value={userForm.department} onChange={e=>setUserForm({...userForm,department:e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" /></div>
                  <div className="flex gap-3"><label className="flex items-center gap-1.5"><input type="checkbox" checked={userForm.status==='Active'} onChange={e=>setUserForm({...userForm,status:e.target.checked?'Active':'Inactive'})} /> Active</label><label className="flex items-center gap-1.5"><input type="checkbox" checked={userForm.mustChangePin} onChange={e=>setUserForm({...userForm,mustChangePin:e.target.checked})} /> Force PIN change</label></div>
                  <div className="flex justify-end gap-2 pt-2 border-t"><button type="button" onClick={()=>setIsUserModalOpen(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button><button type="submit" className="px-5 py-2 bg-brand-600 text-white rounded-xl font-bold">Save</button></div>
                </form>
              </div>
            </div>
          )}

          {/* Signature Modal */}
          {signatureModal.open && (
            <SignatureCapture
              title={signatureModal.title}
              onSave={(data)=>{ signatureModal.onSave?.(data); }}
              onClose={()=>setSignatureModal(s=>({...s,open:false}))}
            />
          )}

          {/* Confirm Dialog */}
          {confirmDialog.open && (
            <div className="fixed inset-0 bg-slate-900/60 z-[70] flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-sm w-full p-6 space-y-3 animate-scale-in">
                <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">{confirmDialog.title}</h3>
                <p className="text-xs text-slate-600 dark:text-slate-400">{confirmDialog.message}</p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={()=>setConfirmDialog(d=>({...d,open:false}))} className="px-4 py-2 border rounded-xl text-xs font-bold">Cancel</button>
                  <button onClick={()=>confirmDialog.onConfirm?.()} className={`px-4 py-2 text-white rounded-xl text-xs font-bold ${confirmDialog.danger?'bg-rose-600 hover:bg-rose-700':'bg-brand-600'}`}>Confirm</button>
                </div>
              </div>
            </div>
          )}

          {/* Movement Report */}
          {showMovementReportModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-3xl w-full p-6 space-y-3">
                <div className="flex justify-between border-b pb-2"><h3 className="font-extrabold text-sm">Asset Movement Trail</h3><button onClick={()=>setShowMovementReportModal(false)}>✕</button></div>
                <div className="max-h-96 overflow-auto">
                  <table className="w-full text-left text-xs"><thead className="bg-slate-100 dark:bg-slate-800 sticky top-0"><tr><th className="p-2">Tag</th><th>Asset</th><th>Dept</th><th>Receiver</th><th>Issued</th></tr></thead>
                  <tbody>{tempDispatches.map((r,i)=><tr key={i} className="border-b"><td className="p-2 font-mono text-brand-600">{r.assetTagNo}</td><td>{r.assetName}</td><td>{r.department}</td><td>{r.receiver}</td><td className="font-mono">{r.issueDate}</td></tr>)}</tbody></table>
                </div>
                <div className="text-right"><button onClick={()=>setShowMovementReportModal(false)} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">Close</button></div>
              </div>
            </div>
          )}

          {/* Stock Report */}
          {showStockReportModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-3xl w-full p-6 space-y-3">
                <div className="flex justify-between border-b pb-2"><h3 className="font-extrabold text-sm">Stock Movement Audit</h3><button onClick={()=>setShowStockReportModal(false)}>✕</button></div>
                <div className="max-h-96 overflow-auto">
                  <table className="w-full text-left text-xs"><thead className="bg-slate-100 dark:bg-slate-800 sticky top-0"><tr><th className="p-2">Particulars</th><th>Opening</th><th>Pur</th><th>Iss</th><th>Bal</th><th>Short</th><th>Dead</th></tr></thead>
                  <tbody>{assets.map((a,i)=>{const bal=(+a.openingQty||0)+(+a.newPurchase||0)-(+a.issueItems||0)-(+a.shortItems||0)-(+a.deadItems||0);return <tr key={i} className="border-b"><td className="p-2">{a.particulars}</td><td>{a.openingQty}</td><td className="text-brand-600">+{a.newPurchase}</td><td className="text-amber-600">-{a.issueItems}</td><td className="font-bold">{bal}</td><td className="text-rose-600">{a.shortItems}</td><td>{a.deadItems}</td></tr>;})}</tbody></table>
                </div>
                <div className="text-right"><button onClick={()=>setShowStockReportModal(false)} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">Close</button></div>
              </div>
            </div>
          )}

          {/* PM Audit Report */}
          {showPmReportModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-2xl w-full p-6 space-y-3">
                <div className="flex justify-between border-b pb-2"><h3 className="font-extrabold text-sm">PM Audit Trail</h3><button onClick={()=>setShowPmReportModal(false)}>✕</button></div>
                <div className="max-h-96 overflow-auto space-y-1">
                  {pmAuditLogs.map((l,i)=><div key={i} className="text-[11px] p-2 bg-slate-50 dark:bg-slate-800 rounded-lg"><strong>{l.department}</strong> · {l.action} <span className="text-slate-400 float-right font-mono">{l.timestamp}</span></div>)}
                  {!pmAuditLogs.length && <div className="text-center py-6 text-slate-400 text-xs">No logs</div>}
                </div>
                <div className="text-right"><button onClick={()=>setShowPmReportModal(false)} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">Close</button></div>
              </div>
            </div>
          )}

          {/* QR generator */}
          {viewModalItem && (() => {
            setTimeout(() => {
              const c = document.getElementById('qr-canvas');
              if (c && window.QRCode) window.QRCode.toCanvas(c, JSON.stringify({ id:viewModalItem.id, sn:viewModalItem.serialNo, name:viewModalItem.particulars }), { width:120 }, () => {});
            }, 100);
            return null;
          })()}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
