<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT & Biomedical Asset Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #020617 0%, #080d1a 40%, #030712 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #020617; color: white; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading Asset Portal...</div>
        <div style="font-size: 12px; color: #94a3b8;">Syncing Enterprise Infrastructure</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";

    // Dynamic Color Palette generator for Alphabetical Groups
    const GROUP_COLOR_PALETTES = [
      { bg: 'from-blue-500/10 to-indigo-500/10', border: 'border-blue-500/30', text: 'text-blue-600', badge: 'bg-blue-600 text-white' },
      { bg: 'from-emerald-500/10 to-teal-500/10', border: 'border-emerald-500/30', text: 'text-emerald-600', badge: 'bg-emerald-600 text-white' },
      { bg: 'from-purple-500/10 to-violet-500/10', border: 'border-purple-500/30', text: 'text-purple-600', badge: 'bg-purple-600 text-white' },
      { bg: 'from-amber-500/10 to-orange-500/10', border: 'border-amber-500/30', text: 'text-amber-600', badge: 'bg-amber-600 text-white' },
      { bg: 'from-rose-500/10 to-pink-500/10', border: 'border-rose-500/30', text: 'text-rose-600', badge: 'bg-rose-600 text-white' },
      { bg: 'from-cyan-500/10 to-sky-500/10', border: 'border-cyan-500/30', text: 'text-cyan-600', badge: 'bg-cyan-600 text-white' }
    ];

    // Initial Default User Directory with Roles & Department Allocations
    const INITIAL_USER_ACCOUNTS = {
      '1234': { name: 'Super Admin', role: 'Admin', dept: 'Management', pin: '1234' },
      '2222': { name: 'Rajesh Sharma', role: 'IT Manager', dept: 'IT Infrastructure', pin: '2222' },
      '3333': { name: 'Dr. Suresh Verma', role: 'Biomedical Manager', dept: 'Biomedical', pin: '3333' },
      '4444': { name: 'Amit Tech', role: 'Technician', dept: 'IT Infrastructure', pin: '4444' },
      '5555': { name: 'Biomed Tech', role: 'Technician', dept: 'Biomedical', pin: '5555' },
      '0000': { name: 'Guest Staff', role: 'Viewer', dept: 'General', pin: '0000' }
    };

    // Role Rights & View Access Matrix
    const DEFAULT_ROLE_RIGHTS = {
      Admin: { 
        canAdd: true, canEdit: true, canDelete: true, canStockIn: true, 
        allowedDepts: ['All', 'IT Infrastructure', 'Biomedical'],
        tabs: ['dashboard', 'inventory', 'analytics', 'reports', 'rights'] 
      },
      "IT Manager": { 
        canAdd: true, canEdit: true, canDelete: false, canStockIn: true, 
        allowedDepts: ['IT Infrastructure'],
        tabs: ['dashboard', 'inventory', 'analytics', 'reports'] 
      },
      "Biomedical Manager": { 
        canAdd: true, canEdit: true, canDelete: false, canStockIn: true, 
        allowedDepts: ['Biomedical'],
        tabs: ['dashboard', 'inventory', 'analytics', 'reports'] 
      },
      Technician: { 
        canAdd: false, canEdit: true, canDelete: false, canStockIn: true, 
        allowedDepts: ['IT Infrastructure', 'Biomedical'],
        tabs: ['inventory', 'analytics'] 
      },
      Viewer: { 
        canAdd: false, canEdit: false, canDelete: false, canStockIn: false, 
        allowedDepts: ['All', 'IT Infrastructure', 'Biomedical'],
        tabs: ['inventory'] 
      }
    };

    function App() {
      const [userAccounts, setUserAccounts] = useState(INITIAL_USER_ACCOUNTS);
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState({ name: 'Admin', role: 'Admin', dept: 'Management' });
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [roleRights, setRoleRights] = useState(DEFAULT_ROLE_RIGHTS);
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');
      const [departmentFilter, setDepartmentFilter] = useState('');

      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [activeGroupModal, setActiveGroupModal] = useState(null);

      // Biomedical User Creation State (for Admin)
      const [newUserForm, setNewUserForm] = useState({
        name: '',
        pin: '',
        role: 'Biomedical Manager',
        dept: 'Biomedical'
      });

      const lineChartRef = useRef(null);
      const donutChartRef = useRef(null);

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const [formData, setFormData] = useState({
        department: 'IT Infrastructure',
        group: '',
        particulars: '',
        cableLength: '',
        unit: 'Piece',
        brand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear()
      });

      const fetchCloudData = async () => {
        try {
          const res = await fetch(FIREBASE_DB_URL);
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
          } else {
            setAssets([]);
          }
        } catch (err) {
          console.error("Firebase fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 3000);
        return () => clearInterval(interval);
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        const foundUser = userAccounts[pinInput];
        if (foundUser) {
          setCurrentUser(foundUser);
          setIsLoggedIn(true);
          setLoginError('');
          const rights = DEFAULT_ROLE_RIGHTS[foundUser.role] || DEFAULT_ROLE_RIGHTS.Viewer;
          setActiveTab(rights.tabs[0] || 'inventory');
        } else {
          setLoginError('Invalid Security PIN Code!');
        }
      };

      const handleCreateUser = (e) => {
        e.preventDefault();
        if (!newUserForm.pin || !newUserForm.name) {
          alert("Please fill in User Name and Security PIN!");
          return;
        }
        if (userAccounts[newUserForm.pin]) {
          alert("User PIN already exists! Choose a unique PIN.");
          return;
        }

        setUserAccounts(prev => ({
          ...prev,
          [newUserForm.pin]: {
            name: newUserForm.name,
            role: newUserForm.role,
            dept: newUserForm.dept,
            pin: newUserForm.pin
          }
        }));

        alert(`Success: ${newUserForm.dept} user "${newUserForm.name}" created with PIN ${newUserForm.pin}!`);
        setNewUserForm({ name: '', pin: '', role: 'Biomedical Manager', dept: 'Biomedical' });
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const userRights = roleRights[currentUser.role] || DEFAULT_ROLE_RIGHTS.Viewer;

      const visibleAssets = assets.filter(item => {
        if (currentUser.role === 'Admin' || currentUser.role === 'Viewer') return true;
        const itemDept = item.department || 'IT Infrastructure';
        return userRights.allowedDepts.includes(itemDept);
      });

      const handleOpenModal = (asset = null) => {
        if (!userRights.canAdd && !userRights.canEdit) {
          alert("Unauthorized: Your role does not have permission to modify assets.");
          return;
        }
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          setEditingAsset(asset);
          setFormData({
            department: asset.department || 'IT Infrastructure',
            group: asset.group || '',
            particulars: asset.particulars || '',
            cableLength: asset.cableLength || '',
            unit: asset.unit || 'Piece',
            brand: asset.brand || '',
            serialNo: asset.serialNo || '',
            vendor: asset.vendor || '',
            invoiceNo: asset.invoiceNo || '',
            warranty: asset.warranty || '',
            openingQty: asset.openingQty || 0,
            newPurchase: asset.newPurchase || 0,
            issueItems: asset.issueItems || 0,
            shortItems: asset.shortItems || 0,
            deadItems: asset.deadItems || 0,
            category: asset.category || 'Consumable',
            location: asset.location || '',
            minAlert: asset.minAlert || 2,
            entryMonth: asset.entryMonth || autoMonth
          });
        } else {
          setEditingAsset(null);
          setFormData({
            department: currentUser.dept !== 'Management' ? currentUser.dept : 'IT Infrastructure',
            group: '',
            particulars: '',
            cableLength: '',
            unit: 'Piece',
            brand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '',
            minAlert: 2,
            entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const finalData = {
          ...formData,
          entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear()
        };

        try {
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalData)
            });
          } else {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...finalData, id: currentTimestamp })
            });
          }
          setIsModalOpen(false);
          await fetchCloudData();
        } catch (err) {
          alert("Error saving entry.");
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteAsset = async (asset) => {
        if (!userRights.canDelete) {
          alert("Permission Denied: Only Admins are authorized to delete items.");
          return;
        }
        if (window.confirm("Are you sure you want to delete this asset record?")) {
          setLoading(true);
          try {
            const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${asset.firebaseKey}.json`;
            await fetch(deleteUrl, { method: 'DELETE' });
            await fetchCloudData();
          } catch (err) {
            console.error(err);
          } finally {
            setLoading(false);
          }
        }
      };

      const filteredAssets = visibleAssets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        const matchesDept = departmentFilter === '' || (item.department || 'IT Infrastructure') === departmentFilter;
        return matchesSearch && matchesLocation && matchesMonth && matchesDept;
      });

      // Group Summaries mapped & Alphabetically Sorted
      const groupSummaryMap = filteredAssets.reduce((acc, item) => {
        const grp = (item.group || 'OTHER').toUpperCase().trim();
        if (!acc[grp]) {
          acc[grp] = [];
        }
        acc[grp].push(item);
        return acc;
      }, {});

      const groupsMap = groupSummaryMap;

      const groupSummaryList = Object.keys(groupSummaryMap).map(grp => {
        const items = groupSummaryMap[grp];
        let lowStockCount = 0;
        items.forEach(item => {
          const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
          const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
          if (phy <= Number(item.minAlert || 2)) {
            lowStockCount += 1;
          }
        });
        return { groupName: grp, count: items.length, lowStockCount, items };
      });

      // Alphabetical sorting of groups
      const sortedGroupSummaryList = groupSummaryList.sort((a, b) => 
        a.groupName.localeCompare(b.groupName)
      );

      const totalRecords = visibleAssets.length;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4 relative overflow-hidden">
            {/* Background Decorative Glow Elements */}
            <div className="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div className="bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl shadow-2xl max-w-md w-full border border-slate-800 relative z-10">
              <div className="text-center mb-6">
                <div className="inline-flex p-4 bg-gradient-to-tr from-blue-600 to-indigo-500 text-white rounded-2xl mb-3 shadow-lg shadow-blue-500/30">
                  <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 className="text-2xl font-black text-white tracking-tight">SUPER ADMIN PORTAL</h1>
                <p className="text-xs font-semibold text-slate-400 mt-1">IT Infrastructure & Biomedical Enterprise Control</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Super Admin Security PIN / Password</label>
                  <input 
                    type="password" 
                    placeholder="Enter Super Admin PIN (Default: 1234)" 
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3.5 bg-slate-800/90 border border-slate-700 rounded-xl text-xs font-medium text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition"
                    required
                  />
                </div>

                {loginError && <p className="text-xs text-rose-400 font-bold bg-rose-950/50 p-2.5 rounded-lg border border-rose-800/50">{loginError}</p>}

                <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-blue-600/30 transition duration-150 flex items-center justify-center gap-2 cursor-pointer">
                  Authenticate Super Admin
                </button>
              </form>

              <div className="mt-5 pt-4 border-t border-slate-800 flex justify-between items-center text-[11px]">
                <button 
                  type="button" 
                  onClick={() => {
                    const currentPin = prompt("Enter Current Super Admin PIN:");
                    if (currentPin === userAccounts['1234']?.pin) {
                      const newPin = prompt("Enter NEW Security PIN Code:");
                      if (newPin && newPin.trim()) {
                        setUserAccounts(prev => ({
                          ...prev,
                          [newPin]: { ...prev['1234'], pin: newPin }
                        }));
                        alert("Super Admin PIN code updated successfully!");
                      }
                    } else if (currentPin !== null) {
                      alert("Incorrect current PIN!");
                    }
                  }} 
                  className="text-blue-400 hover:text-blue-300 font-semibold cursor-pointer underline"
                >
                  Reset Admin PIN?
                </button>
                <span className="text-slate-500 font-semibold">Protected Portal v3.2</span>
              </div>
            </div>
          </div>
        );
      }

      const availableNavTabs = [
        { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
        { id: 'inventory', label: '1. Stock Register', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
        { id: 'analytics', label: '2. Analytics Board', icon: 'M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' },
        { id: 'reports', label: '3. Audit & Reports', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
        { id: 'rights', label: '4. Privilege & Users', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' }
      ].filter(t => userRights.tabs.includes(t.id));

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100">
          
          <aside className="w-64 neon-sidebar text-slate-300 flex flex-col justify-between p-4 shadow-2xl border-r border-slate-900 relative">
            <div>
              <div className="text-center pt-2 pb-5 border-b border-slate-800/60">
                <div className="inline-flex p-3 bg-blue-600/20 border border-blue-500/40 rounded-full mb-2 shadow-lg shadow-blue-500/20">
                  <svg className="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">ENTERPRISE ASSET</h2>
                <h2 className="font-black text-blue-400 text-xs tracking-wider leading-tight">IT & BIOMEDICAL</h2>
                <span className="text-[11px] text-emerald-400 font-bold flex items-center justify-center gap-1.5 mt-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synchronized
                </span>
              </div>

              <nav className="mt-5 space-y-2">
                {availableNavTabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full text-left px-4 py-3 rounded-2xl text-xs font-bold transition-all duration-200 flex items-center justify-between cursor-pointer ${
                      activeTab === tab.id 
                        ? 'active-neon-btn text-white' 
                        : 'hover:bg-slate-900/80 text-slate-300 hover:text-white'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={tab.icon}></path></svg>
                      <span>{tab.label}</span>
                    </div>
                    {activeTab === tab.id && <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7"></path></svg>}
                  </button>
                ))}
              </nav>
            </div>

            <div className="space-y-3 pt-3 border-t border-slate-900">
              <div className="p-3 bg-slate-900/90 rounded-2xl border border-slate-800 flex items-center space-x-3">
                <div className="relative">
                  <div className="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white text-sm uppercase">
                    {currentUser.name.charAt(0)}
                  </div>
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 absolute bottom-0 right-0 border-2 border-slate-900"></span>
                </div>
                <div className="overflow-hidden">
                  <h4 className="font-bold text-white text-xs leading-tight truncate">{currentUser.name}</h4>
                  <p className="text-[10px] text-blue-400 font-semibold leading-tight truncate">{currentUser.role}</p>
                  <p className="text-[9px] text-slate-400 font-medium leading-tight truncate">{currentUser.dept}</p>
                </div>
              </div>

              <button 
                onClick={handleLogout} 
                className="w-full py-3 bg-gradient-to-r from-rose-900 to-rose-700 hover:from-rose-800 hover:to-rose-600 text-white rounded-2xl font-bold text-xs shadow-lg shadow-rose-900/30 transition flex items-center justify-center gap-2 cursor-pointer"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign Out
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden p-4 space-y-3">
            
            {activeTab === 'inventory' && userRights.tabs.includes('inventory') && (
              <>
                <header className="bg-gradient-to-r from-slate-950 via-slate-900 to-blue-950 text-white p-3.5 rounded-xl shadow-lg flex justify-between items-center border border-slate-800">
                  <div className="flex items-center space-x-3">
                    <div className="p-2 bg-blue-600/30 border border-blue-500/40 rounded-lg text-blue-400">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <div>
                      <h1 className="text-sm font-extrabold tracking-wide uppercase">Group-Wise Stock Register</h1>
                      <p className="text-[10px] text-slate-400 font-medium">Categorized Alphabetically with Dynamic Color Coding</p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-2">
                    <select 
                      value={departmentFilter} 
                      onChange={(e) => setDepartmentFilter(e.target.value)}
                      className="px-3 py-1.5 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-white outline-none font-bold text-amber-300"
                    >
                      <option value="">Filter Dept: All</option>
                      <option value="IT Infrastructure">IT Infrastructure</option>
                      <option value="Biomedical">Biomedical Dept</option>
                    </select>

                    <div className="relative">
                      <input 
                        type="text" 
                        placeholder="Search Group or Asset..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-44 px-3 py-1.5 pl-8 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500"
                      />
                      <svg className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>

                    {userRights.canAdd && (
                      <button 
                        onClick={() => handleOpenModal()} 
                        className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg shadow-md shadow-blue-600/30 transition flex items-center gap-1 cursor-pointer"
                      >
                        + New Asset
                      </button>
                    )}
                  </div>
                </header>

                {/* Pure Dynamic Alphabetical Colored Group Grid */}
                <div className="flex-1 overflow-y-auto space-y-4 pr-1">
                  {sortedGroupSummaryList.length === 0 ? (
                    <div className="p-12 bg-white rounded-2xl border border-slate-200 text-center text-slate-400 font-medium">
                      {loading ? 'Syncing cloud data...' : 'No inventory groups found for selected filter.'}
                    </div>
                  ) : (
                    sortedGroupSummaryList.map((grp, colorIdx) => {
                      const theme = GROUP_COLOR_PALETTES[colorIdx % GROUP_COLOR_PALETTES.length];
                      const isExpanded = selectedGroupFilter.toLowerCase() === grp.groupName.toLowerCase();

                      return (
                        <div key={grp.groupName} className={`rounded-2xl border ${theme.border} bg-white shadow-sm overflow-hidden transition-all duration-200`}>
                          
                          {/* Group Header Banner */}
                          <div 
                            onClick={() => setActiveGroupModal(grp.groupName)}
                            className={`p-4 bg-gradient-to-r ${theme.bg} flex items-center justify-between cursor-pointer select-none`}
                          >
                            <div className="flex items-center space-x-3">
                              <div className={`w-8 h-8 rounded-xl bg-white shadow-sm flex items-center justify-center font-black ${theme.text} text-sm`}>
                                {grp.groupName.charAt(0)}
                              </div>
                              <div>
                                <h3 className={`font-black text-sm tracking-wider uppercase ${theme.text}`}>
                                  {grp.groupName}
                                </h3>
                                <p className="text-[11px] font-semibold text-slate-500">
                                  {grp.count} Items Registered (Click to view list)
                                </p>
                              </div>
                            </div>

                            <div className="flex items-center space-x-3">
                              {grp.lowStockCount > 0 && (
                                <span className="px-2.5 py-1 text-[10px] font-black rounded-full bg-rose-600 text-white shadow-sm animate-pulse">
                                  ⚠️ {grp.lowStockCount} LOW STOCK
                                </span>
                              )}
                              <span className={`px-3 py-1 rounded-xl text-xs font-bold ${theme.badge} shadow-sm`}>
                                Total: {grp.count}
                              </span>
                              <svg className={`w-5 h-5 ${theme.text}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </>
            )}

            {/* Admin Privilege Control & Biomedical User Account Manager Panel */}
            {activeTab === 'rights' && userRights.tabs.includes('rights') && (
              <div className="flex-1 overflow-y-auto space-y-6">
                
                {/* Biomedical & IT User Creator Section (Admin Only) */}
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex items-center space-x-3 border-b border-slate-200 pb-3">
                    <div className="p-2 bg-emerald-100 text-emerald-700 rounded-xl">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                    </div>
                    <div>
                      <h2 className="text-base font-bold text-slate-900">Biomedical & Department User Account Generator</h2>
                      <p className="text-xs text-slate-500">Create login PIN/password and assign roles for Biomedical department users</p>
                    </div>
                  </div>

                  <form onSubmit={handleCreateUser} className="grid grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Target Department *</label>
                      <select 
                        value={newUserForm.dept} 
                        onChange={(e) => setNewUserForm({...newUserForm, dept: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-lg bg-white font-bold text-emerald-800 outline-none"
                      >
                        <option value="Biomedical">Biomedical Dept</option>
                        <option value="IT Infrastructure">IT Infrastructure</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">User Full Name *</label>
                      <input 
                        type="text" 
                        value={newUserForm.name}
                        onChange={(e) => setNewUserForm({...newUserForm, name: e.target.value})}
                        placeholder="e.g. Dr. Anil Kumar"
                        className="w-full p-2.5 border border-slate-300 rounded-lg bg-white outline-none"
                        required
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Assign User Role *</label>
                      <select 
                        value={newUserForm.role} 
                        onChange={(e) => setNewUserForm({...newUserForm, role: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-lg bg-white outline-none"
                      >
                        <option value="Biomedical Manager">Biomedical Manager (Add/Edit Access)</option>
                        <option value="Technician">Biomedical Technician (Stock Update Only)</option>
                        <option value="Viewer">Biomedical Viewer (Read-Only)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Create Security PIN (Password) *</label>
                      <div className="flex space-x-2">
                        <input 
                          type="text" 
                          value={newUserForm.pin}
                          onChange={(e) => setNewUserForm({...newUserForm, pin: e.target.value})}
                          placeholder="e.g. 7777"
                          className="w-full p-2.5 border border-slate-300 rounded-lg bg-white font-mono font-bold text-blue-700 outline-none"
                          required
                        />
                        <button type="submit" className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-md transition cursor-pointer">
                          Create
                        </button>
                      </div>
                    </div>
                  </form>

                  {/* Active Users Directory List */}
                  <div className="pt-2">
                    <h3 className="font-bold text-xs text-slate-800 mb-2">Registered System Accounts</h3>
                    <div className="grid grid-cols-3 gap-3 text-xs">
                      {Object.keys(userAccounts).map(pKey => (
                        <div key={pKey} className="p-3 bg-white rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
                          <div>
                            <p className="font-bold text-slate-900">{userAccounts[pKey].name}</p>
                            <p className="text-[10px] text-blue-600 font-semibold">{userAccounts[pKey].role} • {userAccounts[pKey].dept}</p>
                          </div>
                          <span className="px-2 py-1 bg-slate-100 text-slate-700 font-mono font-bold rounded border border-slate-300">
                            PIN: {pKey}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* GROUP ASSET MODAL LIST VIEW */}
          {activeGroupModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-5xl w-full p-6 border border-slate-200 max-h-[85vh] flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center border-b border-slate-200 pb-3 mb-3">
                    <div>
                      <span className="text-[10px] font-extrabold text-blue-600 uppercase tracking-wider">Group Particulars List</span>
                      <h3 className="text-base font-black text-slate-900 uppercase">{activeGroupModal}</h3>
                    </div>
                    <button 
                      onClick={() => setActiveGroupModal(null)} 
                      className="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs"
                    >
                      Close ✕
                    </button>
                  </div>

                  <div className="overflow-x-auto max-h-[60vh]">
                    <table className="w-full text-xs text-left border-collapse table-compact whitespace-nowrap">
                      <thead className="bg-slate-900 text-white font-bold text-[10px] uppercase">
                        <tr>
                          <th className="p-2">Particular Name</th>
                          <th className="p-2 text-blue-400">Brand</th>
                          <th className="p-2">Cable / Spec</th>
                          <th className="p-2">Serial No</th>
                          <th className="p-2 text-center">Opening</th>
                          <th className="p-2 text-center">Purchased</th>
                          <th className="p-2 text-center text-emerald-400">Issued</th>
                          <th className="p-2 text-center text-blue-400 font-bold">Balance</th>
                          <th className="p-2 text-center text-rose-400">Dead</th>
                          <th className="p-2">Location</th>
                          <th className="p-2 text-center">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 text-slate-800">
                        {groupsMap[activeGroupModal].map((item, idx) => {
                          const balanceStock = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
                          return (
                            <tr key={idx} className="hover:bg-slate-50">
                              <td className="p-2 font-bold">{item.particulars}</td>
                              <td className="p-2 text-blue-600 font-semibold">{item.brand || '-'}</td>
                              <td className="p-2 text-slate-500">{item.cableLength ? `${item.cableLength} ${item.unit}` : '-'}</td>
                              <td className="p-2 text-slate-400 font-mono text-[10px]">{item.serialNo || '-'}</td>
                              <td className="p-2 text-center font-semibold">{item.openingQty || 0}</td>
                              <td className="p-2 text-center font-semibold">{item.newPurchase || 0}</td>
                              <td className="p-2 text-center font-bold text-emerald-600">{item.issueItems || 0}</td>
                              <td className="p-2 text-center font-extrabold text-blue-700 bg-blue-50/50">{balanceStock}</td>
                              <td className="p-2 text-center text-rose-600 font-bold">{item.deadItems || 0}</td>
                              <td className="p-2 text-slate-500">{item.location || '-'}</td>
                              <td className="p-2 text-center">
                                <button 
                                  onClick={() => { setActiveGroupModal(null); handleOpenModal(item); }} 
                                  className="text-blue-600 font-bold hover:underline"
                                >
                                  Edit
                                </button>
                                {userRights.canDelete && (
                                  <button 
                                    onClick={() => handleDeleteAsset(item)} 
                                    className="ml-2 text-rose-600 font-bold hover:underline"
                                  >
                                    Del
                                  </button>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
                
                <div className="pt-3 border-t border-slate-200 text-right">
                  <button onClick={() => setActiveGroupModal(null)} className="px-4 py-1.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow">Done</button>
                </div>
              </div>
            </div>
          )}

          {/* ADD / EDIT ASSET MODAL FORM */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 border border-slate-200 max-h-[90vh] overflow-y-auto">
                <h3 className="text-sm font-bold text-slate-900 mb-4 border-b border-slate-200 pb-2">
                  {editingAsset ? 'Edit Asset Record' : 'Register New Asset Entry'}
                </h3>
                <form onSubmit={handleSaveAsset} className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block font-bold text-blue-700 mb-1">Target Department *</label>
                    <select 
                      value={formData.department} 
                      onChange={(e) => setFormData({...formData, department: e.target.value})} 
                      className="w-full p-2 border border-blue-300 rounded-lg bg-blue-50/40 outline-none font-bold" 
                      required
                    >
                      <option value="IT Infrastructure">IT Infrastructure</option>
                      <option value="Biomedical">Biomedical Department</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Stock Group (Category)</label>
                    <input type="text" value={formData.group} onChange={(e) => setFormData({...formData, group: e.target.value})} placeholder="e.g. MOUSE, VENTILATOR" className="w-full p-2 border border-slate-300 rounded-lg outline-none uppercase font-bold" required />
                  </div>

                  <div className="col-span-2">
                    <label className="block font-semibold text-slate-700 mb-1">Asset Particulars / Description</label>
                    <input type="text" value={formData.particulars} onChange={(e) => setFormData({...formData, particulars: e.target.value})} placeholder="e.g. DELL MONITOR 24INCH or ECG MACHINE 12CH" className="w-full p-2 border border-slate-300 rounded-lg outline-none" required />
                  </div>

                  <div className="col-span-2 grid grid-cols-2 gap-3 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Cable / Spec Length (Optional)</label>
                      <input type="text" value={formData.cableLength} onChange={(e) => setFormData({...formData, cableLength: e.target.value})} placeholder="e.g. 1.5, 3, 5" className="w-full p-1.5 border border-slate-300 rounded-lg bg-white outline-none" />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Measurement Unit</label>
                      <select value={formData.unit} onChange={(e) => setFormData({...formData, unit: e.target.value})} className="w-full p-1.5 border border-slate-300 rounded-lg bg-white outline-none font-bold">
                        <option value="Piece">Piece</option>
                        <option value="Meter">Meter</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-blue-600 mb-1">Brand Name</label>
                    <input type="text" value={formData.brand} onChange={(e) => setFormData({...formData, brand: e.target.value})} placeholder="e.g. PHILIPS, DELL, GE" className="w-full p-2 border border-blue-200 rounded-lg bg-blue-50/20 outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-emerald-700 mb-1">Entry Period (Month)</label>
                    <input type="text" value={formData.entryMonth} onChange={(e) => setFormData({...formData, entryMonth: e.target.value})} className="w-full p-2 border border-emerald-200 rounded-lg bg-emerald-50/30 font-semibold text-emerald-800 outline-none" required />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Serial Number / Asset Tag</label>
                    <input type="text" value={formData.serialNo} onChange={(e) => setFormData({...formData, serialNo: e.target.value})} placeholder="e.g. SN-99281-XYZ" className="w-full p-2 border border-slate-300 rounded-lg outline-none font-mono" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Procurement Vendor Name</label>
                    <input type="text" value={formData.vendor} onChange={(e) => setFormData({...formData, vendor: e.target.value})} placeholder="e.g. HealthTech Ltd" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Category Classification</label>
                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg outline-none">
                      <option value="Consumable">Consumable</option>
                      <option value="Non-Consumable">Non-Consumable</option>
                      <option value="Fixed Assets">Fixed Assets</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Low Stock Alert Limit</label>
                    <input type="number" value={formData.minAlert} onChange={(e) => setFormData({...formData, minAlert: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Opening Quantity Stock (OP)</label>
                    <input type="number" value={formData.openingQty} onChange={(e) => setFormData({...formData, openingQty: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">New Purchase Quantity (Purch.)</label>
                    <input type="number" value={formData.newPurchase} onChange={(e) => setFormData({...formData, newPurchase: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Issued Quantity Total</label>
                    <input type="number" value={formData.issueItems} onChange={(e) => setFormData({...formData, issueItems: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Dead / Faulty Quantity</label>
                    <input type="number" value={formData.deadItems} onChange={(e) => setFormData({...formData, deadItems: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div className="col-span-2">
                    <label className="block font-semibold text-slate-700 mb-1">Installation Location / User Allocation</label>
                    <input type="text" value={formData.location} onChange={(e) => setFormData({...formData, location: e.target.value})} placeholder="e.g. ICU Room 3, B Block, Dr. Jha Room" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div className="col-span-2 flex justify-end space-x-2 pt-4 border-t border-slate-200">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow-md cursor-pointer">Save Asset Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
