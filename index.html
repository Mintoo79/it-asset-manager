<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #020617 0%, #080d1a 40%, #030712 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #020617; color: white; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading IT Asset Portal...</div>
        <div style="font-size: 12px; color: #94a3b8;">Establishing secure cloud connection</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";

    const IMPORTANT_ITEMS = ['mouse', 'keyboard', 'ram', 'ssd', 'hdd', 'web camera', 'camera'];

    function isImportantItem(name) {
      if (!name) return false;
      const lower = name.toLowerCase();
      return IMPORTANT_ITEMS.some(item => lower.includes(item));
    }

    // Dynamic gradient backgrounds for group cards based on group name
    const GROUP_COLORS = [
      "from-blue-600 to-indigo-700 text-white",
      "from-emerald-600 to-teal-700 text-white",
      "from-purple-600 to-indigo-800 text-white",
      "from-amber-500 to-orange-600 text-white",
      "from-cyan-600 to-blue-700 text-white",
      "from-rose-600 to-pink-700 text-white"
    ];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');

      const [selectedGroupFilter, setSelectedGroupFilter] = useState(null);
      const [expandedGroup, setExpandedGroup] = useState(null);

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        cableLength: '',
        unit: 'Piece',
        brand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear()
      });

      const fetchCloudData = async () => {
        try {
          const res = await fetch(FIREBASE_DB_URL);
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
          } else {
            setAssets([]);
          }
        } catch (err) {
          console.error("Firebase fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 3000);
        return () => clearInterval(interval);
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
        } else {
          setLoginError('Invalid Security PIN (Default PIN: 1234)');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const handleOpenModal = (asset = null) => {
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          setEditingAsset(asset);
          setFormData({
            group: asset.group || '',
            particulars: asset.particulars || '',
            cableLength: asset.cableLength || '',
            unit: asset.unit || 'Piece',
            brand: asset.brand || '',
            serialNo: asset.serialNo || '',
            vendor: asset.vendor || '',
            invoiceNo: asset.invoiceNo || '',
            warranty: asset.warranty || '',
            openingQty: asset.openingQty || 0,
            newPurchase: asset.newPurchase || 0,
            issueItems: asset.issueItems || 0,
            shortItems: asset.shortItems || 0,
            deadItems: asset.deadItems || 0,
            category: asset.category || 'Consumable',
            location: asset.location || '',
            minAlert: asset.minAlert || 2,
            entryMonth: asset.entryMonth || autoMonth
          });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            cableLength: '',
            unit: 'Piece',
            brand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '',
            minAlert: 2,
            entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const finalData = {
          ...formData,
          entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear()
        };

        try {
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalData)
            });
          } else {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...finalData, id: currentTimestamp })
            });
          }
          setIsModalOpen(false);
          await fetchCloudData();
        } catch (err) {
          alert("Error saving entry.");
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteAsset = async (asset) => {
        if (window.confirm("Are you sure you want to delete this asset record?")) {
          setLoading(true);
          try {
            const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${asset.firebaseKey}.json`;
            await fetch(deleteUrl, { method: 'DELETE' });
            await fetchCloudData();
          } catch (err) {
            console.error(err);
          } finally {
            setLoading(false);
          }
        }
      };

      // Filtered assets
      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        const matchesGroup = selectedGroupFilter === null || (item.group || '').toUpperCase() === selectedGroupFilter.toUpperCase();
        return matchesSearch && matchesLocation && matchesMonth && matchesGroup;
      });

      // Group Summaries sorted alphabetically
      const groupNames = Array.from(new Set(assets.map(a => (a.group || 'UNGROUPED').toUpperCase()))).sort();
      
      const groupSummaries = groupNames.map((groupName, idx) => {
        const groupItems = assets.filter(a => (a.group || 'UNGROUPED').toUpperCase() === groupName);
        const totalQty = groupItems.reduce((acc, i) => {
          const bal = (Number(i.openingQty || 0) + Number(i.newPurchase || 0)) - Number(i.issueItems || 0);
          return acc + Math.max(bal, 0);
        }, 0);
        const lowCount = groupItems.filter(i => {
          const bal = (Number(i.openingQty || 0) + Number(i.newPurchase || 0)) - Number(i.issueItems || 0);
          return bal <= Number(i.minAlert || 2);
        }).length;

        return {
          name: groupName,
          count: groupItems.length,
          totalQty: totalQty,
          lowCount: lowCount,
          colorClass: GROUP_COLORS[idx % GROUP_COLORS.length]
        };
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);
      const totalRecords = assets.length;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <div className="text-center mb-6">
                <div className="inline-flex p-3.5 bg-blue-50 text-blue-600 rounded-2xl mb-3 shadow-inner border border-blue-100">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">IT Asset Portal</h1>
                <p className="text-xs font-medium text-slate-500 mt-1">Enterprise Cloud Inventory Infrastructure</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Security PIN Code</label>
                  <input 
                    type="password" 
                    placeholder="Enter PIN (Default: 1234)" 
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none transition"
                    required
                  />
                </div>

                {loginError && <p className="text-xs text-rose-500 font-medium">{loginError}</p>}

                <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-blue-500/20 transition duration-150 flex items-center justify-center gap-2 cursor-pointer">
                  Authenticate & Sign In
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100">
          {/* Left Neon Sidebar */}
          <aside className="w-64 neon-sidebar text-slate-300 flex flex-col justify-between p-4 shadow-2xl border-r border-slate-900 relative">
            <div>
              <div className="text-center pt-2 pb-5 border-b border-slate-800/60">
                <div className="inline-flex p-3 bg-blue-600/20 border border-blue-500/40 rounded-full mb-2 shadow-lg shadow-blue-500/20">
                  <svg className="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">IT ASSET</h2>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">MANAGEMENT</h2>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">SYSTEM</h2>
                <span className="text-[11px] text-emerald-400 font-bold flex items-center justify-center gap-1.5 mt-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synchronized
                </span>
              </div>

              <nav className="mt-5 space-y-2">
                {[
                  { id: 'inventory', label: '1. Stock Register', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className="w-full text-left px-4 py-3 rounded-2xl text-xs font-bold transition-all duration-200 flex items-center justify-between cursor-pointer active-neon-btn text-white"
                  >
                    <div className="flex items-center gap-3">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={tab.icon}></path></svg>
                      <span>{tab.label}</span>
                    </div>
                  </button>
                ))}
              </nav>
            </div>

            <div className="space-y-3 pt-3 border-t border-slate-900">
              <div className="p-3 bg-slate-900/90 rounded-2xl border border-slate-800 flex items-center space-x-3">
                <div className="relative">
                  <div className="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white text-sm">
                    A
                  </div>
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 absolute bottom-0 right-0 border-2 border-slate-900"></span>
                </div>
                <div>
                  <h4 className="font-bold text-white text-xs leading-tight">Admin</h4>
                  <p className="text-[10px] text-slate-400 font-medium leading-tight">IT Administrator</p>
                </div>
              </div>

              <button 
                onClick={handleLogout} 
                className="w-full py-3 bg-gradient-to-r from-rose-900 to-rose-700 hover:from-rose-800 hover:to-rose-600 text-white rounded-2xl font-bold text-xs shadow-lg shadow-rose-900/30 transition flex items-center justify-center gap-2 cursor-pointer"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign Out
              </button>
            </div>
          </aside>

          {/* Main Content Area - All Pages Active */}
          <main className="flex-1 flex flex-col overflow-hidden p-4 space-y-3">
            
            {/* VIEW 1: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="flex-1 overflow-auto space-y-4">
                <header className="bg-gradient-to-r from-slate-950 via-slate-900 to-blue-950 text-white p-3.5 rounded-xl shadow-lg flex justify-between items-center border border-slate-800">
                  <div className="flex items-center space-x-3">
                    <div className="p-2 bg-blue-600/30 border border-blue-500/40 rounded-lg text-blue-400">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    </div>
                    <div>
                      <h1 className="text-sm font-extrabold tracking-wide uppercase">Operations Dashboard Overview</h1>
                      <p className="text-[10px] text-slate-400">Executive Asset & Health Metrics</p>
                    </div>
                  </div>
                </header>

                <div className="grid grid-cols-4 gap-4">
                  <div className="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-[10px] font-bold text-slate-400 uppercase">Total Items</p>
                      <h3 className="text-2xl font-black text-slate-900 mt-0.5">{totalRecords}</h3>
                    </div>
                    <div className="p-3 bg-blue-50 text-blue-600 rounded-xl">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    </div>
                  </div>

                  <div className="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-[10px] font-bold text-slate-400 uppercase">Total Groups</p>
                      <h3 className="text-2xl font-black text-emerald-600 mt-0.5">{groupSummaries.length}</h3>
                    </div>
                    <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    </div>
                  </div>

                  <div className="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-[10px] font-bold text-slate-400 uppercase">Low Stock Alerts</p>
                      <h3 className="text-2xl font-black text-rose-600 mt-0.5">
                        {assets.filter(i => ((Number(i.openingQty||0) + Number(i.newPurchase||0)) - Number(i.issueItems||0)) <= Number(i.minAlert||2)).length}
                      </h3>
                    </div>
                    <div className="p-3 bg-rose-50 text-rose-600 rounded-xl">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                  </div>

                  <div className="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-[10px] font-bold text-slate-400 uppercase">Fixed Assets</p>
                      <h3 className="text-2xl font-black text-amber-600 mt-0.5">
                        {assets.filter(i => i.category === 'Fixed Assets').length}
                      </h3>
                    </div>
                    <div className="p-3 bg-amber-50 text-amber-600 rounded-xl">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                  <h3 className="font-bold text-xs uppercase text-slate-700 tracking-wider">Quick Actions</h3>
                  <div className="flex gap-3">
                    <button onClick={() => { setActiveTab('inventory'); handleOpenModal(); }} className="px-4 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-500/20 hover:bg-blue-700 transition">
                      + Register New Asset Item
                    </button>
                    <button onClick={() => setActiveTab('inventory')} className="px-4 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition">
                      Go to Stock Register Ledger
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: STOCK REGISTER */}
            {activeTab === 'inventory' && (
              <>
                <header className="bg-gradient-to-r from-slate-950 via-slate-900 to-blue-950 text-white p-3 rounded-xl shadow-lg flex justify-between items-center border border-slate-800">
                  <div className="flex items-center space-x-3">
                    <div className="p-2 bg-blue-600/30 border border-blue-500/40 rounded-lg text-blue-400">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <h1 className="text-sm font-extrabold tracking-wide uppercase">Stock Register & Inventory Ledger</h1>
                  </div>

                  <div className="flex items-center space-x-2">
                    <div className="relative">
                      <input 
                        type="text" 
                        placeholder="Search Items..." 
                        value={searchQuery}
                        onChange={(e) => { setSearchQuery(e.target.value); setCurrentPage(1); }}
                        className="w-44 px-3 py-1.5 pl-8 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500"
                      />
                      <svg className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>

                    <select 
                      value={monthFilter} 
                      onChange={(e) => { setMonthFilter(e.target.value); setCurrentPage(1); }}
                      className="px-3 py-1.5 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-white outline-none"
                    >
                      <option value="">Month: Nov 2026</option>
                      <option value="Oct 2026">Month: Oct 2026</option>
                      <option value="Sep 2026">Month: Sep 2026</option>
                    </select>

                    <select 
                      value={locationFilter} 
                      onChange={(e) => { setLocationFilter(e.target.value); setCurrentPage(1); }}
                      className="px-3 py-1.5 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-white outline-none"
                    >
                      <option value="">Location: All</option>
                      <option value="B Block">Location: B Block</option>
                      <option value="A Block">Location: A Block</option>
                    </select>

                    <button 
                      onClick={() => handleOpenModal()} 
                      className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg shadow-md shadow-blue-600/30 transition flex items-center gap-1 cursor-pointer"
                    >
                      + New Asset
                    </button>
                  </div>
                </header>

                {/* Professional Alphabetically Sorted Dynamic Group Cards */}
                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-extrabold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                      <svg className="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                      Alphabetical Group Summary (Click Box to Filter)
                    </span>
                    {selectedGroupFilter && (
                      <button 
                        onClick={() => setSelectedGroupFilter(null)} 
                        className="text-[11px] font-bold text-rose-600 hover:text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200 flex items-center gap-1 cursor-pointer"
                      >
                        ✕ Clear Filter ({selectedGroupFilter})
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-6 gap-2.5">
                    {groupSummaries.map((g, idx) => {
                      const isSelected = selectedGroupFilter === g.name;
                      return (
                        <div 
                          key={idx}
                          onClick={() => setSelectedGroupFilter(isSelected ? null : g.name)}
                          className={`p-2.5 rounded-xl bg-gradient-to-br ${g.colorClass} shadow-md transition-all duration-200 cursor-pointer transform hover:-translate-y-0.5 relative overflow-hidden ${isSelected ? 'ring-4 ring-blue-500 scale-105' : 'opacity-90 hover:opacity-100'}`}
                        >
                          <div className="flex justify-between items-start">
                            <h4 className="font-extrabold text-xs tracking-wide truncate max-w-[100px]">{g.name}</h4>
                            <span className="px-1.5 py-0.5 bg-white/20 backdrop-blur-md rounded text-[9px] font-bold">
                              {g.count} Items
                            </span>
                          </div>
                          <div className="mt-2 flex justify-between items-end">
                            <div>
                              <p className="text-[9px] text-white/80 uppercase font-semibold">Total Stock</p>
                              <p className="text-sm font-black">{g.totalQty}</p>
                            </div>
                            {g.lowCount > 0 && (
                              <span className="px-1.5 py-0.5 bg-rose-500 text-white rounded-md text-[8px] font-extrabold animate-pulse">
                                {g.lowCount} Low
                              </span>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Table View */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col justify-between mt-1">
                  <div className="overflow-x-auto flex-1">
                    <table className="w-full text-left border-collapse table-compact">
                      <thead>
                        <tr className="bg-slate-900 text-white text-[10px] uppercase font-bold tracking-wider">
                          <th className="p-2">Group</th>
                          <th className="p-2">Particulars / Item</th>
                          <th className="p-2 text-center">Cable</th>
                          <th className="p-2 text-center">Unit</th>
                          <th className="p-2 text-center">OP</th>
                          <th className="p-2 text-center">Purch.</th>
                          <th className="p-2 text-center">Issued</th>
                          <th className="p-2 text-center">Return</th>
                          <th className="p-2 text-center">Bal</th>
                          <th className="p-2 text-center">Dead</th>
                          <th className="p-2">Category</th>
                          <th className="p-2">Location / User</th>
                          <th className="p-2 text-center">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 text-xs font-medium text-slate-700">
                        {currentItems.length > 0 ? (
                          currentItems.map((item, idx) => {
                            const op = Number(item.openingQty || 0);
                            const purch = Number(item.newPurchase || 0);
                            const issue = Number(item.issueItems || 0);
                            const dead = Number(item.deadItems || 0);
                            const balance = (op + purch) - issue;
                            const isLow = balance <= Number(item.minAlert || 2);
                            const isVIP = isImportantItem(item.particulars);

                            return (
                              <tr key={item.firebaseKey || idx} className={`hover:bg-slate-50 transition ${isVIP ? 'bg-amber-50/40' : ''}`}>
                                <td className="p-2 font-bold uppercase text-[11px] text-slate-900">{item.group || 'GENERAL'}</td>
                                <td className="p-2 font-bold text-slate-900 flex items-center gap-1.5">
                                  {isVIP && <span className="text-amber-500 font-bold" title="Important Asset Tag">★</span>}
                                  {item.particulars}
                                  {item.brand && <span className="text-[10px] font-normal text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">{item.brand}</span>}
                                </td>
                                <td className="p-2 text-center font-mono text-slate-600">{item.cableLength ? `${item.cableLength}` : '-'}</td>
                                <td className="p-2 text-center text-slate-500 text-[11px]">{item.unit || 'Piece'}</td>
                                <td className="p-2 text-center font-bold text-slate-600">{op}</td>
                                <td className="p-2 text-center font-bold text-emerald-600">+{purch}</td>
                                <td className="p-2 text-center font-bold text-blue-600">{issue}</td>
                                <td className="p-2 text-center font-bold text-indigo-600">0</td>
                                <td className="p-2 text-center">
                                  <span className={`px-2 py-0.5 rounded text-[11px] font-black ${isLow ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-emerald-100 text-emerald-800'}`}>
                                    {balance}
                                  </span>
                                </td>
                                <td className="p-2 text-center font-bold text-rose-600">{dead}</td>
                                <td className="p-2">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${item.category === 'Fixed Assets' ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-slate-100 text-slate-700'}`}>
                                    {item.category || 'Consumable'}
                                  </span>
                                </td>
                                <td className="p-2 text-slate-600">{item.location || 'Main Store'}</td>
                                <td className="p-2 text-center space-x-1">
                                  <button onClick={() => handleOpenModal(item)} className="px-2 py-1 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded text-[11px] font-bold cursor-pointer">Edit</button>
                                  <button onClick={() => handleDeleteAsset(item)} className="px-2 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded text-[11px] font-bold cursor-pointer">Del</button>
                                </td>
                              </tr>
                            );
                          })
                        ) : (
                          <tr>
                            <td colSpan="13" className="text-center py-8 text-slate-400 font-medium">No inventory asset records found matching criteria.</td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>

                  <div className="px-4 py-2 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs">
                    <div className="flex items-center space-x-5">
                      <div className="flex items-center space-x-2">
                        <div className="p-1 bg-emerald-500 rounded-full text-white">
                          <svg className="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"></path></svg>
                        </div>
                        <div>
                          <p className="text-[10px] font-bold text-slate-400 leading-tight">System Status</p>
                          <p className="text-emerald-600 font-bold leading-tight">All Systems Operational</p>
                        </div>
                      </div>

                      <div className="h-6 w-px bg-slate-300"></div>

                      <div className="flex items-center space-x-2">
                        <div className="p-1 text-blue-600">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                          <p className="text-[10px] font-bold text-slate-400 leading-tight">Last Updated</p>
                          <p className="font-bold text-slate-800 leading-tight">07 Nov 2026, 11:16 AM</p>
                        </div>
                      </div>

                      <div className="h-6 w-px bg-slate-300"></div>

                      <div className="flex items-center space-x-2">
                        <div className="p-1 text-blue-600">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path></svg>
                        </div>
                        <div>
                          <p className="text-[10px] font-bold text-slate-400 leading-tight">Total Records</p>
                          <p className="font-bold text-slate-800 leading-tight">{totalRecords} Assets</p>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center space-x-4">
                      <label className="flex items-center gap-1.5 font-bold text-slate-700 text-xs">
                        View Records:
                        <select 
                          value={itemsPerPage} 
                          onChange={(e) => { setItemsPerPage(Number(e.target.value)); setCurrentPage(1); }}
                          className="px-2 py-0.5 bg-white border border-slate-300 rounded-lg font-bold text-blue-700 outline-none cursor-pointer shadow-sm"
                        >
                          <option value="10">10 per page</option>
                          <option value="25">25 per page</option>
                          <option value="50">50 per page</option>
                          <option value="100">100 per page</option>
                        </select>
                      </label>

                      <div className="flex items-center space-x-1.5">
                        <button 
                          disabled={currentPage === 1}
                          onClick={() => setCurrentPage(prev => prev - 1)}
                          className="px-2.5 py-1 border border-slate-300 rounded bg-white font-semibold text-slate-600 disabled:opacity-40 shadow-sm cursor-pointer"
                        >
                          ◀ Prev
                        </button>
                        <span className="font-bold text-slate-800 px-2">{currentPage} / {totalPages}</span>
                        <button 
                          disabled={currentPage === totalPages}
                          onClick={() => setCurrentPage(prev => prev + 1)}
                          className="px-2.5 py-1 border border-slate-300 rounded bg-white font-semibold text-slate-600 disabled:opacity-40 shadow-sm cursor-pointer"
                        >
                          Next ▶
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </>
            )}
          </main>

          {/* Modal Form */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 border border-slate-200 max-h-[90vh] overflow-y-auto">
                <h3 className="text-sm font-bold text-slate-900 mb-4 border-b border-slate-200 pb-2">
                  {editingAsset ? 'Edit Stock Register Record' : 'Register New Asset Entry'}
                </h3>
                <form onSubmit={handleSaveAsset} className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Stock Group (Category)</label>
                    <input type="text" value={formData.group} onChange={(e) => setFormData({...formData, group: e.target.value})} placeholder="e.g. MOUSE, KEYBOARD" className="w-full p-2 border border-slate-300 rounded-lg outline-none uppercase font-bold" required />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Asset Particulars</label>
                    <input type="text" value={formData.particulars} onChange={(e) => setFormData({...formData, particulars: e.target.value})} placeholder="e.g. USB MOUSE DELL" className="w-full p-2 border border-slate-300 rounded-lg outline-none" required />
                  </div>

                  <div className="col-span-2 grid grid-cols-2 gap-3 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Cable Length (If applicable)</label>
                      <input type="text" value={formData.cableLength} onChange={(e) => setFormData({...formData, cableLength: e.target.value})} placeholder="e.g. 1.5, 3, 5" className="w-full p-1.5 border border-slate-300 rounded-lg bg-white outline-none" />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Measurement Unit</label>
                      <select value={formData.unit} onChange={(e) => setFormData({...formData, unit: e.target.value})} className="w-full p-1.5 border border-slate-300 rounded-lg bg-white outline-none font-bold cursor-pointer">
                        <option value="Piece">Piece</option>
                        <option value="Meter">Meter</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-blue-600 mb-1">Brand Name</label>
                    <input type="text" value={formData.brand} onChange={(e) => setFormData({...formData, brand: e.target.value})} placeholder="e.g. DELL, HP, LENOVO" className="w-full p-2 border border-blue-200 rounded-lg bg-blue-50/20 outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-emerald-700 mb-1">Entry Period (Month)</label>
                    <input type="text" value={formData.entryMonth} onChange={(e) => setFormData({...formData, entryMonth: e.target.value})} className="w-full p-2 border border-emerald-200 rounded-lg bg-emerald-50/30 font-semibold text-emerald-800 outline-none" required />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Serial Number / Asset Tag</label>
                    <input type="text" value={formData.serialNo} onChange={(e) => setFormData({...formData, serialNo: e.target.value})} placeholder="e.g. SN-99281-XYZ" className="w-full p-2 border border-slate-300 rounded-lg outline-none font-mono" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Procurement Vendor Name</label>
                    <input type="text" value={formData.vendor} onChange={(e) => setFormData({...formData, vendor: e.target.value})} placeholder="e.g. Tech Solutions Ltd" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Category Classification</label>
                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg outline-none cursor-pointer">
                      <option value="Consumable">Consumable</option>
                      <option value="Non-Consumable">Non-Consumable</option>
                      <option value="Fixed Assets">Fixed Assets</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Low Stock Alert Limit</label>
                    <input type="number" value={formData.minAlert} onChange={(e) => setFormData({...formData, minAlert: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Opening Quantity Stock (OP)</label>
                    <input type="number" value={formData.openingQty} onChange={(e) => setFormData({...formData, openingQty: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">New Purchase Quantity (Purch.)</label>
                    <input type="number" value={formData.newPurchase} onChange={(e) => setFormData({...formData, newPurchase: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Issued Quantity Total</label>
                    <input type="number" value={formData.issueItems} onChange={(e) => setFormData({...formData, issueItems: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Dead / Faulty Quantity</label>
                    <input type="number" value={formData.deadItems} onChange={(e) => setFormData({...formData, deadItems: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div className="col-span-2">
                    <label className="block font-semibold text-slate-700 mb-1">Installation Location / User Allocation</label>
                    <input type="text" value={formData.location} onChange={(e) => setFormData({...formData, location: e.target.value})} placeholder="e.g. B Block, Dr. Jha Room" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div className="col-span-2 flex justify-end space-x-2 pt-4 border-t border-slate-200">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow-md cursor-pointer">Save Asset Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
