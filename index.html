<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #printable-slip, #printable-slip * { visibility: visible; }
      #printable-slip { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Firebase REST Database URL
    const FIREBASE_DB_URL = "https://it-asset-management-default-rtdb.firebaseio.com/";

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('it_asset_current_user');
        return saved ? JSON.parse(saved) : { name: 'Super Admin', role: 'Super Admin', email: 'admin@system.local' };
      });

      const [activeTab, setActiveTab] = useState('stock');
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // -------------------------------------------------------------
      // STATE MANAGEMENT & FIREBASE SYNC
      // -------------------------------------------------------------
      const [assets, setAssets] = useState([
        { id: 'ast_1', group: 'MOUSE', name: 'USB MOUSE', brand: 'Dell', op: 12, purch: 0, issued: -1, bal: 11, short: 0, dead: 0, category: 'Consumable', location: 'it', minLevel: 2, updatedAt: '2026-11-12' },
        { id: 'ast_2', group: 'MOUSE', name: 'USB MOUSE', brand: 'Lenovo', op: 6, purch: 0, issued: 0, bal: 6, short: 0, dead: 0, category: 'Consumable', location: 'Unassigned', minLevel: 1, updatedAt: '2026-11-12' },
        { id: 'ast_3', group: 'MOUSE', name: 'WIRELESS-MOUSE', brand: 'Dell', op: 1, purch: 0, issued: 0, bal: 1, short: 0, dead: 0, category: 'Consumable', location: 'Unassigned', minLevel: 2, updatedAt: '2026-11-12' },
        { id: 'ast_4', group: 'KEYBOARD', name: 'USB-KEYBOARD', brand: 'DELL', op: 9, purch: 0, issued: 0, bal: 9, short: 0, dead: 0, category: 'Consumable', location: 'Unassigned', minLevel: 2, updatedAt: '2026-11-12' },
        { id: 'ast_5', group: 'CONNECTOR', name: 'VGA-HDMI WITH AUDIO', brand: '-', op: 1, purch: 0, issued: 0, bal: 1, short: 0, dead: 0, category: 'Consumable', location: 'Unassigned', minLevel: 2, updatedAt: '2026-11-12' },
        { id: 'ast_6', group: 'WIRELESS SET', name: 'KEYBOARD-MOUSE', brand: '-', op: 1, purch: 0, issued: 0, bal: 1, short: 0, dead: 0, category: 'Consumable', location: 'Unassigned', minLevel: 1, updatedAt: '2026-11-12' }
      ]);

      const [tempDeployments, setTempDeployments] = useState([
        { id: 'tmp_1', assetName: 'Dell Latitude Laptop', serialNo: 'DL-99823', handedTo: 'Dr. Ramesh Sharma', department: 'Cardiology', dateOut: '2026-11-01', expectedReturn: '2026-12-01', status: 'Active', remarks: 'Temporary conference use' }
      ]);

      const [pmSelectedMonth, setPmSelectedMonth] = useState('Jan');
      const [pmSelectedSlot, setPmSelectedSlot] = useState('01 to 10 January');

      const [pmSchedules, setPmSchedules] = useState([
        {
          id: 'pm_101',
          targetMonth: 'Jan',
          slotRange: '01 to 10 January',
          department: 'General Registration',
          equipmentName: 'Desktop Workstation Alpha',
          monitorBrand: 'Dell',
          monitorTagNo: 'MON-8831',
          cpuBrand: 'Intel',
          cpuProcessor: 'Intel Core i5-13400 @ 2.50GHz',
          printerBrand: 'HP LaserJet',
          printerTagNo: 'PRN-102',
          printerIP: '192.168.1.50',
          systemIP: '192.168.1.101',
          systemMac: '00:1A:2B:3C:4D:5E',
          ramType: 'DDR4',
          ramSize: '16GB',
          diskType: 'SSD',
          diskSize: '512GB',
          msOffice: 'Office 365 Pro',
          outlook: 'Configured',
          backup: 'Active',
          antiVirus: 'Updated',
          remarks: 'All preventive checks completed successfully in pristine condition.',
          userSignDate: 'Dr. Ramesh (05-Jan-2026)',
          status: 'Completed',
          dueDate: '2026-01-05'
        },
        {
          id: 'pm_102',
          targetMonth: 'Jan',
          slotRange: '01 to 10 January',
          department: 'Block-C',
          equipmentName: 'Reception Terminal 02',
          monitorBrand: 'HP',
          monitorTagNo: 'MON-8832',
          cpuBrand: 'Lenovo',
          cpuProcessor: 'Intel Core i3-12100 @ 3.30GHz',
          printerBrand: 'Canon',
          printerTagNo: 'PRN-105',
          printerIP: '192.168.1.52',
          systemIP: '192.168.1.102',
          systemMac: '00:1A:2B:3C:4D:5F',
          ramType: 'DDR4',
          ramSize: '8GB',
          diskType: 'SSD',
          diskSize: '256GB',
          msOffice: 'Office 2021',
          outlook: 'Configured',
          backup: 'Pending',
          antiVirus: 'Updated',
          remarks: 'Cleaned fan dust and updated OS patches.',
          userSignDate: 'Pending Sign',
          status: 'Scheduled',
          dueDate: '2026-01-08'
        }
      ]);

      const [pmAuditLogs, setPmAuditLogs] = useState([]);

      const [users, setUsers] = useState([
        { id: 'u_1', name: 'Super Admin', email: 'admin@system.local', role: 'Super Admin', status: 'Active' },
        { id: 'u_2', name: 'Biomedical Lead', email: 'bio@system.local', role: 'Technician', status: 'Active' }
      ]);

      // State for Modals
      const [isNewAssetModalOpen, setIsNewAssetModalOpen] = useState(false);
      const [newAssetForm, setNewAssetForm] = useState({ group: 'MOUSE', name: '', brand: '', op: 0, category: 'Consumable', location: 'it', minLevel: 2 });
      
      const [isTempModalOpen, setIsTempModalOpen] = useState(false);
      const [tempForm, setTempForm] = useState({ assetName: '', serialNo: '', handedTo: '', department: '', expectedReturn: '', remarks: '' });

      const [isPmModalOpen, setIsPmModalOpen] = useState(false);
      const [pmForm, setPmForm] = useState({
        department: 'General Registration',
        equipmentName: 'Desktop PC Workstation',
        monitorBrand: 'Dell',
        monitorTagNo: 'MON-TAG-999',
        cpuBrand: 'Intel',
        cpuProcessor: 'Intel Core i5-13400 @ 2.50GHz',
        printerBrand: 'HP',
        printerTagNo: 'PRN-TAG-999',
        printerIP: '192.168.1.200',
        systemIP: '192.168.1.100',
        systemMac: 'AA:BB:CC:DD:EE:FF',
        ramType: 'DDR4',
        ramSize: '16GB',
        diskType: 'SSD',
        diskSize: '512GB',
        msOffice: 'Office 365',
        outlook: 'Configured',
        backup: 'Active',
        antiVirus: 'Updated',
        remarks: 'All preventive checks completed successfully.',
        userSignDate: 'Pending Sign',
        status: 'Scheduled',
        dueDate: '2026-01-08',
        targetMonth: pmSelectedMonth,
        slotRange: pmSelectedSlot
      });
      const [editingPmId, setEditingPmId] = useState(null);

      // Print slip modal state
      const [printSlipItem, setPrintSlipItem] = useState(null);

      // 12 Months starting from January
      const monthsList = [
        { code: 'Jan', name: 'January', slots: ['01 to 10 January', '11 to 20 January', '21 to 31 January'] },
        { code: 'Feb', name: 'February', slots: ['01 to 10 February', '11 to 20 February', '21 to 28 February'] },
        { code: 'Mar', name: 'March', slots: ['01 to 10 March', '11 to 20 March', '21 to 31 March'] },
        { code: 'Apr', name: 'April', slots: ['01 to 10 April', '11 to 20 April', '21 to 30 April'] },
        { code: 'May', name: 'May', slots: ['01 to 10 May', '11 to 20 May', '21 to 31 May'] },
        { code: 'Jun', name: 'June', slots: ['01 to 10 June', '11 to 20 June', '21 to 30 June'] },
        { code: 'Jul', name: 'July', slots: ['01 to 10 July', '11 to 20 July', '21 to 31 July'] },
        { code: 'Aug', name: 'August', slots: ['01 to 10 August', '11 to 20 August', '21 to 31 August'] },
        { code: 'Sep', name: 'September', slots: ['01 to 10 September', '11 to 20 September', '21 to 30 September'] },
        { code: 'Oct', name: 'October', slots: ['01 to 10 October', '11 to 20 October', '21 to 31 October'] },
        { code: 'Nov', name: 'November', slots: ['01 to 10 November', '11 to 20 November', '21 to 30 November'] },
        { code: 'Dec', name: 'December', slots: ['01 to 10 December', '11 to 20 December', '21 to 31 December'] }
      ];

      // Firebase Sync polling effect
      useEffect(() => {
        const fetchData = async () => {
          try {
            const res = await fetch(`${FIREBASE_DB_URL}/system_data.json`);
            if (res.ok) {
              const data = await res.json();
              if (data) {
                if (data.assets) setAssets(data.assets);
                if (data.tempDeployments) setTempDeployments(data.tempDeployments);
                if (data.pmSchedules) setPmSchedules(data.pmSchedules);
                if (data.pmAuditLogs) setPmAuditLogs(data.pmAuditLogs);
                if (data.users) setUsers(data.users);
              }
            }
          } catch (e) {
            console.error("Sync fetch error", e);
          }
        };
        fetchData();
        const interval = setInterval(fetchData, 4000);
        return () => clearInterval(interval);
      }, []);

      const syncToFirebase = async (newPayload) => {
        try {
          const payload = {
            assets,
            tempDeployments,
            pmSchedules,
            pmAuditLogs,
            users,
            ...newPayload
          };
          await fetch(`${FIREBASE_DB_URL}/system_data.json`, {
            method: 'PUT',
            body: JSON.stringify(payload)
          });
        } catch (e) {
          console.error("Sync save error", e);
        }
      };

      // Handlers for Stock
      const handleCreateAsset = (e) => {
        e.preventDefault();
        const newItem = {
          id: `ast_${Date.now()}`,
          group: newAssetForm.group,
          name: newAssetForm.name || 'NEW ITEM',
          brand: newAssetForm.brand || '-',
          op: Number(newAssetForm.op) || 0,
          purch: 0,
          issued: 0,
          bal: Number(newAssetForm.op) || 0,
          short: 0,
          dead: 0,
          category: newAssetForm.category,
          location: newAssetForm.location,
          minLevel: Number(newAssetForm.minLevel) || 2,
          updatedAt: new Date().toISOString().split('T')[0]
        };
        const updated = [newItem, ...assets];
        setAssets(updated);
        syncToFirebase({ assets: updated });
        setIsNewAssetModalOpen(false);
        setNewAssetForm({ group: 'MOUSE', name: '', brand: '', op: 0, category: 'Consumable', location: 'it', minLevel: 2 });
        showToast("New asset added successfully!");
      };

      // Handlers for Temp Deployment
      const handleCreateTemp = (e) => {
        e.preventDefault();
        const newItem = {
          id: `tmp_${Date.now()}`,
          ...tempForm,
          status: 'Active'
        };
        const updated = [newItem, ...tempDeployments];
        setTempDeployments(updated);
        syncToFirebase({ tempDeployments: updated });
        setIsTempModalOpen(false);
        setTempForm({ assetName: '', serialNo: '', handedTo: '', department: '', expectedReturn: '', remarks: '' });
        showToast("Temporary asset issued!");
      };

      // Handlers for PM Save & Edit
      const handleSavePm = (e) => {
        e.preventDefault();
        const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);
        if (editingPmId) {
          // Edit existing
          const updated = pmSchedules.map(item => {
            if (item.id === editingPmId) {
              const changedFields = [];
              if (item.equipmentName !== pmForm.equipmentName) changedFields.log('Equipment');
              return { ...item, ...pmForm, updatedAt: nowStr };
            }
            return item;
          });
          setPmSchedules(updated);
          // Add audit log
          const newAudit = {
            id: `aud_${Date.now()}`,
            timestamp: nowStr,
            user: currentUser.name,
            action: `Updated PM task for ${pmForm.equipmentName} (${pmForm.department})`,
            details: `Month: ${pmSelectedMonth}, Slot: ${pmSelectedSlot}`
          };
          const updatedAuditLogs = [newAudit, ...pmAuditLogs];
          setPmAuditLogs(updatedAuditLogs);
          syncToFirebase({ pmSchedules: updated, pmAuditLogs: updatedAuditLogs });
          showToast("PM Schedule updated and audit logged!");
        } else {
          // Create new
          const newItem = {
            id: `pm_${Date.now()}`,
            ...pmForm,
            targetMonth: pmSelectedMonth,
            slotRange: pmSelectedSlot,
            updatedAt: nowStr
          };
          const updated = [newItem, ...pmSchedules];
          setPmSchedules(updated);
          syncToFirebase({ pmSchedules: updated });
          showToast("New PM Schedule task added!");
        }
        setIsPmModalOpen(false);
        setEditingPmId(null);
      };

      const handleExportPmCSV = () => {
        const filtered = pmSchedules.filter(i => (i.targetMonth || '').toLowerCase() === pmSelectedMonth.toLowerCase() && (i.slotRange || '').toLowerCase() === pmSelectedSlot.toLowerCase());
        const headers = ["Department","Equipment Name","Monitor Brand","Monitor Tag","CPU Brand","CPU Processor","Printer Brand","Printer Tag","Printer IP","System IP","System Mac","RAM Type","RAM Size","Disk Type","Disk Size","MS Office","Outlook","Backup","Anti-Virus","Remarks","Due Date","Status"];
        const rows = filtered.map(i => [
          i.department, i.equipmentName, i.monitorBrand, i.monitorTagNo, i.cpuBrand, i.cpuProcessor, i.printerBrand, i.printerTagNo, i.printerIP, i.systemIP, i.systemMac, i.ramType, i.ramSize, i.diskType, i.diskSize, i.msOffice, i.outlook, i.backup, i.antiVirus, i.remarks, i.dueDate, i.status
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `PM_Schedule_${pmSelectedMonth}_${pmSelectedSlot}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("PM Schedule exported successfully!");
      };

      const handleImportPmCSV = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = event => {
            try {
              const text = event.target.result;
              const lines = text.split(/\r?\n/);
              const newItems = [];
              for(let i=1; i<lines.length; i++) {
                if(!lines[i].trim()) continue;
                const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if(cols.length >= 2) {
                  newItems.push({
                    id: `pm_imp_${Date.now()}_${i}`,
                    department: cols[0]?.replace(/"/g,'').trim() || 'General Reg',
                    equipmentName: cols[1]?.replace(/"/g,'').trim() || 'Desktop',
                    monitorBrand: cols[2]?.replace(/"/g,'').trim() || 'Dell',
                    monitorTagNo: cols[3]?.replace(/"/g,'').trim() || '',
                    cpuBrand: cols[4]?.replace(/"/g,'').trim() || 'Intel',
                    cpuProcessor: cols[5]?.replace(/"/g,'').trim() || 'Intel Core i5',
                    printerBrand: cols[6]?.replace(/"/g,'').trim() || 'HP',
                    printerTagNo: cols[7]?.replace(/"/g,'').trim() || '',
                    printerIP: cols[8]?.replace(/"/g,'').trim() || '',
                    systemIP: cols[9]?.replace(/"/g,'').trim() || '',
                    systemMac: cols[10]?.replace(/"/g,'').trim() || '',
                    ramType: cols[11]?.replace(/"/g,'').trim() || 'DDR4',
                    ramSize: cols[12]?.replace(/"/g,'').trim() || '16GB',
                    diskType: cols[13]?.replace(/"/g,'').trim() || 'SSD',
                    diskSize: cols[14]?.replace(/"/g,'').trim() || '512GB',
                    msOffice: cols[15]?.replace(/"/g,'').trim() || 'Office 365',
                    outlook: cols[16]?.replace(/"/g,'').trim() || 'Configured',
                    backup: cols[17]?.replace(/"/g,'').trim() || 'Active',
                    antiVirus: cols[18]?.replace(/"/g,'').trim() || 'Updated',
                    remarks: cols[19]?.replace(/"/g,'').trim() || 'Imported record',
                    dueDate: cols[20]?.replace(/"/g,'').trim() || '2026-01-10',
                    status: cols[21]?.replace(/"/g,'').trim() || 'Scheduled',
                    targetMonth: pmSelectedMonth,
                    slotRange: pmSelectedSlot
                  });
                }
              }
              if(newItems.length > 0) {
                const updated = [...newItems, ...pmSchedules];
                setPmSchedules(updated);
                syncToFirebase({ pmSchedules: updated });
                showToast(`Successfully imported ${newItems.length} PM records!`);
              } else {
                showToast("No valid rows found in file.");
              }
            } catch (err) {
              showToast("Error parsing import file.");
            }
          };
        }
      };

      const assetGroups = useMemo(() => {
        const groups = {};
        assets.forEach(a => {
          const g = a.group || 'OTHER';
          if(!groups[g]) groups[g] = { count: 0, low: 0 };
          groups[g].count += (a.bal || 0);
          if((a.bal || 0) <= (a.minLevel || 2)) groups[g].low += 1;
        });
        return groups;
      }, [assets]);

      return (
        <div className="flex h-screen bg-slate-100 overflow-hidden text-slate-800">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl border border-slate-700 flex items-center gap-3 animate-bounce">
              <span className="text-blue-400 font-bold">ℹ</span>
              <span className="text-sm font-semibold">{toastMessage}</span>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className="w-72 bg-slate-900 text-slate-300 flex flex-col justify-between border-r border-slate-800 shadow-xl">
            <div>
              <div className="p-6 border-b border-slate-800">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-lg shadow-blue-500/30">IT</div>
                  <div>
                    <h1 className="font-extrabold text-white text-sm tracking-wide">IT ASSET & INVENTORY</h1>
                    <div className="flex items-center gap-1.5 mt-0.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                      <span className="text-[10px] font-semibold text-emerald-400">Cloud Synchronized</span>
                    </div>
                  </div>
                </div>
              </div>

              <nav className="p-4 space-y-1.5">
                {[
                  { id: 'stock', label: '1. Stock Register', icon: '📄' },
                  { id: 'temp', label: '2. Temporary Deployment', icon: '⇄' },
                  { id: 'pm', label: '3. Preventive Maintenance', icon: '⚙' },
                  { id: 'dashboard', label: '4. Executive Dashboard', icon: '🏠' },
                  { id: 'analytics', label: '5. Analytics Board', icon: '📊' },
                  { id: 'audit', label: '6. Audit & Reports', icon: '📋' },
                  { id: 'users', label: '7. Privilege & Users', icon: '👥' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition cursor-pointer ${
                      activeTab === item.id
                        ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30'
                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                  >
                    <span className="text-sm">{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800">
              <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 mb-3">
                <div className="text-[10px] font-bold text-slate-400 uppercase">Logged in as</div>
                <div className="font-extrabold text-white text-sm truncate mt-0.5">{currentUser.name}</div>
                <div className="text-[10px] text-blue-400 font-medium mt-0.5">{currentUser.role}</div>
              </div>
              <button 
                onClick={() => showToast("User session secure.")}
                className="w-full py-2.5 px-4 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow-sm"
              >
                Sign Out
              </button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col overflow-hidden bg-slate-50">
            {/* TOP HEADER */}
            <header className="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
              <div>
                <h2 className="text-lg font-black text-slate-800 uppercase tracking-wide">
                  {activeTab === 'stock' && 'Stock Register & Inventory Ledger'}
                  {activeTab === 'temp' && 'Temporary Asset Deployment Module'}
                  {activeTab === 'pm' && 'Preventive Maintenance Master & Schedule'}
                  {activeTab === 'dashboard' && 'Executive Management Dashboard'}
                  {activeTab === 'analytics' && 'Asset Analytics & Consumption Trends'}
                  {activeTab === 'audit' && 'Audit Trails & Change History Reports'}
                  {activeTab === 'users' && 'System Users & Privilege Management'}
                </h2>
                <p className="text-xs text-slate-500 font-medium mt-0.5">Hospital IT Infrastructure & Asset Lifecycle Management</p>
              </div>
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => showToast("System synchronized with Firebase Realtime DB")}
                  className="px-3.5 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-bold hover:bg-emerald-100 transition flex items-center gap-1.5 shadow-sm"
                >
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                  <span>Cloud Active</span>
                </button>
              </div>
            </header>

            {/* TAB VIEWS */}
            <div className="flex-1 overflow-auto p-8">
              
              {/* 1. STOCK REGISTER VIEW */}
              {activeTab === 'stock' && (
                <div className="space-y-6">
                  {/* Asset Groups Cards */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div className="text-xs font-extrabold uppercase text-slate-500 tracking-wider mb-3">Asset Groups (Click to Filter)</div>
                    <div className="flex gap-3 overflow-x-auto pb-2">
                      <div className="px-4 py-3 bg-blue-600 text-white rounded-xl border border-blue-500 shadow-md shadow-blue-500/20 shrink-0">
                        <div className="text-[10px] font-bold uppercase tracking-wider text-blue-100">All Groups</div>
                        <div className="text-sm font-black mt-0.5">{assets.reduce((a,c)=>a+(c.bal||0),0)} Total Items</div>
                      </div>
                      {Object.entries(assetGroups).map(([g, info]) => (
                        <div key={g} className="px-4 py-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl shrink-0 transition cursor-pointer min-w-[140px]">
                          <div className="text-[10px] font-black text-slate-700 uppercase tracking-wider">{g}</div>
                          <div className="flex items-center justify-between mt-1">
                            <span className="text-xs font-bold text-slate-800">{info.count} items</span>

                            <td className="p-3.5 font-mono text-slate-600">{u.email}</td>
                            <td className="p-3.5 font-bold text-blue-700">{u.role}</td>
                            <td className="p-3.5"><span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 font-bold text-[10px] rounded">Active</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* NEW ASSET MODAL */}
          {isNewAssetModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <h3 className="font-black text-slate-800 text-sm">Add New Stock Asset</h3>
                  <button onClick={() => setIsNewAssetModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <form onSubmit={handleCreateAsset} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Asset Group</label>
                    <input 
                      type="text" 
                      required
                      value={newAssetForm.group} 
                      onChange={e => setNewAssetForm({...newAssetForm, group: e.target.value.toUpperCase()})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Item Name / Particulars</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. USB OPTICAL MOUSE"
                      value={newAssetForm.name} 
                      onChange={e => setNewAssetForm({...newAssetForm, name: e.target.value.toUpperCase()})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Brand & Specs</label>
                      <input 
                        type="text" 
                        value={newAssetForm.brand} 
                        onChange={e => setNewAssetForm({...newAssetForm, brand: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Opening Qty (OP)</label>
                      <input 
                        type="number" 
                        value={newAssetForm.op} 
                        onChange={e => setNewAssetForm({...newAssetForm, op: Number(e.target.value)})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button type="button" onClick={() => setIsNewAssetModalOpen(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 font-bold rounded-xl">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl shadow-md">Save Asset</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TEMPORARY ASSET MODAL */}
          {isTempModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <h3 className="font-black text-slate-800 text-sm">Issue Temporary Asset</h3>
                  <button onClick={() => setIsTempModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <form onSubmit={handleCreateTemp} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Asset Name</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Dell Latitude Laptop"
                      value={tempForm.assetName} 
                      onChange={e => setTempForm({...tempForm, assetName: e.target.value})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Serial No</label>
                      <input 
                        type="text" 
                        required
                        value={tempForm.serialNo} 
                        onChange={e => setTempForm({...tempForm, serialNo: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Handed To (Staff Name)</label>
                      <input 
                        type="text" 
                        required
                        value={tempForm.handedTo} 
                        onChange={e => setTempForm({...tempForm, handedTo: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Department</label>
                      <input 
                        type="text" 
                        required
                        value={tempForm.department} 
                        onChange={e => setTempForm({...tempForm, department: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Expected Return</label>
                      <input 
                        type="date" 
                        required
                        value={tempForm.expectedReturn} 
                        onChange={e => setTempForm({...tempForm, expectedReturn: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Remarks</label>
                    <input 
                      type="text" 
                      value={tempForm.remarks} 
                      onChange={e => setTempForm({...tempForm, remarks: e.target.value})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button type="button" onClick={() => setIsTempModalOpen(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 font-bold rounded-xl">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl shadow-md">Confirm Issue</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PM TASK EDIT / ADD MODAL */}
          {isPmModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-auto">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <h3 className="font-black text-slate-800 text-sm">{editingPmId ? 'Edit Preventive Maintenance Task' : 'Add New PM Task'}</h3>
                  <button onClick={() => setIsPmModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <form onSubmit={handleSavePm} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Department / Location</label>
                      <input 
                        type="text" 
                        required
                        value={pmForm.department} 
                        onChange={e => setPmForm({...pmForm, department: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Equipment Name</label>
                      <input 
                        type="text" 
                        required
                        value={pmForm.equipmentName} 
                        onChange={e => setPmForm({...pmForm, equipmentName: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Monitor Brand</label>
                      <input 
                        type="text" 
                        value={pmForm.monitorBrand} 
                        onChange={e => setPmForm({...pmForm, monitorBrand: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Monitor Tag No</label>
                      <input 
                        type="text" 
                        value={pmForm.monitorTagNo} 
                        onChange={e => setPmForm({...pmForm, monitorTagNo: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">CPU Brand</label>
                      <input 
                        type="text" 
                        value={pmForm.cpuBrand} 
                        onChange={e => setPmForm({...pmForm, cpuBrand: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">CPU Processor</label>
                      <input 
                        type="text" 
                        value={pmForm.cpuProcessor} 
                        onChange={e => setPmForm({...pmForm, cpuProcessor: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Printer Brand</label>
                      <input 
                        type="text" 
                        value={pmForm.printerBrand} 
                        onChange={e => setPmForm({...pmForm, printerBrand: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Printer Tag No</label>
                      <input 
                        type="text" 
                        value={pmForm.printerTagNo} 
                        onChange={e => setPmForm({...pmForm, printerTagNo: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Printer IP</label>
                      <input 
                        type="text" 
                        value={pmForm.printerIP} 
                        onChange={e => setPmForm({...pmForm, printerIP: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">System IP</label>
                      <input 
                        type="text" 
                        value={pmForm.systemIP} 
                        onChange={e => setPmForm({...pmForm, systemIP: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">System Mac</label>
                      <input 
                        type="text" 
                        value={pmForm.systemMac} 
                        onChange={e => setPmForm({...pmForm, systemMac: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-4 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">RAM Type</label>
                      <input type="text" value={pmForm.ramType} onChange={e => setPmForm({...pmForm, ramType: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">RAM Size</label>
                      <input type="text" value={pmForm.ramSize} onChange={e => setPmForm({...pmForm, ramSize: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Disk Type</label>
                      <input type="text" value={pmForm.diskType} onChange={e => setPmForm({...pmForm, diskType: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Disk Size</label>
                      <input type="text" value={pmForm.diskSize} onChange={e => setPmForm({...pmForm, diskSize: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">MS Office</label>
                      <input type="text" value={pmForm.msOffice} onChange={e => setPmForm({...pmForm, msOffice: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Anti-Virus</label>
                      <input type="text" value={pmForm.antiVirus} onChange={e => setPmForm({...pmForm, antiVirus: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Status</label>
                      <select value={pmForm.status} onChange={e => setPmForm({...pmForm, status: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                        <option value="Scheduled">Scheduled</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Remarks</label>
                    <textarea 
                      rows="2"
                      value={pmForm.remarks} 
                      onChange={e => setPmForm({...pmForm, remarks: e.target.value})}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button type="button" onClick={() => setIsPmModalOpen(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 font-bold rounded-xl">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl shadow-md">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PRINTABLE SIGN-OFF SLIP MODAL */}
          {printSlipItem && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full p-8 shadow-2xl border border-slate-200 space-y-6">
                <div id="printable-slip" className="space-y-4 text-xs text-slate-800">
                  <div className="text-center border-b border-slate-300 pb-4">
                    <h2 className="text-base font-black uppercase">IT Preventive Maintenance Verification Slip</h2>
                    <p className="text-[10px] text-slate-500 font-medium">Hospital Information Technology Infrastructure Department</p>
                  </div>

                  <div className="grid grid-cols-2 gap-2 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div><span className="font-bold">Department:</span> {printSlipItem.department}</div>
                    <div><span className="font-bold">Equipment:</span> {printSlipItem.equipmentName}</div>
                    <div><span className="font-bold">System IP:</span> {printSlipItem.systemIP}</div>
                    <div><span className="font-bold">System Mac:</span> {printSlipItem.systemMac}</div>
                    <div><span className="font-bold">CPU Processor:</span> {printSlipItem.cpuProcessor}</div>
                    <div><span className="font-bold">RAM / Disk:</span> {printSlipItem.ramSize} / {printSlipItem.diskSize}</div>
                    <div><span className="font-bold">Anti-Virus:</span> {printSlipItem.antiVirus}</div>
                    <div><span className="font-bold">MS Office:</span> {printSlipItem.msOffice}</div>
                  </div>

                  <div>
                    <div className="font-bold mb-1">Technician Remarks:</div>
                    <div className="p-3 bg-slate-100 rounded-xl italic text-slate-700">{printSlipItem.remarks}</div>
                  </div>

                  <div className="pt-8 grid grid-cols-2 gap-8 text-center">
                    <div className="border-t border-slate-400 pt-2">
                      <div className="font-extrabold">Technician Signature</div>
                      <div className="text-[10px] text-slate-500 mt-1">Verified & Tested</div>
                    </div>
                    <div className="border-t border-slate-400 pt-2">
                      <div className="font-extrabold">Department User Signature</div>
                      <div className="text-[10px] text-slate-500 mt-1">{printSlipItem.userSignDate}</div>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-4 border-t border-slate-200">
                  <button onClick={() => setPrintSlipItem(null)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 font-bold rounded-xl text-xs">Close</button>
                  <button onClick={() => window.print()} className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-xs shadow-md">Print Slip</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Updated to use React 18 createRoot API
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
