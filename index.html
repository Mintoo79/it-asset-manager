<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #020617 0%, #080d1a 40%, #030712 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #020617; color: white; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading IT Asset Portal...</div>
        <div style="font-size: 12px; color: #94a3b8;">Establishing secure cloud connection</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);

      const lineChartRef = useRef(null);
      const donutChartRef = useRef(null);

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        cableLength: '',
        unit: 'Piece',
        brand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear()
      });

      const fetchCloudData = async () => {
        try {
          const res = await fetch(FIREBASE_DB_URL);
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
          } else {
            setAssets([]);
          }
        } catch (err) {
          console.error("Firebase fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 3000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (activeTab === 'dashboard' && isLoggedIn) {
          setTimeout(() => {
            const lineCtx = document.getElementById('trendLineChart');
            if (lineCtx) {
              if (lineChartRef.current) lineChartRef.current.destroy();
              lineChartRef.current = new Chart(lineCtx, {
                type: 'line',
                data: {
                  labels: ['Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
                  datasets: [
                    {
                      label: 'Entries',
                      data: [40, 55, 60, 65, assets.length || 76],
                      borderColor: '#2563eb',
                      backgroundColor: 'rgba(37, 99, 235, 0.1)',
                      tension: 0.3,
                      fill: true,
                      pointRadius: 4
                    },
                    {
                      label: 'Issued',
                      data: [25, 38, 42, 50, assets.reduce((acc, i) => acc + Number(i.issueItems || 0), 0) || 53],
                      borderColor: '#10b981',
                      backgroundColor: 'rgba(16, 185, 129, 0.05)',
                      tension: 0.3,
                      fill: true,
                      pointRadius: 4
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  scales: {
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                  }
                }
              });
            }

            const donutCtx = document.getElementById('overviewDonutChart');
            if (donutCtx) {
              if (donutChartRef.current) donutChartRef.current.destroy();
              const consumable = assets.filter(i => i.category === 'Consumable').length || 25;
              const nonConsumable = assets.filter(i => i.category === 'Non-Consumable').length || 35;
              const fixedAssets = assets.filter(i => i.category === 'Fixed Assets').length || 16;

              donutChartRef.current = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                  labels: ['Fixed Assets', 'Non-Consumables', 'Consumables'],
                  datasets: [{
                    data: [fixedAssets, nonConsumable, consumable],
                    backgroundColor: ['#d97706', '#10b981', '#2563eb'],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  cutout: '72%',
                  plugins: { legend: { display: false } }
                }
              });
            }
          }, 100);
        }
      }, [activeTab, isLoggedIn, assets]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
        } else {
          setLoginError('Invalid Security PIN (Default PIN: 1234)');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const handleOpenModal = (asset = null) => {
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          setEditingAsset(asset);
          setFormData({
            group: asset.group || '',
            particulars: asset.particulars || '',
            cableLength: asset.cableLength || '',
            unit: asset.unit || 'Piece',
            brand: asset.brand || '',
            serialNo: asset.serialNo || '',
            vendor: asset.vendor || '',
            invoiceNo: asset.invoiceNo || '',
            warranty: asset.warranty || '',
            openingQty: asset.openingQty || 0,
            newPurchase: asset.newPurchase || 0,
            issueItems: asset.issueItems || 0,
            shortItems: asset.shortItems || 0,
            deadItems: asset.deadItems || 0,
            category: asset.category || 'Consumable',
            location: asset.location || '',
            minAlert: asset.minAlert || 2,
            entryMonth: asset.entryMonth || autoMonth
          });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            cableLength: '',
            unit: 'Piece',
            brand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '',
            minAlert: 2,
            entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const finalData = {
          ...formData,
          entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear()
        };

        try {
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalData)
            });
          } else {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...finalData, id: currentTimestamp })
            });
          }
          setIsModalOpen(false);
          await fetchCloudData();
        } catch (err) {
          alert("Error saving entry.");
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteAsset = async (asset) => {
        if (window.confirm("Are you sure you want to delete this asset record?")) {
          setLoading(true);
          try {
            const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${asset.firebaseKey}.json`;
            await fetch(deleteUrl, { method: 'DELETE' });
            await fetchCloudData();
          } catch (err) {
            console.error(err);
          } finally {
            setLoading(false);
          }
        }
      };

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        const matchesGroup = selectedGroupFilter === '' || (item.group || '').toLowerCase() === selectedGroupFilter.toLowerCase();
        return matchesSearch && matchesLocation && matchesMonth && matchesGroup;
      });

      // Calculate Stock Group summary card stats
      const groupSummaryMap = assets.reduce((acc, item) => {
        const grp = (item.group || 'OTHER').toUpperCase().trim();
        if (!acc[grp]) {
          acc[grp] = { groupName: grp, count: 0, lowStockCount: 0 };
        }
        acc[grp].count += 1;
        
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        if (phy <= Number(item.minAlert || 2)) {
          acc[grp].lowStockCount += 1;
        }
        return acc;
      }, {});
      const groupSummaryList = Object.values(groupSummaryMap);

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);

      const totalRecords = assets.length;
      const lowStockItems = assets.filter(item => {
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        return phy <= Number(item.minAlert || 2);
      });
      const currentMonthRecords = assets.filter(i => (i.entryMonth || '').toLowerCase() === getCurrentMonthYear().toLowerCase()).length;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <div className="text-center mb-6">
                <div className="inline-flex p-3.5 bg-blue-50 text-blue-600 rounded-2xl mb-3 shadow-inner border border-blue-100">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">IT Asset Portal</h1>
                <p className="text-xs font-medium text-slate-500 mt-1">Enterprise Cloud Inventory Infrastructure</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Security PIN Code</label>
                  <input 
                    type="password" 
                    placeholder="Enter PIN (Default: 1234)" 
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none transition"
                    required
                  />
                </div>

                {loginError && <p className="text-xs text-rose-500 font-medium">{loginError}</p>}

                <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-blue-500/20 transition duration-150 flex items-center justify-center gap-2 cursor-pointer">
                  Authenticate & Sign In
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100">
          
          <aside className="w-64 neon-sidebar text-slate-300 flex flex-col justify-between p-4 shadow-2xl border-r border-slate-900 relative">
            <div>
              <div className="text-center pt-2 pb-5 border-b border-slate-800/60">
                <div className="inline-flex p-3 bg-blue-600/20 border border-blue-500/40 rounded-full mb-2 shadow-lg shadow-blue-500/20">
                  <svg className="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">IT ASSET</h2>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">MANAGEMENT</h2>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">SYSTEM</h2>
                <span className="text-[11px] text-emerald-400 font-bold flex items-center justify-center gap-1.5 mt-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synchronized
                </span>
              </div>

              <nav className="mt-5 space-y-2">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                  { id: 'inventory', label: '1. Stock Register', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                  { id: 'analytics', label: '2. Analytics Board', icon: 'M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' },
                  { id: 'reports', label: '3. Audit & Reports', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                  { id: 'rights', label: '4. Privilege Control', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full text-left px-4 py-3 rounded-2xl text-xs font-bold transition-all duration-200 flex items-center justify-between cursor-pointer ${
                      activeTab === tab.id 
                        ? 'active-neon-btn text-white' 
                        : 'hover:bg-slate-900/80 text-slate-300 hover:text-white'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={tab.icon}></path></svg>
                      <span>{tab.label}</span>
                    </div>
                    {activeTab === tab.id && <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7"></path></svg>}
                  </button>
                ))}
              </nav>
            </div>

            <div className="space-y-3 pt-3 border-t border-slate-900">
              <div className="p-3 bg-slate-900/90 rounded-2xl border border-slate-800 flex items-center space-x-3">
                <div className="relative">
                  <div className="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white text-sm">
                    A
                  </div>
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 absolute bottom-0 right-0 border-2 border-slate-900"></span>
                </div>
                <div>
                  <h4 className="font-bold text-white text-xs leading-tight">Admin</h4>
                  <p className="text-[10px] text-slate-400 font-medium leading-tight">IT Administrator</p>
                </div>
              </div>

              <button 
                onClick={handleLogout} 
                className="w-full py-3 bg-gradient-to-r from-rose-900 to-rose-700 hover:from-rose-800 hover:to-rose-600 text-white rounded-2xl font-bold text-xs shadow-lg shadow-rose-900/30 transition flex items-center justify-center gap-2 cursor-pointer"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign Out
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden p-4 space-y-3">
            
            {activeTab === 'dashboard' && (
              <div className="flex-1 overflow-auto space-y-5">
                <header className="px-2 py-2 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="p-2 bg-blue-100 rounded-xl text-blue-600">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    </div>
                    <div>
                      <h1 className="text-lg font-extrabold text-slate-900 tracking-tight leading-none">Operations Executive Dashboard</h1>
                      <p className="text-xs text-slate-500 font-medium mt-0.5">Monitor • Manage • Optimize</p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-3">
                    <div className="flex items-center space-x-1 px-3 py-2 bg-white border border-slate-200 rounded-xl shadow-sm text-xs font-semibold text-slate-700">
                      <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                      <span>{getCurrentMonthYear()}</span>
                    </div>
                  </div>
                </header>

                <div className="grid grid-cols-3 gap-5">
                  <div className="p-5 rounded-2xl bg-gradient-to-r from-blue-600 to-blue-500 text-white shadow-lg shadow-blue-500/20 relative overflow-hidden flex justify-between items-center">
                    <div className="space-y-1 z-10">
                      <p className="text-xs font-semibold text-blue-100 uppercase tracking-wider">Total Managed Assets</p>
                      <div className="flex items-baseline gap-2">
                        <h2 className="text-4xl font-extrabold tracking-tight">{totalRecords || 76}</h2>
                        <span className="text-xs font-bold text-blue-200 flex items-center">↑ +5%</span>
                      </div>
                    </div>
                    <div className="p-3 bg-white/20 rounded-2xl backdrop-blur-md">
                      <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    </div>
                  </div>

                  <div className="p-5 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-400 text-emerald-950 shadow-lg shadow-emerald-500/20 relative overflow-hidden flex justify-between items-center">
                    <div className="space-y-1 z-10">
                      <p className="text-xs font-bold text-emerald-900 uppercase tracking-wider">This Month Entries ({getCurrentMonthYear()})</p>
                      <div className="flex items-baseline gap-2">
                        <h2 className="text-4xl font-extrabold tracking-tight">{currentMonthRecords || 71}</h2>
                        <span className="text-xs font-bold text-emerald-800 flex items-center">↑ +12%</span>
                      </div>
                    </div>
                    <div className="p-3 bg-white/30 rounded-2xl backdrop-blur-md">
                      <svg className="w-8 h-8 text-emerald-950" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                  </div>

                  <div className="p-5 rounded-2xl bg-gradient-to-r from-rose-500 to-red-400 text-white shadow-lg shadow-rose-500/20 relative overflow-hidden flex justify-between items-center">
                    <div className="space-y-1 z-10">
                      <p className="text-xs font-semibold text-rose-100 uppercase tracking-wider">Low Stock Alerts</p>
                      <div className="flex items-baseline gap-2">
                        <h2 className="text-4xl font-extrabold tracking-tight">{lowStockItems.length || 53}</h2>
                        <span className="text-xs font-bold text-rose-200 flex items-center">↑ +8%</span>
                      </div>
                    </div>
                    <div className="p-3 bg-white/20 rounded-2xl backdrop-blur-md">

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Serial Number / Asset Tag</label>
                    <input type="text" value={formData.serialNo} onChange={(e) => setFormData({...formData, serialNo: e.target.value})} placeholder="e.g. SN-99281-XYZ" className="w-full p-2 border border-slate-300 rounded-lg outline-none font-mono" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Procurement Vendor Name</label>
                    <input type="text" value={formData.vendor} onChange={(e) => setFormData({...formData, vendor: e.target.value})} placeholder="e.g. Tech Solutions Ltd" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Invoice / Bill Reference No.</label>
                    <input type="text" value={formData.invoiceNo} onChange={(e) => setFormData({...formData, invoiceNo: e.target.value})} placeholder="e.g. INV-2026-05" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Category Classification</label>
                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg outline-none">
                      <option value="Consumable">Consumable</option>
                      <option value="Non-Consumable">Non-Consumable</option>
                      <option value="Fixed Assets">Fixed Assets</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Low Stock Alert Limit</label>
                    <input type="number" value={formData.minAlert} onChange={(e) => setFormData({...formData, minAlert: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Opening Quantity Stock (OP)</label>
                    <input type="number" value={formData.openingQty} onChange={(e) => setFormData({...formData, openingQty: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">New Purchase Quantity (Purch.)</label>
                    <input type="number" value={formData.newPurchase} onChange={(e) => setFormData({...formData, newPurchase: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Issued Quantity Total</label>
                    <input type="number" value={formData.issueItems} onChange={(e) => setFormData({...formData, issueItems: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Shortage Quantity</label>
                    <input type="number" value={formData.shortItems} onChange={(e) => setFormData({...formData, shortItems: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Dead / Faulty Quantity</label>
                    <input type="number" value={formData.deadItems} onChange={(e) => setFormData({...formData, deadItems: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Warranty Expiry Date</label>
                    <input type="date" value={formData.warranty} onChange={(e) => setFormData({...formData, warranty: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div className="col-span-2">
                    <label className="block font-semibold text-slate-700 mb-1">Installation Location / User Allocation</label>
                    <input type="text" value={formData.location} onChange={(e) => setFormData({...formData, location: e.target.value})} placeholder="e.g. B Block, Dr. Jha Room, Shampa HR" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div className="col-span-2 flex justify-end space-x-2 pt-4 border-t border-slate-200">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow-md cursor-pointer">Save Asset Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
