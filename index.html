<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #090d16 0%, #111827 50%, #030712 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading IT Asset Portal...</div>
        <div style="font-size: 12px; color: #94a3b8;">Establishing secure cloud session</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";
    const FIREBASE_TEMP_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/temp_dispatches.json";
    const FIREBASE_PM_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/pm_schedules.json";
    const FIREBASE_USERS_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/system_users.json";
    const FIREBASE_PM_AUDIT_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/pm_audit_logs.json";

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [viewModalItem, setViewModalItem] = useState(null);
      const [historyModalItem, setHistoryModalItem] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      // Temporary Asset Deployment state synced with Firebase
      const [tempDispatches, setTempDispatches] = useState([]);
      const [isTempModalOpen, setIsTempModalOpen] = useState(false);
      const [editingTempItem, setEditingTempItem] = useState(null);
      const [tempForm, setTempForm] = useState({ assetName: '', assetTagNo: '', department: '', receiver: '', quantity: 1 });

      // Preventive Maintenance (PM) 12-Month Chart Plan state
      const [pmSchedules, setPmSchedules] = useState([]);
      const [isPmModalOpen, setIsPmModalOpen] = useState(false);
      const [editingPmItem, setEditingPmItem] = useState(null);
      const [pmSelectedMonth, setPmSelectedMonth] = useState('Apr'); // Default active month view
      const [pmAuditLogs, setPmAuditLogs] = useState([]);
      const [pmForm, setPmForm] = useState({ equipmentName: '', maintenanceType: '', scheduledDate: '', technician: '', remarks: '', location: '', targetMonth: 'Apr' });

      const monthsList = [
        { code: 'Apr', name: 'April' },
        { code: 'May', name: 'May' },
        { code: 'Jun', name: 'June' },
        { code: 'Jul', name: 'July' },
        { code: 'Aug', name: 'August' },
        { code: 'Sep', name: 'September' },
        { code: 'Oct', name: 'October' },
        { code: 'Nov', name: 'November' },
        { code: 'Dec', name: 'December' },
        { code: 'Jan', name: 'January' },
        { code: 'Feb', name: 'February' },
        { code: 'Mar', name: 'March' }
      ];

      const logPmChange = async (action, details) => {
        const newLog = {
          timestamp: getFormattedDateTime(),
          action,
          details,
          user: 'Super Admin',
          month: pmSelectedMonth
        };
        try {
          await fetch(FIREBASE_PM_AUDIT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newLog)
          });
          setPmAuditLogs(prev => [newLog, ...prev]);
        } catch(e) {
          setPmAuditLogs(prev => [newLog, ...prev]);
        }
      };

      const filteredPmSchedules = pmSchedules.filter(item => {
        if (!pmSelectedMonth) return true;
        return (item.targetMonth || '').toLowerCase() === pmSelectedMonth.toLowerCase();
      });

      // Users state synced with Firebase
      const [users, setUsers] = useState([]);
      const [newUserName, setNewUserName] = useState('');
      const [newUserPin, setNewUserPin] = useState('');
      const [newUserRole, setNewUserRole] = useState('Store Keeper');

      const lineChartRef = useRef(null);
      const donutChartRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const getFormattedDateTime = () => {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        brand: 'Honeywell',
        customBrand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        cableLength: '',
        measurementUnit: 'Piece',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear(),
        lastUpdated: getFormattedDateTime()
      });

      const sampleFallbackAssets = [
        { id: 101, group: 'IT Peripherals', particulars: 'Optical Mouse USB', brand: 'Honeywell', serialNo: 'HW-MS-9981', cableLength: '1.5', measurementUnit: 'Meter', openingQty: 25, newPurchase: 10, issueItems: 8, shortItems: 0, deadItems: 1, category: 'Consumable', location: 'A Block', minAlert: 5, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026, 10:15 AM' },
        { id: 102, group: 'IT Peripherals', particulars: 'Multimedia Keyboard', brand: 'Honeywell', serialNo: 'HW-KB-4421', cableLength: '1.8', measurementUnit: 'Meter', openingQty: 20, newPurchase: 5, issueItems: 6, shortItems: 0, deadItems: 0, category: 'Consumable', location: 'B Block', minAlert: 4, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026, 11:20 AM' }
      ];

      const sampleFallbackUsers = [
        { id: 1, name: 'Super Admin', pin: '1234', role: 'Super Administrator', status: 'Active' },
        { id: 2, name: 'IT Inventory Desk', pin: '5678', role: 'Store Keeper', status: 'Active' }
      ];

      const sampleFallbackPm = [
        { id: 'pm_1', equipmentName: 'Server Room Rack A - Core Switches', maintenanceType: 'Quarterly Dusting & Thermal Check', location: 'Server Room - Rack A', scheduledDate: '15 Apr 2026', technician: 'Mr. Amit Verma', status: 'Scheduled', remarks: 'Preventive Master Register 2026-27', targetMonth: 'Apr', isEdited: false },
        { id: 'pm_2', equipmentName: 'UPS 10KVA Backup Unit', maintenanceType: 'Battery Health & Load Testing', location: 'A Block - Electrical Room', scheduledDate: '20 Apr 2026', technician: 'Mr. Rajesh Kumar', status: 'Scheduled', remarks: 'Master Plan Chart', targetMonth: 'Apr', isEdited: false },
        { id: 'pm_3', equipmentName: 'Biometric Access Control Terminals', maintenanceType: 'Sensor Cleaning & Firmware Sync', location: 'B Block - Reception', scheduledDate: '12 May 2026', technician: 'Mr. Suresh Nair', status: 'Scheduled', remarks: 'Preventive Master Register', targetMonth: 'May', isEdited: false },
        { id: 'pm_4', equipmentName: 'Network Core Router & Firewall', maintenanceType: 'Firmware Patch & Security Audit', location: 'Server Room - Network Hub', scheduledDate: '10 Jun 2026', technician: 'Mr. Amit Verma', status: 'Scheduled', remarks: 'Q1 Master Plan', targetMonth: 'Jun', isEdited: false },
        { id: 'pm_5', equipmentName: 'CCTV Network NVR & Cameras', maintenanceType: 'Lens Cleaning & Storage Check', location: 'Security Control Room', scheduledDate: '18 Jul 2026', technician: 'Mr. Ramesh Gupta', status: 'Scheduled', remarks: 'Master Register', targetMonth: 'Jul', isEdited: false },
        { id: 'pm_6', equipmentName: 'AC Unit 3 - Server Room', maintenanceType: 'Filter Cleaning & Gas Check', location: 'Server Room', scheduledDate: '14 Aug 2026', technician: 'Mr. Manoj Kumar', status: 'Scheduled', remarks: 'Master Register', targetMonth: 'Aug', isEdited: false },
        { id: 'pm_7', equipmentName: 'Fire Alarm Control Panel', maintenanceType: 'Sensor Testing & Battery Backup', location: 'Main Lobby', scheduledDate: '10 Sep 2026', technician: 'Mr. Anil Sharma', status: 'Scheduled', remarks: 'Master Register', targetMonth: 'Sep', isEdited: false },
        { id: 'pm_8', equipmentName: 'Elevator Control Panel', maintenanceType: 'Interlock & Safety Circuit Audit', location: 'Block A Lift Lobby', scheduledDate: '12 Oct 2026', technician: 'Mr. Pradeep Singh', status: 'Scheduled', remarks: 'Master Register', targetMonth: 'Oct', isEdited: false },
        { id: 'pm_9', equipmentName: 'DG Set 250 KVA', maintenanceType: 'Oil Check, Filters & Load Run', location: 'Utility Yard', scheduledDate: '15 Nov 2026', technician: 'Mr. Rajesh Kumar', status: 'Scheduled', remarks: 'Master Register', targetMonth: 'Nov', isEdited: false },
        { id: 'pm_10', equipmentName: 'Main Distribution Board (MDB)', maintenanceType: 'Thermal Scanning & Tightness Check', location: 'Electrical Substation', scheduledDate: '10 Dec 2026', technician: 'Mr. Amit Verma', status: 'Scheduled', remarks: 'Master Register', targetMonth: 'Dec', isEdited: false },
        { id: 'pm_11', equipmentName: 'Structured Cabling Patch Panels', maintenanceType: 'Port Testing & Cable Dressing', location: 'Floor 2 IT Rack', scheduledDate: '14 Jan 2027', technician: 'Mr. Suresh Nair', status: 'Scheduled', remarks: 'Master Register', targetMonth: 'Jan', isEdited: false },
        { id: 'pm_12', equipmentName: 'PA System & Speakers', maintenanceType: 'Amplifier & Zone Testing', location: 'Admin Block', scheduledDate: '18 Feb 2027', technician: 'Mr. Manoj Kumar', status: 'Scheduled', remarks: 'Master Register', targetMonth: 'Feb', isEdited: false },
        { id: 'pm_13', equipmentName: 'Annual IT Infrastructure Audit', maintenanceType: 'Comprehensive Hardware & Software Check', location: 'All Blocks', scheduledDate: '15 Mar 2027', technician: 'Super Admin', status: 'Scheduled', remarks: 'Master Register Final Review', targetMonth: 'Mar', isEdited: false }
      ];

      useEffect(() => {
        let isMounted = true;
        let eventSources = [];

        const subscribeToFirebase = (url, setter, fallback) => {
          const sseUrl = url.replace('.json', '/.json');
          const eventSource = new EventSource(sseUrl);

          eventSource.onmessage = (e) => {
            try {
              const raw = JSON.parse(e.data);
              if (!isMounted) return;
              if (raw && raw.data) {
                if (typeof raw.data === 'object' && raw.data !== null) {
                  const list = Object.keys(raw.data).map(key => ({ ...raw.data[key], firebaseKey: key }));
                  setter(list);
                } else {
                  setter(fallback);
                }
              } else if (raw && typeof raw === 'object') {
                const list = Object.keys(raw).map(key => ({ ...raw[key], firebaseKey: key }));
                setter(list);
              }
            } catch (err) {
              console.error("SSE parse error", err);
            }
          };

          eventSource.onerror = () => {
            fetch(url)
              .then(res => res.json())
              .then(data => {
                if (!isMounted) return;
                if (data) {
                  const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
                  setter(list);
                } else {
                  setter(fallback);
                }
              })
              .catch(() => {});
          };

          return eventSource;
        };

        // Initial fetches
        fetch(FIREBASE_DB_URL).then(res => res.json()).then(data => {
          if (data) setAssets(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
          else setAssets(sampleFallbackAssets);
          setLoading(false);
        }).catch(() => { setAssets(sampleFallbackAssets); setLoading(false); });

        fetch(FIREBASE_TEMP_URL).then(res => res.json()).then(data => {
          if (data) setTempDispatches(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
          else setTempDispatches([{ id: 'td_1', assetName: 'Dell OptiPlex CPU i5', assetTagNo: 'TAG-IT-9012', department: 'Accounts Department', receiver: 'Mr. Ramesh Gupta', quantity: 2, issueDate: '10 Nov 2026', status: 'Active Dispatched' }]);
        }).catch(() => {});

        fetch(FIREBASE_PM_URL).then(res => res.json()).then(data => {
          if (data) setPmSchedules(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
          else setPmSchedules(sampleFallbackPm);
        }).catch(() => setPmSchedules(sampleFallbackPm));

        fetch(FIREBASE_PM_AUDIT_URL).then(res => res.json()).then(data => {
          if (data) {
            const list = Object.keys(data).map(k => data[k]).reverse();
            setPmAuditLogs(list);
          }
        }).catch(() => {});
      const handleSavePmSchedule = async (e) => {
        e.preventDefault();
        const timestamped = getFormattedDateTime();
        
        if (editingPmItem) {
          const updated = {
            ...editingPmItem,
            ...pmForm,
            isEdited: true,
            lastModified: timestamped
          };
          try {
            if (editingPmItem.firebaseKey) {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/pm_schedules/${editingPmItem.firebaseKey}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updated)
              });
            }
            setPmSchedules(pmSchedules.map(i => (i.id === editingPmItem.id || i.firebaseKey === editingPmItem.firebaseKey) ? updated : i));
            await logPmChange('Update Location/Task', `Modified PM for ${updated.equipmentName} at Location: "${updated.location}" (${updated.targetMonth})`);
            showToast("PM schedule updated & highlighted!");
          } catch(err) {
            showToast("Error updating PM schedule.");
          }
        } else {
          const newPm = {
            id: `pm_${Date.now()}`,
            ...pmForm,
            status: 'Scheduled',
            isEdited: false,
            createdDate: timestamped
          };
          try {
            await fetch(FIREBASE_PM_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newPm)
            });
            const res = await fetch(FIREBASE_PM_URL);
            const data = await res.json();
            if (data) setPmSchedules(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
            await logPmChange('Add Task', `Added new PM task for ${newPm.equipmentName} at ${newPm.location}`);
            showToast("Preventive maintenance task scheduled successfully!");
          } catch(err) {
            setPmSchedules([newPm, ...pmSchedules]);
            showToast("Preventive maintenance task scheduled locally!");
          }
        }

        setIsPmModalOpen(false);
        setEditingPmItem(null);
        setPmForm({ equipmentName: '', maintenanceType: '', scheduledDate: '', technician: '', remarks: '', location: '', targetMonth: pmSelectedMonth });
      };
      }, []);

      useEffect(() => {
        if (activeTab === 'dashboard' && isLoggedIn) {
          setTimeout(() => {
            const lineCtx = document.getElementById('trendLineChart');
            if (lineCtx) {
              if (lineChartRef.current) lineChartRef.current.destroy();
              const totalEnt = assets.length;
              const totalIss = assets.reduce((acc, i) => acc + Number(i.issueItems || 0), 0);
              lineChartRef.current = new Chart(lineCtx, {
                type: 'bar',
                data: {
                  labels: ['Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
                  datasets: [
                    {
                      label: 'Stock Entries',
                      data: [Math.round(totalEnt * 0.6), Math.round(totalEnt * 0.75), Math.round(totalEnt * 0.85), Math.round(totalEnt * 0.9), totalEnt],
                      backgroundColor: '#3b82f6',
                      borderRadius: 6
                    },
                    {
                      label: 'Items Issued',
                      data: [Math.round(totalIss * 0.5), Math.round(totalIss * 0.7), Math.round(totalIss * 0.8), Math.round(totalIss * 0.9), totalIss],
                      backgroundColor: '#10b981',
                      borderRadius: 6
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } },
                  scales: {
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                  }
                }
              });
            }

            const donutCtx = document.getElementById('overviewDonutChart');
            if (donutCtx) {
              if (donutChartRef.current) donutChartRef.current.destroy();
              const fixedCount = assets.filter(i => i.category === 'Fixed Assets').length || 2;
              const consumCount = assets.filter(i => i.category === 'Consumable').length || 2;
              donutChartRef.current = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                  labels: ['Fixed Assets', 'Consumables'],
                  datasets: [{
                    data: [fixedCount, consumCount],
                    backgroundColor: ['#3b82f6', '#10b981'],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  cutout: '70%',
                  plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } }
                }
              });
            }
          }, 150);
        }
      }, [activeTab, isLoggedIn, assets]);

      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u => u.pin === pinInput && u.status === 'Active');
        if (matched || pinInput === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
          showToast(`Welcome back, ${matched ? matched.name : 'Super Admin'}!`);
        } else {
          setLoginError('Invalid Security PIN (Default PIN: 1234)');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const handleOpenModal = (asset = null) => {
        const currentTs = getFormattedDateTime();
        if (asset) {
          setEditingAsset(asset);
          setFormData({
            group: asset.group || '',
            particulars: asset.particulars || '',
            brand: asset.brand || 'Honeywell',
            customBrand: asset.customBrand || '',
            serialNo: asset.serialNo || '',
            vendor: asset.vendor || '',
            invoiceNo: asset.invoiceNo || '',
            warranty: asset.warranty || '',
            cableLength: asset.cableLength || '',
            measurementUnit: asset.measurementUnit || 'Piece',
            openingQty: asset.openingQty || 0,
            newPurchase: asset.newPurchase || 0,
            issueItems: asset.issueItems || 0,
            shortItems: asset.shortItems || 0,
            deadItems: asset.deadItems || 0,
            category: asset.category || 'Consumable',
            location: asset.location || '',
            minAlert: asset.minAlert || 2,
            entryMonth: asset.entryMonth || getCurrentMonthYear(),
            lastUpdated: currentTs
          });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            brand: 'Honeywell',
            customBrand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            cableLength: '',
            measurementUnit: 'Piece',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '', // Blank by default
            minAlert: 2,
            entryMonth: getCurrentMonthYear(),
            lastUpdated: currentTs
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const timestampedData = {
          ...formData,
          lastUpdated: getFormattedDateTime()
        };

        try {
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(timestampedData)
            });
          } else {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...timestampedData, id: Date.now() })
            });
          }
          setIsModalOpen(false);
          const res = await fetch(FIREBASE_DB_URL);
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
          }
          showToast("Asset record saved successfully to cloud!");
        } catch (err) {
          if (editingAsset) {
            setAssets(assets.map(i => i.id === editingAsset.id ? { ...timestampedData, id: editingAsset.id } : i));
          } else {
            setAssets([{ ...timestampedData, id: Date.now() }, ...assets]);
          }
          setIsModalOpen(false);
          showToast("Asset record saved locally!");
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteAsset = async (asset) => {
        if (window.confirm("Are you sure you want to delete this asset record?")) {
          setLoading(true);
          try {
            if (asset.firebaseKey) {
              const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${asset.firebaseKey}.json`;
              await fetch(deleteUrl, { method: 'DELETE' });
            }
            setAssets(assets.filter(i => i.id !== asset.id && i.firebaseKey !== asset.firebaseKey));
            showToast("Asset record deleted.");
          } catch (err) {
            setAssets(assets.filter(i => i.id !== asset.id));
          } finally {
            setLoading(false);
          }
        }
      };

      const handleCreateUser = (e) => {
        e.preventDefault();
        if (!newUserName || !newUserPin) return;
        const newUser = {
          id: Date.now(),
          name: newUserName,
          pin: newUserPin,
          role: newUserRole,
          status: 'Active'
        };
        const updated = [...users, newUser];
        setUsers(updated);
        localStorage.setItem('it_system_users_v2', JSON.stringify(updated));
        setNewUserName('');
        setNewUserPin('');
        showToast(`User account created for ${newUser.name}!`);
      };

      const handleSaveTempDispatch = async (e) => {
        e.preventDefault();

          issueDate: getFormattedDateTime().split(',')[0],
          status: 'Active Dispatched'

            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/temp_dispatches/${editingTempItem.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newRecord)
            });

            await fetch(FIREBASE_TEMP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...newRecord, id: `td_${Date.now()}` })
            });

          setIsTempModalOpen(false);

              headers: { 'Content-Type': 'application/json' },

                      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(assets, null, 2));
                      const dl = document.createElement('a');
                      dl.setAttribute("href", dataStr);
                      dl.setAttribute("download", "master_inventory_audit.json");
                      dl.click();
                      showToast("Master Inventory exported successfully!");
                    }} className="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold shadow cursor-pointer">

                      />
                      <select 
                        value={newUserRole}
                        onChange={(e) => setNewUserRole(e.target.value)}
                        className="w-full p-2.5 border rounded-lg text-xs"
                      >
                        <option value="Store Keeper">Store Keeper</option>
                        <option value="Auditor">Auditor</option>
                        <option value="Administrator">Administrator</option>

                        {users.map(u => (
                          <div key={u.id || u.firebaseKey} className="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs">
                            <div>
                              <div className="font-bold text-slate-900">{u.name}</div>
                              <div className="text-[10px] text-slate-500 font-mono">Role: {u.role} | PIN: ****</div>

                      type="text"
                      required
                      placeholder="e.g. Dell OptiPlex CPU i5"
                      value={tempForm.assetName}
                      onChange={(e) => setTempForm({ ...tempForm, assetName: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Asset Tag No. *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. TAG-IT-9012"
                      value={tempForm.assetTagNo}
                      onChange={(e) => setTempForm({ ...tempForm, assetTagNo: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono font-bold text-blue-600"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Department Name *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Accounts Department"
                      value={tempForm.department}
                      onChange={(e) => setTempForm({ ...tempForm, department: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Receiver Person Name *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Mr. Ramesh Gupta"
                      value={tempForm.receiver}

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Quantity *</label>
                    <input 
                      type="number"
                      min="1"
                      required
                      value={tempForm.quantity}
                      onChange={(e) => setTempForm({ ...tempForm, quantity: Number(e.target.value) })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono font-bold"

                  <div className="flex justify-end gap-2 pt-2">

                    <button 
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow cursor-pointer"
                    >
                      {editingTempItem ? 'Update Deployment' : 'Save & Dispatch'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PREVENTIVE MAINTENANCE SCHEDULE MODAL */}
          {isPmModalOpen && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-5 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-sm">
                    {editingPmItem ? 'Edit Preventive Maintenance & Location' : 'Schedule Preventive Maintenance (PM)'}

                  <button onClick={() => setIsPmModalOpen(false)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={handleSavePmSchedule} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Target Month *</label>
                    <select
                      value={pmForm.targetMonth}
                      onChange={(e) => setPmForm({ ...pmForm, targetMonth: e.target.value })}

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Location Name *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Server Room - Rack A / A Block - Electrical"
                      value={pmForm.location || ''}
                      onChange={(e) => setPmForm({ ...pmForm, location: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg font-semibold outline-none focus:ring-2 focus:ring-blue-500"

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Equipment Name / System *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Core Switch / UPS 10KVA"
                      value={pmForm.equipmentName}
                      onChange={(e) => setPmForm({ ...pmForm, equipmentName: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg font-semibold outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Maintenance Type *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Quarterly Dusting & Thermal Check"
                      value={pmForm.maintenanceType}
                      onChange={(e) => setPmForm({ ...pmForm, maintenanceType: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Scheduled Date *</label>
                      <input 
                        type="text"
                        required
                        placeholder="e.g. 15 Apr 2026"
                        value={pmForm.scheduledDate}
                        onChange={(e) => setPmForm({ ...pmForm, scheduledDate: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg font-mono"

                      <label className="block font-semibold text-slate-700 mb-1">Technician / Vendor</label>

                        type="text"

                        onChange={(e) => setPmForm({ ...pmForm, technician: e.target.value })}

                    <button 
                      type="button" 
                      onClick={() => setIsPmModalOpen(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                    >
                      Cancel

                    <button 
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow cursor-pointer"

                </form>
              </div>
            </div>
          )}

          {/* VIEW SLIP MODAL */}

            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-extrabold text-slate-900 text-sm uppercase">Asset Issue & Verification Slip</h3>
                    <p className="text-[11px] text-slate-500">Official IT Infrastructure Record</p>
                  </div>
                  <button onClick={() => setViewModalItem(null)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>

                <div className="space-y-3 text-xs bg-slate-50 p-4 rounded-xl border">
                  <div className="grid grid-cols-2 gap-2">
                    <div><strong>Group:</strong> {viewModalItem.group}</div>
                    <div><strong>Category:</strong> {viewModalItem.category}</div>
                    <div><strong>Item Particulars:</strong> {viewModalItem.particulars}</div>
                    <div><strong>Brand:</strong> {viewModalItem.brand === 'Other' ? viewModalItem.customBrand : viewModalItem.brand}</div>
                    <div><strong>Serial No:</strong> {viewModalItem.serialNo || 'N/A'}</div>
                    <div><strong>Location:</strong> {viewModalItem.location || 'Unassigned'}</div>
                    <div><strong>Issued Qty:</strong> {viewModalItem.issueItems || 0}</div>
                    <div><strong>Last Updated:</strong> {viewModalItem.lastUpdated}</div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button 
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-blue-600 text-white font-bold shadow cursor-pointer text-xs"

                    Print Slip
                  </button>
                  <button 
                    onClick={() => setViewModalItem(null)}
                    className="px-4 py-2 rounded-xl bg-slate-200 text-slate-800 font-bold cursor-pointer text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* STOCK HISTORY MODAL */}
          {historyModalItem && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">

                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-slate-900 text-sm">Stock History & Log</h3>
                  <button onClick={() => setHistoryModalItem(null)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <div className="space-y-2 text-xs">
                  <div className="p-3 bg-slate-50 rounded-xl border">
                    <div className="font-bold text-slate-900">{historyModalItem.particulars}</div>
                    <div className="text-slate-500 mt-1">Opening Qty: {historyModalItem.openingQty} | Purchases: {historyModalItem.newPurchase} | Issued: {historyModalItem.issueItems}</div>
                    <div className="text-[10px] text-slate-400 font-mono mt-2">Last Modified: {historyModalItem.lastUpdated}</div>
                  </div>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setHistoryModalItem(null)} className="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold cursor-pointer">Close</button>

            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">

                </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Asset Group *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. IT Peripherals, Hardware"
                        value={formData.group}
                        onChange={(e) => setFormData({ ...formData, group: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-semibold"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Item Particulars *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Optical Mouse USB"
                        value={formData.particulars}
                        onChange={(e) => setFormData({ ...formData, particulars: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-semibold"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Brand Name *</label>
                      <select 
                        value={formData.brand}
                        onChange={(e) => setFormData({ ...formData, brand: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      >
                        <option value="Honeywell">Honeywell</option>
                        <option value="Dell">Dell</option>
                        <option value="HP">HP</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="Cisco">Cisco</option>
                        <option value="Logitech">Logitech</option>
                        <option value="Other">Other (Custom)</option>
                      </select>
                    </div>

                    {formData.brand === 'Other' && (
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">Custom Brand Name *</label>
                        <input 
                          type="text"
                          required
                          placeholder="Enter Brand Name"
                          value={formData.customBrand}
                          onChange={(e) => setFormData({ ...formData, customBrand: e.target.value })}
                          className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Category Classification *</label>
                      <select 
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      >
                        <option value="Consumable">Consumable</option>
                        <option value="Non-Consumable">Non-Consumable</option>
                        <option value="Fixed Assets">Fixed Assets</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Location / Department (Optional)</label>
                      <input 
                        type="text" 
                        placeholder="Leave blank until assigned"
                        value={formData.location}
                        onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Serial Number</label>
                      <input 
                        type="text" 
                        placeholder="e.g. HW-MS-9981"

                        onChange={(e) => setFormData({ ...formData, serialNo: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Cable Length</label>
                      <input 
                        type="text" 
                        placeholder="e.g. 1.5 / 3 / 5"
                        value={formData.cableLength}
                        onChange={(e) => setFormData({ ...formData, cableLength: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Measurement Unit</label>
                      <select 
                        value={formData.measurementUnit}
                        onChange={(e) => setFormData({ ...formData, measurementUnit: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      >
                        <option value="Piece">Piece</option>
                        <option value="Meter">Meter</option>
                        <option value="GB">GB</option>
                        <option value="TB">TB</option>
                        <option value="Box / Set">Box / Set</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-5 gap-3 bg-slate-50 p-4 rounded-xl border">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Opening Qty</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.openingQty}
                        onChange={(e) => setFormData({ ...formData, openingQty: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">New Purchase</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.newPurchase}

                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-blue-600"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Issue Items</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.issueItems}
                        onChange={(e) => setFormData({ ...formData, issueItems: Number(e.target.value) })}

                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Short / Deficit</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.shortItems}
                        onChange={(e) => setFormData({ ...formData, shortItems: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-rose-500"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Dead / Faulty</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.deadItems}
                        onChange={(e) => setFormData({ ...formData, deadItems: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-slate-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Vendor Name</label>
                      <input 
                        type="text" 
                        placeholder="e.g. Apex Tech Solutions"
                        value={formData.vendor}
                        onChange={(e) => setFormData({ ...formData, vendor: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Invoice Number & Warranty</label>
                      <input 
                        type="text" 
                        placeholder="e.g. INV-2026-991 | 1 Year"
                        value={formData.invoiceNo}
                        onChange={(e) => setFormData({ ...formData, invoiceNo: e.target.value })}

                  </div>

                  <div className="flex justify-end gap-3 pt-3 border-t">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow cursor-pointer"
                    >
                      Save Asset Record
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
