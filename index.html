<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 8px 10px !important;
      line-height: 1.25 !important;
    }
    .pro-sidebar {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    }
    .active-pro-btn {
      background: linear-gradient(90deg, #2563eb 100%, #1d4ed8 100%);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #f8fafc; color: #1e293b; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading IT Asset Portal...</div>
        <div style="font-size: 12px; color: #64748b;">Establishing secure professional session</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";
    const FIREBASE_TEMP_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/temp_dispatches.json";
    const FIREBASE_PM_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/pm_schedules.json";
    const FIREBASE_USERS_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/system_users.json";
    const FIREBASE_PM_LOGS_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/pm_audit_logs.json";

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('All');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [viewModalItem, setViewModalItem] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      // Temporary Asset Deployment state synced with Firebase
      const [tempDispatches, setTempDispatches] = useState([]);
      const [isTempModalOpen, setIsTempModalOpen] = useState(false);
      const [editingTempItem, setEditingTempItem] = useState(null);
      const [tempForm, setTempForm] = useState({ assetName: '', assetTagNo: '', department: '', receiver: '', quantity: 1 });

      // Preventive Maintenance (PM) 12-Month Chart Plan state with date slots for ALL months
      const [pmSchedules, setPmSchedules] = useState([]);
      const [pmAuditLogs, setPmAuditLogs] = useState([]);
      const [isPmModalOpen, setIsPmModalOpen] = useState(false);
      const [editingPmItem, setEditingPmItem] = useState(null);
      const [pmSelectedMonth, setPmSelectedMonth] = useState('Jan');
      const [pmSelectedSlot, setPmSelectedSlot] = useState('01 to 10 January');
      const [showPmReportModal, setShowPmReportModal] = useState(false);

      const [pmForm, setPmForm] = useState({
        department: 'General Registration',
        equipmentName: 'Desktop PC Workstation',
        monitorBrand: 'Dell',
        monitorTagNo: 'MON-TAG-101',
        cpuBrand: 'Intel i5 / Dell',
        printerBrand: 'HP',
        printerTagNo: 'PRN-TAG-202',
        printerIP: '192.168.1.150',
        systemIP: '192.168.1.50',
        systemMac: '00:1A:2B:3C:4D:5E',
        ramType: 'DDR4',
        ramSize: '16GB',
        diskType: 'NVMe SSD',
        diskSize: '512GB',
        msOffice: 'Office 2021 Pro Plus',
        outlook: 'Configured & Synced',
        backup: 'Active Daily',
        antiVirus: 'Quick Heal (Updated)',
        userSignDate: 'Pending Sign',
        status: 'Scheduled',
        dueDate: '2026-01-05',
        targetMonth: 'Jan',
        slotRange: '01 to 10 January'
      });

      const monthsList = [
        { code: 'Apr', name: 'April', slots: ['01 to 10 April', '11 to 20 April', '21 to 30 April'] },
        { code: 'May', name: 'May', slots: ['01 to 10 May', '11 to 20 May', '21 to 31 May'] },
        { code: 'Jun', name: 'June', slots: ['01 to 10 June', '11 to 20 June', '21 to 30 June'] },
        { code: 'Jul', name: 'July', slots: ['01 to 10 July', '11 to 20 July', '21 to 31 July'] },
        { code: 'Aug', name: 'August', slots: ['01 to 10 August', '11 to 20 August', '21 to 31 August'] },
        { code: 'Sep', name: 'September', slots: ['01 to 10 September', '11 to 20 September', '21 to 30 September'] },
        { code: 'Oct', name: 'October', slots: ['01 to 10 October', '11 to 20 October', '21 to 31 October'] },
        { code: 'Nov', name: 'November', slots: ['01 to 10 November', '11 to 20 November', '21 to 30 November'] },
        { code: 'Dec', name: 'December', slots: ['01 to 10 December', '11 to 20 December', '21 to 31 December'] },
        { code: 'Jan', name: 'January', slots: ['01 to 10 January', '11 to 20 January', '21 to 31 January'] },
        { code: 'Feb', name: 'February', slots: ['01 to 10 February', '11 to 20 February', '21 to 28 February'] },
        { code: 'Mar', name: 'March', slots: ['01 to 10 March', '11 to 20 March', '21 to 31 March'] }
      ];

      const sampleFallbackUsers = [
        { id: 1, name: 'Super Admin', pin: '1234', role: 'Super Administrator', status: 'Active' },
        { id: 2, name: 'IT Inventory Desk', pin: '5678', role: 'Store Keeper', status: 'Active' }
      ];

      const [users, setUsers] = useState(sampleFallbackUsers);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const getFormattedDateTime = () => {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
      };

      const sampleFallbackAssets = [
        { id: 101, group: 'MOUSE', particulars: 'USB MOUSE', brand: 'Dell', serialNo: 'MS-01', cableLength: '1.5', measurementUnit: 'Piece', openingQty: 12, newPurchase: 0, issueItems: 1, shortItems: 0, deadItems: 0, category: 'Consumable', location: 'it', minAlert: 2, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026, 2:54 PM' },
        { id: 102, group: 'MOUSE', particulars: 'USB MOUSE', brand: 'Lenovo', serialNo: 'MS-02', cableLength: '1.5', measurementUnit: 'Piece', openingQty: 6, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0, category: 'Consumable', location: '', minAlert: 2, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026' },
        { id: 103, group: 'MOUSE', particulars: 'WIRELESS-MOUSE', brand: 'Dell', serialNo: 'MS-03', cableLength: '', measurementUnit: 'Piece', openingQty: 1, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0, category: 'Consumable', location: '', minAlert: 2, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026' },
        { id: 104, group: 'KEYBOARD', particulars: 'USB-KEYBOARD', brand: 'DELL', serialNo: 'KB-01', cableLength: '', measurementUnit: 'Piece', openingQty: 9, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0, category: 'Consumable', location: '', minAlert: 2, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026' },
        { id: 105, group: 'CONNECTOR', particulars: 'VGA-HDMI WITH AUDIO', brand: '-', serialNo: 'CN-01', cableLength: '', measurementUnit: 'Piece', openingQty: 1, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0, category: 'Consumable', location: '', minAlert: 1, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026' }
      ];

      // Safe Data Fetching with 2-Second Auto-Sync Interval
      useEffect(() => {
        let isMounted = true;

        const fetchAllData = async () => {
          try {
            const resAssets = await fetch(FIREBASE_DB_URL);
            const dataAssets = await resAssets.json();
            if (isMounted) {
              if (dataAssets && typeof dataAssets === 'object') {
                const loaded = Object.keys(dataAssets).map(k => ({ ...dataAssets[k], firebaseKey: k }));
                setAssets(loaded.length > 0 ? loaded : sampleFallbackAssets);
              } else {
                setAssets(sampleFallbackAssets);
              }
              setLoading(false);
            }
          } catch(e) {
            if (isMounted) {
              setAssets(sampleFallbackAssets);
              setLoading(false);
            }
          }

          try {
            const resTemp = await fetch(FIREBASE_TEMP_URL);
            const dataTemp = await resTemp.json();
            if (isMounted && dataTemp && typeof dataTemp === 'object') {
              setTempDispatches(Object.keys(dataTemp).map(k => ({ ...dataTemp[k], firebaseKey: k })));
            }
          } catch(e) {}

          try {
            const resPm = await fetch(FIREBASE_PM_URL);
            const dataPm = await resPm.json();
            if (isMounted && dataPm && typeof dataPm === 'object') {
              setPmSchedules(Object.keys(dataPm).map(k => ({ ...dataPm[k], firebaseKey: k })));
            }
          } catch(e) {}

          try {
            const resLogs = await fetch(FIREBASE_PM_LOGS_URL);
            const dataLogs = await resLogs.json();
            if (isMounted && dataLogs && typeof dataLogs === 'object') {
              setPmAuditLogs(Object.keys(dataLogs).map(k => ({ ...dataLogs[k], firebaseKey: k })));
            }
          } catch(e) {}
        };

        fetchAllData();
        const intervalId = setInterval(fetchAllData, 2000);

        return () => {
          isMounted = false;
          clearInterval(intervalId);
        };
      }, []);

      const filteredPmSchedules = pmSchedules.filter(item => {
        const matchesMonth = (item.targetMonth || '').toLowerCase() === pmSelectedMonth.toLowerCase();
        const matchesSlot = !pmSelectedSlot || (item.slotRange || '').toLowerCase() === pmSelectedSlot.toLowerCase();
        return matchesMonth && matchesSlot;
      });

      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u => String(u.pin) === String(pinInput) && u.status === 'Active');
        if (matched) {
          setIsLoggedIn(true);
          setLoginError('');
          showToast(`Welcome back, ${matched.name}!`);
        } else {
          setLoginError('Invalid Security PIN or Inactive User.');
        }
      };

      const [formData, setFormData] = useState({
        group: 'MOUSE',
        particulars: '',
        brand: 'Dell',
        customBrand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        cableLength: '',
        measurementUnit: 'Piece',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear(),
        lastUpdated: getFormattedDateTime()
      });

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        const timestamped = getFormattedDateTime();
        const finalBrand = formData.brand === 'Other' ? formData.customBrand : formData.brand;

        if (editingAsset) {
          const updated = {
            ...editingAsset,
            ...formData,
            brand: finalBrand,
            lastUpdated: timestamped
          };
          try {
            if (editingAsset.firebaseKey) {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updated)
              });
            }
            setAssets(assets.map(a => (a.id === editingAsset.id || a.firebaseKey === editingAsset.firebaseKey) ? updated : a));
            showToast("Asset record successfully updated!");
          } catch(err) {
            showToast("Error updating record in database.");
          }
        } else {
          const newAsset = {
            id: Date.now(),
            ...formData,
            brand: finalBrand,
            lastUpdated: timestamped
          };
          try {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newAsset)
            });
            const res = await fetch(FIREBASE_DB_URL);
            const data = await res.json();
            if (data) setAssets(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
            showToast("New asset registered successfully!");
          } catch(err) {
            setAssets([newAsset, ...assets]);
            showToast("Asset added locally!");
          }
        }

        setIsModalOpen(false);
        setEditingAsset(null);
      };

      const handleDeleteAsset = async (item) => {
        if (window.confirm(`Are you sure you want to delete "${item.particulars}"?`)) {
          try {
            if (item.firebaseKey) {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${item.firebaseKey}.json`, {
                method: 'DELETE'
              });
            }
            setAssets(assets.filter(a => a.id !== item.id && a.firebaseKey !== item.firebaseKey));
            showToast("Asset record deleted.");
          } catch(err) {
            showToast("Error deleting record.");
          }
        }
      };

      const groupCounts = assets.reduce((acc, curr) => {
        const g = curr.group || 'OTHER';
        acc[g] = (acc[g] || 0) + 1;
        return acc;
      }, {});

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                            (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                            (item.serialNo || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                            (item.location || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === 'All' || !locationFilter || (item.location || '').toLowerCase() === locationFilter.toLowerCase();
        const matchesGroup = !selectedGroupFilter || (item.group || '').toLowerCase() === selectedGroupFilter.toLowerCase();
        return matchesSearch && matchesLocation && matchesGroup;
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const paginatedAssets = filteredAssets.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 border border-slate-200 space-y-6 text-slate-800">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-blue-500/20">IT</div>
                <h1 className="text-xl font-extrabold tracking-tight text-slate-900">IT Asset & Inventory Portal</h1>
                <p className="text-xs text-slate-500 font-medium">Select your professional profile and enter your 4-digit Security PIN</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Select User Profile</label>
                  <select 
                    onChange={(e) => {
                      const sel = users.find(u => String(u.pin) === String(e.target.value));
                      if (sel) setPinInput(sel.pin);
                    }}
                    className="w-full p-3 border border-slate-300 rounded-xl text-xs font-bold outline-none bg-slate-50 text-slate-800"
                  >
                    <option value="">-- Choose Profile --</option>
                    {users.map(u => (
                      <option key={u.id} value={u.pin}>{u.name} ({u.role}) - PIN: {u.pin}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Security PIN</label>
                  <input 
                    type="password"
                    maxLength="4"
                    placeholder="••••"
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3 border border-slate-300 bg-slate-50 text-slate-800 rounded-xl text-center text-xl font-mono tracking-widest outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                {loginError && <div className="p-3 bg-rose-50 text-rose-600 text-xs rounded-xl font-bold border border-rose-200">{loginError}</div>}

                <button 
                  type="submit"
                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-extrabold shadow-lg shadow-blue-600/20 cursor-pointer transition"
                >
                  Authenticate & Login
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-slate-100 overflow-hidden text-slate-800">
          
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl border border-slate-800 text-xs font-bold flex items-center gap-3 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
              {toastMsg}
            </div>
          )}

          {/* PROFESSIONAL LIGHT SIDEBAR WITH ALL MODULES & SCROLL */}
          <aside className="w-72 pro-sidebar text-white flex flex-col justify-between p-5 border-r border-slate-800 shadow-xl">
            <div className="space-y-4 flex flex-col h-full overflow-hidden">
              <div className="flex flex-col items-center text-center pb-3 border-b border-slate-700/60 shrink-0">
                <div className="w-12 h-12 bg-slate-800 border-2 border-blue-500/50 rounded-full flex items-center justify-center text-blue-400 text-lg font-black mb-1 shadow-lg shadow-blue-500/20">
                  💾
                </div>
                <h2 className="text-xs font-extrabold tracking-wider uppercase text-slate-100">IT ASSET & INVENTORY</h2>
                <div className="text-[10px] text-emerald-400 flex items-center gap-1 mt-0.5 font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Auto-Sync Active (2s)
                </div>
              </div>

              {/* Scrollable Navigation Area */}
              <nav className="space-y-1.5 text-xs font-semibold overflow-y-auto pr-1 flex-1 scrollbar-thin">
                <button
                  onClick={() => setActiveTab('inventory')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition cursor-pointer ${
                    activeTab === 'inventory' ? 'active-pro-btn text-white font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>📄</span> 1. Stock Register
                </button>

                <button
                  onClick={() => setActiveTab('temp_deploy')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition cursor-pointer ${
                    activeTab === 'temp_deploy' ? 'active-pro-btn text-white font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>🔄</span> 2. Temporary Deployment
                </button>

                <button
                  onClick={() => setActiveTab('preventive_maint')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition cursor-pointer ${
                    activeTab === 'preventive_maint' ? 'active-pro-btn text-white font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>⚙️</span> 3. Preventive Maintenance
                </button>

                <button
                  onClick={() => setActiveTab('stock_ledger')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition cursor-pointer ${
                    activeTab === 'stock_ledger' ? 'active-pro-btn text-white font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>📊</span> 4. Stock Ledger & Reports
                </button>

                <button
                  onClick={() => setActiveTab('asset_lifecycle')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition cursor-pointer ${
                    activeTab === 'asset_lifecycle' ? 'active-pro-btn text-white font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>🛡️</span> 5. Asset Warranty & Lifecycle
                </button>

                <button
                  onClick={() => setActiveTab('vendors')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition cursor-pointer ${
                    activeTab === 'vendors' ? 'active-pro-btn text-white font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>🏢</span> 6. Vendor & Purchase Management
                </button>

                <button
                  onClick={() => setActiveTab('users')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition cursor-pointer ${
                    activeTab === 'users' ? 'active-pro-btn text-white font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>👤</span> 7. Privilege & Users
                </button>
              </nav>
            </div>

            <div className="pt-3 border-t border-slate-700/60 space-y-2.5 shrink-0">
              <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700 flex items-center gap-3">
                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white text-xs">A</div>
                <div>
                  <div className="font-bold text-xs text-white">Super Admin</div>
                  <div className="text-[10px] text-slate-400 font-medium">Master Access</div>
                </div>
              </div>
              <button
                onClick={() => setIsLoggedIn(false)}
                className="w-full py-2 bg-rose-950/80 hover:bg-rose-900 text-rose-200 rounded-xl text-xs font-bold transition cursor-pointer border border-rose-800/50 flex items-center justify-center gap-2"
              >
                <span>🚪</span> Sign Out
              </button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col overflow-hidden bg-slate-100 p-6 space-y-4">
            
            {activeTab === 'inventory' && (
              <div className="flex-1 flex flex-col overflow-hidden space-y-4">

                      <label className="block font-semibold text-slate-600 mb-1">Target Month *</label>
                      <select
                        value={pmForm.targetMonth}
                        onChange={(e) => {
                          const mCode = e.target.value;
                          const mObj = monthsList.find(m => m.code === mCode);
                          setPmForm({ 
                            ...pmForm, 
                            targetMonth: mCode, 
                            slotRange: mObj && mObj.slots ? mObj.slots[0] : pmForm.slotRange 
                          });
                        }}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-bold outline-none text-slate-900"
                      >
                        {monthsList.map(m => (
                          <option key={m.code} value={m.code}>{m.name} ({m.code})</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Date Slot Range *</label>
                      <select
                        value={pmForm.slotRange}
                        onChange={(e) => setPmForm({ ...pmForm, slotRange: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-bold outline-none text-slate-900"
                      >
                        {(() => {
                          const selM = monthsList.find(m => m.code === pmForm.targetMonth);
                          const slots = selM && selM.slots ? selM.slots : ['01 to 10 January', '11 to 20 January', '21 to 31 January'];
                          return slots.map(s => <option key={s} value={s}>{s}</option>);
                        })()}
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Due Date *</label>
                      <input 
                        type="date"
                        required
                        value={pmForm.dueDate}
                        onChange={(e) => setPmForm({ ...pmForm, dueDate: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-mono text-slate-900"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Department / Location *</label>
                      <input 
                        type="text"
                        required
                        value={pmForm.department}
                        onChange={(e) => setPmForm({ ...pmForm, department: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-semibold text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Equipment Name *</label>
                      <input 
                        type="text"
                        required
                        value={pmForm.equipmentName}
                        onChange={(e) => setPmForm({ ...pmForm, equipmentName: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-semibold text-slate-900"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Monitor Brand</label>
                      <input 
                        type="text"
                        value={pmForm.monitorBrand}
                        onChange={(e) => setPmForm({ ...pmForm, monitorBrand: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Monitor Tag No</label>
                      <input 
                        type="text"
                        value={pmForm.monitorTagNo}
                        onChange={(e) => setPmForm({ ...pmForm, monitorTagNo: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-mono text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">CPU Brand</label>
                      <input 
                        type="text"
                        value={pmForm.cpuBrand}
                        onChange={(e) => setPmForm({ ...pmForm, cpuBrand: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-900"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Printer Brand</label>
                      <input 
                        type="text"
                        value={pmForm.printerBrand}
                        onChange={(e) => setPmForm({ ...pmForm, printerBrand: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Printer Tag No</label>
                      <input 
                        type="text"
                        value={pmForm.printerTagNo}
                        onChange={(e) => setPmForm({ ...pmForm, printerTagNo: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-mono text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Printer IP</label>
                      <input 
                        type="text"
                        value={pmForm.printerIP}
                        onChange={(e) => setPmForm({ ...pmForm, printerIP: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-mono text-slate-900"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">System IP</label>
                      <input 
                        type="text"
                        value={pmForm.systemIP}
                        onChange={(e) => setPmForm({ ...pmForm, systemIP: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-mono text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">System Mac</label>
                      <input 
                        type="text"
                        value={pmForm.systemMac}
                        onChange={(e) => setPmForm({ ...pmForm, systemMac: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-mono text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Status</label>
                      <select
                        value={pmForm.status}
                        onChange={(e) => setPmForm({ ...pmForm, status: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-bold text-slate-900"
                      >
                        <option value="Scheduled">Scheduled</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button 
                      type="button" 
                      onClick={() => setIsPmModalOpen(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-100 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow cursor-pointer"
                    >
                      {editingPmItem ? 'Save & Highlight Changes' : 'Schedule Task'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PM CHANGE AUDIT REPORT MODAL */}
          {showPmReportModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full p-6 space-y-4 text-slate-800">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <div>
                    <h3 className="font-extrabold text-sm text-slate-900">Preventive Maintenance Change Audit Report</h3>
                    <p className="text-[11px] text-slate-500">History log of all updates and edits made to PM tasks</p>
                  </div>
                  <button onClick={() => setShowPmReportModal(false)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>

                <div className="max-h-96 overflow-auto border border-slate-200 rounded-xl">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead className="bg-slate-100 text-slate-700 uppercase font-bold text-[10px] sticky top-0 border-b border-slate-200">
                      <tr>
                        <th className="p-3">Timestamp</th>
                        <th>Department</th>
                        <th>Equipment</th>
                        <th>Change Log Description</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {pmAuditLogs.length === 0 ? (
                        <tr>
                          <td colSpan="4" className="text-center py-8 text-slate-400">No modifications recorded yet. Edit any PM task to generate change logs.</td>
                        </tr>
                      ) : (
                        pmAuditLogs.map((log, index) => (
                          <tr key={log.firebaseKey || index} className="hover:bg-slate-50">
                            <td className="p-3 font-mono text-slate-500 text-[11px]">{log.timestamp}</td>
                            <td className="font-bold text-blue-600">{log.department}</td>
                            <td>{log.equipment}</td>
                            <td className="text-amber-700 font-semibold">{log.action}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>

                <div className="flex justify-end pt-2">
                  <button 
                    onClick={() => setShowPmReportModal(false)}
                    className="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold cursor-pointer text-xs"
                  >
                    Close Report
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* VIEW SLIP MODAL */}
          {viewModalItem && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 space-y-4 text-slate-800">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <div>
                    <h3 className="font-extrabold text-sm uppercase text-slate-900">Asset Issue & Verification Slip</h3>
                    <p className="text-[11px] text-slate-500">Official IT Infrastructure Record</p>
                  </div>
                  <button onClick={() => setViewModalItem(null)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>

                <div className="space-y-3 text-xs bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-700">
                  <div className="grid grid-cols-2 gap-2">
                    <div><strong>Group Category:</strong> {viewModalItem.group}</div>
                    <div><strong>Category:</strong> {viewModalItem.category}</div>
                    <div><strong>Item Particulars:</strong> {viewModalItem.particulars}</div>
                    <div><strong>Brand:</strong> {viewModalItem.brand === 'Other' ? viewModalItem.customBrand : viewModalItem.brand}</div>
                    <div><strong>Serial No:</strong> {viewModalItem.serialNo || 'N/A'}</div>
                    <div><strong>Location:</strong> {viewModalItem.location || 'Unassigned'}</div>
                    <div><strong>Issued Qty:</strong> {viewModalItem.issueItems || 0}</div>
                    <div><strong>Last Updated:</strong> {viewModalItem.lastUpdated}</div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button 
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-blue-600 text-white font-bold shadow cursor-pointer text-xs"
                  >
                    Print Slip
                  </button>
                  <button 
                    onClick={() => setViewModalItem(null)}
                    className="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 font-bold cursor-pointer text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADD / EDIT ASSET MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full p-6 space-y-4 my-8 text-slate-800">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <h3 className="font-extrabold text-sm text-slate-900">
                    {editingAsset ? 'Edit Asset & Stock Details' : 'Register New Asset Entry'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>

                <form onSubmit={handleSaveAsset} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Asset Group Name *</label>
                      <input 
                        type="text"
                        required
                        placeholder="e.g. MOUSE, KEYBOARD, CONNECTOR"
                        value={formData.group}
                        onChange={(e) => setFormData({ ...formData, group: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none font-bold text-slate-900 uppercase"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Item Particulars *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. USB MOUSE"
                        value={formData.particulars}
                        onChange={(e) => setFormData({ ...formData, particulars: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none font-semibold text-slate-900 uppercase"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Brand Name *</label>
                      <select 
                        value={formData.brand}
                        onChange={(e) => setFormData({ ...formData, brand: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none text-slate-900"
                      >
                        <option value="Dell">Dell</option>
                        <option value="HP">HP</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="Cisco">Cisco</option>
                        <option value="Logitech">Logitech</option>
                        <option value="Honeywell">Honeywell</option>
                        <option value="Other">Other (Custom)</option>
                      </select>
                    </div>

                    {formData.brand === 'Other' && (
                      <div>
                        <label className="block font-semibold text-slate-600 mb-1">Custom Brand *</label>
                        <input 
                          type="text"
                          required
                          placeholder="Enter Brand"
                          value={formData.customBrand}
                          onChange={(e) => setFormData({ ...formData, customBrand: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-900"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Category *</label>
                      <select 
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none text-slate-900"
                      >
                        <option value="Consumable">Consumable</option>
                        <option value="Non-Consumable">Non-Consumable</option>
                        <option value="Fixed Assets">Fixed Assets</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Location (Optional)</label>
                      <input 
                        type="text" 
                        placeholder="Leave blank until issued"
                        value={formData.location}
                        onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none text-slate-900"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Serial Number</label>
                      <input 
                        type="text" 
                        placeholder="e.g. MS-01"
                        value={formData.serialNo}
                        onChange={(e) => setFormData({ ...formData, serialNo: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-mono text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Cable Length</label>
                      <input 
                        type="text" 
                        placeholder="e.g. 1.5"
                        value={formData.cableLength}
                        onChange={(e) => setFormData({ ...formData, cableLength: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-mono text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Unit</label>
                      <select 
                        value={formData.measurementUnit}
                        onChange={(e) => setFormData({ ...formData, measurementUnit: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none text-slate-900"
                      >
                        <option value="Piece">Piece</option>
                        <option value="Meter">Meter</option>
                        <option value="GB">GB</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-5 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Opening Qty</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.openingQty}
                        onChange={(e) => setFormData({ ...formData, openingQty: Number(e.target.value) })}
                        className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Purchase</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.newPurchase}
                        onChange={(e) => setFormData({ ...formData, newPurchase: Number(e.target.value) })}
                        className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-blue-600"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Issued</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.issueItems}
                        onChange={(e) => setFormData({ ...formData, issueItems: Number(e.target.value) })}
                        className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-amber-600"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Short</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.shortItems}
                        onChange={(e) => setFormData({ ...formData, shortItems: Number(e.target.value) })}
                        className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-rose-600"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Dead</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.deadItems}
                        onChange={(e) => setFormData({ ...formData, deadItems: Number(e.target.value) })}
                        className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-slate-500"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-3 border-t border-slate-200">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-100 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow cursor-pointer"
                    >
                      Save Asset Record
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
