<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 10px !important;
      line-height: 1.25 !important;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";

    const defaultRoleRights = {
      Admin: { canAdd: true, canEdit: true, canDelete: true, canStockIn: true },
      "IT Manager": { canAdd: true, canEdit: true, canDelete: false, canStockIn: true },
      Technician: { canAdd: false, canEdit: true, canDelete: false, canStockIn: true },
      Viewer: { canAdd: false, canEdit: false, canDelete: false, canStockIn: false }
    };

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState({ name: 'Admin User', role: 'Admin' });
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // Default activeTab is 'dashboard' as shown in user screenshot
      const [activeTab, setActiveTab] = useState('dashboard');
      const [roleRights, setRoleRights] = useState(defaultRoleRights);
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);
      const [recentlyAddedId, setRecentlyAddedId] = useState(null);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);

      const [isIssueModalOpen, setIsIssueModalOpen] = useState(false);
      const [issuingItem, setIssuingItem] = useState(null);
      const [issueForm, setIssueForm] = useState({ qty: 1, recipient: '', dept: '' });

      const lineChartRef = useRef(null);
      const donutChartRef = useRef(null);

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        brand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear()
      });

      const fetchCloudData = async () => {
        try {
          const res = await fetch(FIREBASE_DB_URL);
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
          } else {
            setAssets([]);
          }
        } catch (err) {
          console.error("Firebase fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 3000);
        return () => clearInterval(interval);
      }, []);

      // Render Charts on Dashboard activeTab
      useEffect(() => {
        if (activeTab === 'dashboard' && isLoggedIn) {
          // Line Chart Setup
          const lineCtx = document.getElementById('trendLineChart');
          if (lineCtx) {
            if (lineChartRef.current) lineChartRef.current.destroy();
            lineChartRef.current = new Chart(lineCtx, {
              type: 'line',
              data: {
                labels: ['Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
                datasets: [
                  {
                    label: 'Entries',
                    data: [40, 55, 60, 65, assets.length || 71],
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    tension: 0.3,
                    fill: true,
                    pointRadius: 4,
                    pointBackgroundColor: '#2563eb'
                  },
                  {
                    label: 'Issued',
                    data: [25, 38, 42, 50, assets.reduce((acc, i) => acc + Number(i.issueItems || 0), 0) || 53],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.05)',
                    tension: 0.3,
                    fill: true,
                    pointRadius: 4,
                    pointBackgroundColor: '#10b981'
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
                  x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                }
              }
            });
          }

          // Donut Chart Setup
          const donutCtx = document.getElementById('overviewDonutChart');
          if (donutCtx) {
            if (donutChartRef.current) donutChartRef.current.destroy();
            const consumable = assets.filter(i => i.category === 'Consumable').length || 25;
            const nonConsumable = assets.filter(i => i.category === 'Non-Consumable').length || 35;
            const remaining = Math.max(assets.length - (consumable + nonConsumable), 0) || 40;

            donutChartRef.current = new Chart(donutCtx, {
              type: 'doughnut',
              data: {
                labels: ['IT Equipment', 'Peripherals', 'Consumables'],
                datasets: [{
                  data: [remaining, nonConsumable, consumable],
                  backgroundColor: ['#2563eb', '#10b981', '#a855f7'],
                  borderWidth: 2,
                  borderColor: '#ffffff'
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '72%',
                plugins: { legend: { display: false } }
              }
            });
          }
        }
      }, [activeTab, isLoggedIn, assets]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
        } else {
          setLoginError('Invalid Security PIN (Default PIN: 1234)');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const handleOpenModal = (asset = null) => {
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          setEditingAsset(asset);
          setFormData({ ...asset, entryMonth: asset.entryMonth || autoMonth });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            brand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '',
            minAlert: 2,
            entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const finalData = {
          ...formData,
          entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear()
        };

        try {
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalData)
            });
            setRecentlyAddedId(editingAsset.firebaseKey);
          } else {
            const response = await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...finalData, id: currentTimestamp })
            });
            const result = await response.json();
            if (result && result.name) {
              setRecentlyAddedId(result.name);
            }
          }
          setIsModalOpen(false);
          await fetchCloudData();
        } catch (err) {
          alert("Error saving entry.");
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteAsset = async (asset) => {
        if (window.confirm("Are you sure you want to delete this asset record?")) {
          setLoading(true);
          try {
            const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${asset.firebaseKey}.json`;
            await fetch(deleteUrl, { method: 'DELETE' });
            await fetchCloudData();
          } catch (err) {
            console.error(err);
          } finally {
            setLoading(false);
          }
        }
      };

      const handleOpenIssueModal = (item) => {
        setIssuingItem(item);
        setIssueForm({ qty: 1, recipient: '', dept: item.location || '' });
        setIsIssueModalOpen(true);
      };

      const handleSaveIssue = async (e) => {
        e.preventDefault();
        if (!issuingItem) return;

        const newIssuedTotal = Number(issuingItem.issueItems || 0) + Number(issueForm.qty);
        const updatedLocations = issuingItem.location 
          ? `${issuingItem.location}, ${issueForm.recipient} (${issueForm.dept})`
          : `${issueForm.recipient} (${issueForm.dept})`;

        const updatedData = {
          ...issuingItem,
          issueItems: newIssuedTotal,
          location: updatedLocations
        };

        setLoading(true);
        try {
          const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${issuingItem.firebaseKey}.json`;
          await fetch(updateUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
          });
          setIsIssueModalOpen(false);
          await fetchCloudData();
          alert(`Successfully allocated ${issueForm.qty} unit(s) to ${issueForm.recipient}!`);
        } catch (err) {
          alert("Error updating allocated stock.");
        } finally {
          setLoading(false);
        }
      };

      const handlePrintGatePass = (item) => {
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
          <html>
            <head>
              <title>Asset Handover Voucher & Gate Pass</title>
              <style>
                body { font-family: 'Inter', sans-serif; padding: 35px; color: #0f172a; }
                .header { text-align: center; border-bottom: 2px solid #2563eb; padding-bottom: 14px; margin-bottom: 28px; }
                .details { margin-bottom: 45px; line-height: 2.2; font-size: 14px; }
                .signatures { display: flex; justify-content: space-between; margin-top: 100px; }
                .sig-box { border-top: 1px solid #64748b; width: 220px; text-align: center; padding-top: 8px; font-weight: 600; font-size: 13px; }
              </style>
            </head>
            <body>
              <div class="header">
                <h2 style="margin:0; color:#0f172a; font-size:22px;">IT ASSET MANAGEMENT SYSTEM</h2>
                <h4 style="margin:6px 0 0; color:#2563eb; font-weight:600; text-transform:uppercase; font-size:13px;">Official Handover Voucher & Gate Pass</h4>
              </div>
              <div class="details">
                <p><strong>Asset Group:</strong> ${item.group}</p>
                <p><strong>Item Particulars:</strong> ${item.particulars}</p>
                <p><strong>Brand:</strong> ${item.brand || 'N/A'}</p>
                <p><strong>Serial Number / Tag:</strong> ${item.serialNo || 'N/A'}</p>
                <p><strong>Entry Period:</strong> ${item.entryMonth || 'N/A'}</p>
                <p><strong>Allocation Location:</strong> ${item.location || 'N/A'}</p>
                <p><strong>Date:</strong> ${new Date().toLocaleDateString()}</p>
              </div>
              <div class="signatures">
                <div class="sig-box">Issued By (IT Operations)</div>
                <div class="sig-box">Received By (Employee)</div>
              </div>
            </body>
          </html>
        `);
        printWindow.document.close();
        printWindow.print();
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          const text = event.target.result;
          const rows = text.split("\n");
          
          setLoading(true);
          try {
            let count = 0;
            const currentM = getCurrentMonthYear();
            for (let i = 1; i < rows.length; i++) {
              const cols = rows[i].split(",");
              if (cols.length >= 2 && cols[1] && cols[1].trim() !== "") {
                const newItem = {
                  group: cols[1]?.replace(/"/g, '').trim() || 'General',
                  particulars: cols[2]?.replace(/"/g, '').trim() || 'Item',
                  brand: cols[3]?.replace(/"/g, '').trim() || '',
                  serialNo: cols[4]?.replace(/"/g, '').trim() || '',
                  vendor: cols[5]?.replace(/"/g, '').trim() || '',
                  invoiceNo: cols[6]?.replace(/"/g, '').trim() || '',
                  openingQty: Number(cols[7]) || 0,
                  newPurchase: Number(cols[8]) || 0,
                  issueItems: Number(cols[9]) || 0,
                  shortItems: Number(cols[10]) || 0,
                  deadItems: Number(cols[13]) || 0,
                  category: cols[14]?.replace(/"/g, '').trim() || 'Consumable',
                  location: cols[15]?.replace(/"/g, '').trim() || '',
                  entryMonth: currentM,
                  minAlert: 2,
                  id: Date.now() + i
                };
                await fetch(FIREBASE_DB_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(newItem)
                });
                count++;
              }
            }
            await fetchCloudData();
            alert(`Import Successful! ${count} asset records integrated.`);
          } catch (err) {
            alert("Error importing file.");
          } finally {
            setLoading(false);
          }
        };
        reader.readAsText(file);
      };

      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,S.No,Group,Particulars,Brand,Serial No,Vendor,Invoice,Entry Month,Opening Qty,New Purchase,Issue Items,Short Items,Balance Stock,Physical Stock,Dead Items,Category,Location\n";
        
        assets.forEach((item, index) => {
          const balanceStock = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
          const physicalStock = balanceStock - Number(item.shortItems || 0) - Number(item.deadItems || 0);
          const row = [
            index + 1,
            `"${item.group || ''}"`,
            `"${item.particulars || ''}"`,
            `"${item.brand || ''}"`,
            `"${item.serialNo || ''}"`,
            `"${item.vendor || ''}"`,
            `"${item.invoiceNo || ''}"`,
            `"${item.entryMonth || ''}"`,
            item.openingQty || 0,
            item.newPurchase || 0,
            item.issueItems || 0,
            item.shortItems || 0,
            balanceStock,
            physicalStock,
            item.deadItems || 0,
            `"${item.category || ''}"`,
            `"${(item.location || '').replace(/"/g, '""')}"`
          ];
          csvContent += row.join(",") + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "IT_Asset_Register_Report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        return matchesSearch && matchesLocation && matchesMonth;
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);

      const totalRecords = assets.length;
      const lowStockItems = assets.filter(item => {
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        return phy <= Number(item.minAlert || 2);
      });
      const currentMonthRecords = assets.filter(i => (i.entryMonth || '').toLowerCase() === getCurrentMonthYear().toLowerCase()).length;
      const consumableCount = assets.filter(i => i.category === 'Consumable').length;
      const nonConsumableCount = assets.filter(i => i.category === 'Non-Consumable').length;

      const currentRights = roleRights[currentUser.role] || defaultRoleRights.Viewer;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <div className="text-center mb-6">
                <div className="inline-flex p-3.5 bg-blue-50 text-blue-600 rounded-2xl mb-3 shadow-inner border border-blue-100">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">IT Asset Portal</h1>
                <p className="text-xs font-medium text-slate-500 mt-1">Enterprise Cloud Inventory Infrastructure</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">User Privilege Level</label>
                  <select 
                    value={currentUser.role} 
                    onChange={(e) => setCurrentUser({...currentUser, role: e.target.value})}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none transition"
                  >
                    <option value="Admin">System Administrator</option>
                    <option value="IT Manager">IT Operations Manager</option>
                    <option value="Technician">Desktop Technician</option>
                    <option value="Viewer">Auditor (Read-Only)</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Security PIN Code</label>
                  <input 
                    type="password" 
                    placeholder="Enter PIN (Default: 1234)" 
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none transition"
                    required
                  />
                </div>

                {loginError && <p className="text-xs text-rose-500 font-medium">{loginError}</p>}

                <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-blue-500/20 transition duration-150 flex items-center justify-center gap-2">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                  Authenticate & Sign In
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100">
          {/* Left Dark Sidebar - Matches Image Exactly */}
          <aside className="w-64 bg-slate-950 text-slate-300 flex flex-col shadow-2xl border-r border-slate-800">
            <div className="p-5 border-b border-slate-800/80 flex items-center space-x-3">
              <div className="p-2.5 bg-blue-600 rounded-xl text-white font-bold shadow-lg shadow-blue-600/30 flex items-center justify-center">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
              </div>
              <div>
                <h2 className="font-extrabold text-white text-xs tracking-wider leading-tight">IT ASSET</h2>
                <h2 className="font-extrabold text-white text-xs tracking-wider leading-tight">MANAGEMENT SYSTEM</h2>
                <span className="text-[10px] text-emerald-400 font-semibold flex items-center gap-1 mt-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synchronized
                </span>
              </div>
            </div>

            <nav className="flex-1 p-3 space-y-1.5 overflow-y-auto">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                { id: 'inventory', label: '1. Stock Register', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                { id: 'analytics', label: '2. Analytics Board', icon: 'M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' },
                { id: 'reports', label: '3. Audit & Reports', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                { id: 'rights', label: '4. Privilege Control', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all duration-150 flex items-center justify-between ${
                    activeTab === tab.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'hover:bg-slate-900 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={tab.icon}></path></svg>
                    <span>{tab.label}</span>
                  </div>
                  {activeTab === tab.id && <svg className="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>}
                </button>
              ))}
            </nav>

            <div className="p-3 border-t border-slate-800 bg-slate-950/80">
              <div className="flex items-center justify-between text-xs text-slate-400">
                <span className="flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                  <strong className="text-white font-semibold">{currentUser.role}</strong>
                </span>
                <button onClick={handleLogout} className="text-rose-400 font-semibold hover:underline flex items-center gap-1 text-[11px]">
                  Sign Out
                </button>
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col overflow-hidden bg-slate-100">
            {/* Header Topbar - Matches Image */}
            <header className="px-6 py-4 flex justify-between items-center z-10">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-100 rounded-xl text-blue-600">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <div>
                  <h1 className="text-lg font-extrabold text-slate-900 tracking-tight leading-none">Operations Executive Dashboard</h1>
                  <p className="text-xs text-slate-500 font-medium mt-0.5">Monitor • Manage • Optimize</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <div className="relative">
                  <input 
                    type="text" 
                    placeholder="Search for items, brand, or location..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-72 px-3.5 py-2 pl-9 text-xs border border-slate-200 rounded-full bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-slate-700"
                  />
                  <svg className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>

                <div className="flex items-center space-x-1 px-3 py-2 bg-white border border-slate-200 rounded-xl shadow-sm text-xs font-semibold text-slate-700">
                  <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  <span>{getCurrentMonthYear()}</span>
                </div>
              </div>
            </header>

            {/* Dynamic Tab Body */}
            <div className="flex-1 overflow-auto px-6 pb-6 space-y-5">
              {activeTab === 'dashboard' && (
                <>
                  {/* Top 3 Stat Cards - Gradient Theme matching screenshot */}
                  <div className="grid grid-cols-3 gap-5">
                    {/* Total Managed Assets Card */}
                    <div className="p-5 rounded-2xl bg-gradient-to-r from-blue-600 to-blue-500 text-white shadow-lg shadow-blue-500/20 relative overflow-hidden flex justify-between items-center">
                      <div className="space-y-1 z-10">
                        <p className="text-xs font-semibold text-blue-100 uppercase tracking-wider">Total Managed Assets</p>
                        <div className="flex items-baseline gap-2">
                          <h2 className="text-4xl font-extrabold tracking-tight">{totalRecords || 76}</h2>
                          <span className="text-xs font-bold text-blue-200 flex items-center">↑ +5%</span>
                        </div>
                      </div>
                      <div className="p-3 bg-white/20 rounded-2xl backdrop-blur-md">
                        <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                      </div>
                    </div>

                    {/* This Month Entries Card */}
                    <div className="p-5 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-400 text-emerald-950 shadow-lg shadow-emerald-500/20 relative overflow-hidden flex justify-between items-center">
                      <div className="space-y-1 z-10">
                        <p className="text-xs font-bold text-emerald-900 uppercase tracking-wider">This Month Entries ({getCurrentMonthYear()})</p>
                        <div className="flex items-baseline gap-2">
                          <h2 className="text-4xl font-extrabold tracking-tight">{currentMonthRecords || 71}</h2>
                          <span className="text-xs font-bold text-emerald-800 flex items-center">↑ +12%</span>
                        </div>
                      </div>
                      <div className="p-3 bg-white/30 rounded-2xl backdrop-blur-md">
                        <svg className="w-8 h-8 text-emerald-950" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                      </div>
                    </div>

                    {/* Low Stock Alerts Card */}
                    <div className="p-5 rounded-2xl bg-gradient-to-r from-rose-500 to-red-400 text-white shadow-lg shadow-rose-500/20 relative overflow-hidden flex justify-between items-center">
                      <div className="space-y-1 z-10">
                        <p className="text-xs font-semibold text-rose-100 uppercase tracking-wider">Low Stock Alerts</p>
                        <div className="flex items-baseline gap-2">
                          <h2 className="text-4xl font-extrabold tracking-tight">{lowStockItems.length || 53}</h2>
                          <span className="text-xs font-bold text-rose-200 flex items-center">↑ +8%</span>
                        </div>
                      </div>
                      <div className="p-3 bg-white/20 rounded-2xl backdrop-blur-md">
                        <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                      </div>
                    </div>
                  </div>

                  {/* Visual Analytics Row: Donut Chart, Line Chart & Quick Actions */}
                  <div className="grid grid-cols-12 gap-5">
                    {/* Donut Chart: Asset Overview */}
                    <div className="col-span-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                      <h3 className="font-bold text-slate-900 text-sm">Asset Overview</h3>
                      <div className="relative h-44 my-2">
                        <canvas id="overviewDonutChart"></canvas>
                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                          <span className="text-2xl font-extrabold text-slate-900">{totalRecords || 76}</span>
                          <span className="text-[10px] text-slate-400 font-bold uppercase">Total</span>
                        </div>
                      </div>
                      <div className="space-y-1.5 pt-2 border-t border-slate-100 text-xs">
                        <div className="flex justify-between items-center font-semibold text-slate-700">
                          <span className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span> IT Equipment</span>
                          <span>40%</span>
                        </div>
                        <div className="flex justify-between items-center font-semibold text-slate-700">
                          <span className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Peripherals</span>
                          <span>35%</span>
                        </div>
                        <div className="flex justify-between items-center font-semibold text-slate-700">
                          <span className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full bg-purple-500"></span> Consumables</span>
                          <span>25%</span>
                        </div>
                      </div>
                    </div>

                    {/* Monthly Trend Line Chart */}
                    <div className="col-span-5 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                      <div className="flex justify-between items-center">
                        <h3 className="font-bold text-slate-900 text-sm">Monthly Trend</h3>
                        <div className="flex items-center space-x-3 text-xs font-semibold">
                          <span className="flex items-center gap-1 text-slate-600"><span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span> Entries</span>
                          <span className="flex items-center gap-1 text-slate-600"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Issued</span>
                        </div>
                      </div>
                      <div className="h-52 w-full mt-3">
                        <canvas id="trendLineChart"></canvas>
                      </div>
                    </div>

                    {/* Quick Actions Panel */}
                    <div className="col-span-3 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center justify-center text-center">
                      <h3 className="font-bold text-slate-900 text-sm mb-4">Quick Actions</h3>
                      <button 
                        onClick={() => handleOpenModal()} 
                        className="w-full py-6 bg-blue-50 hover:bg-blue-100/80 text-blue-600 border border-blue-200 rounded-2xl transition flex flex-col items-center justify-center gap-2 group shadow-sm"
                      >
                        <div className="p-3 bg-blue-600 text-white rounded-full group-hover:scale-110 transition duration-200">
                          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        </div>
                        <span className="font-bold text-xs text-slate-800">Add Asset</span>
                      </button>
                    </div>
                  </div>
                </>
              )}

              {/* Stock Register View */}
              {activeTab === 'inventory' && (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between">
                  <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50/50">
                    <h3 className="font-bold text-slate-900 text-sm uppercase tracking-wider">1. Stock Register Ledger</h3>
                    {currentRights.canAdd && (
                      <button onClick={() => handleOpenModal()} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-sm transition">
                        + New Asset Entry
                      </button>
                    )}
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-[11px] text-left border-collapse whitespace-nowrap table-compact">
                      <thead className="bg-slate-900 text-slate-200 font-bold border-b border-slate-800 text-[10px] uppercase tracking-wider">
                        <tr>
                          <th className="border-r border-slate-800 text-center w-8">#</th>
                          <th className="border-r border-slate-800">Stock Group</th>
                          <th className="border-r border-slate-800">Asset Particulars (Click to Edit)</th>
                          <th className="border-r border-slate-800 text-blue-400">Brand</th>
                          <th className="border-r border-slate-800">Serial / Tag</th>
                          <th className="border-r border-slate-800 text-emerald-400">Month</th>
                          <th className="border-r border-slate-800">Vendor</th>
                          <th className="border-r border-slate-800 text-center bg-slate-800">Op.</th>
                          <th className="border-r border-slate-800 text-center bg-slate-800">Purch.</th>
                          <th className="border-r border-slate-800 text-center bg-emerald-900/60 text-emerald-300">Issued</th>
                          <th className="border-r border-slate-800 text-center bg-rose-900/60 text-rose-300">Short</th>
                          <th className="border-r border-slate-800 text-center bg-blue-900/60 text-blue-300 font-bold">Bal</th>
                          <th className="border-r border-slate-800 text-center bg-emerald-950 text-emerald-400 font-bold">Phy</th>
                          <th className="border-r border-slate-800 text-center bg-slate-800">Dead</th>
                          <th className="border-r border-slate-800">Category</th>
                          <th className="border-r border-slate-800">Location</th>
                          <th className="text-center">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 text-slate-700">
                        {currentItems.length === 0 ? (
                          <tr>
                            <td colSpan="17" className="p-8 text-center text-slate-400 font-medium">
                              {loading ? 'Cloud database syncing records...' : 'No inventory records found.'}
                            </td>
                          </tr>
                        ) : (
                          currentItems.map((item, index) => {
                            const serialNumber = indexOfFirstItem + index + 1;
                            const balanceStock = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
                            const physicalStock = balanceStock - Number(item.shortItems || 0) - Number(item.deadItems || 0);
                            const isLowStock = physicalStock <= Number(item.minAlert || 2);
                            const isJustAdded = item.firebaseKey === recentlyAddedId;

                            return (
                              <tr key={item.firebaseKey || index} className={`hover:bg-slate-50 transition ${isJustAdded ? 'bg-emerald-50/70 border-l-2 border-l-emerald-500' : isLowStock ? 'bg-rose-50/50' : index % 2 === 0 ? 'bg-white' : 'bg-slate-50/40'}`}>
                                <td className="border-r border-slate-200 font-semibold text-slate-400 text-center">{serialNumber}</td>
                                <td className="border-r border-slate-200 font-semibold text-slate-800">{item.group}</td>
                                <td className="border-r border-slate-200 font-medium">
                                  {currentRights.canEdit ? (
                                    <button 
                                      onClick={() => handleOpenModal(item)} 
                                      className="text-blue-600 hover:text-blue-800 hover:underline font-semibold text-left cursor-pointer"
                                    >
                                      {item.particulars}
                                    </button>
                                  ) : (
                                    <span>{item.particulars}</span>
                                  )}
                                </td>
                                <td className="border-r border-slate-200 font-bold text-blue-700">{item.brand || '-'}</td>
                                <td className="border-r border-slate-200 font-mono text-[10px] text-slate-600">{item.serialNo || '-'}</td>
                                <td className="border-r border-slate-200 font-medium text-slate-600">{item.entryMonth || getCurrentMonthYear()}</td>
                                <td className="border-r border-slate-200 text-slate-500 max-w-[100px] truncate">{item.vendor || '-'}</td>
                                <td className="border-r border-slate-200 text-center font-medium bg-amber-50/20">{item.openingQty || 0}</td>
                                <td className="border-r border-slate-200 text-center font-medium bg-orange-50/20">{item.newPurchase || 0}</td>
                                <td className="border-r border-slate-200 text-center font-bold text-emerald-700 bg-emerald-50/30">{item.issueItems || 0}</td>
                                <td className="border-r border-slate-200 text-center font-bold text-rose-600 bg-rose-50/20">{item.shortItems || 0}</td>
                                <td className="border-r border-slate-200 text-center bg-blue-50/40 font-bold text-blue-800">{balanceStock}</td>
                                <td className="border-r border-slate-200 text-center bg-emerald-100/60 font-extrabold text-emerald-900">{physicalStock}</td>
                                <td className="border-r border-slate-200 text-center text-slate-500">{item.deadItems || 0}</td>
                                <td className="border-r border-slate-200">
                                  <span className={`px-1.5 py-0.5 text-[9px] font-bold rounded ${item.category === 'Consumable' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}`}>
                                    {item.category}
                                  </span>
                                </td>
                                <td className="border-r border-slate-200 max-w-[110px] truncate text-slate-500">{item.location || '-'}</td>
                                <td className="text-center space-x-1.5 font-bold">
                                  <button onClick={() => handleOpenIssueModal(item)} className="text-emerald-700 hover:text-emerald-800">Issue</button>
                                  <button onClick={() => handlePrintGatePass(item)} className="text-purple-700 hover:text-purple-800">Slip</button>
                                  {currentRights.canDelete && (
                                    <button onClick={() => handleDeleteAsset(item)} className="text-rose-700 hover:text-rose-800">Del</button>
                                  )}
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>

                  <div className="px-4 py-2.5 border-t border-slate-200 bg-slate-50 flex items-center justify-between text-xs text-slate-600">
                    <div className="flex items-center space-x-2">
                      <span>Showing <strong>{filteredAssets.length === 0 ? 0 : indexOfFirstItem + 1}</strong> to <strong>{Math.min(indexOfLastItem, filteredAssets.length)}</strong> of <strong>{filteredAssets.length}</strong> Entries</span>
                      <span className="text-slate-300">|</span>
                      <label className="flex items-center gap-1 font-semibold">
                        Rows per view:
                        <select 
                          value={itemsPerPage} 
                          onChange={(e) => { setItemsPerPage(Number(e.target.value)); setCurrentPage(1); }}
                          className="px-1.5 py-0.5 bg-white border border-slate-300 rounded font-bold text-slate-800 outline-none"
                        >
                          <option value="10">10</option>
                          <option value="25">25</option>
                          <option value="50">50</option>
                          <option value="100">100</option>
                        </select>
                      </label>
                    </div>

                    <div className="flex items-center space-x-1">
                      <button 
                        disabled={currentPage === 1}
                        onClick={() => setCurrentPage(prev => prev - 1)}
                        className="px-2.5 py-1 border border-slate-300 rounded-lg bg-white shadow-sm hover:bg-slate-100 disabled:opacity-40 font-semibold"
                      >
                        ◀ Prev
                      </button>
                      <span className="px-2.5 py-1 font-bold text-slate-700 bg-white border border-slate-300 rounded-lg">
                        {currentPage} / {totalPages}
                      </span>
                      <button 
                        disabled={currentPage === totalPages}
                        onClick={() => setCurrentPage(prev => prev + 1)}
                        className="px-2.5 py-1 border border-slate-300 rounded-lg bg-white shadow-sm hover:bg-slate-100 disabled:opacity-40 font-semibold"
                      >
                        Next ▶
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* Add / Edit Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto border border-slate-200">
                <h3 className="text-sm font-bold text-slate-900 mb-4 border-b border-slate-200 pb-2">
                  {editingAsset ? 'Edit Stock Register Record' : 'Register New Asset Entry'}
                </h3>
                <form onSubmit={handleSaveAsset} className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Stock Group</label>
                    <input type="text" value={formData.group} onChange={(e) => setFormData({...formData, group: e.target.value})} placeholder="e.g. Mouse, Keyboard" className="w-full p-2 border border-slate-300 rounded-xl outline-none focus:ring-1 focus:ring-blue-600" required />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Asset Particulars</label>
                    <input type="text" value={formData.particulars} onChange={(e) => setFormData({...formData, particulars: e.target.value})} placeholder="e.g. USB Mouse-HP" className="w-full p-2 border border-slate-300 rounded-xl outline-none focus:ring-1 focus:ring-blue-600" required />
                  </div>
                  <div>
                    <label className="block font-semibold text-blue-700 mb-1">Brand Name</label>
                    <input type="text" value={formData.brand} onChange={(e) => setFormData({...formData, brand: e.target.value})} placeholder="e.g. HP, Dell" className="w-full p-2 border border-blue-200 rounded-xl bg-blue-50/20 outline-none" />
                  </div>
                  <div>
                    <label className="block font-semibold text-emerald-700 mb-1">Entry Period</label>
                    <input type="text" value={formData.entryMonth} onChange={(e) => setFormData({...formData, entryMonth: e.target.value})} className="w-full p-2 border border-emerald-200 rounded-xl bg-emerald-50/30 font-semibold text-emerald-800 outline-none" required />
                  </div>
                  <div className="col-span-2 flex justify-end space-x-2 pt-4 border-t border-slate-200">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-xl text-slate-600 font-semibold hover:bg-slate-50">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold shadow-md shadow-blue-500/20">Save Asset Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
