<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    tailwind.config = {

        extend: {

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }

      body * { visibility: hidden; }
      #printable-slip, #printable-slip * { visibility: visible; }
      #printable-slip { position: fixed; left: 0; top: 0; width: 100%; margin: 0; padding: 24px; background: white; color: black; box-shadow: none !important; border: none !important; }
      .no-print { display: none !important; }

</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-brand-600 selection:text-white">
  <div id="root">
    <div class="flex h-screen items-center justify-center bg-slate-900 text-white font-sans">
      <div class="text-center space-y-3">
        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <div class="text-sm font-semibold tracking-wider text-slate-300">INITIALIZING AUTO-CALCULATED INVENTORY ENGINE...</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DB_BASE = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com";
    const FIREBASE_DB_URL = `${DB_BASE}/assets.json`;
    const FIREBASE_TEMP_URL = `${DB_BASE}/temp_dispatches.json`;
    const FIREBASE_PM_URL = `${DB_BASE}/pm_schedules.json`;
    const FIREBASE_USERS_URL = `${DB_BASE}/system_users.json`;
    const FIREBASE_PM_LOGS_URL = `${DB_BASE}/pm_audit_logs.json`;
    const FIREBASE_HISTORY_URL = `${DB_BASE}/stock_history.json`;
    const FIREBASE_MASTER_URL = `${DB_BASE}/master_data.json`;
    const FIREBASE_AUDIT_URL = `${DB_BASE}/audit_log.json`;

    const Icons = {
      Stock: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>,
      Exchange: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>,
      Settings: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      Report: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>,
      Shield: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>,
      Building: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>,
      Users: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      Database: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/></svg>,
      Search: () => <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
      Edit: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>,
      Trash: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Eye: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>,
      Download: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
      Upload: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
      Refresh: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
      Check: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>,
      SignOut: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    };

    function exportToExcel(filename, rows) {
      if (!rows || !rows.length) return;
      const cleanRows = rows.map(r => ({
        "Group": r.group, "Particulars": r.particulars, "Brand": r.brand, "Serial No": r.serialNo,
        "Cable Length (m)": r.cableLength, "Unit": r.measurementUnit, "Opening Qty": r.openingQty,
        "New Purchase": r.newPurchase, "Issued Items": r.issueItems,
        "Balance Stock": (Number(r.openingQty || 0) + Number(r.newPurchase || 0)) - (Number(r.issueItems || 0) + Number(r.shortItems || 0) + Number(r.deadItems || 0)),
        "Short Items": r.shortItems, "Dead Items": r.deadItems, "Min Stock Alert": r.minAlert || 2,
        "Category": r.category, "Location": r.location, "Last Updated": r.lastUpdated
      }));
      const worksheet = XLSX.utils.json_to_sheet(cleanRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Stock Register");
      XLSX.writeFile(workbook, filename.endsWith('.xlsx') ? filename : filename + '.xlsx');
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [loggedInUser, setLoggedInUser] = useState(null);
      const [usernameInput, setUsernameInput] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });

      const [activeTab, setActiveTab] = useState('inventory');
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState('Just now');

      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('All');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');
      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);
      
      const [assets, setAssets] = useState([]);
      const [stockHistory, setStockHistory] = useState([]);
      const [loading, setLoading] = useState(true);

      const [masterData, setMasterData] = useState({ groups: [], locations: [], brands: [], units: [], itemNames: [], departments: [] });
      const [currentMasterType, setCurrentMasterType] = useState('groups');
      const [masterForm, setMasterForm] = useState({ name: '' });
      const [auditLogs, setAuditLogs] = useState([]);

      const [sqlDb, setSqlDb] = useState(null);
      const [sqlQuery, setSqlQuery] = useState('SELECT "group", COUNT(*) as TotalItems FROM assets GROUP BY "group";');
      const [sqlResult, setSqlResult] = useState(null);
      const [sqlError, setSqlError] = useState('');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [viewModalItem, setViewModalItem] = useState(null);

      const fileInputRef = useRef(null);

      const [tempDispatches, setTempDispatches] = useState([]);
      const [isTempModalOpen, setIsTempModalOpen] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      
      const [tempForm, setTempForm] = useState({ assetName: '', assetTagNo: '', department: '', receiver: '', quantity: 1, status: 'Temporary Given' });

      const sampleFallbackUsers = [
        { id: 1, name: 'Super Admin', username: 'admin', pin: '1234', role: 'Super Administrator', department: 'IT Management', status: 'Active' },
        { id: 2, name: 'IT Inventory Desk', username: 'store', pin: '5678', role: 'Store Keeper', department: 'IT Stores', status: 'Active' },
        { id: 3, name: 'Dr. Alok Sharma', username: 'alok', pin: '1122', role: 'Department Head', department: 'General Registration', status: 'Active' }
      ];
      const [users, setUsers] = useState(sampleFallbackUsers);

      const showToast = (msg, type = 'info') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3500);
      };

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const getFormattedDateTime = () => {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
      };

      const fetchAllData = async (silent = true) => {
        if (!silent) setIsSyncing(true);
        try {
          const [resAssets, resTemp, resUsers, resHist, resMaster, resAudit] = await Promise.allSettled([
            fetch(FIREBASE_DB_URL).then(r => r.json()),
            fetch(FIREBASE_TEMP_URL).then(r => r.json()),
            fetch(FIREBASE_USERS_URL).then(r => r.json()),
            fetch(FIREBASE_HISTORY_URL).then(r => r.json()),
            fetch(FIREBASE_MASTER_URL).then(r => r.json()),
            fetch(FIREBASE_AUDIT_URL).then(r => r.json())
          ]);

          if (resAssets.status === 'fulfilled' && resAssets.value) {
            setAssets(Object.keys(resAssets.value).map(k => ({ ...resAssets.value[k], firebaseKey: k })));
          }
          if (resHist.status === 'fulfilled' && resHist.value) {
            setStockHistory(Object.keys(resHist.value).map(k => ({ ...resHist.value[k], firebaseKey: k })));
          }
          if (resTemp.status === 'fulfilled' && resTemp.value) {
            setTempDispatches(Object.keys(resTemp.value).map(k => ({ ...resTemp.value[k], firebaseKey: k })));
          }
          if (resUsers.status === 'fulfilled' && resUsers.value) {
            const loadedUsers = Object.keys(resUsers.value).map(k => ({ ...resUsers.value[k], firebaseKey: k }));
            setUsers(loadedUsers.length > 0 ? loadedUsers : sampleFallbackUsers);
          }

          if (resMaster.status === 'fulfilled' && resMaster.value) {
            setMasterData(resMaster.value);
          } else {
            const defaultMaster = { groups: [{name: 'IT Peripherals'}, {name: 'Cable'}], locations: [{name: 'Server Room'}, {name: 'A Block'}], brands: [{name: 'Dell'}, {name: 'HP'}], units: [{name: 'Piece'}, {name: 'Meter'}], itemNames: [{name: 'Mouse'}, {name: 'Keyboard'}], departments: [{name: 'IT'}, {name: 'HR'}] };
            setMasterData(defaultMaster);
            await fetch(FIREBASE_MASTER_URL, { method: 'PUT', body: JSON.stringify(defaultMaster) });
          }

          if (resAudit.status === 'fulfilled' && resAudit.value) {
            setAuditLogs(Object.values(resAudit.value).reverse().slice(0, 50));
          }

          const now = new Date();
          setLastSyncTime(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`);
        } catch (e) {
          console.error("Data fetch error", e);
        } finally {
          setLoading(false);
          if (!silent) { setIsSyncing(false); showToast("Database synchronization complete!", "success"); }
        }
      };

      useEffect(() => {
        fetchAllData(true);
        const intervalId = setInterval(() => { if (!document.hidden) fetchAllData(true); }, 5000);
        return () => clearInterval(intervalId);
      }, []);

      useEffect(() => {
        if (!loading && window.initSqlJs && !sqlDb) {
          window.initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` })
            .then(SQL => { setSqlDb(new SQL.Database()); });
        }
      }, [loading, sqlDb]);

      useEffect(() => {
        if (sqlDb && assets.length > 0) {
          sqlDb.run("DROP TABLE IF EXISTS assets;");
          sqlDb.run(`CREATE TABLE assets (id INTEGER, "group" TEXT, particulars TEXT, brand TEXT, location TEXT, openingQty INTEGER, newPurchase INTEGER, issueItems INTEGER, shortItems INTEGER, deadItems INTEGER);`);
          assets.forEach(a => {
            sqlDb.run(`INSERT INTO assets VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`, [
              a.id || 0, a.group || '', a.particulars || '', a.brand || '', a.location || '', 
              a.openingQty || 0, a.newPurchase || 0, a.issueItems || 0, a.shortItems || 0, a.deadItems || 0
            ]);
          });
        }
      }, [sqlDb, assets]);

      const saveAuditLog = async (action, beforeData, afterData) => {
        const log = { module: 'assets', action, before: beforeData, after: afterData, timestamp: getFormattedDateTime() };
        await fetch(FIREBASE_AUDIT_URL, { method: 'POST', body: JSON.stringify(log) });
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u => 
          (String(u.username).trim().toLowerCase() === String(usernameInput).trim().toLowerCase() || String(u.name).trim().toLowerCase() === String(usernameInput).trim().toLowerCase()) && 
          String(u.pin).trim() === String(pinInput).trim() && u.status === 'Active'
        );
        if (matched) { setIsLoggedIn(true); setLoggedInUser(matched); setLoginError(''); showToast(`Authenticated as ${matched.name}`, "success"); }
        else { setLoginError('Invalid Username or Security PIN code.'); }
      };

      const [formData, setFormData] = useState({
        group: '', particulars: '', brand: '', customBrand: '', serialNo: '', vendor: '', invoiceNo: '', warranty: '',
        cableLength: '', measurementUnit: 'Piece', openingQty: 0, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0,
        minAlert: 2, category: 'Consumable', location: '', entryMonth: getCurrentMonthYear(), lastUpdated: getFormattedDateTime()
      });

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        const timestamped = getFormattedDateTime();
        const finalBrand = formData.brand === 'Other' ? formData.customBrand : formData.brand;

        if (editingAsset) {
          const updated = { ...editingAsset, ...formData, brand: finalBrand, lastUpdated: timestamped };
          try {
            if (editingAsset.firebaseKey) {
              await fetch(`${DB_BASE}/assets/${editingAsset.firebaseKey}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updated) });
            }
            await saveAuditLog('UPDATE', editingAsset, updated);
            setAssets(assets.map(a => (a.id === editingAsset.id || a.firebaseKey === editingAsset.firebaseKey) ? updated : a));
            showToast("Asset updated & safely backed up!", "success");
          } catch(err) { showToast("Error updating record.", "error"); }
        } else {
          const newAsset = { id: Date.now(), ...formData, brand: finalBrand, lastUpdated: timestamped };
          try {
            await fetch(FIREBASE_DB_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newAsset) });
            await saveAuditLog('CREATE', null, newAsset);
            const res = await fetch(FIREBASE_DB_URL);
            const data = await res.json();
            if (data) setAssets(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
            showToast("New asset registered!", "success");
          } catch(err) { setAssets([newAsset, ...assets]); showToast("Asset saved locally.", "info"); }
        }
        setIsModalOpen(false);
        setEditingAsset(null);
      };

      const handleDeleteAsset = async (item) => {
        if (window.confirm(`Remove "${item.particulars}"? (Data will be logged in Data Safety)`)) {
          try {
            if (item.firebaseKey) {
              await fetch(`${DB_BASE}/assets/${item.firebaseKey}.json`, { method: 'DELETE' });
            }
            await saveAuditLog('DELETE', item, null);
            setAssets(assets.filter(a => a.id !== item.id && a.firebaseKey !== item.firebaseKey));
            showToast("Asset deleted. Backup kept in Data Safety.", "info");
          } catch(err) { showToast("Failed to delete record.", "error"); }
        }
      };

      const handleAddMaster = async (e) => {
        e.preventDefault();
        if(!masterForm.name) return;
        const newEntry = { id: Date.now(), name: masterForm.name };
        const currentList = masterData[currentMasterType] || [];
        const updatedData = { ...masterData, [currentMasterType]: [...currentList, newEntry] };
        await fetch(FIREBASE_MASTER_URL, { method: 'PUT', body: JSON.stringify(updatedData) });
        setMasterData(updatedData);
        setMasterForm({ name: '' });
        showToast(`Added to ${currentMasterType}`, "success");
      };

      const runSqlQuery = () => {
        if (!sqlDb) return showToast("SQL Engine loading...", "info");
        setSqlError('');
        try {
          const res = sqlDb.exec(sqlQuery);
          if (res.length > 0) setSqlResult({ cols: res[0].columns, vals: res[0].values });

                      <div>
                        <label className="block font-semibold text-slate-600 mb-1">Brand Name *</label>
                        <select value={formData.brand} onChange={(e) => setFormData({ ...formData, brand: e.target.value })} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-semibold text-slate-900">
                          <option value="">Select Brand</option>
                          {(masterData.brands || []).map((b, i) => <option key={i} value={b.name}>{b.name}</option>)}
                          <option value="Other">Other (Custom)</option>
                        </select>
                      </div>
                      {formData.brand === 'Other' && (
                        <div><label className="block font-semibold text-slate-600 mb-1">Custom Brand *</label><input type="text" required placeholder="Brand Name" value={formData.customBrand} onChange={(e) => setFormData({ ...formData, customBrand: e.target.value })} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 font-semibold" /></div>
                      )}
                      <div>
                        <label className="block font-semibold text-slate-600 mb-1">Category *</label>
                        <select value={formData.category} onChange={(e) => setFormData({ ...formData, category: e.target.value })} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-semibold text-slate-900">
                          <option value="Consumable">Consumable</option><option value="Non-Consumable">Non-Consumable</option><option value="Fixed Assets">Fixed Assets</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-semibold text-slate-600 mb-1">Assigned Location</label>
                        <select value={formData.location} onChange={(e) => setFormData({ ...formData, location: e.target.value })} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-semibold text-slate-900">
                          <option value="">Select Location</option>
                          {(masterData.locations || []).map((l, i) => <option key={i} value={l.name}>{l.name}</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="grid grid-cols-4 gap-3">
                      <div><label className="block font-semibold text-slate-600 mb-1">Serial / Asset Tag</label><input type="text" placeholder="e.g. HD-3M-01" value={formData.serialNo} onChange={(e) => setFormData({ ...formData, serialNo: e.target.value })} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono text-slate-900" /></div>
                      <div><label className="block font-semibold text-slate-600 mb-1">Cable Length (m)</label><input type="text" placeholder="e.g. 3.0" value={formData.cableLength} onChange={(e) => setFormData({ ...formData, cableLength: e.target.value })} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono text-slate-900" /></div>
                      <div>
                        <label className="block font-semibold text-slate-600 mb-1">Unit</label>
                        <select value={formData.measurementUnit} onChange={(e) => setFormData({ ...formData, measurementUnit: e.target.value })} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl outline-none font-semibold text-slate-900">
                          {(masterData.units || []).map((u, i) => <option key={i} value={u.name}>{u.name}</option>)}
                        </select>
                      </div>
                      <div><label className="block font-semibold text-slate-600 mb-1">Min Alert Qty *</label><input type="number" min="0" required value={formData.minAlert} onChange={(e) => setFormData({ ...formData, minAlert: Number(e.target.value) })} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono text-slate-900 font-bold" /></div>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                      <div className="text-[11px] font-extrabold text-brand-600 uppercase">Formula: Net Balance = (Opening + New Purchase) - (Issued + Short + Dead)</div>
                      <div className="grid grid-cols-5 gap-3">
                        <div><label className="block font-semibold text-slate-600 mb-1">Opening Qty</label><input type="number" min="0" value={formData.openingQty} onChange={(e) => setFormData({ ...formData, openingQty: Number(e.target.value) })} className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-slate-900" /></div>
                        <div><label className="block font-semibold text-brand-600 mb-1">New Purchase (+)</label><input type="number" min="0" value={formData.newPurchase} onChange={(e) => setFormData({ ...formData, newPurchase: Number(e.target.value) })} className="w-full p-2 bg-white border border-brand-300 rounded-lg font-mono font-bold text-brand-600" /></div>
                        <div><label className="block font-semibold text-amber-600 mb-1">Issued / HR (-)</label><input type="number" min="0" value={formData.issueItems} onChange={(e) => setFormData({ ...formData, issueItems: Number(e.target.value) })} className="w-full p-2 bg-white border border-amber-300 rounded-lg font-mono font-bold text-amber-600" /></div>
                        <div><label className="block font-semibold text-slate-600 mb-1">Short</label><input type="number" min="0" value={formData.shortItems} onChange={(e) => setFormData({ ...formData, shortItems: Number(e.target.value) })} className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-rose-600" /></div>
                        <div><label className="block font-semibold text-slate-600 mb-1">Dead</label><input type="number" min="0" value={formData.deadItems} onChange={(e) => setFormData({ ...formData, deadItems: Number(e.target.value) })} className="w-full p-2 bg-white border border-slate-300 rounded-lg font-mono font-bold text-slate-400" /></div>
                      </div>
                    </div>
                    <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                      <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-100 transition">Cancel</button>
                      <button type="submit" className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md transition">{editingAsset ? 'Update Stock & Record History' : 'Save New Purchase'}</button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
