<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #090d16 0%, #111827 50%, #030712 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading IT Asset Portal...</div>
        <div style="font-size: 12px; color: #94a3b8;">Establishing secure cloud session</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";
    const FIREBASE_TEMP_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/temp_dispatches.json";
    const FIREBASE_PM_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/pm_schedules.json";
    const FIREBASE_USERS_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/system_users.json";

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [viewModalItem, setViewModalItem] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      // Temporary Asset Deployment state synced with Firebase
      const [tempDispatches, setTempDispatches] = useState([]);
      const [isTempModalOpen, setIsTempModalOpen] = useState(false);
      const [editingTempItem, setEditingTempItem] = useState(null);
      const [tempForm, setTempForm] = useState({ assetName: '', assetTagNo: '', department: '', receiver: '', quantity: 1 });

      // Preventive Maintenance (PM) 12-Month Chart Plan state
      const [pmSchedules, setPmSchedules] = useState([]);
      const [isPmModalOpen, setIsPmModalOpen] = useState(false);
      const [editingPmItem, setEditingPmItem] = useState(null);
      const [pmSelectedMonth, setPmSelectedMonth] = useState('Jan');
      const [pmSelectedSlot, setPmSelectedSlot] = useState('01 to 10 January');
      const [pmForm, setPmForm] = useState({ equipmentName: '', maintenanceType: '', scheduledDate: '', technician: '', remarks: '', location: '', targetMonth: 'Jan', slotRange: '01 to 10 January' });

      const monthsList = [
        { code: 'Apr', name: 'April' },
        { code: 'May', name: 'May' },
        { code: 'Jun', name: 'June' },
        { code: 'Jul', name: 'July' },
        { code: 'Aug', name: 'August' },
        { code: 'Sep', name: 'September' },
        { code: 'Oct', name: 'October' },
        { code: 'Nov', name: 'November' },
        { code: 'Dec', name: 'December' },
        { code: 'Jan', name: 'January', slots: ['01 to 10 January', '11 to 20 January', '21 to 31 January'] },
        { code: 'Feb', name: 'February', slots: ['01 to 10 February', '11 to 20 February', '21 to 28 February'] },
        { code: 'Mar', name: 'March', slots: ['01 to 10 March', '11 to 20 March', '21 to 31 March'] }
      ];

      const sampleFallbackUsers = [
        { id: 1, name: 'Super Admin', pin: '1234', role: 'Super Administrator', status: 'Active' },
        { id: 2, name: 'IT Inventory Desk', pin: '5678', role: 'Store Keeper', status: 'Active' }
      ];

      const [users, setUsers] = useState(sampleFallbackUsers);
      const [newUserName, setNewUserName] = useState('');
      const [newUserPin, setNewUserPin] = useState('');
      const [newUserRole, setNewUserRole] = useState('Store Keeper');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const getFormattedDateTime = () => {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
      };

      const sampleFallbackAssets = [
        { id: 101, group: 'IT Peripherals', particulars: 'Optical Mouse USB', brand: 'Honeywell', serialNo: 'HW-MS-9981', cableLength: '1.5', measurementUnit: 'Meter', openingQty: 25, newPurchase: 10, issueItems: 8, shortItems: 0, deadItems: 1, category: 'Consumable', location: 'A Block', minAlert: 5, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026, 10:15 AM' },
        { id: 102, group: 'Hardware', particulars: 'Dell OptiPlex Core i5', brand: 'Dell', serialNo: 'DL-CPU-8821', cableLength: '', measurementUnit: 'Piece', openingQty: 10, newPurchase: 2, issueItems: 5, shortItems: 0, deadItems: 0, category: 'Fixed Assets', location: 'Server Room', minAlert: 2, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026, 11:20 AM' },
        { id: 103, group: 'Networking', particulars: 'Cisco 24-Port Switch', brand: 'Cisco', serialNo: 'CS-SW-3321', cableLength: '', measurementUnit: 'Piece', openingQty: 5, newPurchase: 1, issueItems: 4, shortItems: 0, deadItems: 0, category: 'Fixed Assets', location: 'Server Room', minAlert: 1, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026, 11:45 AM' }
      ];

      // Safe Data Fetching with Error Catching & Auto-Sync
      useEffect(() => {
        let isMounted = true;

        const fetchAllData = async () => {
          try {
            const resAssets = await fetch(FIREBASE_DB_URL);
            const dataAssets = await resAssets.json();
            if (isMounted) {
              if (dataAssets && typeof dataAssets === 'object') {
                const loaded = Object.keys(dataAssets).map(k => ({ ...dataAssets[k], firebaseKey: k }));
                setAssets(loaded.length > 0 ? loaded : sampleFallbackAssets);
              } else {
                setAssets(sampleFallbackAssets);
              }
              setLoading(false);
            }
          } catch(e) {
            if (isMounted) {
              setAssets(sampleFallbackAssets);
              setLoading(false);
            }
          }

          try {
            const resTemp = await fetch(FIREBASE_TEMP_URL);
            const dataTemp = await resTemp.json();
            if (isMounted && dataTemp && typeof dataTemp === 'object') {
              setTempDispatches(Object.keys(dataTemp).map(k => ({ ...dataTemp[k], firebaseKey: k })));
            }
          } catch(e) {}

          try {
            const resPm = await fetch(FIREBASE_PM_URL);
            const dataPm = await resPm.json();
            if (isMounted && dataPm && typeof dataPm === 'object') {
              setPmSchedules(Object.keys(dataPm).map(k => ({ ...dataPm[k], firebaseKey: k })));
            }
          } catch(e) {}

          try {
            const resUsers = await fetch(FIREBASE_USERS_URL);
            const dataUsers = await resUsers.json();
            if (isMounted && dataUsers && typeof dataUsers === 'object') {
              const remoteUsers = Object.keys(dataUsers).map(k => ({ ...dataUsers[k], firebaseKey: k }));
              if (remoteUsers.length > 0) setUsers(remoteUsers);
            }
          } catch(e) {}
        };

        fetchAllData();
        const intervalId = setInterval(fetchAllData, 3000);

        return () => {
          isMounted = false;
          clearInterval(intervalId);
        };
      }, []);

      const filteredPmSchedules = pmSchedules.filter(item => {
        const matchesMonth = (item.targetMonth || '').toLowerCase() === pmSelectedMonth.toLowerCase();
        const matchesSlot = !pmSelectedSlot || (item.slotRange || '').toLowerCase() === pmSelectedSlot.toLowerCase();
        return matchesMonth && matchesSlot;
      });

      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u => String(u.pin) === String(pinInput) && u.status === 'Active');
        if (matched) {
          setIsLoggedIn(true);
          setLoginError('');
          showToast(`Welcome back, ${matched.name}!`);
        } else {
          setLoginError('Invalid Security PIN or Inactive User.');
        }
      };

      const [formData, setFormData] = useState({
        group: 'IT Peripherals',
        particulars: '',
        brand: 'Honeywell',
        customBrand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        cableLength: '',
        measurementUnit: 'Piece',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear(),
        lastUpdated: getFormattedDateTime()
      });

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        const timestamped = getFormattedDateTime();
        const finalBrand = formData.brand === 'Other' ? formData.customBrand : formData.brand;

        if (editingAsset) {
          const updated = {
            ...editingAsset,
            ...formData,
            brand: finalBrand,
            lastUpdated: timestamped
          };
          try {
            if (editingAsset.firebaseKey) {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updated)
              });
            }
            setAssets(assets.map(a => (a.id === editingAsset.id || a.firebaseKey === editingAsset.firebaseKey) ? updated : a));
            showToast("Asset record successfully updated!");
          } catch(err) {
            showToast("Error updating record in database.");
          }
        } else {
          const newAsset = {
            id: Date.now(),
            ...formData,
            brand: finalBrand,
            lastUpdated: timestamped
          };
          try {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newAsset)
            });
            const res = await fetch(FIREBASE_DB_URL);
            const data = await res.json();
            if (data) setAssets(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
            showToast("New asset registered successfully!");
          } catch(err) {
            setAssets([newAsset, ...assets]);
            showToast("Asset added locally!");
          }
        }

        setIsModalOpen(false);
        setEditingAsset(null);
      };

      const handleDeleteAsset = async (item) => {
        if (window.confirm(`Are you sure you want to delete "${item.particulars}"?`)) {
          try {
            if (item.firebaseKey) {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${item.firebaseKey}.json`, {
                method: 'DELETE'
              });
            }
            setAssets(assets.filter(a => a.id !== item.id && a.firebaseKey !== item.firebaseKey));
            showToast("Asset record deleted.");
          } catch(err) {
            showToast("Error deleting record.");
          }
        }
      };

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.serialNo || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.location || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = !locationFilter || (item.location || '').toLowerCase() === locationFilter.toLowerCase();
        const matchesGroup = !selectedGroupFilter || (item.group || '').toLowerCase() === selectedGroupFilter.toLowerCase();
        return matchesSearch && matchesLocation && matchesGroup;
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const paginatedAssets = filteredAssets.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-slate-800 space-y-6">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-blue-500/30">IT</div>
                <h1 className="text-xl font-extrabold text-slate-900 tracking-tight">IT Asset & Inventory Portal</h1>
                <p className="text-xs text-slate-500 font-medium">Select your profile and enter your 4-digit Security PIN</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Select User Profile</label>
                  <select 
                    onChange={(e) => {
                      const sel = users.find(u => String(u.pin) === String(e.target.value));
                      if (sel) setPinInput(sel.pin);
                    }}
                    className="w-full p-3 border border-slate-300 rounded-xl text-xs font-bold outline-none bg-slate-50"
                  >
                    <option value="">-- Choose Profile --</option>
                    {users.map(u => (
                      <option key={u.firebaseKey || u.id} value={u.pin}>{u.name} ({u.role}) - PIN: {u.pin}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Security PIN</label>
                  <input 
                    type="password"
                    maxLength="4"
                    placeholder="••••"
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3 border border-slate-300 rounded-xl text-center text-xl font-mono tracking-widest outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                {loginError && <div className="p-3 bg-rose-50 text-rose-700 text-xs rounded-xl font-bold border border-rose-200">{loginError}</div>}

                <button 
                  type="submit"
                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-extrabold shadow-lg shadow-blue-600/30 cursor-pointer transition"
                >
                  Authenticate & Login
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-slate-100 overflow-hidden text-slate-800">
          
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl border border-slate-800 text-xs font-bold flex items-center gap-3 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
              {toastMsg}
            </div>
          )}

          <aside className="w-64 neon-sidebar text-white flex flex-col justify-between p-5 border-r border-slate-800">
            <div className="space-y-6">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-black text-white text-lg shadow-md shadow-blue-500/40">IT</div>
                <div>
                  <h2 className="text-xs font-extrabold tracking-wider uppercase">Asset Management</h2>
                  <p className="text-[10px] text-slate-400 font-mono">Enterprise v4.8</p>
                </div>
              </div>

              <nav className="space-y-1.5 text-xs font-semibold">
                <button
                  onClick={() => setActiveTab('inventory')}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition cursor-pointer ${
                    activeTab === 'inventory' ? 'active-neon-btn text-white font-bold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'
                  }`}
                >
                  Stock Register
                </button>

                <button
                  onClick={() => setActiveTab('temp_deploy')}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition cursor-pointer ${
                    activeTab === 'temp_deploy' ? 'active-neon-btn text-white font-bold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'
                  }`}
                >
                  Temporary Deployment
                </button>

                <button
                  onClick={() => setActiveTab('preventive_maint')}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition cursor-pointer ${
                    activeTab === 'preventive_maint' ? 'active-neon-btn text-white font-bold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'
                  }`}
                >
                  Preventive Maintenance
                </button>

                <button
                  onClick={() => setActiveTab('users')}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition cursor-pointer ${
                    activeTab === 'users' ? 'active-neon-btn text-white font-bold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'
                  }`}
                >
                  System Users
                </button>
              </nav>
            </div>

            <div className="pt-4 border-t border-slate-800 space-y-3">
              <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-[11px]">
                <div className="font-bold text-white">Super Admin</div>
                <div className="text-emerald-400 flex items-center gap-1 mt-0.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  Live Auto-Sync
                </div>
              </div>
              <button
                onClick={() => setIsLoggedIn(false)}
                className="w-full py-2 bg-slate-800 hover:bg-rose-900/40 text-slate-300 hover:text-rose-400 rounded-xl text-xs font-bold transition cursor-pointer border border-slate-700"
              >
                Logout Session
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden bg-slate-100 p-6">
            
            {activeTab === 'inventory' && (
              <div className="flex-1 flex flex-col overflow-hidden space-y-4">
                <header className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <h1 className="text-base font-extrabold text-slate-900 tracking-tight">IT Stock Register & Inventory</h1>
                    <p className="text-xs text-slate-500 font-medium">Manage stock levels, groups, physical verification, and asset allocations.</p>
                  </div>
                  <button 
                    onClick={() => {
                      setEditingAsset(null);
                      setFormData({
                        group: 'IT Peripherals',
                        particulars: '',
                        brand: 'Honeywell',
                        customBrand: '',
                        serialNo: '',
                        vendor: '',
                        invoiceNo: '',
                        warranty: '',
                        cableLength: '',
                        measurementUnit: 'Piece',
                        openingQty: 0,
                        newPurchase: 0,
                        issueItems: 0,
                        shortItems: 0,
                        deadItems: 0,
                        category: 'Consumable',
                        location: '',
                        minAlert: 2,
                        entryMonth: getCurrentMonthYear(),
                        lastUpdated: getFormattedDateTime()
                      });
                      setIsModalOpen(true);
                    }}
                    className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-500/20 cursor-pointer flex items-center gap-2"
                  >
                    + Add New Asset
                  </button>
                </header>

                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-4 gap-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Search Keywords</label>
                    <input 
                      type="text"
                      placeholder="Search particulars, serial no..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Filter by Group</label>
                    <select
                      value={selectedGroupFilter}
                      onChange={(e) => setSelectedGroupFilter(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl outline-none font-medium bg-slate-50"
                    >
                      <option value="">All Asset Groups</option>
                      <option value="IT Peripherals">IT Peripherals</option>
                      <option value="Hardware">Hardware</option>
                      <option value="Networking">Networking</option>
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Filter by Location</label>
                    <input 
                      type="text"
                      placeholder="e.g. A Block, Server Room"
                      value={locationFilter}
                      onChange={(e) => setLocationFilter(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl outline-none font-medium"
                    />
                  </div>
                  <div className="flex items-end">
                    <button
                      onClick={() => { setSearchQuery(''); setLocationFilter(''); setSelectedGroupFilter(''); }}
                      className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition cursor-pointer"
                    >
                      Reset Filters
                    </button>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden">
                  <div className="overflow-auto flex-1">
                    <table className="w-full text-left border-collapse table-compact text-xs">
                      <thead className="bg-slate-900 text-slate-100 uppercase font-extrabold text-[10px] sticky top-0 z-10">
                        <tr>
                          <th className="p-3">#</th>
                          <th>Group Category</th>
                          <th>Particulars</th>
                          <th>Brand</th>
                          <th>Serial No</th>
                          <th>Location</th>
                          <th className="text-center">Opening</th>
                          <th className="text-center">Purchase</th>
                          <th className="text-center">Issued</th>
                          <th className="text-center">Short</th>
                          <th className="text-center">Dead</th>
                          <th className="text-center">Closing Balance</th>
                          <th className="text-center">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        {loading ? (
                          <tr><td colSpan="13" className="text-center py-12 text-slate-400 font-bold">Synchronizing database records...</td></tr>
                        ) : paginatedAssets.length === 0 ? (
                          <tr><td colSpan="13" className="text-center py-12 text-slate-400 font-bold">No matching stock items found.</td></tr>
                        ) : (
                          paginatedAssets.map((item, index) => {

            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-5 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-sm">
                    {editingTempItem ? 'Edit Temporary Dispatch' : 'Issue Temporary Asset'}
                  </h3>
                  <button onClick={() => setIsTempModalOpen(false)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const timestamped = getFormattedDateTime();

                  if (editingTempItem) {
                    const updated = {
                      ...editingTempItem,
                      ...tempForm,
                      lastUpdated: timestamped
                    };
                    try {
                      if (editingTempItem.firebaseKey) {
                        await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/temp_dispatches/${editingTempItem.firebaseKey}.json`, {
                          method: 'PUT',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify(updated)
                        });
                      }
                      setTempDispatches(tempDispatches.map(d => (d.id === editingTempItem.id || d.firebaseKey === editingTempItem.firebaseKey) ? updated : d));
                      showToast("Temporary dispatch updated.");
                    } catch(err) {
                      showToast("Error updating dispatch.");
                    }
                  } else {
                    const newDispatch = {
                      id: `td_${Date.now()}`,
                      ...tempForm,
                      issueDate: timestamped,
                      status: 'Active Dispatched'
                    };
                    try {
                      await fetch(FIREBASE_TEMP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newDispatch)
                      });
                      const res = await fetch(FIREBASE_TEMP_URL);
                      const data = await res.json();
                      if (data) setTempDispatches(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
                      showToast("Temporary asset issued successfully!");
                    } catch(err) {
                      setTempDispatches([newDispatch, ...tempDispatches]);
                      showToast("Temporary asset issued locally!");
                    }
                  }

                  setIsTempModalOpen(false);
                  setEditingTempItem(null);
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Asset Name *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Dell OptiPlex CPU i5"
                      value={tempForm.assetName}
                      onChange={(e) => setTempForm({ ...tempForm, assetName: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Asset Tag / Serial No *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. TAG-IT-9012"
                      value={tempForm.assetTagNo}
                      onChange={(e) => setTempForm({ ...tempForm, assetTagNo: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Department *</label>
                      <input 
                        type="text"
                        required
                        placeholder="e.g. Accounts"
                        value={tempForm.department}
                        onChange={(e) => setTempForm({ ...tempForm, department: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Quantity *</label>
                      <input 
                        type="number"
                        min="1"
                        required
                        value={tempForm.quantity}
                        onChange={(e) => setTempForm({ ...tempForm, quantity: Number(e.target.value) })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Receiver Name *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Mr. Ramesh Gupta"
                      value={tempForm.receiver}
                      onChange={(e) => setTempForm({ ...tempForm, receiver: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setIsTempModalOpen(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow cursor-pointer"
                    >
                      {editingTempItem ? 'Save Changes' : 'Confirm Dispatch'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PREVENTIVE MAINTENANCE SCHEDULE MODAL */}
          {isPmModalOpen && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-5 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-sm">
                    {editingPmItem ? 'Edit Preventive Maintenance & Location' : 'Schedule Preventive Maintenance (PM)'}
                  </h3>
                  <button onClick={() => setIsPmModalOpen(false)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const timestamped = getFormattedDateTime();
                  
                  if (editingPmItem) {
                    const updated = {
                      ...editingPmItem,
                      ...pmForm,
                      isEdited: true,
                      lastModified: timestamped
                    };
                    try {
                      if (editingPmItem.firebaseKey) {
                        await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/pm_schedules/${editingPmItem.firebaseKey}.json`, {
                          method: 'PUT',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify(updated)
                        });
                      }
                      setPmSchedules(pmSchedules.map(i => (i.id === editingPmItem.id || i.firebaseKey === editingPmItem.firebaseKey) ? updated : i));
                      showToast("PM schedule updated & highlighted!");
                    } catch(err) {
                      showToast("Error updating PM schedule.");
                    }
                  } else {
                    const newPm = {
                      id: `pm_${Date.now()}`,
                      ...pmForm,
                      status: 'Scheduled',
                      isEdited: false,
                      createdDate: timestamped
                    };
                    try {
                      await fetch(FIREBASE_PM_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newPm)
                      });
                      const res = await fetch(FIREBASE_PM_URL);
                      const data = await res.json();
                      if (data) setPmSchedules(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
                      showToast("Preventive maintenance task scheduled successfully!");
                    } catch(err) {
                      setPmSchedules([newPm, ...pmSchedules]);
                      showToast("Preventive maintenance task scheduled locally!");
                    }
                  }

                  setIsPmModalOpen(false);
                  setEditingPmItem(null);
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Target Month *</label>
                    <select
                      value={pmForm.targetMonth}
                      onChange={(e) => {
                        const mCode = e.target.value;
                        const mObj = monthsList.find(m => m.code === mCode);
                        setPmForm({ 
                          ...pmForm, 
                          targetMonth: mCode, 
                          slotRange: mObj && mObj.slots ? mObj.slots[0] : pmForm.slotRange 
                        });
                      }}
                      className="w-full p-2.5 border border-slate-300 rounded-lg font-bold outline-none bg-slate-50"
                    >
                      {monthsList.map(m => (
                        <option key={m.code} value={m.code}>{m.name} ({m.code})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Date-Wise Slot Range *</label>
                    <select
                      value={pmForm.slotRange}
                      onChange={(e) => setPmForm({ ...pmForm, slotRange: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg font-bold outline-none bg-slate-50"
                    >
                      {(() => {
                        const selM = monthsList.find(m => m.code === pmForm.targetMonth);
                        const slots = selM && selM.slots ? selM.slots : ['01 to 10 January', '11 to 20 January', '21 to 31 January'];
                        return slots.map(s => <option key={s} value={s}>{s}</option>);
                      })()}
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Location Name *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. General Registration / Block-A"
                      value={pmForm.location || ''}
                      onChange={(e) => setPmForm({ ...pmForm, location: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg font-semibold outline-none"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Equipment Name / System *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Core Switch / PC Workstation"
                      value={pmForm.equipmentName}
                      onChange={(e) => setPmForm({ ...pmForm, equipmentName: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg font-semibold outline-none"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Maintenance Type *</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Quarterly Dusting & Thermal Check"
                      value={pmForm.maintenanceType}
                      onChange={(e) => setPmForm({ ...pmForm, maintenanceType: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Scheduled Date *</label>
                      <input 
                        type="text"
                        required
                        placeholder="e.g. 05 Jan 2027"
                        value={pmForm.scheduledDate}
                        onChange={(e) => setPmForm({ ...pmForm, scheduledDate: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Technician / Vendor</label>
                      <input 
                        type="text"
                        placeholder="e.g. Mr. Amit Verma"
                        value={pmForm.technician}
                        onChange={(e) => setPmForm({ ...pmForm, technician: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setIsPmModalOpen(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow cursor-pointer"
                    >
                      {editingPmItem ? 'Save & Highlight Changes' : 'Schedule Task'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* VIEW SLIP MODAL */}
          {viewModalItem && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-extrabold text-slate-900 text-sm uppercase">Asset Issue & Verification Slip</h3>
                    <p className="text-[11px] text-slate-500">Official IT Infrastructure Record</p>
                  </div>
                  <button onClick={() => setViewModalItem(null)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>

                <div className="space-y-3 text-xs bg-slate-50 p-4 rounded-xl border">
                  <div className="grid grid-cols-2 gap-2">
                    <div><strong>Group Category:</strong> {viewModalItem.group}</div>
                    <div><strong>Category:</strong> {viewModalItem.category}</div>
                    <div><strong>Item Particulars:</strong> {viewModalItem.particulars}</div>
                    <div><strong>Brand:</strong> {viewModalItem.brand === 'Other' ? viewModalItem.customBrand : viewModalItem.brand}</div>
                    <div><strong>Serial No:</strong> {viewModalItem.serialNo || 'N/A'}</div>
                    <div><strong>Location:</strong> {viewModalItem.location || 'Unassigned'}</div>
                    <div><strong>Issued Qty:</strong> {viewModalItem.issueItems || 0}</div>
                    <div><strong>Last Updated:</strong> {viewModalItem.lastUpdated}</div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button 
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-blue-600 text-white font-bold shadow cursor-pointer text-xs"
                  >
                    Print Slip
                  </button>
                  <button 
                    onClick={() => setViewModalItem(null)}
                    className="px-4 py-2 rounded-xl bg-slate-200 text-slate-800 font-bold cursor-pointer text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADD / EDIT ASSET MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full p-6 space-y-4 my-8">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-slate-900 text-sm">
                    {editingAsset ? 'Edit Asset & Stock Details' : 'Register New Asset Entry'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>

                <form onSubmit={handleSaveAsset} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Asset Group Category *</label>
                      <select 
                        value={formData.group}
                        onChange={(e) => setFormData({ ...formData, group: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-bold bg-slate-50"
                      >
                        <option value="IT Peripherals">IT Peripherals</option>
                        <option value="Hardware">Hardware</option>
                        <option value="Networking">Networking</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Item Particulars *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Optical Mouse USB"
                        value={formData.particulars}
                        onChange={(e) => setFormData({ ...formData, particulars: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-semibold"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Brand Name *</label>
                      <select 
                        value={formData.brand}
                        onChange={(e) => setFormData({ ...formData, brand: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      >
                        <option value="Honeywell">Honeywell</option>
                        <option value="Dell">Dell</option>
                        <option value="HP">HP</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="Cisco">Cisco</option>
                        <option value="Logitech">Logitech</option>
                        <option value="Other">Other (Custom)</option>
                      </select>
                    </div>

                    {formData.brand === 'Other' && (
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">Custom Brand Name *</label>
                        <input 
                          type="text"
                          required
                          placeholder="Enter Brand Name"
                          value={formData.customBrand}
                          onChange={(e) => setFormData({ ...formData, customBrand: e.target.value })}
                          className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Category Classification *</label>
                      <select 
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      >
                        <option value="Consumable">Consumable</option>
                        <option value="Non-Consumable">Non-Consumable</option>
                        <option value="Fixed Assets">Fixed Assets</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Location / Department (Optional)</label>
                      <input 
                        type="text" 
                        placeholder="Leave blank until assigned"
                        value={formData.location}
                        onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Serial Number</label>
                      <input 
                        type="text" 
                        placeholder="e.g. HW-MS-9981"
                        value={formData.serialNo}
                        onChange={(e) => setFormData({ ...formData, serialNo: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Cable Length</label>
                      <input 
                        type="text" 
                        placeholder="e.g. 1.5 / 3 / 5"
                        value={formData.cableLength}
                        onChange={(e) => setFormData({ ...formData, cableLength: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Measurement Unit</label>
                      <select 
                        value={formData.measurementUnit}
                        onChange={(e) => setFormData({ ...formData, measurementUnit: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      >
                        <option value="Piece">Piece</option>
                        <option value="Meter">Meter</option>
                        <option value="GB">GB</option>
                        <option value="TB">TB</option>
                        <option value="Box / Set">Box / Set</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-5 gap-3 bg-slate-50 p-4 rounded-xl border">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Opening Qty</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.openingQty}
                        onChange={(e) => setFormData({ ...formData, openingQty: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">New Purchase</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.newPurchase}
                        onChange={(e) => setFormData({ ...formData, newPurchase: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-blue-600"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Issue Items</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.issueItems}
                        onChange={(e) => setFormData({ ...formData, issueItems: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-amber-600"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Short / Deficit</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.shortItems}
                        onChange={(e) => setFormData({ ...formData, shortItems: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-rose-500"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Dead / Faulty</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.deadItems}
                        onChange={(e) => setFormData({ ...formData, deadItems: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-slate-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Vendor Name</label>
                      <input 
                        type="text" 
                        placeholder="e.g. Apex Tech Solutions"
                        value={formData.vendor}
                        onChange={(e) => setFormData({ ...formData, vendor: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Invoice Number & Warranty</label>
                      <input 
                        type="text" 
                        placeholder="e.g. INV-2026-991 | 1 Year"
                        value={formData.invoiceNo}
                        onChange={(e) => setFormData({ ...formData, invoiceNo: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-3 border-t">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow cursor-pointer"
                    >
                      Save Asset Record
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
