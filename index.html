<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise IT Asset & Inventory Management Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .table-compact th, .table-compact td {
      padding: 9px 12px !important;
      line-height: 1.35 !important;
      vertical-align: middle !important;
    }

    @media print {
      body * { visibility: hidden; }
      #printable-slip, #printable-slip * { visibility: visible; }
      #printable-slip {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 24px;
        background: white;
        color: black;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-brand-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";
    const FIREBASE_TEMP_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/temp_dispatches.json";
    const FIREBASE_HISTORY_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/stock_history.json";

    const Icons = {
      Stock: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>,
      Report: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>,
      Search: () => <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
      Edit: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>,
      Trash: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Eye: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>,
      Download: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
      Refresh: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    };

    const getFormattedDateTime = () => {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, '0');
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = months[d.getMonth()];
      const year = d.getFullYear();
      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
    };

    const getCurrentMonthYear = () => {
      const d = new Date();
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
    };

    // Deduplicate items so identical items never show up multiple times
    const deduplicateAssets = async (rawItems, cleanRemoteDuplicates = false) => {
      const uniqueMap = new Map();
      const duplicateFirebaseKeys = [];

      for (const item of rawItems) {
        const normGroup = String(item.group || 'GENERAL').trim().toUpperCase();
        const normName = String(item.particulars || '').trim().toUpperCase();
        const normBrand = String(item.brand || '').trim().toUpperCase();
        const sig = `${normGroup}__${normName}__${normBrand}`;

        if (!uniqueMap.has(sig)) {
          uniqueMap.set(sig, {
            ...item,
            id: item.id || Date.now() + Math.random(),
            group: normGroup,
            particulars: normName,
            brand: item.brand || 'Dell'
          });
        } else {
          if (item.firebaseKey) {
            duplicateFirebaseKeys.push(item.firebaseKey);
          }
        }
      }

      if (cleanRemoteDuplicates && duplicateFirebaseKeys.length > 0) {
        for (const dupKey of duplicateFirebaseKeys) {
          try {
            await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${dupKey}.json`, {
              method: 'DELETE'
            });
          } catch (e) {}
        }
      }

      return Array.from(uniqueMap.values());
    };

    const initialSampleAssets = [
      {
        id: 101,
        group: 'MOUSE',
        particulars: 'USB MOUSE',
        brand: 'Dell',
        serialNo: 'MS-DL-12',
        cableLength: '1.5m',
        measurementUnit: 'Piece',
        openingQty: 12,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        minAlert: 2,
        category: 'Consumable',
        location: 'IT Stores',
        remark: 'Ready in stock',
        highlighted: false,
        entryMonth: getCurrentMonthYear(),
        lastUpdated: getFormattedDateTime()
      },
      {
        id: 102,
        group: 'CABLE',
        particulars: 'HDMI CABLE 3M',
        brand: 'Dell',
        serialNo: 'HD-3M-05',
        cableLength: '3.0m',
        measurementUnit: 'Piece',
        openingQty: 5,
        newPurchase: 3,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        minAlert: 2,
        category: 'Consumable',
        location: 'IT Stores',
        remark: '5 opening + 3 new stock',
        highlighted: false,
        entryMonth: getCurrentMonthYear(),
        lastUpdated: getFormattedDateTime()
      }
    ];

    function App() {
      const [assets, setAssets] = useState([]);
      const [stockHistory, setStockHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState('Just now');

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');
      const [activeHighlightId, setActiveHighlightId] = useState(null);

      // Add / Edit Asset Modal
      const [isAssetModalOpen, setIsAssetModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [formData, setFormData] = useState({
        group: 'CABLE',
        particulars: '',
        brand: 'Dell',
        serialNo: '',
        cableLength: '',
        measurementUnit: 'Piece',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        minAlert: 2,
        category: 'Consumable',
        location: 'IT Stores',
        remark: ''
      });

      // Issue Item Modal
      const [issueModalItem, setIssueModalItem] = useState(null);
      const [issueForm, setIssueForm] = useState({
        qtyToIssue: 1,
        receiverName: '',
        department: 'HR',
        extraRemark: ''
      });

      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [viewModalItem, setViewModalItem] = useState(null);
      const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });

      const showToast = (msg, type = 'info') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3200);
      };

      const loadAndCleanData = async (silent = true, cleanDupes = false) => {
        if (!silent) setIsSyncing(true);
        try {
          const [resAssets, resHist] = await Promise.allSettled([
            fetch(FIREBASE_DB_URL).then(r => r.json()),
            fetch(FIREBASE_HISTORY_URL).then(r => r.json())
          ]);

          if (resAssets.status === 'fulfilled' && resAssets.value) {
            const rawList = Object.keys(resAssets.value).map(k => ({ ...resAssets.value[k], firebaseKey: k }));
            const cleaned = await deduplicateAssets(rawList, cleanDupes);
            setAssets(cleaned.length > 0 ? cleaned : initialSampleAssets);
          } else {
            setAssets(prev => prev.length > 0 ? prev : initialSampleAssets);
          }

          if (resHist.status === 'fulfilled' && resHist.value) {
            const histList = Object.keys(resHist.value).map(k => ({ ...resHist.value[k], firebaseKey: k }));
            setStockHistory(histList.reverse());
          }

          const now = new Date();
          setLastSyncTime(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`);
        } catch (err) {
          console.error(err);
          setAssets(prev => prev.length > 0 ? prev : initialSampleAssets);
        } finally {
          setLoading(false);
          if (!silent) setIsSyncing(false);
        }
      };

      useEffect(() => {
        loadAndCleanData(true, true);
      }, []);

      const recordHistory = async (itemName, actionType, details) => {
        const entry = {
          id: `hist_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          timestamp: getFormattedDateTime(),
          monthYear: getCurrentMonthYear(),
          itemName: String(itemName || '').toUpperCase(),
          actionType,
          details
        };
        setStockHistory(prev => [entry, ...prev]);
        try {
          await fetch(FIREBASE_HISTORY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(entry)
          });
        } catch (e) {}
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        const nowStr = getFormattedDateTime();

        if (editingAsset) {
          const prevPurch = Number(editingAsset.newPurchase || 0);
          const nextPurch = Number(formData.newPurchase || 0);
          const addedPurch = nextPurch - prevPurch;

          const updatedItem = {
            ...editingAsset,
            ...formData,
            group: String(formData.group || 'GENERAL').trim().toUpperCase(),
            particulars: String(formData.particulars || '').trim().toUpperCase(),
            remark: formData.remark || (addedPurch > 0 ? `Added +${addedPurch} new stock` : editingAsset.remark || ''),
            highlighted: true,
            lastUpdated: nowStr
          };

          // Clear highlight from other rows so only this exact updated row is highlighted
          setAssets(prev =>
            prev.map(a =>
              a.id === editingAsset.id ? updatedItem : { ...a, highlighted: false }
            )
          );
          setActiveHighlightId(editingAsset.id);

          if (addedPurch > 0) {
            await recordHistory(
              updatedItem.particulars,
              `NEW STOCK (+${addedPurch})`,
              `New stock added (+${addedPurch}). ${formData.remark ? `Remark: ${formData.remark}` : ''}`
            );
          }

          if (editingAsset.firebaseKey) {
            try {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedItem)
              });
            } catch (e) {}
          }

          showToast(`Updated "${updatedItem.particulars}" stock.`, "success");
        } else {
          // Check if item already exists by group + particulars + brand
          const normGroup = String(formData.group || 'GENERAL').trim().toUpperCase();
          const normName = String(formData.particulars || '').trim().toUpperCase();
          const normBrand = String(formData.brand || 'Dell').trim().toUpperCase();

          const existing = assets.find(
            a =>
              String(a.group || '').toUpperCase() === normGroup &&
              String(a.particulars || '').toUpperCase() === normName &&
              String(a.brand || '').toUpperCase() === normBrand
          );

          if (existing) {
            // Merge into existing single item instead of creating duplicate row
            const addedPurchase = Number(formData.newPurchase || 0);
            const mergedItem = {
              ...existing,
              openingQty: Number(existing.openingQty || 0) + Number(formData.openingQty || 0),
              newPurchase: Number(existing.newPurchase || 0) + addedPurchase,
              remark: formData.remark || (addedPurchase > 0 ? `Added +${addedPurchase} new stock` : existing.remark),
              highlighted: true,
              lastUpdated: nowStr
            };

            setAssets(prev =>
              prev.map(a => (a.id === existing.id ? mergedItem : { ...a, highlighted: false }))
            );
            setActiveHighlightId(existing.id);

            if (addedPurchase > 0) {
              await recordHistory(
                mergedItem.particulars,
                `NEW STOCK (+${addedPurchase})`,
                `Added ${addedPurchase} to existing stock. ${formData.remark ? `Remark: ${formData.remark}` : ''}`
              );
            }

            if (existing.firebaseKey) {
              try {
                await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${existing.firebaseKey}.json`, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(mergedItem)
                });
              } catch (e) {}
            }

            showToast(`Merged with existing "${mergedItem.particulars}" stock!`, "success");
          } else {
            const newItem = {
              id: Date.now(),
              ...formData,
              group: normGroup,
              particulars: normName,
              remark: formData.remark || 'New stock registered',
              highlighted: true,
              entryMonth: getCurrentMonthYear(),
              lastUpdated: nowStr
            };

            setAssets(prev => [newItem, ...prev.map(a => ({ ...a, highlighted: false }))]);
            setActiveHighlightId(newItem.id);

            await recordHistory(
              newItem.particulars,
              `NEW ENTRY (Op: ${newItem.openingQty}, Pur: +${newItem.newPurchase})`,
              `Registered in stock. ${newItem.remark}`
            );

            try {
              const res = await fetch(FIREBASE_DB_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newItem)
              });
              const data = await res.json();
              if (data && data.name) {
                setAssets(prev => prev.map(a => (a.id === newItem.id ? { ...a, firebaseKey: data.name } : a)));
              }
            } catch (e) {}

            showToast(`Added "${newItem.particulars}" to Stock Register.`, "success");
          }
        }

        setIsAssetModalOpen(false);
        setEditingAsset(null);
      };

      const handleConfirmIssue = async (e) => {
        e.preventDefault();
        if (!issueModalItem) return;

        const qty = Math.max(1, Number(issueForm.qtyToIssue || 1));
        const opening = Number(issueModalItem.openingQty || 0);
        const purch = Number(issueModalItem.newPurchase || 0);
        const issued = Number(issueModalItem.issueItems || 0);
        const short = Number(issueModalItem.shortItems || 0);
        const dead = Number(issueModalItem.deadItems || 0);
        const currentBalance = (opening + purch) - (issued + short + dead);

        if (qty > currentBalance) {
          showToast(`Only ${currentBalance} available in stock! Cannot issue ${qty}.`, "error");
          return;
        }

        const nextIssued = issued + qty;
        const nowStr = getFormattedDateTime();
        const person = issueForm.receiverName.trim() || 'Authorized Staff';
        const dept = issueForm.department.trim() || 'General';
        const remarkText = `Issued ${qty} to ${person} (${dept} Dept)${issueForm.extraRemark ? ` — ${issueForm.extraRemark}` : ''}`;

        const updatedAsset = {
          ...issueModalItem,
          issueItems: nextIssued,
          remark: remarkText,
          highlighted: true,
          lastUpdated: nowStr
        };

        // Update ONLY this single item and un-highlight others
        setAssets(prev =>
          prev.map(a => (a.id === issueModalItem.id ? updatedAsset : { ...a, highlighted: false }))
        );
        setActiveHighlightId(issueModalItem.id);

        if (issueModalItem.firebaseKey) {
          try {
            await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${issueModalItem.firebaseKey}.json`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(updatedAsset)
            });
          } catch (e) {}
        }

        const dispatchRecord = {
          id: `disp_${Date.now()}`,
          assetId: issueModalItem.id,
          assetName: issueModalItem.particulars,
          quantity: qty,
          receiver: person,
          department: dept,
          remark: remarkText,
          date: nowStr
        };

        try {
          await fetch(FIREBASE_TEMP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dispatchRecord)
          });
        } catch (e) {}

        await recordHistory(issueModalItem.particulars, `ISSUED (-${qty})`, remarkText);

        showToast(`Issued ${qty} ${issueModalItem.particulars} to ${person} (${dept}).`, "success");
        setIssueModalItem(null);
      };

      const handleDeleteAsset = async (item) => {
        if (!window.confirm(`Delete "${item.particulars}" from Stock Register?`)) return;
        setAssets(prev => prev.filter(a => a.id !== item.id));
        if (item.firebaseKey) {
          try {
            await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${item.firebaseKey}.json`, {
              method: 'DELETE'
            });
          } catch (e) {}
        }
        await recordHistory(item.particulars, 'DELETED', `Deleted "${item.particulars}" from register.`);
        showToast("Item deleted.", "info");
      };

      const groups = useMemo(() => {
        const map = {};
        assets.forEach(a => {
          const g = a.group || 'GENERAL';
          map[g] = (map[g] || 0) + 1;
        });
        return map;
      }, [assets]);

      const filteredAssets = useMemo(() => {
        return assets.filter(item => {
          const q = searchQuery.toLowerCase();
          const matchSearch = !q ||
            (item.particulars || '').toLowerCase().includes(q) ||
            (item.group || '').toLowerCase().includes(q) ||
            (item.remark || '').toLowerCase().includes(q) ||
            (item.brand || '').toLowerCase().includes(q);
          const matchGroup = !selectedGroupFilter || (item.group || '').toUpperCase() === selectedGroupFilter.toUpperCase();
          return matchSearch && matchGroup;
        });
      }, [assets, searchQuery, selectedGroupFilter]);

      const exportExcel = () => {
        const rows = assets.map(r => ({
          "Group": r.group,
          "Particulars": r.particulars,
          "Brand": r.brand,
          "Opening": Number(r.openingQty || 0),
          "New Stock": Number(r.newPurchase || 0),
          "Issued": Number(r.issueItems || 0),
          "Balance": (Number(r.openingQty || 0) + Number(r.newPurchase || 0)) - (Number(r.issueItems || 0) + Number(r.shortItems || 0) + Number(r.deadItems || 0)),
          "Remarks": r.remark || '',
          "Last Updated": r.lastUpdated || ''
        }));
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Stock Register");
        XLSX.writeFile(wb, `Stock_Register_${Date.now()}.xlsx`);
      };

      return (
        <div className="flex h-screen bg-slate-100 text-slate-800 overflow-hidden">
          {toast.show && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-xs font-bold text-white ${
              toast.type === 'success' ? 'bg-emerald-700' : toast.type === 'error' ? 'bg-rose-700' : 'bg-slate-900'
            }`}>
              {toast.msg}
            </div>
          )}

          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 shrink-0">
            <div className="space-y-4">
              <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center text-white">
                    <Icons.Stock />
                  </div>
                  <div>
                    <div className="text-xs font-black text-white uppercase">Stock Suite</div>
                    <div className="text-[10px] text-slate-400 font-mono">Sync: {lastSyncTime}</div>
                  </div>
                </div>
                <button
                  onClick={() => loadAndCleanData(false, true)}
                  className={`p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white ${isSyncing ? 'animate-spin' : ''}`}
                  title="Sync & Clean Duplicates"
                >
                  <Icons.Refresh />
                </button>
              </div>

              <nav className="space-y-1 text-xs font-semibold">
                <button
                  className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-left bg-brand-600 text-white font-bold"
                >
                  <Icons.Stock /> Stock Register
                </button>
                <button
                  onClick={() => setShowHistoryModal(true)}
                  className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-left text-slate-400 hover:bg-slate-800 hover:text-white transition"
                >
                  <Icons.Report /> Monthly History ({stockHistory.length})
                </button>
              </nav>
            </div>

            <div className="text-[11px] text-slate-400 bg-slate-800/70 p-3 rounded-xl border border-slate-700/60 space-y-1">
              <div className="font-bold text-slate-200">Auto Calculation</div>
              <div className="font-mono text-[10px]">Balance = (Opening + New Stock) - Issued</div>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 flex flex-col overflow-hidden p-5 space-y-4">
            <header className="bg-white border border-slate-200 p-4 rounded-2xl shadow-xs flex flex-wrap justify-between items-center gap-3">
              <div>
                <h1 className="text-sm font-extrabold text-slate-900 uppercase tracking-wide">
                  Stock Register — Single Entry, Auto Balance & Remarks
                </h1>
                <p className="text-xs text-slate-500">
                  Issuing an item updates only that item once, highlights its row, and shows who & which department received it.
                </p>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => loadAndCleanData(false, true)}
                  className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl text-xs font-bold flex items-center gap-1.5"
                >
                  <Icons.Refresh /> Clean Duplicates
                </button>
                <button
                  onClick={() => setShowHistoryModal(true)}
                  className="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl text-xs font-bold flex items-center gap-1.5"
                >
                  <Icons.Report /> History ({stockHistory.length})
                </button>
                <button
                  onClick={exportExcel}
                  className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl text-xs font-bold flex items-center gap-1.5"
                >
                  <Icons.Download /> Export Excel
                </button>
                <button
                  onClick={() => {
                    setEditingAsset(null);
                    setFormData({
                      group: 'CABLE',
                      particulars: '',
                      brand: 'Dell',
                      serialNo: '',
                      cableLength: '',
                      measurementUnit: 'Piece',
                      openingQty: 0,
                      newPurchase: 0,
                      issueItems: 0,
                      shortItems: 0,
                      deadItems: 0,
                      minAlert: 2,
                      category: 'Consumable',
                      location: 'IT Stores',
                      remark: ''
                    });
                    setIsAssetModalOpen(true);
                  }}
                  className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-xs flex items-center gap-1.5"
                >
                  <Icons.Plus /> Add Stock / Item
                </button>
              </div>
            </header>

            {/* Group Filter & Search */}
            <div className="bg-white border border-slate-200 p-3.5 rounded-2xl shadow-xs flex flex-wrap justify-between items-center gap-3">
              <div className="flex items-center gap-2 overflow-x-auto">
                <button
                  onClick={() => setSelectedGroupFilter('')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                    selectedGroupFilter === '' ? 'bg-brand-600 text-white border-brand-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                  }`}
                >
                  All ({assets.length})
                </button>
                {Object.keys(groups).map(grp => (
                  <button
                    key={grp}
                    onClick={() => setSelectedGroupFilter(grp)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                      selectedGroupFilter === grp ? 'bg-brand-600 text-white border-brand-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                    }`}
                  >
                    {grp} ({groups[grp]})
                  </button>
                ))}
              </div>

              <div className="relative">
                <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <Icons.Search />
                </span>
                <input
                  type="text"
                  placeholder="Search item, remark, group..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-brand-500 w-60"
                />
              </div>
            </div>

            {/* Stock Register Table */}
            <div className="bg-white border border-slate-200 rounded-2xl shadow-xs flex-1 overflow-auto">
              <table className="w-full text-left border-collapse table-compact text-xs">
                <thead className="bg-slate-100 text-slate-700 uppercase font-extrabold text-[10px] sticky top-0 z-10 border-b border-slate-200">
                  <tr>
                    <th className="p-3 text-center">Actions</th>
                    <th>Item / Particulars</th>
                    <th className="text-center">Opening</th>
                    <th className="text-center text-brand-700">New Stock (+)</th>
                    <th className="text-center text-amber-700">Issued (-)</th>
                    <th className="text-center bg-slate-200/70 font-black">Balance</th>
                    <th>Remarks (Whom & Department)</th>
                    <th>Updated</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                  {loading ? (
                    <tr><td colSpan="8" className="text-center py-12 text-slate-400">Loading stock register...</td></tr>
                  ) : filteredAssets.length === 0 ? (
                    <tr><td colSpan="8" className="text-center py-12 text-slate-400">No items found.</td></tr>
                  ) : (
                    filteredAssets.map(item => {
                      const opening = Number(item.openingQty || 0);
                      const purch = Number(item.newPurchase || 0);
                      const issued = Number(item.issueItems || 0);
                      const short = Number(item.shortItems || 0);
                      const dead = Number(item.deadItems || 0);
                      const balance = (opening + purch) - (issued + short + dead);
                      const isLow = balance <= Number(item.minAlert || 2);
                      const isRowHighlighted = Boolean(item.highlighted || activeHighlightId === item.id);

                      return (
                        <tr
                          key={item.id}
                          className={`transition ${
                            isRowHighlighted
                              ? 'bg-amber-100/80 ring-1 ring-inset ring-amber-400'
                              : isLow
                              ? 'bg-rose-50/40 hover:bg-slate-50'
                              : 'hover:bg-slate-50'
                          }`}
                        >
                          <td className="text-center whitespace-nowrap">
                            <div className="inline-flex items-center gap-1">
                              <button
                                onClick={() => {
                                  setIssueModalItem(item);
                                  setIssueForm({
                                    qtyToIssue: 1,
                                    receiverName: '',
                                    department: 'HR',
                                    extraRemark: ''
                                  });
                                }}
                                className="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-[11px] font-bold transition"
                              >
                                Issue Item
                              </button>
                              <button
                                onClick={() => {
                                  setEditingAsset(item);
                                  setFormData({
                                    group: item.group || 'CABLE',
                                    particulars: item.particulars || '',
                                    brand: item.brand || 'Dell',
                                    serialNo: item.serialNo || '',
                                    cableLength: item.cableLength || '',
                                    measurementUnit: item.measurementUnit || 'Piece',
                                    openingQty: item.openingQty || 0,
                                    newPurchase: item.newPurchase || 0,
                                    issueItems: item.issueItems || 0,
                                    shortItems: item.shortItems || 0,
                                    deadItems: item.deadItems || 0,
                                    minAlert: item.minAlert || 2,
                                    category: item.category || 'Consumable',
                                    location: item.location || 'IT Stores',
                                    remark: item.remark || ''
                                  });
                                  setIsAssetModalOpen(true);
                                }}
                                title="Edit / Add Stock"
                                className="p-1.5 bg-slate-100 hover:bg-slate-200 text-indigo-600 rounded-lg"
                              >
                                <Icons.Edit />
                              </button>
                              <button
                                onClick={() => setViewModalItem(item)}
                                title="View / Print Slip"
                                className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg"
                              >
                                <Icons.Eye />
                              </button>
                              <button
                                onClick={() => handleDeleteAsset(item)}
                                title="Delete"
                                className="p-1.5 bg-slate-100 hover:bg-rose-100 text-rose-600 rounded-lg"
                              >
                                <Icons.Trash />
                              </button>
                            </div>
                          </td>

                          <td>
                            <div className="flex items-center gap-1.5">
                              <span className="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                                {item.group || 'ITEM'}
                              </span>
                              <span className="font-extrabold text-slate-900">{item.particulars}</span>
                              {isRowHighlighted && (
                                <span className="px-1.5 py-0.5 text-[9px] font-black uppercase rounded bg-amber-500 text-white">
                                  Updated
                                </span>
                              )}
                              {isLow && (
                                <span className="px-1.5 py-0.5 text-[9px] font-black uppercase rounded bg-rose-600 text-white">
                                  Low
                                </span>
                              )}
                            </div>
                            <div className="text-[11px] text-slate-500 font-mono mt-0.5">
                              {item.brand}
                            </div>
                          </td>

                          <td className="text-center font-mono font-bold">{opening}</td>
                          <td className="text-center font-mono font-bold text-emerald-700">+{purch}</td>
                          <td className="text-center font-mono font-bold text-amber-700">-{issued}</td>
                          <td className="text-center font-mono font-black text-sm bg-slate-100/80">
                            <span className={`px-2 py-0.5 rounded ${isLow ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}`}>
                              {balance}
                            </span>
                          </td>

                          <td className="max-w-xs">
                            {item.remark ? (
                              <span className="inline-block px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-800 text-[11px] font-semibold">
                                {item.remark}
                              </span>
                            ) : (
                              <span className="text-slate-400 italic text-[11px]">No remark</span>
                            )}
                          </td>

                          <td className="font-mono text-[11px] text-slate-500 whitespace-nowrap">
                            {item.lastUpdated || '—'}
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </main>

          {/* Issue Item Modal */}
          {issueModalItem && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <div>
                    <h3 className="font-extrabold text-sm text-slate-900">Issue Item: {issueModalItem.particulars}</h3>
                    <p className="text-[11px] text-slate-500">
                      Available Stock: <strong className="font-mono text-emerald-700">
                        {(Number(issueModalItem.openingQty || 0) + Number(issueModalItem.newPurchase || 0)) - (Number(issueModalItem.issueItems || 0) + Number(issueModalItem.shortItems || 0) + Number(issueModalItem.deadItems || 0))}
                      </strong>
                    </p>
                  </div>
                  <button onClick={() => setIssueModalItem(null)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <form onSubmit={handleConfirmIssue} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Quantity to Give *</label>
                      <input
                        type="number"
                        min="1"
                        required
                        value={issueForm.qtyToIssue}
                        onChange={(e) => setIssueForm({ ...issueForm, qtyToIssue: Number(e.target.value) })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Department / Location *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. HR, Board Room"
                        value={issueForm.department}
                        onChange={(e) => setIssueForm({ ...issueForm, department: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-semibold"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Given To (Person Name) *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Rahul Verma"
                      value={issueForm.receiverName}
                      onChange={(e) => setIssueForm({ ...issueForm, receiverName: e.target.value })}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-semibold"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Additional Remark (Optional)</label>
                    <input
                      type="text"
                      placeholder="e.g. For cabin / meeting room"
                      value={issueForm.extraRemark}
                      onChange={(e) => setIssueForm({ ...issueForm, extraRemark: e.target.value })}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button
                      type="button"
                      onClick={() => setIssueModalItem(null)}
                      className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-600"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold"
                    >
                      Deduct Stock & Save Remark
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add / Edit Asset Modal */}
          {isAssetModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <h3 className="font-extrabold text-sm text-slate-900">
                    {editingAsset ? 'Edit Item / Add New Stock' : 'Register New Item / Stock'}
                  </h3>
                  <button onClick={() => setIsAssetModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveAsset} className="space-y-3 text-xs">
                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Group *</label>
                      <input
                        type="text"
                        required
                        value={formData.group}
                        onChange={(e) => setFormData({ ...formData, group: e.target.value.toUpperCase() })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Item Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. HDMI CABLE 3M"
                        value={formData.particulars}
                        onChange={(e) => setFormData({ ...formData, particulars: e.target.value.toUpperCase() })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Brand</label>
                      <input
                        type="text"
                        value={formData.brand}
                        onChange={(e) => setFormData({ ...formData, brand: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-semibold"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Opening Qty</label>
                      <input
                        type="number"
                        min="0"
                        value={formData.openingQty}
                        onChange={(e) => setFormData({ ...formData, openingQty: Number(e.target.value) })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-emerald-700 mb-1">New Stock (+)</label>
                      <input
                        type="number"
                        min="0"
                        value={formData.newPurchase}
                        onChange={(e) => setFormData({ ...formData, newPurchase: Number(e.target.value) })}
                        className="w-full p-2.5 bg-emerald-50/50 border border-emerald-300 rounded-xl font-mono font-bold text-emerald-800"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-amber-700 mb-1">Issued (-)</label>
                      <input
                        type="number"
                        min="0"
                        value={formData.issueItems}
                        onChange={(e) => setFormData({ ...formData, issueItems: Number(e.target.value) })}
                        className="w-full p-2.5 bg-amber-50/50 border border-amber-300 rounded-xl font-mono font-bold text-amber-800"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Remark (Whom / Department / Notes)</label>
                    <input
                      type="text"
                      placeholder="e.g. New stock arrived / Issued to HR"
                      value={formData.remark}
                      onChange={(e) => setFormData({ ...formData, remark: e.target.value })}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button
                      type="button"
                      onClick={() => setIsAssetModalOpen(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-600"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold"
                    >
                      Save Stock
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Monthly Stock History Modal */}
          {showHistoryModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <h3 className="font-extrabold text-sm text-slate-900">Monthly Stock History</h3>
                  <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <div className="max-h-80 overflow-auto border border-slate-200 rounded-xl">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead className="bg-slate-100 text-slate-700 uppercase font-bold text-[10px] sticky top-0 border-b border-slate-200">
                      <tr>
                        <th className="p-2.5">Date & Time</th>
                        <th>Item</th>
                        <th>Action</th>
                        <th>Remarks</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {stockHistory.length === 0 ? (
                        <tr><td colSpan="4" className="text-center py-8 text-slate-400">No history entries yet.</td></tr>
                      ) : (
                        stockHistory.map(h => (
                          <tr key={h.id}>
                            <td className="p-2.5 font-mono text-[11px] text-slate-500">{h.timestamp}</td>
                            <td className="font-bold text-slate-900">{h.itemName}</td>
                            <td className="font-mono font-bold text-brand-700">{h.actionType}</td>
                            <td>{h.details}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>

                <div className="flex justify-end">
                  <button onClick={() => setShowHistoryModal(false)} className="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Printable Slip Modal */}
          {viewModalItem && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
              <div id="printable-slip" className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-start border-b border-slate-200 pb-3">
                  <div>
                    <div className="text-[10px] font-black uppercase text-brand-600">Stock Slip</div>
                    <h3 className="font-extrabold text-base text-slate-900">{viewModalItem.particulars}</h3>
                  </div>
                  <button onClick={() => setViewModalItem(null)} className="no-print text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <div className="space-y-2 text-xs bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <div><strong>Group:</strong> {viewModalItem.group}</div>
                  <div>
                    <strong>Net Balance:</strong>{' '}
                    <span className="font-mono font-bold">
                      {(Number(viewModalItem.openingQty || 0) + Number(viewModalItem.newPurchase || 0)) - (Number(viewModalItem.issueItems || 0) + Number(viewModalItem.shortItems || 0) + Number(viewModalItem.deadItems || 0))}
                    </span>
                  </div>
                  <div><strong>Remark:</strong> {viewModalItem.remark || '—'}</div>
                  <div><strong>Last Updated:</strong> {viewModalItem.lastUpdated || '—'}</div>
                </div>

                <div className="no-print flex justify-end gap-2">
                  <button onClick={() => window.print()} className="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Print</button>
                  <button onClick={() => setViewModalItem(null)} className="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 text-xs font-bold">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
