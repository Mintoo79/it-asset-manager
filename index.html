<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #4f46e5 0%, #6366f1 100%);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans antialiased selection:bg-indigo-600 selection:text-white">
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading IT Asset Portal...</div>
        <div style="font-size: 12px; color: #94a3b8;">Establishing secure cloud connection</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";
    const LOCAL_STORAGE_KEY = "it_asset_inventory_fallback_v1";

    const DEFAULT_SAMPLE_ASSETS = [
      { firebaseKey: 'sample_1', group: 'MOUSE', particulars: 'USB Optical Mouse - Dell', brand: 'Dell', category: 'Consumable', openingQty: 15, newPurchase: 10, issueItems: 8, deadItems: 1, minAlert: 5, location: 'Main IT Store', entryMonth: 'Nov 2026', unit: 'Piece' },
      { firebaseKey: 'sample_2', group: 'KEYBOARD', particulars: 'Wired USB Keyboard - HP', brand: 'HP', category: 'Consumable', openingQty: 12, newPurchase: 5, issueItems: 15, deadItems: 0, minAlert: 4, location: 'B Block', entryMonth: 'Nov 2026', unit: 'Piece' },
      { firebaseKey: 'sample_3', group: 'STORAGE', particulars: 'SSD 512GB SATA III', brand: 'WD', category: 'Fixed Assets', openingQty: 8, newPurchase: 4, issueItems: 3, deadItems: 0, minAlert: 3, location: 'Server Room', entryMonth: 'Nov 2026', unit: 'Piece' },
      { firebaseKey: 'sample_4', group: 'CABLES', particulars: 'HDMI High-Speed Cable', brand: 'UGREEN', cableLength: '5', unit: 'Meter', category: 'Consumable', openingQty: 20, newPurchase: 0, issueItems: 6, deadItems: 0, minAlert: 5, location: 'A Block', entryMonth: 'Oct 2026', unit: 'Meter' },
      { firebaseKey: 'sample_5', group: 'PERIPHERALS', particulars: 'HD Web Camera 1080p', brand: 'Logitech', category: 'Fixed Assets', openingQty: 5, newPurchase: 2, issueItems: 6, deadItems: 0, minAlert: 2, location: 'Conference Room', entryMonth: 'Nov 2026', unit: 'Piece' }
    ];

    const IMPORTANT_ITEMS = ['mouse', 'keyboard', 'ram', 'ssd', 'hdd', 'web camera', 'camera'];

    function isImportantItem(name) {
      if (!name) return false;
      const lower = name.toLowerCase();
      return IMPORTANT_ITEMS.some(item => lower.includes(item));
    }

    const GROUP_COLORS = [
      "bg-white border-l-4 border-l-indigo-600 text-slate-800 hover:bg-indigo-50/40",
      "bg-white border-l-4 border-l-emerald-600 text-slate-800 hover:bg-emerald-50/40",
      "bg-white border-l-4 border-l-sky-600 text-slate-800 hover:bg-sky-50/40",
      "bg-white border-l-4 border-l-amber-500 text-slate-800 hover:bg-amber-50/40",
      "bg-white border-l-4 border-l-violet-600 text-slate-800 hover:bg-violet-50/40",
      "bg-white border-l-4 border-l-rose-500 text-slate-800 hover:bg-rose-50/40"
    ];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState(null);

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isOfflineMode, setIsOfflineMode] = useState(false);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [deleteConfirmAsset, setDeleteConfirmAsset] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      const lineChartRef = useRef(null);
      const donutChartRef = useRef(null);

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        cableLength: '',
        unit: 'Piece',
        brand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear()
      });

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const loadLocalFallback = () => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            setAssets(JSON.parse(cached));
          } else {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(DEFAULT_SAMPLE_ASSETS));
            setAssets(DEFAULT_SAMPLE_ASSETS);
          }
        } catch (e) {
          setAssets(DEFAULT_SAMPLE_ASSETS);
        }
      };

      const saveLocalFallback = (updatedList) => {
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(updatedList));
        } catch (e) {}
      };

      const fetchCloudData = async () => {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3000);
          const res = await fetch(FIREBASE_DB_URL, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (!res.ok) throw new Error("Network response not ok");
          const data = await res.json();
          setIsOfflineMode(false);
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
            saveLocalFallback(list);
          } else {
            setAssets([]);
          }
        } catch (err) {
          // Gracefully switch to local browser storage without console errors when sandboxed/offline
          setIsOfflineMode(true);
          loadLocalFallback();
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(() => {
          if (!isOfflineMode) fetchCloudData();
        }, 5000);
        return () => clearInterval(interval);
      }, [isOfflineMode]);

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 4000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (activeTab === 'dashboard' && isLoggedIn) {
          setTimeout(() => {
            const lineCtx = document.getElementById('trendLineChart');
            if (lineCtx) {
              if (lineChartRef.current) lineChartRef.current.destroy();
              lineChartRef.current = new Chart(lineCtx, {
                type: 'line',
                data: {
                  labels: ['Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
                  datasets: [
                    {
                      label: 'Entries',
                      data: [40, 55, 60, 65, assets.length || 76],
                      borderColor: '#2563eb',
                      backgroundColor: 'rgba(37, 99, 235, 0.1)',
                      tension: 0.3,
                      fill: true,
                      pointRadius: 4
                    },
                    {
                      label: 'Issued',
                      data: [25, 38, 42, 50, assets.reduce((acc, i) => acc + Number(i.issueItems || 0), 0) || 53],
                      borderColor: '#10b981',
                      backgroundColor: 'rgba(16, 185, 129, 0.05)',
                      tension: 0.3,
                      fill: true,
                      pointRadius: 4
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  scales: {
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                  }
                }
              });
            }

            const donutCtx = document.getElementById('overviewDonutChart');
            if (donutCtx) {
              if (donutChartRef.current) donutChartRef.current.destroy();
              const consumable = assets.filter(i => i.category === 'Consumable').length || 25;
              const nonConsumable = assets.filter(i => i.category === 'Non-Consumable').length || 35;
              const fixedAssets = assets.filter(i => i.category === 'Fixed Assets').length || 16;

              donutChartRef.current = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                  labels: ['Fixed Assets', 'Non-Consumable', 'Consumables'],
                  datasets: [{
                    data: [fixedAssets, nonConsumable, consumable],
                    backgroundColor: ['#2563eb', '#10b981', '#a855f7'],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  cutout: '72%',
                  plugins: { legend: { display: false } }
                }
              });
            }
          }, 100);
        }
      }, [activeTab, isLoggedIn, assets]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
        } else {
          setLoginError('Invalid Security PIN (Default PIN: 1234)');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const handleOpenModal = (asset = null) => {
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          setEditingAsset(asset);
          setFormData({
            group: asset.group || '',
            particulars: asset.particulars || '',
            cableLength: asset.cableLength || '',
            unit: asset.unit || 'Piece',
            brand: asset.brand || '',
            serialNo: asset.serialNo || '',
            vendor: asset.vendor || '',
            invoiceNo: asset.invoiceNo || '',
            warranty: asset.warranty || '',
            openingQty: asset.openingQty || 0,
            newPurchase: asset.newPurchase || 0,
            issueItems: asset.issueItems || 0,
            shortItems: asset.shortItems || 0,
            deadItems: asset.deadItems || 0,
            category: asset.category || 'Consumable',
            location: asset.location || '',
            minAlert: asset.minAlert || 2,
            entryMonth: asset.entryMonth || autoMonth
          });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            cableLength: '',
            unit: 'Piece',
            brand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '',
            minAlert: 2,
            entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const finalData = {
          ...formData,
          group: (formData.group || 'GENERAL').toUpperCase().trim(),
          entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear()
        };

        try {
          if (isOfflineMode) throw new Error("Offline mode active");
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalData)
            });
            showToast("Asset record updated successfully.");
          } else {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...finalData, id: currentTimestamp })
            });
            showToast("New asset record registered.");
          }
          setIsModalOpen(false);
          await fetchCloudData();
        } catch (err) {
          // Local storage persistence fallback
          let updatedAssets;
          if (editingAsset && editingAsset.firebaseKey) {
            updatedAssets = assets.map(a => a.firebaseKey === editingAsset.firebaseKey ? { ...finalData, firebaseKey: editingAsset.firebaseKey } : a);
            showToast("Asset updated (Local Storage Mode).");
          } else {
            const newRecord = { ...finalData, id: currentTimestamp, firebaseKey: `local_${currentTimestamp}` };
            updatedAssets = [newRecord, ...assets];
            showToast("New asset saved (Local Storage Mode).");
          }
          setAssets(updatedAssets);
          saveLocalFallback(updatedAssets);
          setIsModalOpen(false);
        } finally {
          setLoading(false);
        }
      };

      const confirmDeleteAsset = async () => {
        if (!deleteConfirmAsset) return;
        setLoading(true);
        try {
          if (isOfflineMode) throw new Error("Offline mode active");
          const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${deleteConfirmAsset.firebaseKey}.json`;
          await fetch(deleteUrl, { method: 'DELETE' });
          showToast("Asset record deleted.");
          setDeleteConfirmAsset(null);
          await fetchCloudData();
        } catch (err) {
          const updatedAssets = assets.filter(a => a.firebaseKey !== deleteConfirmAsset.firebaseKey);
          setAssets(updatedAssets);
          saveLocalFallback(updatedAssets);
          showToast("Asset deleted (Local Storage Mode).");
          setDeleteConfirmAsset(null);
        } finally {
          setLoading(false);
        }
      };

      // Alphabetical Group Summaries computation
      const groupSummaries = React.useMemo(() => {
        const groupsMap = {};
        assets.forEach(item => {
          const grp = (item.group || 'GENERAL').toUpperCase().trim();
          if (!groupsMap[grp]) {
            groupsMap[grp] = { name: grp, count: 0, totalQty: 0, lowCount: 0 };
          }
          groupsMap[grp].count += 1;
          const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
          groupsMap[grp].totalQty += Math.max(0, bal);
          if (bal <= Number(item.minAlert || 2)) {
            groupsMap[grp].lowCount += 1;
          }
        });

        return Object.values(groupsMap)
          .sort((a, b) => a.name.localeCompare(b.name))
          .map((grp, idx) => ({
            ...grp,
            colorClass: GROUP_COLORS[idx % GROUP_COLORS.length]
          }));
      }, [assets]);

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        const matchesGroup = !selectedGroupFilter || (item.group || 'GENERAL').toUpperCase().trim() === selectedGroupFilter;
        return matchesSearch && matchesLocation && matchesMonth && matchesGroup;
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);
      const totalRecords = assets.length;

      const lowStockItems = assets.filter(item => {
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        return phy <= Number(item.minAlert || 2);
      });
      const currentMonthRecords = assets.filter(i => (i.entryMonth || '').toLowerCase() === getCurrentMonthYear().toLowerCase()).length;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <div className="text-center mb-6">
                <div className="inline-flex p-3.5 bg-indigo-50 text-indigo-600 rounded-2xl mb-3 shadow-inner border border-indigo-100">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">IT Asset Portal</h1>
                <p className="text-xs font-medium text-slate-500 mt-1">Enterprise Cloud Inventory Infrastructure</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Security PIN Code</label>
                  <input 
                    type="password" 
                    placeholder="Enter PIN (Default: 1234)" 
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-indigo-600 outline-none transition"
                    required
                  />
                </div>

                {loginError && <p className="text-xs text-rose-500 font-medium">{loginError}</p>}

                <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-indigo-500/20 transition duration-150 flex items-center justify-center gap-2 cursor-pointer">
                  Authenticate & Sign In
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-[#f8fafc]">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-xl shadow-2xl border border-slate-700 flex items-center gap-2 animate-bounce">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              {toastMsg}
            </div>
          )}

          {/* Left Sidebar */}
          <aside className="w-64 neon-sidebar text-slate-300 flex flex-col justify-between p-4 shadow-xl border-r border-slate-800 relative shrink-0">
            <div>
              <div className="text-center pt-2 pb-5 border-b border-slate-800">
                <div className="inline-flex p-3 bg-indigo-500/15 border border-indigo-500/30 rounded-2xl mb-2 shadow-inner">
                  <svg className="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">IT ASSET</h2>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">MANAGEMENT</h2>
                <h2 className="font-black text-white text-base tracking-wider leading-tight">SYSTEM</h2>
                {isOfflineMode ? (
                  <span className="text-[11px] text-amber-400 font-bold flex items-center justify-center gap-1.5 mt-2">
                    <span className="w-2 h-2 rounded-full bg-amber-400"></span> Local Storage Sync
                  </span>
                ) : (
                  <span className="text-[11px] text-emerald-400 font-bold flex items-center justify-center gap-1.5 mt-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synchronized
                  </span>
                )}
              </div>

              <nav className="mt-5 space-y-2">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                  { id: 'inventory', label: '1. Stock Register', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                  { id: 'analytics', label: '2. Analytics Board', icon: 'M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' },
                  { id: 'reports', label: '3. Audit & Reports', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                  { id: 'rights', label: '4. Privilege Control', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full text-left px-4 py-3 rounded-xl text-xs font-bold transition-all duration-200 flex items-center justify-between cursor-pointer ${
                      activeTab === tab.id 
                        ? 'active-neon-btn text-white' 
                        : 'hover:bg-slate-800/80 text-slate-300 hover:text-white'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={tab.icon}></path></svg>
                      <span>{tab.label}</span>
                    </div>
                    {activeTab === tab.id && <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7"></path></svg>}
                  </button>
                ))}
              </nav>
            </div>

            <div className="space-y-3 pt-3 border-t border-slate-800">
              <div className="p-3 bg-slate-800/70 rounded-xl border border-slate-700/80 flex items-center space-x-3">

                        <span className="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-lg text-[10px] font-bold">{g.count} Types</span>
                      </div>
                      <div className="flex justify-between items-end pt-2 border-t border-slate-100">
                        <div>
                          <p className="text-[10px] text-slate-400 font-bold uppercase">Available Units</p>
                          <p className="text-xl font-black text-slate-800">{g.totalQty}</p>
                        </div>
                        {g.lowCount > 0 ? (
                          <span className="px-2 py-1 bg-rose-100 text-rose-700 rounded-lg text-[10px] font-bold">{g.lowCount} Low Alert</span>
                        ) : (
                          <span className="px-2 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-[10px] font-bold">Healthy</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 4: AUDIT & REPORTS */}
            {activeTab === 'reports' && (
              <div className="flex-1 overflow-auto space-y-4">
                <header className="bg-white text-slate-900 p-3.5 rounded-xl shadow-sm flex justify-between items-center border border-slate-200">
                  <div>
                    <h1 className="text-sm font-extrabold tracking-wide uppercase">Audit & Compliance Reports</h1>
                    <p className="text-[10px] text-slate-500">Critical Assets, Low Stock & Dead Stock Verification</p>
                  </div>
                </header>

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 className="font-bold text-xs uppercase text-slate-800">Low Stock & Critical Audit Summary ({lowStockItems.length} Items)</h3>
                    <button 
                      onClick={() => {
                        const csvContent = "data:text/csv;charset=utf-8," 
                          + ["Group,Particulars,Brand,Category,Opening,Purchased,Issued,Balance,Location"].join(",") + "\n"
                          + assets.map(i => `${i.group},"${i.particulars}",${i.brand},${i.category},${i.openingQty},${i.newPurchase},${i.issueItems},${(Number(i.openingQty||0)+Number(i.newPurchase||0))-Number(i.issueItems||0)},${i.location}`).join("\n");
                        const encodedUri = encodeURI(csvContent);
                        const link = document.createElement("a");
                        link.setAttribute("href", encodedUri);
                        link.setAttribute("download", "IT_Stock_Audit_Report.csv");
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        showToast("Audit CSV report downloaded.");
                      }}
                      className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm cursor-pointer"
                    >
                      ⬇ Export Full CSV Ledger
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse table-compact">
                      <thead>
                        <tr className="bg-slate-100 text-slate-600 text-[10px] uppercase font-bold">
                          <th className="p-2">Group</th>
                          <th className="p-2">Particulars</th>
                          <th className="p-2 text-center">Balance</th>
                          <th className="p-2 text-center">Alert Limit</th>
                          <th className="p-2">Location</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-xs">
                        {lowStockItems.map((item, idx) => (
                          <tr key={idx}>
                            <td className="p-2 font-bold">{item.group}</td>
                            <td className="p-2">{item.particulars}</td>
                            <td className="p-2 text-center font-bold text-rose-600">{(Number(item.openingQty||0)+Number(item.newPurchase||0))-Number(item.issueItems||0)}</td>
                            <td className="p-2 text-center">{item.minAlert || 2}</td>
                            <td className="p-2">{item.location || 'Main Store'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 5: PRIVILEGE CONTROL */}
            {activeTab === 'rights' && (
              <div className="flex-1 overflow-auto space-y-4">
                <header className="bg-white text-slate-900 p-3.5 rounded-xl shadow-sm flex justify-between items-center border border-slate-200">
                  <div>
                    <h1 className="text-sm font-extrabold tracking-wide uppercase">System Security & Privilege Control</h1>
                    <p className="text-[10px] text-slate-500">Active Session & Cloud Sync Policy</p>
                  </div>
                </header>

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3 text-xs">
                  <div className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <div>
                      <p className="font-bold text-slate-900">Active Administrator Session</p>
                      <p className="text-slate-500 text-[11px]">Full Create, Read, Update, and Delete (CRUD) permissions active</p>
                    </div>
                    <span className="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold rounded-full text-[11px]">Authorized (PIN: 1234)</span>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Delete Confirmation Modal (Replaces window.confirm) */}
          {deleteConfirmAsset && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-slate-200 text-center space-y-4">
                <div className="mx-auto w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-lg">!</div>
                <div>
                  <h3 className="text-sm font-extrabold text-slate-900">Confirm Deletion</h3>
                  <p className="text-xs text-slate-500 mt-1">Are you sure you want to permanently remove <span className="font-bold text-slate-800">{deleteConfirmAsset.particulars}</span>?</p>
                </div>
                <div className="flex justify-center gap-3 pt-2">
                  <button onClick={() => setDeleteConfirmAsset(null)} className="px-4 py-2 border border-slate-300 rounded-xl text-xs font-bold text-slate-600 cursor-pointer">Cancel</button>
                  <button onClick={confirmDeleteAsset} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-md cursor-pointer">Yes, Delete</button>
                </div>
              </div>
            </div>
          )}

          {/* Add / Edit Asset Modal Form */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 border border-slate-200 max-h-[90vh] overflow-y-auto">
                <h3 className="text-sm font-bold text-slate-900 mb-4 border-b border-slate-200 pb-2">
                  {editingAsset ? 'Edit Stock Register Record' : 'Register New Asset Entry'}
                </h3>
                <form onSubmit={handleSaveAsset} className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Stock Group (Category)</label>
                    <input type="text" value={formData.group} onChange={(e) => setFormData({...formData, group: e.target.value})} placeholder="e.g. MOUSE, KEYBOARD" className="w-full p-2 border border-slate-300 rounded-lg outline-none uppercase font-bold" required />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Asset Particulars</label>
                    <input type="text" value={formData.particulars} onChange={(e) => setFormData({...formData, particulars: e.target.value})} placeholder="e.g. USB MOUSE DELL" className="w-full p-2 border border-slate-300 rounded-lg outline-none" required />
                  </div>

                  <div className="col-span-2 grid grid-cols-2 gap-3 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Cable Length (If applicable)</label>
                      <input type="text" value={formData.cableLength} onChange={(e) => setFormData({...formData, cableLength: e.target.value})} placeholder="e.g. 1.5, 3, 5" className="w-full p-1.5 border border-slate-300 rounded-lg bg-white outline-none" />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Measurement Unit</label>
                      <select value={formData.unit} onChange={(e) => setFormData({...formData, unit: e.target.value})} className="w-full p-1.5 border border-slate-300 rounded-lg bg-white outline-none font-bold cursor-pointer">
                        <option value="Piece">Piece</option>
                        <option value="Meter">Meter</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-blue-600 mb-1">Brand Name</label>
                    <input type="text" value={formData.brand} onChange={(e) => setFormData({...formData, brand: e.target.value})} placeholder="e.g. DELL, HP, LENOVO" className="w-full p-2 border border-blue-200 rounded-lg bg-blue-50/20 outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-emerald-700 mb-1">Entry Period (Month)</label>
                    <input type="text" value={formData.entryMonth} onChange={(e) => setFormData({...formData, entryMonth: e.target.value})} className="w-full p-2 border border-emerald-200 rounded-lg bg-emerald-50/30 font-semibold text-emerald-800 outline-none" required />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Serial Number / Asset Tag</label>
                    <input type="text" value={formData.serialNo} onChange={(e) => setFormData({...formData, serialNo: e.target.value})} placeholder="e.g. SN-99281-XYZ" className="w-full p-2 border border-slate-300 rounded-lg outline-none font-mono" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Procurement Vendor Name</label>
                    <input type="text" value={formData.vendor} onChange={(e) => setFormData({...formData, vendor: e.target.value})} placeholder="e.g. Tech Solutions Ltd" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Category Classification</label>
                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg outline-none cursor-pointer">
                      <option value="Consumable">Consumable</option>
                      <option value="Non-Consumable">Non-Consumable</option>
                      <option value="Fixed Assets">Fixed Assets</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Low Stock Alert Limit</label>
                    <input type="number" value={formData.minAlert} onChange={(e) => setFormData({...formData, minAlert: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Opening Quantity Stock (OP)</label>
                    <input type="number" value={formData.openingQty} onChange={(e) => setFormData({...formData, openingQty: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">New Purchase Quantity (Purch.)</label>
                    <input type="number" value={formData.newPurchase} onChange={(e) => setFormData({...formData, newPurchase: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Issued Quantity Total</label>
                    <input type="number" value={formData.issueItems} onChange={(e) => setFormData({...formData, issueItems: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Dead / Faulty Quantity</label>
                    <input type="number" value={formData.deadItems} onChange={(e) => setFormData({...formData, deadItems: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div className="col-span-2">
                    <label className="block font-semibold text-slate-700 mb-1">Installation Location / User Allocation</label>
                    <input type="text" value={formData.location} onChange={(e) => setFormData({...formData, location: e.target.value})} placeholder="e.g. B Block, Dr. Jha Room" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>

                  <div className="col-span-2 flex justify-end space-x-2 pt-4 border-t border-slate-200">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow-md cursor-pointer">Save Asset Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
