<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SQL.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #020617 0%, #080d1a 40%, #030712 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
    }
    .sql-editor { font-family: 'Courier New', Courier, monospace; background: #1e293b; color: #e2e8f0; padding: 15px; border-radius: 8px; border: 1px solid #334155; width: 100%; min-height: 120px; resize: vertical; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DB_BASE = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com";
    const FIREBASE_DB_URL = `${DB_BASE}/assets.json`;
    const FIREBASE_MASTER_URL = `${DB_BASE}/master_data.json`;
    const FIREBASE_AUDIT_URL = `${DB_BASE}/audit_log.json`;

    const defaultRoleRights = {
      Admin: { canAdd: true, canEdit: true, canDelete: true, canStockIn: true },
      "IT Manager": { canAdd: true, canEdit: true, canDelete: false, canStockIn: true },
      Technician: { canAdd: false, canEdit: true, canDelete: false, canStockIn: true },
      Viewer: { canAdd: false, canEdit: false, canDelete: false, canStockIn: false }
    };

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState({ name: 'Admin', role: 'IT Administrator' });
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [toastMsg, setToastMsg] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [roleRights, setRoleRights] = useState(defaultRoleRights);
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);

      // --- NEW STATES FOR MASTER, AUDIT & SQL ---
      const [masterData, setMasterData] = useState({ groups: [], locations: [], brands: [], units: [], itemNames: [], departments: [] });
      const [currentMasterType, setCurrentMasterType] = useState('groups');
      const [masterForm, setMasterForm] = useState({ name: '' });
      const [auditLogs, setAuditLogs] = useState([]);
      
      const [sqlDb, setSqlDb] = useState(null);
      const [sqlQuery, setSqlQuery] = useState('SELECT "group", COUNT(*) as TotalItems, SUM(openingQty) as TotalOpening FROM assets GROUP BY "group";');
      const [sqlResult, setSqlResult] = useState(null);
      const [sqlError, setSqlError] = useState('');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);

      const lineChartRef = useRef(null);
      const donutChartRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const [formData, setFormData] = useState({
        group: '', particulars: '', brand: '', serialNo: '', vendor: '', invoiceNo: '', warranty: '',
        openingQty: 0, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0,
        category: 'Consumable', location: '', minAlert: 2, entryMonth: getCurrentMonthYear()
      });

      // --- FETCH DATA & MASTER ---
      const fetchCloudData = async () => {
        try {
          const resAssets = await fetch(FIREBASE_DB_URL);
          const dataAssets = await resAssets.json();
          if (dataAssets) {
            setAssets(Object.keys(dataAssets).map(key => ({ ...dataAssets[key], firebaseKey: key })));
          } else { setAssets([]); }

          const resMaster = await fetch(FIREBASE_MASTER_URL);
          const dataMaster = await resMaster.json();
          if (dataMaster) { setMasterData(dataMaster); } 
          else {
            const defaultMaster = { groups: [{name:'IT Peripherals'}, {name:'Hardware'}], locations: [{name:'Server Room'}, {name:'A Block'}], brands: [{name:'Dell'}, {name:'HP'}, {name:'Cisco'}], units: [{name:'Piece'}, {name:'Meter'}], itemNames: [{name:'Optical Mouse'}, {name:'Keyboard'}], departments: [{name:'IT'}, {name:'Accounts'}] };
            setMasterData(defaultMaster);
            await fetch(FIREBASE_MASTER_URL, { method: 'PUT', body: JSON.stringify(defaultMaster) });
          }

          const resAudit = await fetch(FIREBASE_AUDIT_URL);
          const dataAudit = await resAudit.json();
          if (dataAudit) setAuditLogs(Object.values(dataAudit).reverse().slice(0, 50));

        } catch (err) { console.error("Fetch error:", err); } 
        finally { setLoading(false); }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 5000); // Increased to 5s to prevent race conditions
        return () => clearInterval(interval);
      }, []);

      // --- INITIALIZE SQL.JS & SYNC DATA ---
      useEffect(() => {
        if (!loading && window.initSqlJs && !sqlDb) {
          window.initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` })
            .then(SQL => {
              setSqlDb(new SQL.Database());
            });
        }
      }, [loading, sqlDb]);

      useEffect(() => {
        if (sqlDb && assets.length > 0) {
          sqlDb.run("DROP TABLE IF EXISTS assets;");
          sqlDb.run(`CREATE TABLE assets (id INTEGER, "group" TEXT, particulars TEXT, brand TEXT, location TEXT, openingQty INTEGER, newPurchase INTEGER, issueItems INTEGER, shortItems INTEGER, deadItems INTEGER);`);
          assets.forEach(a => {
            sqlDb.run(`INSERT INTO assets VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`, [
              a.id || 0, a.group || '', a.particulars || '', a.brand || '', a.location || '', 
              a.openingQty || 0, a.newPurchase || 0, a.issueItems || 0, a.shortItems || 0, a.deadItems || 0
            ]);
          });
        }
      }, [sqlDb, assets]);

      // --- AUDIT LOG LOGIC (OPTION A) ---
      const saveAuditLog = async (action, beforeData, afterData) => {
        const log = { module: 'assets', action, before: beforeData, after: afterData, timestamp: new Date().toLocaleString() };
        await fetch(FIREBASE_AUDIT_URL, { method: 'POST', body: JSON.stringify(log) });
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '1234') { setIsLoggedIn(true); setLoginError(''); }
        else { setLoginError('Invalid Security PIN (Default: 1234)'); }
      };

      const handleLogout = () => { setIsLoggedIn(false); setPinInput(''); };

      const handleOpenModal = (asset = null) => {
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          setEditingAsset(asset);
          setFormData({ ...asset, entryMonth: asset.entryMonth || autoMonth });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '', particulars: '', brand: '', serialNo: '', vendor: '', invoiceNo: '', warranty: '',
            openingQty: 0, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0,
            category: 'Consumable', location: '', minAlert: 2, entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const finalData = { ...formData, entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear() };

        try {
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `${DB_BASE}/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(finalData) });
            await saveAuditLog('UPDATE', editingAsset, finalData); // Save old and new data
            showToast("Record updated & backed up.");
          } else {
            const response = await fetch(FIREBASE_DB_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...finalData, id: currentTimestamp }) });
            await saveAuditLog('CREATE', null, finalData);
            showToast("New Asset added.");
          }
          setIsModalOpen(false);
          await fetchCloudData();
        } catch (err) { alert("Error saving entry."); } finally { setLoading(false); }
      };

      // --- MASTER DATA LOGIC ---
      const handleAddMaster = async (e) => {
        e.preventDefault();
        const newEntry = { id: Date.now(), name: masterForm.name };
        const currentList = masterData[currentMasterType] || [];
        const updatedList = [...currentList, newEntry];
        const updatedData = { ...masterData, [currentMasterType]: updatedList };
        await fetch(FIREBASE_MASTER_URL, { method: 'PUT', body: JSON.stringify(updatedData) });
        setMasterData(updatedData);
        setMasterForm({ name: '' });
        showToast(`Added to ${currentMasterType}`);
      };

      // --- SQL LOGIC ---
      const runSqlQuery = () => {
        if (!sqlDb) return showToast("SQL Engine loading...");
        setSqlError('');
        try {
          const res = sqlDb.exec(sqlQuery);
          if (res.length > 0) setSqlResult({ cols: res[0].columns, vals: res[0].values });
          else { setSqlResult(null); showToast("Query successful, 0 results."); }
        } catch (err) { setSqlError(err.message); setSqlResult(null); }
      };

      // Charts effect (kept from your original code)
      useEffect(() => {
        if (activeTab === 'dashboard' && isLoggedIn) {
          setTimeout(() => {
            const lineCtx = document.getElementById('trendLineChart');
            if (lineCtx) {
              if (lineChartRef.current) lineChartRef.current.destroy();
              lineChartRef.current = new Chart(lineCtx, {
                type: 'line',
                data: { labels: ['Jul', 'Aug', 'Sep', 'Oct', 'Nov'], datasets: [{ label: 'Entries', data: [40, 55, 60, 65, assets.length || 76], borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.1)', tension: 0.3, fill: true, pointRadius: 4 }, { label: 'Issued', data: [25, 38, 42, 50, assets.reduce((acc, i) => acc + Number(i.issueItems || 0), 0) || 53], borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.05)', tension: 0.3, fill: true, pointRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } } }
              });
            }
            const donutCtx = document.getElementById('overviewDonutChart');
            if (donutCtx) {
              if (donutChartRef.current) donutChartRef.current.destroy();
              const consumable = assets.filter(i => i.category === 'Consumable').length || 25;
              const nonConsumable = assets.filter(i => i.category === 'Non-Consumable').length || 35;
              const remaining = Math.max((assets.length || 76) - (consumable + nonConsumable), 16);
              donutChartRef.current = new Chart(donutCtx, {
                type: 'doughnut',
                data: { labels: ['IT Equipment', 'Peripherals', 'Consumables'], datasets: [{ data: [remaining, nonConsumable, consumable], backgroundColor: ['#2563eb', '#10b981', '#a855f7'], borderWidth: 2, borderColor: '#ffffff' }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false } } }
              });
            }
          }, 100);
        }
      }, [activeTab, isLoggedIn, assets]);

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) || (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) || (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        return matchesSearch && matchesLocation && matchesMonth;
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);
      const totalRecords = assets.length;
      const lowStockItems = assets.filter(item => (Number(item.openingQty || 0) + Number(item.newPurchase || 0) - Number(item.issueItems || 0)) <= Number(item.minAlert || 2));
      const currentMonthRecords = assets.filter(i => (i.entryMonth || '').toLowerCase() === getCurrentMonthYear().toLowerCase()).length;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <h1 className="text-2xl font-bold text-center mb-6">IT Asset Portal</h1>
              <form onSubmit={handleLogin} className="space-y-4">
                <input type="password" placeholder="Enter PIN (Default: 1234)" value={pinInput} onChange={(e) => setPinInput(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs" required />
                {loginError && <p className="text-xs text-rose-500">{loginError}</p>}
                <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-xl text-xs font-semibold">Sign In</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100">
          
          {toastMsg && <div className="fixed top-4 right-4 z-50 bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-2xl">{toastMsg}</div>}

          <aside className="w-64 neon-sidebar text-slate-300 flex flex-col justify-between p-4 shadow-2xl border-r border-slate-900 relative overflow-y-auto">
            <div>
              <div className="text-center pt-2 pb-5 border-b border-slate-800/60">
                <h2 className="font-black text-white text-base tracking-wider leading-tight">IT ASSET</h2>
                <span className="text-[11px] text-emerald-400 font-bold flex items-center justify-center gap-1.5 mt-2"><span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Sync</span>
              </div>
              <nav className="mt-5 space-y-2">
                {[
                  { id: 'dashboard', label: 'Dashboard' },
                  { id: 'inventory', label: '1. Stock Register' },
                  { id: 'master', label: '2. Master Data' },
                  { id: 'sql', label: '3. SQL Playground ⭐' },
                  { id: 'safety', label: '4. Data Safety' },
                  { id: 'analytics', label: '5. Analytics Board' },
                  { id: 'reports', label: '6. Audit & Reports' },
                  { id: 'rights', label: '7. Privilege Control' }
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`w-full text-left px-4 py-3 rounded-2xl text-xs font-bold transition-all duration-200 flex items-center justify-between cursor-pointer ${activeTab === tab.id ? 'active-neon-btn text-white' : 'hover:bg-slate-900/80 text-slate-300'}`}>{tab.label}</button>
                ))}
              </nav>
            </div>
            <button onClick={handleLogout} className="mt-4 py-3 bg-rose-900 hover:bg-rose-800 text-white rounded-2xl font-bold text-xs">Sign Out</button>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden p-4 space-y-3 overflow-y-auto">
            
            {/* DASHBOARD TAB */}
            {activeTab === 'dashboard' && (
              <div className="flex-1 overflow-auto space-y-5">
                <header className="px-2 py-2 flex justify-between items-center">
                  <h1 className="text-lg font-extrabold text-slate-900 tracking-tight">Operations Dashboard</h1>
                </header>
                <div className="grid grid-cols-3 gap-5">
                  <div className="p-5 rounded-2xl bg-blue-600 text-white shadow-lg flex justify-between items-center"><div><p className="text-xs font-semibold uppercase">Total Assets</p><h2 className="text-4xl font-extrabold">{totalRecords}</h2></div></div>
                  <div className="p-5 rounded-2xl bg-emerald-400 text-emerald-950 shadow-lg flex justify-between items-center"><div><p className="text-xs font-bold uppercase">This Month Entries</p><h2 className="text-4xl font-extrabold">{currentMonthRecords}</h2></div></div>
                  <div className="p-5 rounded-2xl bg-rose-500 text-white shadow-lg flex justify-between items-center"><div><p className="text-xs font-semibold uppercase">Low Stock Alerts</p><h2 className="text-4xl font-extrabold">{lowStockItems.length}</h2></div></div>
                </div>
                <div className="grid grid-cols-12 gap-5">
                  <div className="col-span-4 bg-white p-5 rounded-2xl shadow-sm border flex flex-col justify-between"><h3 className="font-bold text-sm">Asset Overview</h3><div className="relative h-44 my-2"><canvas id="overviewDonutChart"></canvas></div></div>
                  <div className="col-span-5 bg-white p-5 rounded-2xl shadow-sm border flex flex-col justify-between"><h3 className="font-bold text-sm">Monthly Trend</h3><div className="h-52 w-full mt-3"><canvas id="trendLineChart"></canvas></div></div>
                  <div className="col-span-3 bg-white p-5 rounded-2xl shadow-sm border flex flex-col items-center justify-center"><button onClick={() => handleOpenModal()} className="w-full py-6 bg-blue-50 text-blue-600 rounded-2xl font-bold">+ Add Asset</button></div>
                </div>
              </div>
            )}

            {/* INVENTORY TAB */}
            {activeTab === 'inventory' && (
              <div className="flex-1 flex flex-col space-y-3">
                 <header className="bg-slate-900 text-white p-3 rounded-xl flex justify-between items-center">
                    <h1 className="text-sm font-extrabold uppercase">Stock Register & Inventory</h1>
                    <button onClick={() => handleOpenModal()} className="px-3 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg">+ New Asset</button>
                 </header>
                 <div className="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 flex flex-col">
                    <div className="overflow-x-auto">
                      <table className="w-full text-[11px] text-left border-collapse whitespace-nowrap table-compact">
                        <thead className="bg-slate-950 text-white text-[10px] uppercase">
                          <tr>
                            <th className="px-2 py-2 border-r">#</th>
                            <th className="px-2 py-2 border-r">Group</th>
                            <th className="px-2 py-2 border-r">Particulars</th>
                            <th className="px-2 py-2 border-r">Brand</th>
                            <th className="px-2 py-2 border-r text-center">Opening</th>
                            <th className="px-2 py-2 border-r text-center">Purch.</th>
                            <th className="px-2 py-2 border-r text-center">Issued</th>
                            <th className="px-2 py-2 border-r text-center">Balance</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {currentItems.map((item, index) => {
                            const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
                            return (
                              <tr key={item.firebaseKey || index} className="hover:bg-slate-50">
                                <td className="px-2 py-2 border-r text-center">{indexOfFirstItem + index + 1}</td>
                                <td className="px-2 py-2 border-r font-bold">{item.group}</td>
                                <td className="px-2 py-2 border-r font-semibold cursor-pointer text-blue-600" onClick={() => handleOpenModal(item)}>{item.particulars}</td>
                                <td className="px-2 py-2 border-r">{item.brand}</td>
                                <td className="px-2 py-2 border-r text-center">{item.openingQty || 0}</td>
                                <td className="px-2 py-2 border-r text-center">{item.newPurchase || 0}</td>
                                <td className="px-2 py-2 border-r text-center text-emerald-600">{item.issueItems || 0}</td>
                                <td className="px-2 py-2 border-r text-center font-bold text-blue-700">{bal}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                 </div>
              </div>
            )}

            {/* MASTER DATA TAB */}
            {activeTab === 'master' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm space-y-6">
                <h2 className="text-lg font-extrabold border-b pb-2">Master Data Manager</h2>
                <div className="flex gap-4">
                  <div className="w-1/3 space-y-2 border-r pr-4">
                    {['groups', 'locations', 'brands', 'units', 'itemNames', 'departments'].map(type => (
                      <button key={type} onClick={() => setCurrentMasterType(type)} className={`w-full text-left px-4 py-2 rounded-xl capitalize font-bold text-xs ${currentMasterType === type ? 'bg-blue-100 text-blue-700' : 'hover:bg-slate-50 text-slate-600'}`}>{type}</button>
                    ))}
                  </div>
                  <div className="w-2/3 space-y-4">
                    <form onSubmit={handleAddMaster} className="flex gap-2">
                      <input required type="text" placeholder={`Add new ${currentMasterType}`} value={masterForm.name} onChange={e => setMasterForm({name: e.target.value})} className="flex-1 p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500" />
                      <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold text-xs">Add Item</button>
                    </form>
                    <div className="max-h-64 overflow-y-auto border rounded-xl">
                      <table className="w-full text-xs text-left">
                        <tbody className="divide-y">
                          {(masterData[currentMasterType] || []).map((item, idx) => (
                            <tr key={idx} className="hover:bg-slate-50"><td className="p-2 font-bold text-slate-700">{item.name}</td><td className="p-2 text-right text-emerald-600">Active</td></tr>
                          ))}
                          {(masterData[currentMasterType] || []).length === 0 && <tr><td className="p-4 text-center text-slate-400">No items added yet.</td></tr>}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* SQL PLAYGROUND TAB */}
            {activeTab === 'sql' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                <header className="flex justify-between items-center border-b pb-4">
                  <div><h2 className="text-lg font-extrabold">SQL Playground ⭐</h2><p className="text-xs text-slate-500">Practice SQL on live 'assets' table (Read-Only).</p></div>
                  <button onClick={runSqlQuery} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow">▶ Run Query</button>
                </header>
                <div className="grid grid-cols-4 gap-4">
                  <div className="col-span-1 bg-slate-50 p-4 rounded-xl border text-xs">
                    <h3 className="font-bold mb-2">Table: assets</h3>
                    <ul className="list-disc pl-4 text-slate-600 space-y-1 font-mono">
