    // Helper to download real CSV files
    function exportToCSV(filename, rows) {
      if (!rows || !rows.length) return;
      const separator = ',';
      const keys = Object.keys(rows[0]);
      const csvContent =
        keys.join(separator) +
        '\n' +
        rows.map(row => {
          return keys.map(k => {
            let cell = row[k] === null || row[k] === undefined ? '' : String(row[k]);
            cell = cell.replace(/"/g, '""');
            if (cell.search(/("|,|\n)/g) >= 0) cell = `"${cell}"`;
            return cell;
          }).join(separator);
        }).join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

        brand: 'Dell',
        customBrand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        cableLength: '',
        measurementUnit: 'Piece',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear(),
        lastUpdated: getFormattedDateTime()

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        const timestamped = getFormattedDateTime();
        const finalBrand = formData.brand === 'Other' ? formData.customBrand : formData.brand;

        if (editingAsset) {
          const updated = {
            ...editingAsset,
            ...formData,
            brand: finalBrand,
            lastUpdated: timestamped
          };
          try {
            if (editingAsset.firebaseKey) {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updated)
              });
            }
            setAssets(assets.map(a => (a.id === editingAsset.id || a.firebaseKey === editingAsset.firebaseKey) ? updated : a));
            showToast("Asset specification successfully updated!", "success");
          } catch(err) {
            showToast("Error updating record in database.", "error");
          }
        } else {
          const newAsset = {
            id: Date.now(),
            ...formData,
            brand: finalBrand,
            lastUpdated: timestamped
          };
          try {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newAsset)
            });
            const res = await fetch(FIREBASE_DB_URL);
            const data = await res.json();
            if (data) setAssets(Object.keys(data).map(k => ({ ...data[k], firebaseKey: k })));
            showToast("New asset registered successfully!", "success");
          } catch(err) {
            setAssets([newAsset, ...assets]);
            showToast("Asset saved locally.", "info");
          }
        }

        setIsModalOpen(false);
        setEditingAsset(null);
      };

      const handleDeleteAsset = async (item) => {
        if (window.confirm(`Permanently remove "${item.particulars}" from active registry?`)) {
          try {
            if (item.firebaseKey) {
              await fetch(`https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${item.firebaseKey}.json`, {
                method: 'DELETE'
              });
            }
            setAssets(assets.filter(a => a.id !== item.id && a.firebaseKey !== item.firebaseKey));
            showToast("Asset record successfully deleted.", "info");
          } catch(err) {
            showToast("Failed to delete record.", "error");
          }
        }
      };

      // Summary KPIs
      const summaryMetrics = useMemo(() => {
        let totalItems = 0;
        let totalIssued = 0;
        let totalShort = 0;
        let totalDead = 0;
        let lowStockCount = 0;

        assets.forEach(a => {
          const op = Number(a.openingQty || 0);
          const pur = Number(a.newPurchase || 0);
          const iss = Number(a.issueItems || 0);
          const sh = Number(a.shortItems || 0);
          const dd = Number(a.deadItems || 0);
          const bal = (op + pur) - (iss + sh + dd);
          totalItems += (op + pur);
          totalIssued += iss;
          totalShort += sh;
          totalDead += dd;
          if (bal <= Number(a.minAlert || 2)) lowStockCount++;
        });

        return { totalItems, totalIssued, totalShort, totalDead, lowStockCount };
      }, [assets]);

      const groupCounts = useMemo(() => {
        return assets.reduce((acc, curr) => {
          const g = curr.group || 'OTHER';
          acc[g] = (acc[g] || 0) + 1;
          return acc;
        }, {});
      }, [assets]);

      const filteredAssets = useMemo(() => {
        return assets.filter(item => {
          const searchLower = searchQuery.toLowerCase();
          const matchesSearch = (item.particulars || '').toLowerCase().includes(searchLower) ||
                              (item.group || '').toLowerCase().includes(searchLower) ||
                              (item.serialNo || '').toLowerCase().includes(searchLower) ||
                              (item.brand || '').toLowerCase().includes(searchLower) ||
                              (item.location || '').toLowerCase().includes(searchLower);
          const matchesLocation = locationFilter === 'All' || !locationFilter || (item.location || '').toLowerCase() === locationFilter.toLowerCase();
          const matchesGroup = !selectedGroupFilter || (item.group || '').toLowerCase() === selectedGroupFilter.toLowerCase();
          return matchesSearch && matchesLocation && matchesGroup;
        });
      }, [assets, searchQuery, locationFilter, selectedGroupFilter]);

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const paginatedAssets = useMemo(() => {
        return filteredAssets.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

      // Quick 1-click Return Handler for Temp Dispatches

                      >
