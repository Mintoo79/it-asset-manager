<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    /* Custom subtle horizontal scrollbar for Group Strip */
    .group-scroll::-webkit-scrollbar {
      height: 5px;
    }
    .group-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
    .group-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .group-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans antialiased selection:bg-indigo-600 selection:text-white">
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading IT Asset Portal...</div>
        <div style="font-size: 12px; color: #94a3b8;">Establishing secure cloud connection</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";
    const LOCAL_STORAGE_KEY = "it_asset_inventory_fallback_v1";
    const USERS_STORAGE_KEY = "it_asset_system_users_v1";

    const DEFAULT_SAMPLE_ASSETS = [
      { firebaseKey: 'sample_1', group: 'MOUSE', particulars: 'USB Optical Mouse - Dell', brand: 'Dell', category: 'Consumable', openingQty: 15, newPurchase: 10, issueItems: 8, shortItems: 0, deadItems: 1, minAlert: 5, location: 'Main IT Store', entryMonth: 'Nov 2026', unit: 'Piece', cableLength: '' },
      { firebaseKey: 'sample_2', group: 'KEYBOARD', particulars: 'Wired USB Keyboard - HP', brand: 'HP', category: 'Consumable', openingQty: 12, newPurchase: 5, issueItems: 15, shortItems: 0, deadItems: 0, minAlert: 4, location: 'B Block', entryMonth: 'Nov 2026', unit: 'Piece', cableLength: '' },
      { firebaseKey: 'sample_3', group: 'STORAGE', particulars: 'SSD 512GB SATA III', brand: 'WD', unit: 'GB', category: 'Fixed Assets', openingQty: 8, newPurchase: 4, issueItems: 3, shortItems: 0, deadItems: 0, minAlert: 3, location: 'Server Room', entryMonth: 'Nov 2026', cableLength: '' },
      { firebaseKey: 'sample_4', group: 'CABLES', particulars: 'HDMI High-Speed Cable', brand: 'UGREEN', cableLength: '5', unit: 'Meter', category: 'Consumable', openingQty: 20, newPurchase: 0, issueItems: 6, shortItems: 0, deadItems: 0, minAlert: 5, location: 'A Block', entryMonth: 'Oct 2026' },
      { firebaseKey: 'sample_5', group: 'PERIPHERALS', particulars: 'HD Web Camera 1080p', brand: 'Logitech', unit: 'Piece', category: 'Fixed Assets', openingQty: 5, newPurchase: 2, issueItems: 6, shortItems: 0, deadItems: 0, minAlert: 2, location: 'Conference Room', entryMonth: 'Nov 2026', cableLength: '' }
    ];

    const DEFAULT_USERS = [
      { id: 'usr_super', name: 'Super Admin', pin: '1234', role: 'Super Admin', permissions: 'Full Access (Master + Create Users + Delete)' },
      { id: 'usr_tech', name: 'IT Technician', pin: '2222', role: 'Operator', permissions: 'Stock Entry & Issue' }
    ];

    const DEFAULT_BRANDS = ['Dell', 'HP', 'Lenovo', 'Logitech', 'WD', 'Seagate', 'Kingston', 'UGREEN', 'Cisco', 'Samsung', 'Mantra', 'Wacom', 'Honeywell', 'Other'];

    const IMPORTANT_ITEMS = ['mouse', 'keyboard', 'ram', 'ssd', 'hdd', 'web camera', 'camera'];

    const GROUP_COLORS = [
      { bg: 'bg-slate-50', border: 'border-slate-200', text: 'text-slate-800', badge: 'bg-blue-600 text-white' },
      { bg: 'bg-slate-50', border: 'border-slate-200', text: 'text-slate-800', badge: 'bg-teal-600 text-white' },
      { bg: 'bg-slate-50', border: 'border-slate-200', text: 'text-slate-800', badge: 'bg-indigo-600 text-white' },
      { bg: 'bg-slate-50', border: 'border-slate-200', text: 'text-slate-800', badge: 'bg-emerald-600 text-white' },
      { bg: 'bg-slate-50', border: 'border-slate-200', text: 'text-slate-800', badge: 'bg-cyan-700 text-white' },
      { bg: 'bg-slate-50', border: 'border-slate-200', text: 'text-slate-800', badge: 'bg-slate-700 text-white' }
    ];

    function App() {
      const [users, setUsers] = useState(() => {
        try {
          const saved = localStorage.getItem(USERS_STORAGE_KEY);
          return saved ? JSON.parse(saved) : DEFAULT_USERS;
        } catch (e) {
          return DEFAULT_USERS;
        }
      });

      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);
      const [cloudConnected, setCloudConnected] = useState(false);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [deleteConfirmAsset, setDeleteConfirmAsset] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      // New User Form State (Super Admin Privilege Control)
      const [newUserName, setNewUserName] = useState('');
      const [newUserPin, setNewUserPin] = useState('');
      const [newUserRole, setNewUserRole] = useState('Super Admin');

      const lineChartRef = useRef(null);
      const donutChartRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        cableLength: '',
        unit: 'Piece',
        brand: 'Dell',
        customBrand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear()
      });

      const loadLocalFallback = () => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            setAssets(JSON.parse(cached));
          } else {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(DEFAULT_SAMPLE_ASSETS));
            setAssets(DEFAULT_SAMPLE_ASSETS);
          }
        } catch (e) {
          setAssets(DEFAULT_SAMPLE_ASSETS);
        }
      };

      const saveLocalFallback = (updatedList) => {
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(updatedList));
        } catch (e) {
          console.warn("Local storage save skipped:", e);
        }
      };

      const fetchCloudData = async () => {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);
          const res = await fetch(FIREBASE_DB_URL, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (!res.ok) throw new Error("Network response not ok");
          const data = await res.json();
          setCloudConnected(true);
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
            saveLocalFallback(list);
          } else {
            loadLocalFallback();
          }
        } catch (err) {
          setCloudConnected(false);
          loadLocalFallback();
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 5000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (activeTab === 'dashboard' && isLoggedIn) {
          const timer = setTimeout(() => {
            const lineCtx = document.getElementById('trendLineChart');
            if (lineCtx && window.Chart) {
              if (lineChartRef.current) lineChartRef.current.destroy();
              lineChartRef.current = new Chart(lineCtx, {
                type: 'line',
                data: {
                  labels: ['Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
                  datasets: [
                    {
                      label: 'Entries',
                      data: [40, 55, 60, 65, assets.length || 5],
                      borderColor: '#4f46e5',
                      backgroundColor: 'rgba(79, 70, 229, 0.1)',
                      tension: 0.3,
                      fill: true,
                      pointRadius: 4
                    },
                    {
                      label: 'Issued',
                      data: [25, 38, 42, 50, assets.reduce((acc, i) => acc + Number(i.issueItems || 0), 0)],
                      borderColor: '#10b981',
                      backgroundColor: 'rgba(16, 185, 129, 0.05)',
                      tension: 0.3,
                      fill: true,
                      pointRadius: 4
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  scales: {
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                  }
                }
              });
            }

            const donutCtx = document.getElementById('overviewDonutChart');
            if (donutCtx && window.Chart) {
              if (donutChartRef.current) donutChartRef.current.destroy();
              const consumable = assets.filter(i => i.category === 'Consumable').length;
              const nonConsumable = assets.filter(i => i.category === 'Non-Consumable').length;
              const fixedAssets = assets.filter(i => i.category === 'Fixed Assets').length;

              donutChartRef.current = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                  labels: ['Fixed Assets', 'Non-Consumable', 'Consumables'],
                  datasets: [{
                    data: [fixedAssets || 1, nonConsumable || 1, consumable || 1],
                    backgroundColor: ['#4f46e5', '#10b981', '#a855f7'],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  cutout: '72%',
                  plugins: { legend: { display: false } }
                }
              });
            }
          }, 100);
          return () => clearTimeout(timer);
        }
      }, [activeTab, isLoggedIn, assets]);

      const handleLogin = (e) => {
        e.preventDefault();
        const foundUser = users.find(u => u.pin === pinInput.trim());
        if (foundUser) {
          setCurrentUser(foundUser);
          setIsLoggedIn(true);
          setLoginError('');
        } else {
          setLoginError('Invalid Security PIN (Default Super Admin PIN: 1234)');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setCurrentUser(null);
        setPinInput('');
      };

      const handleCreateUser = (e) => {
        e.preventDefault();
        if (!newUserName.trim() || !newUserPin.trim()) return;
        if (users.some(u => u.pin === newUserPin.trim())) {
          showToast("PIN already exists! Choose a unique PIN.");
          return;
        }
        const perms = newUserRole === 'Super Admin'
          ? 'Full Access (Master + Create Users + Delete)'
          : newUserRole === 'Admin'
          ? 'Stock Entry + Reports + Edit'
          : 'Stock Entry & View Only';
        const newUserObj = {
          id: 'usr_' + Date.now(),
          name: newUserName.trim(),
          pin: newUserPin.trim(),
          role: newUserRole,
          permissions: perms
        };
        const updatedUsers = [...users, newUserObj];
        setUsers(updatedUsers);
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(updatedUsers));
        setNewUserName('');
        setNewUserPin('');
        showToast(`User "${newUserObj.name}" (${newUserObj.role}) created!`);
      };

      const handleDeleteUser = (userId) => {
        if (userId === 'usr_super') {
          showToast("Primary Super Admin cannot be removed.");
          return;
        }
        const updatedUsers = users.filter(u => u.id !== userId);
        setUsers(updatedUsers);
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(updatedUsers));
        showToast("User account removed.");
      };

      const handleOpenModal = (asset = null) => {
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          const isKnownBrand = DEFAULT_BRANDS.includes(asset.brand);
          setEditingAsset(asset);
          setFormData({
            group: asset.group || '',
            particulars: asset.particulars || '',
            cableLength: asset.cableLength || '',
            unit: asset.unit || 'Piece',
            brand: isKnownBrand ? (asset.brand || 'Dell') : 'Other',
            customBrand: isKnownBrand ? '' : (asset.brand || ''),
            serialNo: asset.serialNo || '',
            vendor: asset.vendor || '',
            invoiceNo: asset.invoiceNo || '',
            warranty: asset.warranty || '',
            openingQty: asset.openingQty || 0,
            newPurchase: asset.newPurchase || 0,
            issueItems: asset.issueItems || 0,
            shortItems: asset.shortItems || 0,
            deadItems: asset.deadItems || 0,
            category: asset.category || 'Consumable',
            location: asset.location || '',
            minAlert: asset.minAlert || 2,
            entryMonth: asset.entryMonth || autoMonth
          });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            cableLength: '',
            unit: 'Piece',
            brand: 'Dell',
            customBrand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '',
            minAlert: 2,
            entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const resolvedBrand = formData.brand === 'Other' && formData.customBrand.trim()
          ? formData.customBrand.trim()
          : formData.brand;
        const { customBrand, ...cleanFormData } = formData;
        const finalData = {
          ...cleanFormData,
          brand: resolvedBrand,
          group: (formData.group || 'GENERAL').toUpperCase().trim(),
          entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear()
        };

        let updatedList;
        if (editingAsset && editingAsset.firebaseKey) {
          updatedList = assets.map(item =>
            item.firebaseKey === editingAsset.firebaseKey ? { ...finalData, firebaseKey: editingAsset.firebaseKey } : item
          );
        } else {
          const newRecord = { ...finalData, id: currentTimestamp, firebaseKey: `local_${currentTimestamp}` };
          updatedList = [newRecord, ...assets];
        }

        setAssets(updatedList);
        saveLocalFallback(updatedList);
        setIsModalOpen(false);
        showToast(editingAsset ? "Asset record updated!" : "New asset added to ledger!");

        try {
          if (editingAsset && editingAsset.firebaseKey && !editingAsset.firebaseKey.startsWith('sample_') && !editingAsset.firebaseKey.startsWith('local_')) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalData)
            });
          } else {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...finalData, id: currentTimestamp })
            });
          }
          await fetchCloudData();
        } catch (err) {
          console.warn("Saved locally (Cloud offline)");
        } finally {
          setLoading(false);
        }
      };

      const confirmDeleteAsset = async () => {
        if (!deleteConfirmAsset) return;
        const asset = deleteConfirmAsset;
        setDeleteConfirmAsset(null);
        setLoading(true);

        const updatedList = assets.filter(item => item.firebaseKey !== asset.firebaseKey);
        setAssets(updatedList);
        saveLocalFallback(updatedList);
        showToast("Asset record deleted.");

        try {
          if (asset.firebaseKey && !asset.firebaseKey.startsWith('sample_') && !asset.firebaseKey.startsWith('local_')) {
            const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${asset.firebaseKey}.json`;
            await fetch(deleteUrl, { method: 'DELETE' });
            await fetchCloudData();
          }
        } catch (err) {
          console.warn("Deleted locally");
        } finally {
          setLoading(false);
        }
      };

      const handleExportCSV = () => {
        const headers = ['Group', 'Particulars', 'Brand', 'CableLength', 'Unit', 'Category', 'Opening', 'Purchase', 'Issued', 'Short', 'Dead', 'PhysicalBal', 'Location', 'Month'];
        const rows = assets.map(item => {
          const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
          const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
          return [
            `"${item.group || ''}"`,
            `"${item.particulars || ''}"`,
            `"${item.brand || ''}"`,
            `"${item.cableLength || ''}"`,
            `"${item.unit || 'Piece'}"`,
            `"${item.category || ''}"`,
            item.openingQty || 0,
            item.newPurchase || 0,
            item.issueItems || 0,
            item.shortItems || 0,
            item.deadItems || 0,
            phy,
            `"${item.location || ''}"`,
            `"${item.entryMonth || ''}"`
          ].join(',');
        });
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `IT_Stock_Register_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Stock Register exported to CSV!");
      };

      // Alphabetical Group Summary Calculation
      const groupMap = {};
      assets.forEach(item => {
        const grp = (item.group || 'GENERAL').toUpperCase().trim();
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        const isLow = phy <= Number(item.minAlert || 2);
        if (!groupMap[grp]) {
          groupMap[grp] = { name: grp, count: 0, totalStock: 0, lowCount: 0 };
        }
        groupMap[grp].count += 1;
        groupMap[grp].totalStock += Math.max(phy, 0);
        if (isLow) groupMap[grp].lowCount += 1;
      });
      const sortedGroups = Object.values(groupMap).sort((a, b) => a.name.localeCompare(b.name));

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        const matchesGroup = selectedGroupFilter === '' || (item.group || 'GENERAL').toUpperCase().trim() === selectedGroupFilter;
        return matchesSearch && matchesLocation && matchesMonth && matchesGroup;
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);

      const totalRecords = assets.length;
      const lowStockItems = assets.filter(item => {
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        return phy <= Number(item.minAlert || 2);
      });
      const currentMonthRecords = assets.filter(i => (i.entryMonth || '').toLowerCase() === getCurrentMonthYear().toLowerCase()).length;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <div className="text-center mb-6">
                <div className="inline-flex p-3.5 bg-indigo-50 text-indigo-600 rounded-2xl mb-3 shadow-inner border border-indigo-100">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">IT Asset Portal</h1>
                <p className="text-xs font-medium text-slate-500 mt-1">Enterprise Cloud Inventory Infrastructure</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Security PIN Code</label>
                  <input
                    type="password"
                    placeholder="Enter PIN (Super Admin Default: 1234)"
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-indigo-600 outline-none transition"
                    required
                  />
                </div>

                {loginError && <p className="text-xs text-rose-500 font-medium">{loginError}</p>}

                <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-indigo-500/20 transition duration-150 flex items-center justify-center gap-2 cursor-pointer">
                  Authenticate & Sign In
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-[#f8fafc]">
          {/* Toast Notification */}
          {toastMsg && (

                              <td className="text-center font-mono text-rose-500">{dead}</td>
                              <td className="text-center font-mono font-extrabold bg-indigo-50/50">
                                <span className={`px-2 py-0.5 rounded-full text-[11px] ${isLow ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                  {phy}
                                </span>
                              </td>
                              <td>
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                  item.category === 'Fixed Assets'
                                    ? 'bg-purple-100 text-purple-800'
                                    : item.category === 'Non-Consumable'
                                    ? 'bg-sky-100 text-sky-800'
                                    : 'bg-emerald-100 text-emerald-800'
                                }`}>
                                  {item.category || 'Consumable'}
                                </span>
                              </td>
                              <td className="text-slate-600 font-medium">{item.location || '-'}</td>
                              <td className="text-center">
                                <button
                                  onClick={() => setDeleteConfirmAsset(item)}
                                  className="px-2 py-0.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded text-[10px] font-bold transition cursor-pointer"
                                >
                                  Del
                                </button>
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>

                {/* Bottom Status & Pagination Bar */}
                <footer className="bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center text-xs">
                  <div className="flex items-center space-x-4">
                    <div className="flex items-center space-x-2">
                      <span className="text-slate-500 font-medium">Rows per view:</span>
                      <select
                        value={itemsPerPage}
                        onChange={(e) => { setItemsPerPage(Number(e.target.value)); setCurrentPage(1); }}
                        className="border border-slate-300 rounded-lg px-2 py-1 font-bold text-slate-700 bg-slate-50 outline-none"
                      >
                        <option value={10}>10</option>
                        <option value={25}>25</option>
                        <option value={50}>50</option>
                        <option value={100}>100</option>
                      </select>
                    </div>
                    <span className="text-slate-500 font-semibold">
                      Showing {filteredAssets.length === 0 ? 0 : indexOfFirstItem + 1}–{Math.min(indexOfLastItem, filteredAssets.length)} of {filteredAssets.length} records
                    </span>
                  </div>

                  <div className="flex items-center space-x-2">
                    <button
                      disabled={currentPage === 1}
                      onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                      className="px-3 py-1 rounded-lg border border-slate-300 font-bold disabled:opacity-40 hover:bg-slate-100 cursor-pointer"
                    >
                      Prev
                    </button>
                    <span className="font-bold text-indigo-600 px-2">Page {currentPage} of {totalPages}</span>
                    <button
                      disabled={currentPage === totalPages}
                      onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                      className="px-3 py-1 rounded-lg border border-slate-300 font-bold disabled:opacity-40 hover:bg-slate-100 cursor-pointer"
                    >
                      Next
                    </button>
                  </div>
                </footer>
              </>
            )}

            {/* TAB 2: ANALYTICS BOARD */}
            {activeTab === 'analytics' && (
              <div className="flex-1 overflow-auto space-y-5">
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h2 className="text-base font-extrabold text-slate-900">Group-Wise Stock Distribution & Analytics</h2>
                  <p className="text-xs text-slate-500 mb-4">Real-time breakdown of physical stock quantities across asset groups.</p>

                  <div className="space-y-3">
                    {sortedGroups.map((grp, idx) => {
                      const maxStock = Math.max(...sortedGroups.map(g => g.totalStock), 1);
                      const pct = Math.round((grp.totalStock / maxStock) * 100);
                      return (
                        <div key={grp.name} className="space-y-1">
                          <div className="flex justify-between text-xs font-bold">
                            <span className="text-slate-800">{grp.name} ({grp.count} Items)</span>
                            <span className="text-indigo-600">{grp.totalStock} Units</span>
                          </div>
                          <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-indigo-600 rounded-full transition-all duration-500"
                              style={{ width: `${pct}%` }}
                            ></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: AUDIT & REPORTS */}
            {activeTab === 'reports' && (
              <div className="flex-1 overflow-auto space-y-5">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <h2 className="text-base font-extrabold text-slate-900">Audit Ledger & CSV Export</h2>
                    <p className="text-xs text-slate-500 mt-0.5">Download the complete stock register with physical balances, brands, and cable measurements.</p>
                  </div>
                  <button
                    onClick={handleExportCSV}
                    className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow transition cursor-pointer"
                  >
                    ⬇ Download CSV Report
                  </button>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 className="text-sm font-bold text-rose-600 mb-3">Low Stock Action Items ({lowStockItems.length})</h3>
                  {lowStockItems.length === 0 ? (
                    <p className="text-xs text-slate-500">All items are currently above minimum threshold limits.</p>
                  ) : (
                    <div className="divide-y divide-slate-100 text-xs">
                      {lowStockItems.map((item, i) => {
                        const phy = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0) - Number(item.shortItems || 0) - Number(item.deadItems || 0);
                        return (
                          <div key={i} className="py-2.5 flex justify-between items-center">
                            <div>
                              <span className="font-bold text-slate-800">{item.particulars}</span>
                              <span className="ml-2 text-slate-400">({item.brand || 'Generic'} • {item.location || 'Main Store'})</span>
                            </div>
                            <span className="px-2.5 py-1 bg-rose-100 text-rose-700 rounded-lg font-bold">
                              Stock: {phy} (Min: {item.minAlert || 2})
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 4: PRIVILEGE CONTROL (SUPER ADMIN USER MANAGEMENT) */}
            {activeTab === 'rights' && (
              <div className="flex-1 overflow-auto space-y-5">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h2 className="text-base font-extrabold text-slate-900">Super Admin Privilege & User Master</h2>
                  <p className="text-xs text-slate-500 mb-4">Create authorized user accounts and assign Security PINs and operational roles.</p>

                  <form onSubmit={handleCreateUser} className="grid grid-cols-1 md:grid-cols-4 gap-3 pt-3 border-t border-slate-100">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Full Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Rajesh Kumar"
                        value={newUserName}
                        onChange={(e) => setNewUserName(e.target.value)}
                        className="w-full p-2 border border-slate-300 rounded-xl text-xs bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Login PIN Code *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. 4567"
                        value={newUserPin}
                        onChange={(e) => setNewUserPin(e.target.value)}
                        className="w-full p-2 border border-slate-300 rounded-xl text-xs bg-slate-50 font-mono outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Assigned Role</label>
                      <select
                        value={newUserRole}
                        onChange={(e) => setNewUserRole(e.target.value)}
                        className="w-full p-2 border border-slate-300 rounded-xl text-xs bg-slate-50 font-bold outline-none"
                      >
                        <option value="Super Admin">Super Admin (Full Master)</option>
                        <option value="Admin">IT Admin (Entry & Reports)</option>
                        <option value="Operator">Store Operator</option>
                      </select>
                    </div>
                    <div className="flex items-end">
                      <button
                        type="submit"
                        className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow cursor-pointer"
                      >
                        + Create User ID
                      </button>
                    </div>
                  </form>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead className="bg-slate-900 text-slate-200 text-[10px] uppercase font-bold">
                      <tr>
                        <th className="p-3">User Name</th>
                        <th className="p-3">Role</th>
                        <th className="p-3">Security PIN</th>
                        <th className="p-3">Permissions</th>
                        <th className="p-3 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {users.map(u => (
                        <tr key={u.id}>
                          <td className="p-3 font-bold text-slate-800">{u.name}</td>
                          <td className="p-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${u.role === 'Super Admin' ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-700'}`}>
                              {u.role}
                            </span>
                          </td>
                          <td className="p-3 font-mono font-bold text-slate-600">•••• ({u.pin})</td>
                          <td className="p-3 text-slate-500">{u.permissions}</td>
                          <td className="p-3 text-center">
                            {u.id !== 'usr_super' ? (
                              <button
                                onClick={() => handleDeleteUser(u.id)}
                                className="px-2.5 py-1 bg-rose-50 text-rose-600 rounded-lg font-bold text-[10px] hover:bg-rose-100 cursor-pointer"
                              >
                                Remove
                              </button>
                            ) : (
                              <span className="text-[10px] text-slate-400 font-semibold">Primary</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* ADD / EDIT ASSET MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div className="p-4 bg-slate-900 text-white rounded-t-2xl flex justify-between items-center sticky top-0 z-10">
                  <h3 className="font-bold text-sm uppercase tracking-wider">
                    {editingAsset ? 'Edit Asset Details' : 'Register New Asset Entry'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white font-bold cursor-pointer">✕</button>
                </div>

                <form onSubmit={handleSaveAsset} className="p-5 space-y-4 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Asset Group *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. MOUSE, CABLES, STORAGE"
                        value={formData.group}
                        onChange={(e) => setFormData({ ...formData, group: e.target.value })}
                        className="w-full p-2 border border-slate-300 rounded-lg uppercase font-bold outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="block font-semibold text-slate-700 mb-1">Particulars / Item Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. HDMI High-Speed Cable / SSD 512GB"
                        value={formData.particulars}
                        onChange={(e) => setFormData({ ...formData, particulars: e.target.value })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-semibold outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block font-semibold text-indigo-600 mb-1">Brand Name Selection</label>
                      <select
                        value={formData.brand}
                        onChange={(e) => setFormData({ ...formData, brand: e.target.value })}
                        className="w-full p-2 border border-indigo-300 rounded-lg bg-indigo-50/30 font-bold outline-none cursor-pointer"
                      >
                        {DEFAULT_BRANDS.map((b, idx) => (
                          <option key={idx} value={b}>{b}</option>
                        ))}
                      </select>
                      {formData.brand === 'Other' && (
                        <input
                          type="text"
                          value={formData.customBrand}
                          onChange={(e) => setFormData({ ...formData, customBrand: e.target.value })}
                          placeholder="Enter Custom Brand Name..."
                          className="w-full mt-1.5 p-2 border border-indigo-300 rounded-lg bg-white font-semibold outline-none"
                          required
                        />
                      )}
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Cable Length / Capacity</label>
                      <input
                        type="text"
                        placeholder="e.g. 5 or 512"
                        value={formData.cableLength}
                        onChange={(e) => setFormData({ ...formData, cableLength: e.target.value })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Measurement Unit</label>
                      <select
                        value={formData.unit}
                        onChange={(e) => setFormData({ ...formData, unit: e.target.value })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-bold bg-slate-50 outline-none"
                      >
                        <option value="Piece">Piece</option>
                        <option value="Meter">Meter</option>
                        <option value="GB">GB (SSD / HDD / RAM)</option>
                        <option value="TB">TB (HDD / Storage)</option>
                        <option value="Box">Box / Set</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div>
                      <label className="block font-bold text-slate-600 mb-1">Opening</label>
                      <input type="number" min="0" value={formData.openingQty} onChange={(e) => setFormData({ ...formData, openingQty: Number(e.target.value) })} className="w-full p-1.5 border border-slate-300 rounded bg-white font-mono font-bold" />
                    </div>
                    <div>
                      <label className="block font-bold text-emerald-700 mb-1">New Purch.</label>
                      <input type="number" min="0" value={formData.newPurchase} onChange={(e) => setFormData({ ...formData, newPurchase: Number(e.target.value) })} className="w-full p-1.5 border border-emerald-300 rounded bg-white font-mono font-bold text-emerald-700" />
                    </div>
                    <div>
                      <label className="block font-bold text-amber-700 mb-1">Issued</label>
                      <input type="number" min="0" value={formData.issueItems} onChange={(e) => setFormData({ ...formData, issueItems: Number(e.target.value) })} className="w-full p-1.5 border border-amber-300 rounded bg-white font-mono font-bold text-amber-700" />
                    </div>
                    <div>
                      <label className="block font-bold text-rose-700 mb-1">Dead / Faulty</label>
                      <input type="number" min="0" value={formData.deadItems} onChange={(e) => setFormData({ ...formData, deadItems: Number(e.target.value) })} className="w-full p-1.5 border border-rose-300 rounded bg-white font-mono font-bold text-rose-700" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-600 mb-1">Min Alert</label>
                      <input type="number" min="0" value={formData.minAlert} onChange={(e) => setFormData({ ...formData, minAlert: Number(e.target.value) })} className="w-full p-1.5 border border-slate-300 rounded bg-white font-mono font-bold" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Category</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-bold bg-white outline-none"
                      >
                        <option value="Consumable">Consumable</option>
                        <option value="Non-Consumable">Non-Consumable</option>
                        <option value="Fixed Assets">Fixed Assets</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Location / Store</label>
                      <input
                        type="text"
                        placeholder="e.g. Main IT Store / B Block"
                        value={formData.location}
                        onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                        className="w-full p-2 border border-slate-300 rounded-lg outline-none"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Entry Month</label>
                      <input
                        type="text"
                        value={formData.entryMonth}
                        onChange={(e) => setFormData({ ...formData, entryMonth: e.target.value })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-semibold outline-none"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow cursor-pointer"
                    >
                      {editingAsset ? 'Update Asset Record' : 'Save Asset Record'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CUSTOM DELETE CONFIRMATION MODAL */}
          {deleteConfirmAsset && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-sm w-full p-5 space-y-4">
                <h3 className="font-bold text-slate-900 text-sm">Delete Asset Record?</h3>
                <p className="text-xs text-slate-600">
                  Are you sure you want to delete <span className="font-bold text-slate-900">{deleteConfirmAsset.particulars}</span>? This action cannot be undone.
                </p>
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setDeleteConfirmAsset(null)}
                    className="px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmDeleteAsset}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow cursor-pointer"
                  >
                    Delete Record
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
