<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 7px 10px !important;
      line-height: 1.25 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #4f46e5 0%, #6366f1 100%);
      box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
    }
    /* Custom scrollbar for horizontal group pills */
    .no-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .no-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .no-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .no-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-indigo-600 selection:text-white">
  <div id="root">
    <!-- Fallback loading message so screen is never fully blank -->
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading IT Asset Portal...</div>
        <div style="font-size: 12px; color: #94a3b8;">Establishing secure enterprise connection</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";
    const LOCAL_STORAGE_KEY = "it_asset_inventory_fallback_v2";
    const USERS_STORAGE_KEY = "it_asset_system_users_v2";

    const DEFAULT_SAMPLE_ASSETS = [
      { firebaseKey: 'sample_1', group: 'MOUSE', particulars: 'USB Optical Mouse - Dell', brand: 'Dell', category: 'Consumable', openingQty: 15, newPurchase: 10, issueItems: 8, shortItems: 0, deadItems: 1, minAlert: 5, location: 'Main IT Store', entryMonth: 'Nov 2026', unit: 'Piece', cableLength: '', status: 'Active', lastUpdated: '12 Nov 2026, 12:30 PM' },
      { firebaseKey: 'sample_2', group: 'KEYBOARD', particulars: 'Wired USB Keyboard - HP', brand: 'HP', category: 'Consumable', openingQty: 12, newPurchase: 5, issueItems: 15, shortItems: 0, deadItems: 0, minAlert: 4, location: 'B Block', entryMonth: 'Nov 2026', unit: 'Piece', cableLength: '', status: 'Active', lastUpdated: '12 Nov 2026, 12:32 PM' },
      { firebaseKey: 'sample_3', group: 'STORAGE', particulars: 'SSD 512GB SATA III', brand: 'WD', unit: 'GB', category: 'Fixed Assets', openingQty: 8, newPurchase: 4, issueItems: 3, shortItems: 0, deadItems: 0, minAlert: 3, location: 'Server Room', entryMonth: 'Nov 2026', cableLength: '', status: 'Active', lastUpdated: '12 Nov 2026, 12:35 PM' },
      { firebaseKey: 'sample_4', group: 'CABLES', particulars: 'HDMI High-Speed Cable', brand: 'UGREEN', cableLength: '5', unit: 'Meter', category: 'Consumable', openingQty: 20, newPurchase: 0, issueItems: 6, shortItems: 0, deadItems: 0, minAlert: 5, location: 'A Block', entryMonth: 'Oct 2026', status: 'Active', lastUpdated: '12 Nov 2026, 12:40 PM' },
      { firebaseKey: 'sample_5', group: 'PERIPHERALS', particulars: 'HD Web Camera 1080p', brand: 'Logitech', unit: 'Piece', category: 'Fixed Assets', openingQty: 5, newPurchase: 2, issueItems: 6, shortItems: 0, deadItems: 0, minAlert: 2, location: 'Conference Room', entryMonth: 'Nov 2026', cableLength: '', status: 'Active', lastUpdated: '12 Nov 2026, 12:42 PM' }
    ];

    const DEFAULT_USERS = [
      { id: 'usr_super', name: 'Super Admin', pin: '1234', role: 'Super Admin', permissions: 'Full Access (Master + Create Users + Delete)' },
      { id: 'usr_tech', name: 'IT Technician', pin: '2222', role: 'Operator', permissions: 'Stock Entry & Issue' }
    ];

    const DEFAULT_BRANDS = ['Dell', 'HP', 'Lenovo', 'Logitech', 'WD', 'Seagate', 'Kingston', 'UGREEN', 'Cisco', 'Samsung', 'Mantra', 'Wacom', 'Honeywell', 'Other'];

    const IMPORTANT_ITEMS = ['mouse', 'keyboard', 'ram', 'ssd', 'hdd', 'web camera', 'camera'];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [resetModalOpen, setResetModalOpen] = useState(false);
      const [resetPinInput, setResetPinInput] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [deleteConfirmAsset, setDeleteConfirmAsset] = useState(null);
      const [activeModalViewItem, setActiveModalViewItem] = useState(null);
      const [historyModalItem, setHistoryModalItem] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem(USERS_STORAGE_KEY);
        return saved ? JSON.parse(saved) : DEFAULT_USERS;
      });
      const [newUserName, setNewUserName] = useState('');
      const [newUserPin, setNewUserPin] = useState('');
      const [newUserRole, setNewUserRole] = useState('Operator');

      const lineChartRef = useRef(null);
      const donutChartRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const getFormattedDateTime = () => {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, '0');
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const formattedHours = hours % 12 || 12;
        return `${day} ${monthNames[d.getMonth()]} ${d.getFullYear()}, ${formattedHours}:${minutes} ${ampm}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        cableLength: '',
        unit: 'Piece',
        brand: 'Dell',
        customBrand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear()
      });

      const loadLocalFallback = () => {
        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (saved) {
          try {
            setAssets(JSON.parse(saved));
          } catch (e) {
            setAssets(DEFAULT_SAMPLE_ASSETS);
          }
        } else {
          setAssets(DEFAULT_SAMPLE_ASSETS);
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(DEFAULT_SAMPLE_ASSETS));
        }
      };

      const saveLocalFallback = (list) => {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(list));
      };

      const fetchCloudData = async () => {
        try {
          const res = await fetch(FIREBASE_DB_URL);
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
            saveLocalFallback(list);
          } else {
            loadLocalFallback();
          }
        } catch (err) {
          console.warn("Cloud offline, loading local state.");
          loadLocalFallback();
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 10000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (activeTab === 'dashboard' && isLoggedIn) {
          setTimeout(() => {
            const lineCtx = document.getElementById('trendLineChart');
            if (lineCtx) {
              if (lineChartRef.current) lineChartRef.current.destroy();
              lineChartRef.current = new Chart(lineCtx, {
                type: 'line',
                data: {
                  labels: ['Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
                  datasets: [
                    {
                      label: 'Entries',
                      data: [40, 55, 60, 65, assets.length || 76],
                      borderColor: '#4f46e5',
                      backgroundColor: 'rgba(79, 70, 229, 0.1)',
                      tension: 0.3,
                      fill: true,
                      pointRadius: 4
                    },
                    {
                      label: 'Issued',
                      data: [25, 38, 42, 50, assets.reduce((acc, i) => acc + Number(i.issueItems || 0), 0) || 53],
                      borderColor: '#10b981',
                      backgroundColor: 'rgba(16, 185, 129, 0.05)',
                      tension: 0.3,
                      fill: true,
                      pointRadius: 4
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  scales: {
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                  }
                }
              });
            }

            const donutCtx = document.getElementById('overviewDonutChart');
            if (donutCtx) {
              if (donutChartRef.current) donutChartRef.current.destroy();
              const consumable = assets.filter(i => i.category === 'Consumable').length || 25;
              const nonConsumable = assets.filter(i => i.category === 'Non-Consumable').length || 35;
              const fixed = assets.filter(i => i.category === 'Fixed Assets').length || 16;

              donutChartRef.current = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                  labels: ['Fixed Assets', 'Non-Consumable', 'Consumable'],
                  datasets: [{
                    data: [fixed, nonConsumable, consumable],
                    backgroundColor: ['#4f46e5', '#0ea5e9', '#10b981'],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  cutout: '72%',
                  plugins: { legend: { display: false } }
                }
              });
            }
          }, 100);
        }
      }, [activeTab, isLoggedIn, assets]);

      const handleLogin = (e) => {
        e.preventDefault();
        const found = users.find(u => u.pin === pinInput);
        if (found || pinInput === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
          showToast(`Welcome back, ${found ? found.name : 'Super Admin'}!`);
        } else {
          setLoginError('Invalid PIN Code. Default Super Admin PIN is 1234.');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const handleResetPinSubmit = (e) => {
        e.preventDefault();
        if (resetPinInput.length >= 4) {
          const updated = users.map(u => u.id === 'usr_super' ? { ...u, pin: resetPinInput } : u);
          setUsers(updated);
          localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(updated));
          setResetModalOpen(false);
          setResetPinInput('');
          showToast("Super Admin PIN successfully reset!");
        } else {
          showToast("PIN must be at least 4 digits.");
        }
      };

      const handleCreateUser = (e) => {
        e.preventDefault();
        if (!newUserName.trim() || !newUserPin.trim()) {
          showToast("Please provide both Name and PIN.");
          return;
        }
        const newUser = {
          id: `usr_${Date.now()}`,
          name: newUserName.trim(),
          pin: newUserPin.trim(),
          role: newUserRole,
          permissions: newUserRole === 'Super Admin' ? 'Full Access' : 'Stock Entry & Management'
        };
        const updatedUsers = [...users, newUser];
        setUsers(updatedUsers);
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(updatedUsers));
        setNewUserName('');
        setNewUserPin('');
        showToast(`User ${newUser.name} created successfully!`);
      };

      const handleDeleteUser = (userId) => {
        if (userId === 'usr_super') {
          showToast("Cannot delete primary Super Admin.");
          return;
        }
        const updated = users.filter(u => u.id !== userId);
        setUsers(updated);
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(updated));
        showToast("User account removed.");
      };

      const handleOpenModal = (asset = null) => {
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          const isKnownBrand = DEFAULT_BRANDS.includes(asset.brand);
          setEditingAsset(asset);
          setFormData({
            group: asset.group || '',
            particulars: asset.particulars || '',
            cableLength: asset.cableLength || '',
            unit: asset.unit || 'Piece',
            brand: isKnownBrand ? (asset.brand || 'Dell') : 'Other',
            customBrand: isKnownBrand ? '' : (asset.brand || ''),
            serialNo: asset.serialNo || '',
            vendor: asset.vendor || '',
            invoiceNo: asset.invoiceNo || '',
            warranty: asset.warranty || '',
            openingQty: asset.openingQty || 0,
            newPurchase: asset.newPurchase || 0,
            issueItems: asset.issueItems || 0,
            shortItems: asset.shortItems || 0,
            deadItems: asset.deadItems || 0,
            category: asset.category || 'Consumable',
            location: asset.location || '',
            minAlert: asset.minAlert || 2,
            entryMonth: asset.entryMonth || autoMonth
          });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            cableLength: '',
            unit: 'Piece',
            brand: 'Dell',
            customBrand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '',
            minAlert: 2,
            entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const dateTimeStr = getFormattedDateTime();
        const resolvedBrand = formData.brand === 'Other' && formData.customBrand.trim()
          ? formData.customBrand.trim()
          : formData.brand;
        const { customBrand, ...cleanFormData } = formData;
        const finalData = {
          ...cleanFormData,
          brand: resolvedBrand,
          group: (formData.group || 'GENERAL').toUpperCase().trim(),
          entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear(),
          lastUpdated: dateTimeStr,
          status: editingAsset?.status || 'Active'
        };

        let updatedList;
        if (editingAsset && editingAsset.firebaseKey) {
          updatedList = assets.map(item =>
            item.firebaseKey === editingAsset.firebaseKey ? { ...finalData, firebaseKey: editingAsset.firebaseKey } : item
          );
        } else {
          const newRecord = { ...finalData, id: currentTimestamp, firebaseKey: `local_${currentTimestamp}` };
          updatedList = [newRecord, ...assets];
        }

        setAssets(updatedList);
        saveLocalFallback(updatedList);
        setIsModalOpen(false);
        showToast(editingAsset ? "Asset record updated with timestamp!" : "New asset added to ledger!");

        try {
          if (editingAsset && editingAsset.firebaseKey && !editingAsset.firebaseKey.startsWith('sample_') && !editingAsset.firebaseKey.startsWith('local_')) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalData)
            });
          } else {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...finalData, id: currentTimestamp })
            });
          }
          await fetchCloudData();
        } catch (err) {
          console.warn("Saved locally (Cloud offline)");
        } finally {
          setLoading(false);
        }
      };

      const toggleAssetInactive = (asset) => {
        const newStatus = asset.status === 'Inactive' ? 'Active' : 'Inactive';
        const updatedList = assets.map(i => i.firebaseKey === asset.firebaseKey ? { ...i, status: newStatus, lastUpdated: getFormattedDateTime() } : i);
        setAssets(updatedList);
        saveLocalFallback(updatedList);
        showToast(`Asset marked as ${newStatus}`);
      };

      const handlePrintSlip = (asset) => {
        const slipWindow = window.open('', '_blank');
        slipWindow.document.write(`
          <html>
            <head>
              <title>Asset Slip - ${asset.particulars}</title>
              <style>
                body { font-family: Inter, sans-serif; padding: 25px; color: #1e293b; }
                .box { border: 2px solid #e2e8f0; padding: 25px; border-radius: 12px; max-width: 520px; margin: auto; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
                h2 { margin-top: 0; color: #4f46e5; font-size: 20px; border-bottom: 2px solid #4f46e5; padding-bottom: 8px; }
                table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                td { padding: 9px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
                .label { font-weight: bold; color: #64748b; width: 42%; }
              </style>
            </head>
            <body>
              <div class="box">
                <h2>IT Infrastructure Asset Slip</h2>
                <table>
                  <tr><td class="label">Stock Group:</td><td><b>${asset.group}</b></td></tr>
                  <tr><td class="label">Particulars:</td><td><b>${asset.particulars}</b></td></tr>
                  <tr><td class="label">Brand:</td><td>${asset.brand || '-'}</td></tr>
                  <tr><td class="label">Capacity / Length:</td><td>${asset.cableLength ? asset.cableLength + ' ' + (asset.unit || '') : (asset.unit || 'Piece')}</td></tr>
                  <tr><td class="label">Category:</td><td>${asset.category}</td></tr>
                  <tr><td class="label">Location / Store:</td><td>${asset.location || 'Main IT Store'}</td></tr>
                  <tr><td class="label">Last Updated:</td><td>${asset.lastUpdated || 'N/A'}</td></tr>
                </table>
                <p style="margin-top: 35px; font-size: 11px; text-align: center; color: #94a3b8;">Authorized IT & Inventory Management System</p>
              </div>
              <script>window.print();<\/script>
            </body>
          </html>
        `);
        slipWindow.document.close();
      };

      const confirmDeleteAsset = async () => {
        if (!deleteConfirmAsset) return;
        const target = deleteConfirmAsset;
        setDeleteConfirmAsset(null);
        setLoading(true);

        const updatedList = assets.filter(i => i.firebaseKey !== target.firebaseKey);
        setAssets(updatedList);
        saveLocalFallback(updatedList);
        showToast("Asset record deleted.");

        try {
          if (target.firebaseKey && !target.firebaseKey.startsWith('sample_') && !target.firebaseKey.startsWith('local_')) {
            const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${target.firebaseKey}.json`;
            await fetch(deleteUrl, { method: 'DELETE' });
            await fetchCloudData();
          }
        } catch (err) {
          console.warn("Deleted locally");
        } finally {
          setLoading(false);
        }
      };

      // Distinct Group summary calculation
      const groupSummaries = React.useMemo(() => {
        const map = {};
        assets.forEach(item => {
          const g = (item.group || 'GENERAL').toUpperCase().trim();
          if (!map[g]) {
            map[g] = { count: 0, lowStock: 0 };
          }
          map[g].count += 1;
          const op = Number(item.openingQty || 0);
          const purch = Number(item.newPurchase || 0);
          const issued = Number(item.issueItems || 0);
          const short = Number(item.shortItems || 0);
          const dead = Number(item.deadItems || 0);
          const phy = (op + purch - issued) - short - dead;
          if (phy <= Number(item.minAlert || 2)) {
            map[g].lowStock += 1;
          }
        });
        return Object.keys(map).sort().map(groupName => ({
          groupName,
          count: map[groupName].count,
          lowStock: map[groupName].lowStock
        }));
      }, [assets]);

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        const matchesGroup = selectedGroupFilter === '' || (item.group || '').toUpperCase() === selectedGroupFilter.toUpperCase();
        return matchesSearch && matchesLocation && matchesMonth && matchesGroup;
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);

      const totalRecords = assets.length;
      const lowStockItems = assets.filter(item => {
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        return phy <= Number(item.minAlert || 2);
      });
      const currentMonthRecords = assets.filter(i => (i.entryMonth || '').toLowerCase() === getCurrentMonthYear().toLowerCase()).length;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <div className="text-center mb-6">
                <div className="inline-flex p-3.5 bg-indigo-50 text-indigo-600 rounded-2xl mb-3 shadow-inner border border-indigo-100">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">IT Asset Portal</h1>
                <p className="text-xs font-medium text-slate-500 mt-1">Enterprise Cloud Inventory Infrastructure</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>

                <div className="space-y-3 text-xs">
                  <p className="font-semibold text-slate-700">Item: <span className="text-indigo-600 font-bold">{historyModalItem.particulars}</span></p>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1.5 font-mono text-[11px]">
                    <div className="flex justify-between"><span>Opening Qty:</span> <b>{historyModalItem.openingQty || 0}</b></div>
                    <div className="flex justify-between text-emerald-600"><span>New Purchases:</span> <b>+{historyModalItem.newPurchase || 0}</b></div>
                    <div className="flex justify-between text-amber-600"><span>Total Issued:</span> <b>-{historyModalItem.issueItems || 0}</b></div>
                    <div className="flex justify-between text-rose-600"><span>Dead / Faulty:</span> <b>{historyModalItem.deadItems || 0}</b></div>
                    <div className="flex justify-between pt-2 border-t border-slate-200 font-extrabold text-slate-900 text-xs">
                      <span>Physical Balance:</span>
                      <span>{(Number(historyModalItem.openingQty || 0) + Number(historyModalItem.newPurchase || 0)) - Number(historyModalItem.issueItems || 0) - Number(historyModalItem.shortItems || 0) - Number(historyModalItem.deadItems || 0)}</span>
                    </div>
                  </div>
                  <div className="text-[11px] text-slate-400">Last updated timestamp: <span className="font-mono font-medium text-slate-700">{historyModalItem.lastUpdated || 'N/A'}</span></div>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setHistoryModalItem(null)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs cursor-pointer">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* CUSTOM DELETE CONFIRMATION MODAL */}
          {deleteConfirmAsset && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-sm w-full p-5 space-y-4">
                <h3 className="font-bold text-slate-900 text-sm">Delete Asset Record?</h3>
                <p className="text-xs text-slate-600">
                  Are you sure you want to delete <span className="font-bold text-slate-900">{deleteConfirmAsset.particulars}</span>? This action cannot be undone.
                </p>
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setDeleteConfirmAsset(null)}
                    className="px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmDeleteAsset}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow cursor-pointer"
                  >
                    Delete Record
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
