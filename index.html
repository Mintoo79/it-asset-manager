<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";

    const defaultRoleRights = {
      Admin: { canAdd: true, canEdit: true, canDelete: true, canStockIn: true },
      "IT Manager": { canAdd: true, canEdit: true, canDelete: false, canStockIn: true },
      Technician: { canAdd: false, canEdit: true, canDelete: false, canStockIn: true },
      Viewer: { canAdd: false, canEdit: false, canDelete: false, canStockIn: false }
    };

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState({ name: 'Admin User', role: 'Admin' });
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [roleRights, setRoleRights] = useState(defaultRoleRights);
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);
      const [recentlyAddedId, setRecentlyAddedId] = useState(null);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);

      const [isIssueModalOpen, setIsIssueModalOpen] = useState(false);
      const [issuingItem, setIssuingItem] = useState(null);
      const [issueForm, setIssueForm] = useState({ qty: 1, recipient: '', dept: '' });

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        brand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear()
      });

      const fetchCloudData = async () => {
        try {
          const res = await fetch(FIREBASE_DB_URL);
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
          } else {
            setAssets([]);
          }
        } catch (err) {
          console.error("Firebase fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 3000);
        return () => clearInterval(interval);
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
        } else {
          setLoginError('Invalid Security PIN (Default PIN: 1234)');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const handleOpenModal = (asset = null) => {
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          setEditingAsset(asset);
          setFormData({ ...asset, entryMonth: asset.entryMonth || autoMonth });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            brand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '',
            minAlert: 2,
            entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const finalData = {
          ...formData,
          entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear()
        };

        try {
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalData)
            });
            setRecentlyAddedId(editingAsset.firebaseKey);
          } else {
            const response = await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...finalData, id: currentTimestamp })
            });
            const result = await response.json();
            if (result && result.name) {
              setRecentlyAddedId(result.name);
            }
          }
          setIsModalOpen(false);
          await fetchCloudData();
        } catch (err) {
          alert("Error saving entry.");
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteAsset = async (asset) => {
        if (window.confirm("Are you sure you want to delete this asset record?")) {
          setLoading(true);
          try {
            const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${asset.firebaseKey}.json`;
            await fetch(deleteUrl, { method: 'DELETE' });
            await fetchCloudData();
          } catch (err) {
            console.error(err);
          } finally {
            setLoading(false);
          }
        }
      };

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        return matchesSearch && matchesLocation && matchesMonth;
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);

      const totalRecords = assets.length;
      const currentRights = roleRights[currentUser.role] || defaultRoleRights.Viewer;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <div className="text-center mb-6">
                <div className="inline-flex p-3.5 bg-blue-50 text-blue-600 rounded-2xl mb-3 shadow-inner border border-blue-100">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">IT Asset Portal</h1>
                <p className="text-xs font-medium text-slate-500 mt-1">Enterprise Cloud Inventory Infrastructure</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">User Privilege Level</label>
                  <select 
                    value={currentUser.role} 
                    onChange={(e) => setCurrentUser({...currentUser, role: e.target.value})}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none transition"
                  >
                    <option value="Admin">System Administrator</option>
                    <option value="IT Manager">IT Operations Manager</option>
                    <option value="Technician">Desktop Technician</option>
                    <option value="Viewer">Auditor (Read-Only)</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Security PIN Code</label>
                  <input 
                    type="password" 
                    placeholder="Enter PIN (Default: 1234)" 
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none transition"
                    required
                  />
                </div>

                {loginError && <p className="text-xs text-rose-500 font-medium">{loginError}</p>}

                <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-blue-500/20 transition duration-150 flex items-center justify-center gap-2">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                  Authenticate & Sign In
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100 p-4">
          <main className="flex-1 flex flex-col overflow-hidden space-y-3">
            
            {/* Top Dark Header Bar Matching Screenshot Exactly */}
            <header className="bg-gradient-to-r from-slate-950 via-slate-900 to-blue-950 text-white p-3 rounded-xl shadow-lg flex justify-between items-center border border-slate-800">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600/30 border border-blue-500/40 rounded-lg text-blue-400">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h1 className="text-sm font-extrabold tracking-wide uppercase">Stock Register & Inventory Ledger</h1>
              </div>

              <div className="flex items-center space-x-2">
                <div className="relative">
                  <input 
                    type="text" 
                    placeholder="Search Items..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-44 px-3 py-1.5 pl-8 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500"
                  />
                  <svg className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>

                <select 
                  value={monthFilter} 
                  onChange={(e) => setMonthFilter(e.target.value)}
                  className="px-3 py-1.5 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-white outline-none"
                >
                  <option value="">Month: Nov 2026</option>
                  <option value="Oct 2026">Month: Oct 2026</option>
                  <option value="Sep 2026">Month: Sep 2026</option>
                </select>

                <select 
                  value={locationFilter} 
                  onChange={(e) => setLocationFilter(e.target.value)}
                  className="px-3 py-1.5 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-white outline-none"
                >
                  <option value="">Location: All</option>
                  <option value="B Block">Location: B Block</option>
                  <option value="A Block">Location: A Block</option>
                </select>

                <button 
                  onClick={() => handleOpenModal()} 
                  className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg shadow-md shadow-blue-600/30 transition flex items-center gap-1"
                >
                  + New Asset
                </button>
              </div>
            </header>

            {/* Table Container Matching Screenshot Columns & Colors */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col justify-between">
              <div className="overflow-x-auto">
                <table className="w-full text-[11px] text-left border-collapse whitespace-nowrap table-compact">
                  <thead className="bg-slate-950 text-white font-bold border-b border-slate-800 text-[10px] uppercase tracking-wider">
                    <tr>
                      <th className="border-r border-slate-800 text-center w-7 py-2">#</th>
                      <th className="border-r border-slate-800 px-2 py-2">Stock Group</th>
                      <th className="border-r border-slate-800 px-2 py-2">Asset Particulars</th>
                      <th className="border-r border-slate-800 px-2 py-2 text-blue-400">Brand</th>
                      <th className="border-r border-slate-800 px-2 py-2">Serial / Tag</th>
                      <th className="border-r border-slate-800 px-2 py-2 text-slate-300">Month</th>
                      <th className="border-r border-slate-800 px-2 py-2">Vendor</th>
                      <th className="border-r border-slate-800 px-2 py-2 text-center bg-slate-900">OP</th>
                      <th className="border-r border-slate-800 px-2 py-2 text-center bg-slate-900">Purch.</th>
                      <th className="border-r border-slate-800 px-2 py-2 text-center bg-slate-900 text-emerald-400">Issued</th>
                      <th className="border-r border-slate-800 px-2 py-2 text-center bg-slate-900 text-rose-400">Return</th>
                      <th className="border-r border-slate-800 px-2 py-2 text-center bg-slate-900 text-blue-400 font-bold">Bal</th>
                      <th className="border-r border-slate-800 px-2 py-2 text-center bg-slate-900 text-emerald-300 font-bold">Map</th>
                      <th className="border-r border-slate-800 px-2 py-2 text-center bg-slate-900">Dead</th>
                      <th className="border-r border-slate-800 px-2 py-2">Category</th>
                      <th className="px-2 py-2">Location</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200 text-slate-800">
                    {currentItems.length === 0 ? (
                      <tr>
                        <td colSpan="16" className="p-8 text-center text-slate-400 font-medium">
                          {loading ? 'Cloud database syncing records...' : 'No inventory records found.'}
                        </td>
                      </tr>
                    ) : (
                      currentItems.map((item, index) => {
                        const serialNumber = indexOfFirstItem + index + 1;
                        const balanceStock = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
                        const isLowStock = balanceStock <= Number(item.minAlert || 2);

                        return (
                          <tr key={item.firebaseKey || index} className="hover:bg-slate-50 transition">
                            <td className="border-r border-slate-200 font-semibold text-slate-400 text-center">{serialNumber}</td>
                            <td className="border-r border-slate-200 font-bold text-slate-800">{item.group}</td>
                            <td className="border-r border-slate-200 font-semibold text-slate-900">
                              <button onClick={() => handleOpenModal(item)} className="hover:text-blue-600 text-left flex items-center gap-1.5">
                                {item.particulars}
                                {isLowStock && <span className="px-1.5 py-0.5 bg-rose-600 text-white font-extrabold text-[8px] rounded-md tracking-wider uppercase">LOW</span>}
                              </button>
                            </td>
                            <td className="border-r border-slate-200 font-bold text-blue-600">{item.brand || '-'}</td>
                            <td className="border-r border-slate-200 text-slate-400 text-[10px]">{item.serialNo || '-'}</td>
                            <td className="border-r border-slate-200 text-slate-600 font-medium">{item.entryMonth || 'Nov 2026'}</td>
                            <td className="border-r border-slate-200 text-slate-400">{item.vendor || '-'}</td>
                            <td className="border-r border-slate-200 text-center font-bold text-slate-700 bg-slate-50/50">{item.openingQty || 0}</td>
                            <td className="border-r border-slate-200 text-center font-bold text-slate-700 bg-slate-50/50">{item.newPurchase || 0}</td>
                            <td className="border-r border-slate-200 text-center font-bold text-emerald-600">{item.issueItems || 0}</td>
                            <td className="border-r border-slate-200 text-center font-bold text-rose-600">0</td>
                            <td className="border-r border-slate-200 text-center font-bold text-blue-700 bg-blue-50/20">{balanceStock}</td>
                            <td className="border-r border-slate-200 text-center font-bold text-emerald-600 bg-emerald-50/30">{balanceStock}</td>
                            <td className="border-r border-slate-200 text-center text-slate-500">{item.deadItems || 0}</td>
                            <td className="border-r border-slate-200">
                              <span className="px-2 py-0.5 text-[9px] font-bold rounded-full bg-blue-100 text-blue-700 border border-blue-200">
                                {item.category || 'Consumable'}
                              </span>
                            </td>
                            <td className="text-slate-400 text-center">{item.location || '- -'}</td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>

              {/* Bottom System Status Bar Matching Screenshot */}
              <div className="px-4 py-2 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs">
                <div className="flex items-center space-x-6">
                  {/* Shield Status */}
                  <div className="flex items-center space-x-2">
                    <div className="p-1 bg-emerald-500 rounded-full text-white">
                      <svg className="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"></path></svg>
                    </div>
                    <div>
                      <p className="text-[10px] font-bold text-slate-400 leading-tight">System Status</p>
                      <p className="text-emerald-600 font-bold leading-tight">All Systems Operational</p>
                    </div>
                  </div>

                  <div className="h-6 w-px bg-slate-300"></div>

                  {/* Clock Last Updated */}
                  <div className="flex items-center space-x-2">
                    <div className="p-1 text-blue-600">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div>
                      <p className="text-[10px] font-bold text-slate-400 leading-tight">Last Updated</p>
                      <p className="font-bold text-slate-800 leading-tight">07 Nov 2026, 11:16 AM</p>
                    </div>
                  </div>

                  <div className="h-6 w-px bg-slate-300"></div>

                  {/* Database Asset Count */}
                  <div className="flex items-center space-x-2">
                    <div className="p-1 text-blue-600">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path></svg>
                    </div>
                    <div>
                      <p className="text-[10px] font-bold text-slate-400 leading-tight">Total Records</p>
                      <p className="font-bold text-slate-800 leading-tight">{totalRecords} Assets</p>
                    </div>
                  </div>

                  <div className="h-6 w-px bg-slate-300"></div>

                  {/* Cloud Sync Status */}
                  <div className="flex items-center space-x-2">
                    <div className="p-1 text-blue-600">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    </div>
                    <div>
                      <p className="text-[10px] font-bold text-slate-400 leading-tight">Data Source</p>
                      <p className="font-bold text-slate-800 leading-tight">Cloud Synced</p>
                    </div>
                  </div>
                </div>

                {/* Pagination Controls */}
                <div className="flex items-center space-x-2">
                  <button 
                    disabled={currentPage === 1}
                    onClick={() => setCurrentPage(prev => prev - 1)}
                    className="px-2.5 py-1 border border-slate-300 rounded bg-white font-semibold text-slate-600 disabled:opacity-40"
                  >
                    ◀ Prev
                  </button>
                  <span className="font-bold text-slate-800 px-2">{currentPage} / {totalPages}</span>
                  <button 
                    disabled={currentPage === totalPages}
                    onClick={() => setCurrentPage(prev => prev + 1)}
                    className="px-2.5 py-1 border border-slate-300 rounded bg-white font-semibold text-slate-600 disabled:opacity-40"
                  >
                    Next ▶
                  </button>
                </div>
              </div>
            </div>

          </main>

          {/* Add/Edit Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 border border-slate-200">
                <h3 className="text-sm font-bold text-slate-900 mb-4 border-b border-slate-200 pb-2">
                  {editingAsset ? 'Edit Stock Register Record' : 'Register New Asset Entry'}
                </h3>
                <form onSubmit={handleSaveAsset} className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Stock Group</label>
                    <input type="text" value={formData.group} onChange={(e) => setFormData({...formData, group: e.target.value})} placeholder="e.g. MOUSE" className="w-full p-2 border border-slate-300 rounded-lg outline-none" required />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Asset Particulars</label>
                    <input type="text" value={formData.particulars} onChange={(e) => setFormData({...formData, particulars: e.target.value})} placeholder="e.g. USB MOUSE" className="w-full p-2 border border-slate-300 rounded-lg outline-none" required />
                  </div>
                  <div>
                    <label className="block font-semibold text-blue-600 mb-1">Brand Name</label>
                    <input type="text" value={formData.brand} onChange={(e) => setFormData({...formData, brand: e.target.value})} placeholder="e.g. DELL" className="w-full p-2 border border-blue-200 rounded-lg bg-blue-50/20 outline-none" />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Opening Stock (OP)</label>
                    <input type="number" value={formData.openingQty} onChange={(e) => setFormData({...formData, openingQty: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                  </div>
                  <div className="col-span-2 flex justify-end space-x-2 pt-4 border-t border-slate-200">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow-md">Save Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
