  <script type="text/babel">

      Database: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/></svg>,
      Users: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      Search: () => <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
      Edit: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>,
      Trash: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Eye: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>,
      Download: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
      Upload: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
      Refresh: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
      Check: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>,
      Lock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>,
      SignOut: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    };

    const calcBalance = (item) => {
      return (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) -
             (Number(item.issueItems || 0) + Number(item.shortItems || 0) + Number(item.deadItems || 0));
    };

    function exportToExcel(filename, rows) {
      if (!rows || !rows.length) return;
      const cleanRows = rows.map(r => ({
        "Group": r.group, "Particulars": r.particulars, "Brand": r.brand, "Serial No": r.serialNo || '',
        "Cable Length (m)": r.cableLength || '', "Unit": r.measurementUnit || 'Piece', "Opening Qty": r.openingQty || 0,
        "New Purchase": r.newPurchase || 0, "Issued Items": r.issueItems || 0,
        "Balance Stock": calcBalance(r),
        "Short Items": r.shortItems || 0, "Dead Items": r.deadItems || 0, "Min Stock Alert": r.minAlert || 2,
        "Category": r.category || 'Consumable', "Location": r.location || 'IT Stores',
        "Vendor": r.vendor || '', "Invoice No": r.invoiceNo || '', "Warranty": r.warranty || '',
        "Last Updated": r.lastUpdated || ''
      }));
      const worksheet = XLSX.utils.json_to_sheet(cleanRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Stock Register");
      XLSX.writeFile(workbook, filename.endsWith('.xlsx') ? filename : filename + '.xlsx');
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [loggedInUser, setLoggedInUser] = useState(null);
      const [usernameInput, setUsernameInput] = useState('admin');
      const [pinInput, setPinInput] = useState('1234');
      const [loginError, setLoginError] = useState('');
      const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });

      const [activeTab, setActiveTab] = useState('inventory');
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState('Just now');

      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('All');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');
      const [lowStockOnly, setLowStockOnly] = useState(false);
      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [stockHistory, setStockHistory] = useState([]);
      const [loading, setLoading] = useState(true);

      // MASTER DATA & AUDIT STATES
      const [masterData, setMasterData] = useState({ groups: [], locations: [], brands: [], units: [], itemNames: [], departments: [] });
      const [currentMasterType, setCurrentMasterType] = useState('groups');
      const [masterForm, setMasterForm] = useState({ name: '' });
      const [auditLogs, setAuditLogs] = useState([]);

      // SQL STATES
      const [sqlDb, setSqlDb] = useState(null);
      const [sqlQuery, setSqlQuery] = useState('SELECT "group", COUNT(*) as TotalItems, SUM(openingQty + newPurchase - issueItems - shortItems - deadItems) as NetBalance FROM assets GROUP BY "group";');
      const [sqlResult, setSqlResult] = useState(null);
      const [sqlError, setSqlError] = useState('');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [viewModalItem, setViewModalItem] = useState(null);
      const [showHistoryModal, setShowHistoryModal] = useState(false);

      const fileInputRef = useRef(null);

      // TEMP DISPATCH STATES
      const [tempDispatches, setTempDispatches] = useState([]);
      const [isTempModalOpen, setIsTempModalOpen] = useState(false);
      const [tempForm, setTempForm] = useState({ assetName: '', assetTagNo: '', department: 'IT', receiver: '', quantity: 1, expectedReturn: '', status: 'Temporary Given' });

      // PM SCHEDULE STATES
      const [pmSchedules, setPmSchedules] = useState([]);
      const [isPmModalOpen, setIsPmModalOpen] = useState(false);
      const [pmSelectedMonth, setPmSelectedMonth] = useState('Nov');
      const [pmSelectedSlot, setPmSelectedSlot] = useState('All');
      const [pmForm, setPmForm] = useState({
        department: 'General Registration', equipmentName: 'Desktop PC Workstation', cpuBrand: 'Dell', cpuTag: 'CPU-TAG-101',
        monitorBrand: 'Dell', monitorTag: 'MON-TAG-101', printerModel: 'HP LaserJet Pro M126nw', printerTag: 'PRN-TAG-202',
        systemIP: '192.168.1.50', ramSpec: '16 GB DDR4', hddSpec: '512 GB SSD', antiVirus: 'Updated',
        status: 'Scheduled', dueDate: '2026-11-25', targetMonth: 'Nov', slotRange: '21 to 30 November'
      });

      // USERS STATES
      const sampleFallbackUsers = [
        { id: 1, name: 'Super Admin', username: 'admin', pin: '1234', role: 'Super Administrator', department: 'IT Management', status: 'Active' },
        { id: 2, name: 'IT Inventory Desk', username: 'store', pin: '5678', role: 'Store Keeper', department: 'IT Stores', status: 'Active' },
        { id: 3, name: 'Dr. Alok Sharma', username: 'alok', pin: '1122', role: 'Department Head', department: 'General Registration', status: 'Active' }
      ];
      const [users, setUsers] = useState(sampleFallbackUsers);
      const [newUserForm, setNewUserForm] = useState({ name: '', username: '', pin: '', role: 'Store Keeper', department: 'IT', status: 'Active' });

      const monthsList = [
        { code: 'Jan', name: 'January', slots: ['01 to 10 January', '11 to 20 January', '21 to 31 January'] },
        { code: 'Feb', name: 'February', slots: ['01 to 10 February', '11 to 20 February', '21 to 28 February'] },
        { code: 'Mar', name: 'March', slots: ['01 to 10 March', '11 to 20 March', '21 to 31 March'] },
        { code: 'Apr', name: 'April', slots: ['01 to 10 April', '11 to 20 April', '21 to 30 April'] },
        { code: 'May', name: 'May', slots: ['01 to 10 May', '11 to 20 May', '21 to 31 May'] },
        { code: 'Jun', name: 'June', slots: ['01 to 10 June', '11 to 20 June', '21 to 30 June'] },
        { code: 'Jul', name: 'July', slots: ['01 to 10 July', '11 to 20 July', '21 to 31 July'] },
        { code: 'Aug', name: 'August', slots: ['01 to 10 August', '11 to 20 August', '21 to 31 August'] },
        { code: 'Sep', name: 'September', slots: ['01 to 10 September', '11 to 20 September', '21 to 30 September'] },
        { code: 'Oct', name: 'October', slots: ['01 to 10 October', '11 to 20 October', '21 to 31 October'] },
        { code: 'Nov', name: 'November', slots: ['01 to 10 November', '11 to 20 November', '21 to 30 November'] },
        { code: 'Dec', name: 'December', slots: ['01 to 10 December', '11 to 20 December', '21 to 31 December'] }
      ];

      const showToast = (msg, type = 'info') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3500);
      };

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const getFormattedDateTime = () => {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
      };

      const fetchAllData = async (silent = true) => {
        if (!silent) setIsSyncing(true);
        try {
          const [resAssets, resTemp, resPm, resUsers, resHist, resMaster, resAudit] = await Promise.allSettled([
            fetch(FIREBASE_DB_URL).then(r => r.json()),
            fetch(FIREBASE_TEMP_URL).then(r => r.json()),
            fetch(FIREBASE_PM_URL).then(r => r.json()),
            fetch(FIREBASE_USERS_URL).then(r => r.json()),
            fetch(FIREBASE_HISTORY_URL).then(r => r.json()),
            fetch(FIREBASE_MASTER_URL).then(r => r.json()),
            fetch(FIREBASE_AUDIT_URL).then(r => r.json())
          ]);

          if (resAssets.status === 'fulfilled' && resAssets.value) {
            setAssets(Object.keys(resAssets.value).map(k => ({ ...resAssets.value[k], firebaseKey: k })));
          }
          if (resHist.status === 'fulfilled' && resHist.value) {
            setStockHistory(Object.keys(resHist.value).map(k => ({ ...resHist.value[k], firebaseKey: k })).reverse());
          }
          if (resTemp.status === 'fulfilled' && resTemp.value) {
            setTempDispatches(Object.keys(resTemp.value).map(k => ({ ...resTemp.value[k], firebaseKey: k })).reverse());
          }
          if (resPm.status === 'fulfilled' && resPm.value) {
            setPmSchedules(Object.keys(resPm.value).map(k => ({ ...resPm.value[k], firebaseKey: k })));
          }
          if (resUsers.status === 'fulfilled' && resUsers.value) {
            const loadedUsers = Object.keys(resUsers.value).map(k => ({ ...resUsers.value[k], firebaseKey: k }));
            setUsers(loadedUsers.length > 0 ? loadedUsers : sampleFallbackUsers);
          }

          if (resMaster.status === 'fulfilled' && resMaster.value) {
            setMasterData(resMaster.value);
          } else {
            const defaultMaster = {
              groups: [{name: 'IT Peripherals'}, {name: 'Cable'}, {name: 'Networking'}, {name: 'Workstations'}, {name: 'Printers & Scanners'}],
              locations: [{name: 'IT Stores'}, {name: 'Server Room'}, {name: 'OPD Block'}, {name: 'IPD Ward'}, {name: 'Admin Block'}],
              brands: [{name: 'Dell'}, {name: 'HP'}, {name: 'Lenovo'}, {name: 'Cisco'}, {name: 'Logitech'}, {name: 'Honeywell'}, {name: 'D-Link'}],
              units: [{name: 'Piece'}, {name: 'Meter'}, {name: 'Box'}, {name: 'Set'}],
              itemNames: [{name: 'Mouse'}, {name: 'Keyboard'}, {name: 'HDMI Cable'}, {name: 'Cat6 Patch Cord'}],
              departments: [{name: 'IT'}, {name: 'HR'}, {name: 'Billing'}, {name: 'Pharmacy'}, {name: 'Diagnostics'}]
            };
            setMasterData(defaultMaster);
            await fetch(FIREBASE_MASTER_URL, { method: 'PUT', body: JSON.stringify(defaultMaster) });
          }

          if (resAudit.status === 'fulfilled' && resAudit.value) {
            setAuditLogs(Object.keys(resAudit.value).map(k => ({ ...resAudit.value[k], firebaseKey: k })).reverse().slice(0, 60));
          }

          const now = new Date();
          setLastSyncTime(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`);
        } catch (e) {
          console.error("Data fetch error", e);
        } finally {
          setLoading(false);
          if (!silent) { setIsSyncing(false); showToast("Cloud database synchronized!", "success"); }
        }
      };

      useEffect(() => {
        fetchAllData(true);
        const intervalId = setInterval(() => { if (!document.hidden) fetchAllData(true); }, 10000);
        return () => clearInterval(intervalId);
      }, []);

      // INITIALIZE SQL.JS
      useEffect(() => {
        if (!loading && window.initSqlJs && !sqlDb) {
          window.initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` })
            .then(SQL => { setSqlDb(new SQL.Database()); });
        }
      }, [loading, sqlDb]);

      useEffect(() => {
        if (sqlDb) {
          sqlDb.run("DROP TABLE IF EXISTS assets;");
          sqlDb.run(`CREATE TABLE assets (id INTEGER, "group" TEXT, particulars TEXT, brand TEXT, category TEXT, location TEXT, vendor TEXT, openingQty INTEGER, newPurchase INTEGER, issueItems INTEGER, shortItems INTEGER, deadItems INTEGER, balance INTEGER);`);
          assets.forEach(a => {
            sqlDb.run(`INSERT INTO assets VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`, [
              a.id || 0, a.group || '', a.particulars || '', a.brand || '', a.category || '', a.location || '', a.vendor || '',
              Number(a.openingQty || 0), Number(a.newPurchase || 0), Number(a.issueItems || 0), Number(a.shortItems || 0), Number(a.deadItems || 0), calcBalance(a)
            ]);
          });
        }
      }, [sqlDb, assets]);

      const saveAuditLog = async (action, beforeData, afterData) => {
        const log = {
          module: 'assets',
          action,
          by: loggedInUser ? loggedInUser.name : 'Admin',
          before: beforeData,
          after: afterData,
          timestamp: getFormattedDateTime()
        };
        await fetch(FIREBASE_AUDIT_URL, { method: 'POST', body: JSON.stringify(log) });
      };

      const recordStockHistory = async (particulars, actionType, qtyDelta, balanceAfter) => {
        const entry = {
          particulars,
          actionType,
          qtyDelta,
          balanceAfter,
          user: loggedInUser ? loggedInUser.name : 'Admin',
          timestamp: getFormattedDateTime()
        };
        await fetch(FIREBASE_HISTORY_URL, { method: 'POST', body: JSON.stringify(entry) });
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u =>
          (String(u.username).trim().toLowerCase() === String(usernameInput).trim().toLowerCase() ||
           String(u.name).trim().toLowerCase() === String(usernameInput).trim().toLowerCase()) &&
          String(u.pin).trim() === String(pinInput).trim() && u.status === 'Active'
        );
        if (matched) {
          setIsLoggedIn(true);
          setLoggedInUser(matched);
          setLoginError('');
          showToast(`Welcome back, ${matched.name}!`, "success");
        } else {
          setLoginError('Invalid Username or Security PIN code.');
        }
      };

      const [formData, setFormData] = useState({
        group: '', particulars: '', brand: '', customBrand: '', serialNo: '', vendor: '', invoiceNo: '', warranty: '',
        cableLength: '', measurementUnit: 'Piece', openingQty: 0, newPurchase: 0, issueItems: 0, shortItems: 0, deadItems: 0,
        minAlert: 2, category: 'Consumable', location: 'IT Stores', entryMonth: getCurrentMonthYear(), lastUpdated: getFormattedDateTime()
      });

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        const timestamped = getFormattedDateTime();
        const finalBrand = formData.brand === 'Other' ? formData.customBrand : formData.brand;

        if (editingAsset) {
          const updated = { ...editingAsset, ...formData, brand: finalBrand, lastUpdated: timestamped };
          try {
            if (editingAsset.firebaseKey) {
              await fetch(`${DB_BASE}/assets/${editingAsset.firebaseKey}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updated) });
            }
            await saveAuditLog('UPDATE', editingAsset, updated);
            await recordStockHistory(updated.particulars, 'Stock Updated', `Bal: ${calcBalance(updated)}`, calcBalance(updated));
            setAssets(assets.map(a => (a.id === editingAsset.id || a.firebaseKey === editingAsset.firebaseKey) ? updated : a));
            showToast("Asset updated & logged in Data Safety!", "success");
          } catch(err) { showToast("Error updating record.", "error"); }
        } else {
          const newAsset = { id: Date.now(), ...formData, brand: finalBrand, lastUpdated: timestamped };
          try {
            await fetch(FIREBASE_DB_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newAsset) });
            await saveAuditLog('CREATE', null, newAsset);
            await recordStockHistory(newAsset.particulars, 'New Entry', `+${Number(newAsset.openingQty) + Number(newAsset.newPurchase)}`, calcBalance(newAsset));
            await fetchAllData(true);
            showToast("New asset registered!", "success");
          } catch(err) { setAssets([newAsset, ...assets]); showToast("Asset saved locally.", "info"); }
        }
        setIsModalOpen(false);
        setEditingAsset(null);
      };

      const handleDeleteAsset = async (item) => {
        if (window.confirm(`Remove "${item.particulars}"? (Snapshot will be saved in Data Safety)`)) {
          try {
            if (item.firebaseKey) {
              await fetch(`${DB_BASE}/assets/${item.firebaseKey}.json`, { method: 'DELETE' });
            }
            await saveAuditLog('DELETE', item, null);
            setAssets(assets.filter(a => a.id !== item.id && a.firebaseKey !== item.firebaseKey));
            showToast("Asset removed. Backup retained in Data Safety.", "info");
          } catch(err) { showToast("Failed to delete record.", "error"); }
        }
      };

      const handleRestoreSnapshot = async (snapshot) => {
        if (!snapshot) return;
        const restored = { ...snapshot, lastUpdated: getFormattedDateTime() };
        delete restored.firebaseKey;
        await fetch(FIREBASE_DB_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(restored) });
        await fetchAllData(true);
        showToast(`Restored "${snapshot.particulars}" back to Stock Register!`, "success");
      };

      // EXCEL IMPORT HANDLER
      const handleExcelImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const wb = XLSX.read(evt.target.result, { type: 'binary' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws);
            if (!rows.length) return showToast("Excel sheet is empty.", "error");
            let count = 0;
            for (const r of rows) {
              const payload = {
                id: Date.now() + count,
                group: String(r["Group"] || r.group || "IT Peripherals"),
                particulars: String(r["Particulars"] || r.particulars || "IMPORTED ITEM").toUpperCase(),
                brand: String(r["Brand"] || r.brand || "Generic"),
                serialNo: String(r["Serial No"] || r.serialNo || ""),
                measurementUnit: String(r["Unit"] || r.measurementUnit || "Piece"),
                openingQty: Number(r["Opening Qty"] || r.openingQty || 0),
                newPurchase: Number(r["New Purchase"] || r.newPurchase || 0),
                issueItems: Number(r["Issued Items"] || r.issueItems || 0),
                shortItems: Number(r["Short Items"] || r.shortItems || 0),
                deadItems: Number(r["Dead Items"] || r.deadItems || 0),
                minAlert: Number(r["Min Stock Alert"] || r.minAlert || 2),
                category: String(r["Category"] || r.category || "Consumable"),
                location: String(r["Location"] || r.location || "IT Stores"),
                lastUpdated: getFormattedDateTime()
              };
              await fetch(FIREBASE_DB_URL, { method: 'POST', body: JSON.stringify(payload) });
              count++;
            }
            await fetchAllData(true);
            showToast(`Imported ${count} items from Excel!`, "success");
          } catch (err) {
            showToast("Failed to parse Excel file.", "error");
          }
          e.target.value = '';
        };
        reader.readAsBinaryString(file);
      };

      const handleAddMaster = async (e) => {
        e.preventDefault();
        if (!masterForm.name.trim()) return;
        const newEntry = { id: Date.now(), name: masterForm.name.trim() };
        const currentList = masterData[currentMasterType] || [];
        const updatedData = { ...masterData, [currentMasterType]: [...currentList, newEntry] };
        await fetch(FIREBASE_MASTER_URL, { method: 'PUT', body: JSON.stringify(updatedData) });
        setMasterData(updatedData);
        setMasterForm({ name: '' });
        showToast(`Added "${newEntry.name}" to ${currentMasterType}`, "success");
      };

      const handleDeleteMaster = async (idx) => {
        const currentList = [...(masterData[currentMasterType] || [])];
        currentList.splice(idx, 1);
        const updatedData = { ...masterData, [currentMasterType]: currentList };
        await fetch(FIREBASE_MASTER_URL, { method: 'PUT', body: JSON.stringify(updatedData) });
        setMasterData(updatedData);
        showToast("Master entry removed.", "info");
      };

      // TEMP DISPATCH HANDLERS
      const handleSaveTemp = async (e) => {
        e.preventDefault();
        const entry = { id: Date.now(), ...tempForm, issuedBy: loggedInUser?.name || 'Admin', issuedDate: getFormattedDateTime() };
        await fetch(FIREBASE_TEMP_URL, { method: 'POST', body: JSON.stringify(entry) });
        await fetchAllData(true);
        setIsTempModalOpen(false);
        setTempForm({ assetName: '', assetTagNo: '', department: 'IT', receiver: '', quantity: 1, expectedReturn: '', status: 'Temporary Given' });
        showToast("Temporary dispatch logged!", "success");
      };

      const handleReturnTemp = async (item) => {
        const updated = { ...item, status: 'Returned', returnedDate: getFormattedDateTime() };
        if (item.firebaseKey) {
          await fetch(`${DB_BASE}/temp_dispatches/${item.firebaseKey}.json`, { method: 'PUT', body: JSON.stringify(updated) });
        }
        setTempDispatches(tempDispatches.map(t => t.firebaseKey === item.firebaseKey ? updated : t));
        showToast(`Marked "${item.assetName}" as Returned!`, "success");
      };

      // PM SCHEDULE HANDLERS
      const handleSavePm = async (e) => {
        e.preventDefault();
        const entry = { id: Date.now(), ...pmForm, loggedBy: loggedInUser?.name || 'Admin', updatedAt: getFormattedDateTime() };
        await fetch(FIREBASE_PM_URL, { method: 'POST', body: JSON.stringify(entry) });
        await fetchAllData(true);
        setIsPmModalOpen(false);
        showToast("Preventive Maintenance schedule added!", "success");
      };

      const handleCompletePm = async (pm) => {
        const updated = { ...pm, status: 'Completed', completedDate: getFormattedDateTime() };
        if (pm.firebaseKey) {
          await fetch(`${DB_BASE}/pm_schedules/${pm.firebaseKey}.json`, { method: 'PUT', body: JSON.stringify(updated) });
        }
        setPmSchedules(pmSchedules.map(p => p.firebaseKey === pm.firebaseKey ? updated : p));
        showToast("PM marked as Completed!", "success");
      };

      // USER HANDLERS
      const handleAddUser = async (e) => {
        e.preventDefault();
        const entry = { id: Date.now(), ...newUserForm };
        await fetch(FIREBASE_USERS_URL, { method: 'POST', body: JSON.stringify(entry) });
        await fetchAllData(true);
        setNewUserForm({ name: '', username: '', pin: '', role: 'Store Keeper', department: 'IT', status: 'Active' });
        showToast("New user added!", "success");
      };

      const runSqlQuery = () => {
        if (!sqlDb) return showToast("SQL Engine initializing...", "info");
        setSqlError('');
        try {
          const res = sqlDb.exec(sqlQuery);
          if (res.length > 0) setSqlResult({ cols: res[0].columns, vals: res[0].values });
          else { setSqlResult(null); showToast("Query executed (0 rows returned).", "info"); }
        } catch (err) { setSqlError(err.message); setSqlResult(null); }
      };

      const summaryMetrics = useMemo(() => {
        let totalItems = 0, totalBalance = 0, totalIssued = 0, totalShort = 0, totalDead = 0, lowStockCount = 0;
        assets.forEach(a => {
          const op = Number(a.openingQty || 0), pur = Number(a.newPurchase || 0), iss = Number(a.issueItems || 0), sh = Number(a.shortItems || 0), dd = Number(a.deadItems || 0);
          const bal = calcBalance(a);
          totalItems += (op + pur);
          totalBalance += bal;
          totalIssued += iss;
          totalShort += sh;
          totalDead += dd;
          if (bal <= Number(a.minAlert || 2)) lowStockCount++;
        });
        return { totalItems, totalBalance, totalIssued, totalShort, totalDead, lowStockCount };
      }, [assets]);

      const groupCounts = useMemo(() => {
        return assets.reduce((acc, curr) => { const g = curr.group || 'OTHER'; acc[g] = (acc[g] || 0) + 1; return acc; }, {});
      }, [assets]);

      const filteredAssets = useMemo(() => {
        return assets.filter(item => {
          const searchLower = searchQuery.toLowerCase();
          const matchesSearch =
            (item.particulars || '').toLowerCase().includes(searchLower) ||
            (item.group || '').toLowerCase().includes(searchLower) ||
            (item.serialNo || '').toLowerCase().includes(searchLower) ||
            (item.brand || '').toLowerCase().includes(searchLower) ||
            (item.location || '').toLowerCase().includes(searchLower);
          const matchesLocation = locationFilter === 'All' || !locationFilter || (item.location || '').toLowerCase() === locationFilter.toLowerCase();
          const matchesGroup = !selectedGroupFilter || (item.group || '').toLowerCase() === selectedGroupFilter.toLowerCase();
          const matchesLow = !lowStockOnly || calcBalance(item) <= Number(item.minAlert || 2);
          return matchesSearch && matchesLocation && matchesGroup && matchesLow;
        });
      }, [assets, searchQuery, locationFilter, selectedGroupFilter, lowStockOnly]);

      useEffect(() => { setCurrentPage(1); }, [searchQuery, locationFilter, selectedGroupFilter, lowStockOnly]);

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const paginatedAssets = useMemo(() => filteredAssets.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage), [filteredAssets, currentPage, itemsPerPage]);

      // ==================== LOGIN GATE SCREEN ====================
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_top_right,#312e81,transparent_50%)] opacity-60"></div>
            <div className="bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl max-w-md w-full p-8 space-y-6 relative z-10 text-white">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 bg-brand-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-brand-600/30">
                  <Icons.Lock />
                </div>
                <h1 className="text-xl font-black tracking-wide uppercase">Enterprise IT Asset Suite</h1>
                <p className="text-xs text-slate-400">NABH Audit & Live Hospital IT Inventory Portal</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
                  <input
                    type="text"
                    required
                    value={usernameInput}
                    onChange={(e) => setUsernameInput(e.target.value)}
                    placeholder="e.g. admin or store"
                    className="w-full px-4 py-3 bg-slate-800/90 border border-slate-700 rounded-xl text-sm font-semibold text-white outline-none focus:border-brand-500"
                  />
                </div>
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Security PIN</label>
                  <input
                    type="password"
                    required
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    placeholder="••••"
                    className="w-full px-4 py-3 bg-slate-800/90 border border-slate-700 rounded-xl text-sm font-mono tracking-widest text-white outline-none focus:border-brand-500"
                  />
                </div>
                {loginError && (
                  <div className="p-3 rounded-xl bg-rose-950/70 border border-rose-500/40 text-rose-300 text-xs font-semibold">
                    {loginError}
                  </div>
                )}
                <button type="submit" className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold text-sm shadow-lg shadow-brand-600/30 transition">
                  Authenticate & Enter Suite
                </button>
              </form>

              <div className="pt-3 border-t border-slate-800 flex justify-between text-[11px] text-slate-400 font-mono">
                <span>Admin: admin / 1234</span>
                <span>Store: store / 5678</span>
              </div>
            </div>
          </div>
        );
      }

      // ==================== MAIN APPLICATION ====================
      return (
        <div className="flex h-screen bg-slate-100 text-slate-800 overflow-hidden font-sans">
          {toast.show && (
            <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl border text-xs font-semibold flex items-center gap-2.5 transition-all ${toast.type === 'success' ? 'bg-slate-900 text-white border-emerald-500/40' : toast.type === 'error' ? 'bg-rose-900 text-white border-rose-500/40' : 'bg-slate-900 text-white border-slate-700'}`}>
              <span className={`w-2 h-2 rounded-full ${toast.type === 'success' ? 'bg-emerald-400' : toast.type === 'error' ? 'bg-rose-400' : 'bg-brand-400'}`}></span>
              <span>{toast.msg}</span>
            </div>
          )}
          <input type="file" ref={fileInputRef} onChange={handleExcelImport} accept=".xlsx, .xls, .csv" className="hidden" />

          {/* SIDEBAR */}
          <aside className="w-72 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 border-r border-slate-800 shrink-0">
            <div className="space-y-4 flex flex-col h-full overflow-hidden">
              <div className="flex items-center gap-3 px-2 py-3 border-b border-slate-800 shrink-0">
                <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-brand-600/30"><Icons.Stock /></div>
                <div>
                  <h2 className="text-xs font-black tracking-wider uppercase text-white">ASSET SUITE PRO</h2>
                  <div className="flex items-center gap-1.5 mt-0.5"><span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span className="text-[10px] text-slate-400 font-mono">Sync: {lastSyncTime}</span></div>
                </div>
              </div>

              <nav className="space-y-1 text-xs font-semibold overflow-y-auto pr-1 flex-1">
                {[
                  { id: 'inventory', label: '1. Stock Register', icon: Icons.Stock },
                  { id: 'temp_deploy', label: '2. Temporary Deployment', icon: Icons.Exchange },
                  { id: 'preventive_maint', label: '3. Preventive Maintenance', icon: Icons.Settings },
                  { id: 'stock_ledger', label: '4. Stock Ledger & Analytics', icon: Icons.Report },
                  { id: 'asset_lifecycle', label: '5. Warranty & Lifecycle', icon: Icons.Shield },
                  { id: 'vendors', label: '6. Vendors & Procurement', icon: Icons.Building },
                  { id: 'users', label: '7. Privileges & Access', icon: Icons.Users },
                  { id: 'master', label: '8. Master Data Manager', icon: Icons.Database },
                  { id: 'sql', label: '9. SQL Playground', icon: Icons.Report },
                  { id: 'safety', label: '10. Data Safety Logs', icon: Icons.Shield }
                ].map(tab => {
                  const IconComponent = tab.icon;
                  const isActive = activeTab === tab.id;
                  return (
                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition cursor-pointer text-left ${isActive ? 'bg-brand-600 text-white font-bold shadow-md shadow-brand-600/25' : 'text-slate-400 hover:bg-slate-800/80 hover:text-white'}`}>
                      <IconComponent /><span>{tab.label}</span>
                    </button>
                  );
                })}
              </nav>

              <div className="bg-slate-800/60 p-3 rounded-2xl border border-slate-700/60 space-y-2 shrink-0">
                <div className="flex justify-between items-center text-[10px] uppercase font-bold text-slate-400"><span>Net Available Stock</span><span className="text-emerald-400 font-mono">{summaryMetrics.totalBalance} Units</span></div>
                <div className="grid grid-cols-2 gap-2 text-center">
                  <div className="bg-slate-900/80 p-2 rounded-xl"><div className="text-[10px] text-slate-400">Total Inward</div><div className="text-sm font-extrabold text-white font-mono">{summaryMetrics.totalItems}</div></div>
                  <button onClick={() => { setActiveTab('inventory'); setLowStockOnly(!lowStockOnly); }} className="bg-slate-900/80 hover:bg-slate-900 p-2 rounded-xl transition">
                    <div className="text-[10px] text-slate-400">Low Alerts</div>
                    <div className={`text-sm font-extrabold font-mono ${summaryMetrics.lowStockCount > 0 ? 'text-amber-400' : 'text-emerald-400'}`}>{summaryMetrics.lowStockCount}</div>
                  </button>
                </div>
              </div>
            </div>

            <div className="pt-3 border-t border-slate-800 space-y-2 shrink-0">
              <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/80 flex items-center justify-between">
                <div className="flex items-center gap-2.5 overflow-hidden">
                  <div className="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-xs">{loggedInUser ? loggedInUser.name.charAt(0) : 'A'}</div>
                  <div className="truncate">
                    <div className="text-xs font-bold text-white truncate">{loggedInUser ? loggedInUser.name : 'Super Admin'}</div>
                    <div className="text-[10px] text-indigo-400 font-medium truncate">{loggedInUser ? loggedInUser.role : 'Administrator'}</div>
                  </div>
                </div>
                <button onClick={() => fetchAllData(false)} title="Sync Now" disabled={isSyncing} className={`p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-700 transition ${isSyncing ? 'animate-spin text-brand-400' : ''}`}><Icons.Refresh /></button>
              </div>
              <button onClick={() => { setIsLoggedIn(false); setLoggedInUser(null); setPinInput(''); }} className="w-full py-2 bg-slate-800 hover:bg-rose-950/50 hover:text-rose-300 text-slate-400 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 border border-slate-700/60"><Icons.SignOut /> Sign Out</button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col overflow-hidden bg-slate-100 p-6 space-y-4">

            {/* ==================== TAB 1: STOCK REGISTER ==================== */}
            {activeTab === 'inventory' && (
              <div className="flex-1 flex flex-col overflow-hidden space-y-4">
                <div className="bg-white border border-slate-200/90 p-4 rounded-2xl shadow-xs space-y-2.5">
                  <div className="flex flex-wrap justify-between items-center gap-2">
                    <div className="text-xs font-extrabold uppercase tracking-wider text-slate-600 flex items-center gap-2"><Icons.Stock /> Stock Control & Auto-Calculation Suite</div>
                    <div className="flex flex-wrap items-center gap-2">
                      <button onClick={() => setLowStockOnly(!lowStockOnly)} className={`px-3 py-1.5 border text-xs font-bold rounded-xl transition ${lowStockOnly ? 'bg-amber-500 text-white border-amber-500' : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'}`}>
                        {lowStockOnly ? 'Showing Low Stock Only' : `Low Stock Alerts (${summaryMetrics.lowStockCount})`}
                      </button>
                      <button onClick={() => setShowHistoryModal(true)} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold rounded-xl flex items-center gap-1.5 transition"><Icons.Report /> History ({stockHistory.length})</button>
                      <button onClick={() => fileInputRef.current?.click()} className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-bold rounded-xl flex items-center gap-1.5 transition"><Icons.Upload /> Import Excel</button>
                      <button onClick={() => exportToExcel(`Stock_Register_${Date.now()}.xlsx`, filteredAssets)} className="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-bold rounded-xl flex items-center gap-1.5 transition"><Icons.Download /> Export Excel</button>
                    </div>
                  </div>
                  <div className="flex items-center gap-2.5 overflow-x-auto pb-1">
                    <button onClick={() => setSelectedGroupFilter('')} className={`min-w-[130px] p-2.5 rounded-xl text-left border transition cursor-pointer ${selectedGroupFilter === '' ? 'bg-brand-600 border-brand-600 text-white shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`}>
                      <div className="text-xs font-black uppercase">ALL GROUPS</div>
                      <div className={`text-[10px] font-semibold mt-0.5 ${selectedGroupFilter === '' ? 'text-brand-100' : 'text-slate-500'}`}>{assets.length} items logged</div>
                    </button>
                    {Object.keys(groupCounts).map(grp => {
                      const count = groupCounts[grp];
                      const isSelected = selectedGroupFilter.toLowerCase() === grp.toLowerCase();
                      return (
                        <button key={grp} onClick={() => setSelectedGroupFilter(grp)} className={`min-w-[140px] p-2.5 rounded-xl text-left border transition cursor-pointer flex justify-between items-start ${isSelected ? 'bg-brand-600 border-brand-600 text-white shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`}>
                          <div>
                            <div className="text-xs font-black uppercase tracking-tight">{grp}</div>
                            <div className={`text-[10px] font-semibold mt-0.5 ${isSelected ? 'text-brand-100' : 'text-slate-500'}`}>{count} assets</div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <header className="bg-white border border-slate-200/90 p-4 rounded-2xl shadow-xs flex flex-wrap justify-between items-center gap-4">
                  <div className="flex items-center gap-3">
                    <h1 className="text-sm font-extrabold text-slate-900 tracking-wide uppercase">Stock Register</h1>
                    <span className="px-2.5 py-0.5 bg-slate-100 text-slate-600 font-mono text-xs rounded-full font-bold">{filteredAssets.length} Records</span>

                      <input type="text" placeholder="Antivirus Status" value={pmForm.antiVirus} onChange={e => setPmForm({...pmForm, antiVirus: e.target.value})} className="p-2.5 border rounded-xl" />
                    </div>
                    <div className="flex justify-end gap-2 pt-2">
                      <button type="button" onClick={() => setIsPmModalOpen(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button>
                      <button type="submit" className="px-5 py-2 bg-brand-600 text-white rounded-xl font-bold">Save Schedule</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
