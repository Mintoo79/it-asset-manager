<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td {
      padding: 6px 8px !important;
      line-height: 1.2 !important;
    }
    .neon-sidebar {
      background: linear-gradient(180deg, #090d16 0%, #111827 50%, #030712 100%);
    }
    .active-neon-btn {
      background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: Inter, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">Loading IT Asset Portal...</div>
        <div style="font-size: 12px; color: #94a3b8;">Establishing secure cloud session</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [viewModalItem, setViewModalItem] = useState(null);
      const [historyModalItem, setHistoryModalItem] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      // Temporary Asset Deployment state
      const [tempDispatches, setTempDispatches] = useState(() => {
        const saved = localStorage.getItem('it_temp_dispatches_v3');
        return saved ? JSON.parse(saved) : [
          { id: 'td_1', assetName: 'Dell OptiPlex CPU i5', assetTagNo: 'TAG-IT-9012', department: 'Accounts Department', receiver: 'Mr. Ramesh Gupta', quantity: 2, issueDate: '10 Nov 2026', status: 'Active Dispatched' }
        ];
      });
      const [isTempModalOpen, setIsTempModalOpen] = useState(false);
      const [tempForm, setTempForm] = useState({ assetName: '', assetTagNo: '', department: '', receiver: '', quantity: 1 });

      // Preventive Maintenance (PM) state
      const [pmSchedules, setPmSchedules] = useState(() => {
        const saved = localStorage.getItem('it_pm_schedules_v1');
        return saved ? JSON.parse(saved) : [
          { id: 'pm_1', equipmentName: 'Server Room Rack A', maintenanceType: 'Quarterly Dusting & Thermal Check', scheduledDate: '20 Nov 2026', technician: 'Mr. Amit Verma', status: 'Scheduled', remarks: 'Pending due date' },
          { id: 'pm_2', equipmentName: 'UPS Battery Bank 10KVA', maintenanceType: 'Battery Load Test & Calibration', scheduledDate: '15 Nov 2026', technician: 'Apex Power Services', status: 'Completed', remarks: 'All cells optimal' }
        ];
      });
      const [isPmModalOpen, setIsPmModalOpen] = useState(false);
      const [pmForm, setPmForm] = useState({ equipmentName: '', maintenanceType: '', scheduledDate: '', technician: '', remarks: '' });

      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('it_system_users_v2');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: 'Super Admin', pin: '1234', role: 'Super Administrator', status: 'Active' },
          { id: 2, name: 'IT Inventory Desk', pin: '5678', role: 'Store Keeper', status: 'Active' }
        ];
      });
      const [newUserName, setNewUserName] = useState('');
      const [newUserPin, setNewUserPin] = useState('');
      const [newUserRole, setNewUserRole] = useState('Store Keeper');

      const lineChartRef = useRef(null);
      const donutChartRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const getFormattedDateTime = () => {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        brand: 'Honeywell',
        customBrand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        cableLength: '',
        measurementUnit: 'Piece',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '', // Optional/blank by default until assigned
        minAlert: 2,
        entryMonth: getCurrentMonthYear(),
        lastUpdated: getFormattedDateTime()
      });

      const sampleFallbackAssets = [
        { id: 101, group: 'IT Peripherals', particulars: 'Optical Mouse USB', brand: 'Honeywell', serialNo: 'HW-MS-9981', cableLength: '1.5', measurementUnit: 'Meter', openingQty: 25, newPurchase: 10, issueItems: 8, shortItems: 0, deadItems: 1, category: 'Consumable', location: 'A Block', minAlert: 5, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026, 10:15 AM' },
        { id: 102, group: 'IT Peripherals', particulars: 'Multimedia Keyboard', brand: 'Honeywell', serialNo: 'HW-KB-4421', cableLength: '1.8', measurementUnit: 'Meter', openingQty: 20, newPurchase: 5, issueItems: 6, shortItems: 0, deadItems: 0, category: 'Consumable', location: 'B Block', minAlert: 4, entryMonth: 'Nov 2026', lastUpdated: '12 Nov 2026, 11:20 AM' },
        { id: 103, group: 'Hardware Parts', particulars: 'DDR4 8GB RAM Module', brand: 'Other', customBrand: 'Corsair', serialNo: 'CR-8G-2666', cableLength: '', measurementUnit: 'Piece', openingQty: 15, newPurchase: 10, issueItems: 12, shortItems: 0, deadItems: 0, category: 'Fixed Assets', location: 'A Block', minAlert: 3, entryMonth: 'Nov 2026', lastUpdated: '11 Nov 2026, 02:40 PM' },
        { id: 104, group: 'Storage Devices', particulars: 'Solid State Drive 512GB SSD', brand: 'Other', customBrand: 'Samsung', serialNo: 'SS-512-V9', cableLength: '', measurementUnit: 'GB', openingQty: 10, newPurchase: 8, issueItems: 14, shortItems: 0, deadItems: 0, category: 'Fixed Assets', location: '', minAlert: 2, entryMonth: 'Oct 2026', lastUpdated: '10 Nov 2026, 04:00 PM' }
      ];

      const fetchCloudData = async () => {
        try {
          const res = await fetch(FIREBASE_DB_URL);
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
          } else {
            setAssets(sampleFallbackAssets);
          }
        } catch (err) {
          setAssets(sampleFallbackAssets);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
      }, []);

      useEffect(() => {
        if (activeTab === 'dashboard' && isLoggedIn) {
          setTimeout(() => {
            const lineCtx = document.getElementById('trendLineChart');
            if (lineCtx) {
              if (lineChartRef.current) lineChartRef.current.destroy();
              const totalEnt = assets.length;
              const totalIss = assets.reduce((acc, i) => acc + Number(i.issueItems || 0), 0);
              lineChartRef.current = new Chart(lineCtx, {
                type: 'bar',
                data: {
                  labels: ['Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
                  datasets: [
                    {
                      label: 'Stock Entries',
                      data: [Math.round(totalEnt * 0.6), Math.round(totalEnt * 0.75), Math.round(totalEnt * 0.85), Math.round(totalEnt * 0.9), totalEnt],
                      backgroundColor: '#3b82f6',
                      borderRadius: 6
                    },
                    {
                      label: 'Items Issued',
                      data: [Math.round(totalIss * 0.5), Math.round(totalIss * 0.7), Math.round(totalIss * 0.8), Math.round(totalIss * 0.9), totalIss],
                      backgroundColor: '#10b981',
                      borderRadius: 6
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } },
                  scales: {
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                  }
                }
              });
            }

            const donutCtx = document.getElementById('overviewDonutChart');
            if (donutCtx) {
              if (donutChartRef.current) donutChartRef.current.destroy();
              const fixedCount = assets.filter(i => i.category === 'Fixed Assets').length || 2;
              const consumCount = assets.filter(i => i.category === 'Consumable').length || 2;
              donutChartRef.current = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                  labels: ['Fixed Assets', 'Consumables'],
                  datasets: [{
                    data: [fixedCount, consumCount],
                    backgroundColor: ['#3b82f6', '#10b981'],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  cutout: '70%',
                  plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } }
                }
              });
            }
          }, 150);
        }
      }, [activeTab, isLoggedIn, assets]);

      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u => u.pin === pinInput && u.status === 'Active');
        if (matched || pinInput === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
          showToast(`Welcome back, ${matched ? matched.name : 'Super Admin'}!`);
        } else {
          setLoginError('Invalid Security PIN (Default PIN: 1234)');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const handleOpenModal = (asset = null) => {
        const currentTs = getFormattedDateTime();
        if (asset) {
          setEditingAsset(asset);
          setFormData({
            group: asset.group || '',
            particulars: asset.particulars || '',
            brand: asset.brand || 'Honeywell',
            customBrand: asset.customBrand || '',
            serialNo: asset.serialNo || '',
            vendor: asset.vendor || '',
            invoiceNo: asset.invoiceNo || '',
            warranty: asset.warranty || '',
            cableLength: asset.cableLength || '',
            measurementUnit: asset.measurementUnit || 'Piece',
            openingQty: asset.openingQty || 0,
            newPurchase: asset.newPurchase || 0,
            issueItems: asset.issueItems || 0,
            shortItems: asset.shortItems || 0,
            deadItems: asset.deadItems || 0,
            category: asset.category || 'Consumable',
            location: asset.location || '',
            minAlert: asset.minAlert || 2,
            entryMonth: asset.entryMonth || getCurrentMonthYear(),
            lastUpdated: currentTs
          });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            brand: 'Honeywell',
            customBrand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            cableLength: '',
            measurementUnit: 'Piece',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '', // Blank by default
            minAlert: 2,
            entryMonth: getCurrentMonthYear(),
            lastUpdated: currentTs
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const timestampedData = {
          ...formData,
          lastUpdated: getFormattedDateTime()
        };

        try {
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(timestampedData)
            });
          } else {
            await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...timestampedData, id: Date.now() })
            });
          }
          setIsModalOpen(false);
          await fetchCloudData();
          showToast("Asset record saved successfully!");
        } catch (err) {
          if (editingAsset) {
            setAssets(assets.map(i => i.id === editingAsset.id ? { ...timestampedData, id: editingAsset.id } : i));
          } else {
            setAssets([{ ...timestampedData, id: Date.now() }, ...assets]);
          }
          setIsModalOpen(false);
          showToast("Asset record saved locally!");
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteAsset = async (asset) => {
        if (window.confirm("Are you sure you want to delete this asset record?")) {
          setLoading(true);
          try {
            if (asset.firebaseKey) {
              const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${asset.firebaseKey}.json`;
              await fetch(deleteUrl, { method: 'DELETE' });
            }
            setAssets(assets.filter(i => i.id !== asset.id && i.firebaseKey !== asset.firebaseKey));
            showToast("Asset record deleted.");
          } catch (err) {
            setAssets(assets.filter(i => i.id !== asset.id));
          } finally {
            setLoading(false);
          }
        }
      };

      const handleCreateUser = (e) => {
        e.preventDefault();
        if (!newUserName || !newUserPin) return;
        const newUser = {
          id: Date.now(),
          name: newUserName,
          pin: newUserPin,
          role: newUserRole,
          status: 'Active'
        };
        const updated = [...users, newUser];
        setUsers(updated);
        localStorage.setItem('it_system_users_v2', JSON.stringify(updated));
        setNewUserName('');
        setNewUserPin('');
        showToast(`User account created for ${newUser.name}!`);
      };

      const handleSaveTempDispatch = (e) => {
        e.preventDefault();
        const newRecord = {
          id: `td_${Date.now()}`,
          ...tempForm,
          issueDate: getFormattedDateTime().split(',')[0],
          status: 'Active Dispatched'
        };
        const updated = [newRecord, ...tempDispatches];
        setTempDispatches(updated);
        localStorage.setItem('it_temp_dispatches_v3', JSON.stringify(updated));
        setIsTempModalOpen(false);
        setTempForm({ assetName: '', assetTagNo: '', department: '', receiver: '', quantity: 1 });
        showToast("Temporary asset deployment registered successfully!");
      };

      const handleReturnTempAsset = (id) => {
        const updated = tempDispatches.map(item => item.id === id ? { ...item, status: 'Returned & Verified' } : item);
        setTempDispatches(updated);
        localStorage.setItem('it_temp_dispatches_v3', JSON.stringify(updated));
        showToast("Asset marked as returned and verified.");
      };

      const handleSavePmSchedule = (e) => {
        e.preventDefault();
        const newPm = {
          id: `pm_${Date.now()}`,
          ...pmForm,
          status: 'Scheduled'
        };
        const updated = [newPm, ...pmSchedules];
        setPmSchedules(updated);
        localStorage.setItem('it_pm_schedules_v1', JSON.stringify(updated));
        setIsPmModalOpen(false);
        setPmForm({ equipmentName: '', maintenanceType: '', scheduledDate: '', technician: '', remarks: '' });
        showToast("Preventive maintenance task scheduled!");
      };

      const handleCompletePm = (id) => {
        const updated = pmSchedules.map(item => item.id === id ? { ...item, status: 'Completed' } : item);
        setPmSchedules(updated);
        localStorage.setItem('it_pm_schedules_v1', JSON.stringify(updated));
        showToast("PM task marked as completed.");
      };

      // Group summaries computation
      const groupMap = {};
      assets.forEach(item => {
        const g = item.group || 'General IT Assets';
        if (!groupMap[g]) groupMap[g] = { count: 0, lowStock: 0, items: [] };
        groupMap[g].count += 1;
        groupMap[g].items.push(item);
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        if (phy <= Number(item.minAlert || 2)) groupMap[g].lowStock += 1;
      });

      const sortedGroups = Object.keys(groupMap).sort();

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        const matchesGroup = selectedGroupFilter === '' || (item.group || '') === selectedGroupFilter;
        return matchesSearch && matchesLocation && matchesMonth && matchesGroup;
      });

      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);

      const totalRecords = assets.length;
      const lowStockItems = assets.filter(item => {
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        return phy <= Number(item.minAlert || 2);
      });

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <div className="text-center mb-6">
                <div className="inline-flex p-3.5 bg-blue-50 text-blue-600 rounded-2xl mb-3 shadow-inner border border-blue-100">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">IT Asset Portal</h1>
                <p className="text-xs font-medium text-slate-500 mt-1">Enterprise Cloud Inventory & Deployment Infrastructure</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Security PIN Code</label>
                  <input 
                    type="password" 
                    placeholder="Enter PIN (Default: 1234)" 
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none transition"
                    required
                  />
                </div>

                {loginError && <p className="text-xs text-rose-500 font-medium">{loginError}</p>}

                <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-blue-500/20 transition duration-150 flex items-center justify-center gap-2 cursor-pointer">
                  Authenticate & Sign In
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100">
          
          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed top-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 text-xs font-bold flex items-center gap-2 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
              {toastMsg}
            </div>
          )}

          {/* LEFT NEON SIDEBAR */}
          <aside className="w-64 neon-sidebar text-slate-300 flex flex-col justify-between p-4 shadow-2xl border-r border-slate-900 relative">
            <div>
              <div className="text-center pt-2 pb-5 border-b border-slate-800/60">
                <div className="inline-flex p-3 bg-blue-600/20 border border-blue-500/40 rounded-full mb-2 shadow-lg shadow-blue-500/20">
                  <svg className="w-7 h-7 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h2 className="font-black text-white text-sm tracking-wider leading-tight">IT ASSET & INVENTORY</h2>
                <span className="text-[10px] text-emerald-400 font-bold flex items-center justify-center gap-1.5 mt-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synchronized
                </span>
              </div>

              <nav className="mt-3 space-y-1">
                {[
                  { id: 'inventory', label: '1. Stock Register', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                  { id: 'temp_dispatch', label: '2. Temporary Deployment', icon: 'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4' },

                    <label className="block font-semibold text-slate-700 mb-1">Remarks / Checklist</label>
                    <input
                      type="text"
                      placeholder="e.g. Check power supply fans and backup"
                      value={pmForm.remarks}
                      onChange={(e) => setPmForm({ ...pmForm, remarks: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-lg"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsPmModalOpen(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow cursor-pointer"
                    >
                      Schedule Task
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* VIEW SLIP MODAL */}
          {viewModalItem && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-extrabold text-slate-900 text-sm uppercase">Asset Issue & Verification Slip</h3>
                    <p className="text-[11px] text-slate-500">Official IT Infrastructure Record</p>
                  </div>
                  <button onClick={() => setViewModalItem(null)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>

                <div className="space-y-3 text-xs bg-slate-50 p-4 rounded-xl border">
                  <div className="grid grid-cols-2 gap-2">
                    <div><strong>Group:</strong> {viewModalItem.group}</div>
                    <div><strong>Category:</strong> {viewModalItem.category}</div>
                    <div><strong>Item Particulars:</strong> {viewModalItem.particulars}</div>
                    <div><strong>Brand:</strong> {viewModalItem.brand === 'Other' ? viewModalItem.customBrand : viewModalItem.brand}</div>
                    <div><strong>Serial No:</strong> {viewModalItem.serialNo || 'N/A'}</div>
                    <div><strong>Location:</strong> {viewModalItem.location || 'Unassigned'}</div>
                    <div><strong>Issued Qty:</strong> {viewModalItem.issueItems || 0}</div>
                    <div><strong>Last Updated:</strong> {viewModalItem.lastUpdated}</div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-blue-600 text-white font-bold shadow cursor-pointer text-xs"
                  >
                    Print Slip
                  </button>
                  <button
                    onClick={() => setViewModalItem(null)}
                    className="px-4 py-2 rounded-xl bg-slate-200 text-slate-800 font-bold cursor-pointer text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* STOCK HISTORY MODAL */}
          {historyModalItem && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-slate-900 text-sm">Stock History & Log</h3>
                  <button onClick={() => setHistoryModalItem(null)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <div className="space-y-2 text-xs">
                  <div className="p-3 bg-slate-50 rounded-xl border">
                    <div className="font-bold text-slate-900">{historyModalItem.particulars}</div>
                    <div className="text-slate-500 mt-1">Opening Qty: {historyModalItem.openingQty} | Purchases: {historyModalItem.newPurchase} | Issued: {historyModalItem.issueItems}</div>
                    <div className="text-[10px] text-slate-400 font-mono mt-2">Last Modified: {historyModalItem.lastUpdated}</div>
                  </div>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setHistoryModalItem(null)} className="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold cursor-pointer">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* ADD / EDIT ASSET MODAL WITH ALL FIELDS & OPTIONAL LOCATION */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full p-6 space-y-4 my-8">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-slate-900 text-sm">
                    {editingAsset ? 'Edit Asset & Stock Details' : 'Register New Asset Entry'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="font-bold text-slate-400 hover:text-slate-700">✕</button>
                </div>

                <form onSubmit={handleSaveAsset} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Asset Group *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. IT Peripherals, Hardware"
                        value={formData.group}
                        onChange={(e) => setFormData({ ...formData, group: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-semibold"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Item Particulars *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Optical Mouse USB"
                        value={formData.particulars}
                        onChange={(e) => setFormData({ ...formData, particulars: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-semibold"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Brand Name *</label>
                      <select 
                        value={formData.brand}
                        onChange={(e) => setFormData({ ...formData, brand: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      >
                        <option value="Honeywell">Honeywell</option>
                        <option value="Dell">Dell</option>
                        <option value="HP">HP</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="Cisco">Cisco</option>
                        <option value="Logitech">Logitech</option>
                        <option value="Other">Other (Custom)</option>
                      </select>
                    </div>

                    {formData.brand === 'Other' && (
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">Custom Brand Name *</label>
                        <input 
                          type="text"
                          required
                          placeholder="Enter Brand Name"
                          value={formData.customBrand}
                          onChange={(e) => setFormData({ ...formData, customBrand: e.target.value })}
                          className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Category Classification *</label>
                      <select 
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      >
                        <option value="Consumable">Consumable</option>
                        <option value="Non-Consumable">Non-Consumable</option>
                        <option value="Fixed Assets">Fixed Assets</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Location / Department (Optional)</label>
                      <input 
                        type="text" 
                        placeholder="Leave blank until assigned"
                        value={formData.location}
                        onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Serial Number</label>
                      <input 
                        type="text" 
                        placeholder="e.g. HW-MS-9981"
                        value={formData.serialNo}
                        onChange={(e) => setFormData({ ...formData, serialNo: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Cable Length</label>
                      <input 
                        type="text" 
                        placeholder="e.g. 1.5 / 3 / 5"
                        value={formData.cableLength}
                        onChange={(e) => setFormData({ ...formData, cableLength: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Measurement Unit</label>
                      <select 
                        value={formData.measurementUnit}
                        onChange={(e) => setFormData({ ...formData, measurementUnit: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      >
                        <option value="Piece">Piece</option>
                        <option value="Meter">Meter</option>
                        <option value="GB">GB</option>
                        <option value="TB">TB</option>
                        <option value="Box / Set">Box / Set</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-5 gap-3 bg-slate-50 p-4 rounded-xl border">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Opening Qty</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.openingQty}
                        onChange={(e) => setFormData({ ...formData, openingQty: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">New Purchase</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.newPurchase}
                        onChange={(e) => setFormData({ ...formData, newPurchase: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-blue-600"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Issue Items</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.issueItems}
                        onChange={(e) => setFormData({ ...formData, issueItems: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-amber-600"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Short / Deficit</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.shortItems}
                        onChange={(e) => setFormData({ ...formData, shortItems: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-rose-500"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Dead / Faulty</label>
                      <input 
                        type="number" 
                        min="0"
                        value={formData.deadItems}
                        onChange={(e) => setFormData({ ...formData, deadItems: Number(e.target.value) })}
                        className="w-full p-2 border border-slate-300 rounded-lg font-mono font-bold text-slate-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Vendor Name</label>
                      <input 
                        type="text" 
                        placeholder="e.g. Apex Tech Solutions"
                        value={formData.vendor}
                        onChange={(e) => setFormData({ ...formData, vendor: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Invoice Number & Warranty</label>
                      <input 
                        type="text" 
                        placeholder="e.g. INV-2026-991 | 1 Year"
                        value={formData.invoiceNo}
                        onChange={(e) => setFormData({ ...formData, invoiceNo: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-lg outline-none font-mono"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-3 border-t">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow cursor-pointer"
                    >
                      Save Asset Record
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
