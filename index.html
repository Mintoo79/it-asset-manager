<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const FIREBASE_DB_URL = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets.json";

    const defaultRoleRights = {
      Admin: { canAdd: true, canEdit: true, canDelete: true, canStockIn: true },
      "IT Manager": { canAdd: true, canEdit: true, canDelete: false, canStockIn: true },
      Technician: { canAdd: false, canEdit: true, canDelete: false, canStockIn: true },
      Viewer: { canAdd: false, canEdit: false, canDelete: false, canStockIn: false }
    };

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState({ name: 'Admin User', role: 'Admin' });
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [roleRights, setRoleRights] = useState(defaultRoleRights);
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');

      // Pagination States
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 10;

      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);
      const [recentlyAddedId, setRecentlyAddedId] = useState(null);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);

      const [isIssueModalOpen, setIsIssueModalOpen] = useState(false);
      const [issuingItem, setIssuingItem] = useState(null);
      const [issueForm, setIssueForm] = useState({ qty: 1, recipient: '', dept: '' });

      const getCurrentMonthYear = () => {
        const d = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
      };

      const [formData, setFormData] = useState({
        group: '',
        particulars: '',
        brand: '',
        serialNo: '',
        vendor: '',
        invoiceNo: '',
        warranty: '',
        openingQty: 0,
        newPurchase: 0,
        issueItems: 0,
        shortItems: 0,
        deadItems: 0,
        category: 'Consumable',
        location: '',
        minAlert: 2,
        entryMonth: getCurrentMonthYear()
      });

      const fetchCloudData = async () => {
        try {
          const res = await fetch(FIREBASE_DB_URL);
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
            setAssets(list);
          } else {
            setAssets([]);
          }
        } catch (err) {
          console.error("Firebase fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 3000);
        return () => clearInterval(interval);
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
        } else {
          setLoginError('Invalid Security PIN (Default PIN: 1234)');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
      };

      const handleOpenModal = (asset = null) => {
        const autoMonth = getCurrentMonthYear();
        if (asset) {
          setEditingAsset(asset);
          setFormData({ ...asset, entryMonth: asset.entryMonth || autoMonth });
        } else {
          setEditingAsset(null);
          setFormData({
            group: '',
            particulars: '',
            brand: '',
            serialNo: '',
            vendor: '',
            invoiceNo: '',
            warranty: '',
            openingQty: 0,
            newPurchase: 0,
            issueItems: 0,
            shortItems: 0,
            deadItems: 0,
            category: 'Consumable',
            location: '',
            minAlert: 2,
            entryMonth: autoMonth
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveAsset = async (e) => {
        e.preventDefault();
        setLoading(true);
        const currentTimestamp = Date.now();
        const finalData = {
          ...formData,
          entryMonth: formData.entryMonth ? formData.entryMonth : getCurrentMonthYear()
        };

        try {
          if (editingAsset && editingAsset.firebaseKey) {
            const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${editingAsset.firebaseKey}.json`;
            await fetch(updateUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(finalData)
            });
            setRecentlyAddedId(editingAsset.firebaseKey);
          } else {
            const response = await fetch(FIREBASE_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...finalData, id: currentTimestamp })
            });
            const result = await response.json();
            if (result && result.name) {
              setRecentlyAddedId(result.name);
            }
          }
          setIsModalOpen(false);
          await fetchCloudData();
        } catch (err) {
          alert("Error saving entry.");
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteAsset = async (asset) => {
        if (window.confirm("Are you sure you want to delete this asset record?")) {
          setLoading(true);
          try {
            const deleteUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${asset.firebaseKey}.json`;
            await fetch(deleteUrl, { method: 'DELETE' });
            await fetchCloudData();
          } catch (err) {
            console.error(err);
          } finally {
            setLoading(false);
          }
        }
      };

      const handleOpenIssueModal = (item) => {
        setIssuingItem(item);
        setIssueForm({ qty: 1, recipient: '', dept: item.location || '' });
        setIsIssueModalOpen(true);
      };

      const handleSaveIssue = async (e) => {
        e.preventDefault();
        if (!issuingItem) return;

        const newIssuedTotal = Number(issuingItem.issueItems || 0) + Number(issueForm.qty);
        const updatedLocations = issuingItem.location 
          ? `${issuingItem.location}, ${issueForm.recipient} (${issueForm.dept})`
          : `${issueForm.recipient} (${issueForm.dept})`;

        const updatedData = {
          ...issuingItem,
          issueItems: newIssuedTotal,
          location: updatedLocations
        };

        setLoading(true);
        try {
          const updateUrl = `https://it-asset-system-31cb8-default-rtdb.firebaseio.com/assets/${issuingItem.firebaseKey}.json`;
          await fetch(updateUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
          });
          setIsIssueModalOpen(false);
          await fetchCloudData();
          alert(`Successfully allocated ${issueForm.qty} unit(s) to ${issueForm.recipient}!`);
        } catch (err) {
          alert("Error updating allocated stock.");
        } finally {
          setLoading(false);
        }
      };

      const handlePrintGatePass = (item) => {
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
          <html>
            <head>
              <title>Asset Handover Voucher & Gate Pass</title>
              <style>
                body { font-family: 'Inter', sans-serif; padding: 35px; color: #0f172a; }
                .header { text-align: center; border-bottom: 2px solid #0284c7; padding-bottom: 14px; margin-bottom: 28px; }
                .details { margin-bottom: 45px; line-height: 2.2; font-size: 14px; }
                .signatures { display: flex; justify-content: space-between; margin-top: 100px; }
                .sig-box { border-top: 1px solid #64748b; width: 220px; text-align: center; padding-top: 8px; font-weight: 600; font-size: 13px; }
              </style>
            </head>
            <body>
              <div class="header">
                <h2 style="margin:0; color:#0f172a; font-size:22px;">IT ASSET MANAGEMENT SYSTEM</h2>
                <h4 style="margin:6px 0 0; color:#0284c7; font-weight:600; text-transform:uppercase; font-size:13px;">Official Handover Voucher & Gate Pass</h4>
              </div>
              <div class="details">
                <p><strong>Asset Category / Group:</strong> ${item.group}</p>
                <p><strong>Item Particulars:</strong> ${item.particulars}</p>
                <p><strong>Hardware Brand:</strong> ${item.brand || 'N/A'}</p>
                <p><strong>Serial Number / Asset Tag:</strong> ${item.serialNo || 'N/A'}</p>
                <p><strong>Entry Period:</strong> ${item.entryMonth || 'N/A'}</p>
                <p><strong>Allocation Location / Department:</strong> ${item.location || 'N/A'}</p>
                <p><strong>Voucher Issue Date:</strong> ${new Date().toLocaleDateString()}</p>
              </div>
              <div class="signatures">
                <div class="sig-box">Issued By (IT Operations)</div>
                <div class="sig-box">Received By (Employee / User)</div>
              </div>
            </body>
          </html>
        `);
        printWindow.document.close();
        printWindow.print();
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          const text = event.target.result;
          const rows = text.split("\n");
          
          setLoading(true);
          try {
            let count = 0;
            const currentM = getCurrentMonthYear();
            for (let i = 1; i < rows.length; i++) {
              const cols = rows[i].split(",");
              if (cols.length >= 2 && cols[1] && cols[1].trim() !== "") {
                const newItem = {
                  group: cols[1]?.replace(/"/g, '').trim() || 'General',
                  particulars: cols[2]?.replace(/"/g, '').trim() || 'Item',
                  brand: cols[3]?.replace(/"/g, '').trim() || '',
                  serialNo: cols[4]?.replace(/"/g, '').trim() || '',
                  vendor: cols[5]?.replace(/"/g, '').trim() || '',
                  invoiceNo: cols[6]?.replace(/"/g, '').trim() || '',
                  openingQty: Number(cols[7]) || 0,
                  newPurchase: Number(cols[8]) || 0,
                  issueItems: Number(cols[9]) || 0,
                  shortItems: Number(cols[10]) || 0,
                  deadItems: Number(cols[13]) || 0,
                  category: cols[14]?.replace(/"/g, '').trim() || 'Consumable',
                  location: cols[15]?.replace(/"/g, '').trim() || '',
                  entryMonth: currentM,
                  minAlert: 2,
                  id: Date.now() + i
                };
                await fetch(FIREBASE_DB_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(newItem)
                });
                count++;
              }
            }
            await fetchCloudData();
            alert(`Import Successful! ${count} asset records integrated.`);
          } catch (err) {
            alert("Error importing file.");
          } finally {
            setLoading(false);
          }
        };
        reader.readAsText(file);
      };

      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,S.No,Group,Particulars,Brand,Serial No,Vendor,Invoice,Entry Month,Opening Qty,New Purchase,Issue Items,Short Items,Balance Stock,Physical Stock,Dead Items,Category,Location\n";
        
        assets.forEach((item, index) => {
          const balanceStock = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
          const physicalStock = balanceStock - Number(item.shortItems || 0) - Number(item.deadItems || 0);
          const row = [
            index + 1,
            `"${item.group || ''}"`,
            `"${item.particulars || ''}"`,
            `"${item.brand || ''}"`,
            `"${item.serialNo || ''}"`,
            `"${item.vendor || ''}"`,
            `"${item.invoiceNo || ''}"`,
            `"${item.entryMonth || ''}"`,
            item.openingQty || 0,
            item.newPurchase || 0,
            item.issueItems || 0,
            item.shortItems || 0,
            balanceStock,
            physicalStock,
            item.deadItems || 0,
            `"${item.category || ''}"`,
            `"${(item.location || '').replace(/"/g, '""')}"`
          ];
          csvContent += row.join(",") + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "IT_Asset_Register_Report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const filteredAssets = assets.filter(item => {
        const matchesSearch = (item.particulars || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.group || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.brand || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLocation = locationFilter === '' || (item.location || '').toLowerCase().includes(locationFilter.toLowerCase());
        const matchesMonth = monthFilter === '' || (item.entryMonth || '').toLowerCase().includes(monthFilter.toLowerCase());
        return matchesSearch && matchesLocation && matchesMonth;
      });

      // Pagination Calculation
      const totalPages = Math.ceil(filteredAssets.length / itemsPerPage) || 1;
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filteredAssets.slice(indexOfFirstItem, indexOfLastItem);

      // Analytics Calculations
      const totalRecords = assets.length;
      const lowStockItems = assets.filter(item => {
        const bal = (Number(item.openingQty || 0) + Number(item.newPurchase || 0)) - Number(item.issueItems || 0);
        const phy = bal - Number(item.shortItems || 0) - Number(item.deadItems || 0);
        return phy <= Number(item.minAlert || 2);
      });
      const currentMonthRecords = assets.filter(i => (i.entryMonth || '').toLowerCase() === getCurrentMonthYear().toLowerCase()).length;

      const currentRights = roleRights[currentUser.role] || defaultRoleRights.Viewer;

      if (!isLoggedIn) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
              <div class="text-center mb-6">
                <div class="inline-flex p-3.5 bg-blue-50 text-blue-600 rounded-2xl mb-3 shadow-inner border border-blue-100">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">IT Asset Portal</h1>
                <p class="text-xs font-medium text-slate-500 mt-1">Enterprise Cloud Inventory Infrastructure</p>
              </div>

              <form onSubmit={handleLogin} class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">User Privilege Level</label>
                  <select 
                    value={currentUser.role} 
                    onChange={(e) => setCurrentUser({...currentUser, role: e.target.value})}
                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none transition"
                  >
                    <option value="Admin">System Administrator</option>
                    <option value="IT Manager">IT Operations Manager</option>
                    <option value="Technician">Desktop Technician</option>
                    <option value="Viewer">Auditor (Read-Only)</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Security PIN Code</label>
                  <input 
                    type="password" 
                    placeholder="Enter PIN (Default: 1234)" 
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none transition"
                    required
                  />
                </div>

                {loginError && <p class="text-xs text-rose-500 font-medium">{loginError}</p>}

                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-blue-500/20 transition duration-150 flex items-center justify-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                  Authenticate & Sign In
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div class="flex h-screen overflow-hidden bg-slate-50">
          <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-2xl border-r border-slate-800">
            <div class="p-5 border-b border-slate-800/80 flex items-center space-x-3">
              <div class="p-2.5 bg-blue-600 rounded-xl text-white font-bold text-sm shadow-md shadow-blue-500/30 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
              </div>
              <div>
                <h2 class="font-bold text-white text-sm leading-tight tracking-wide">IT Asset Hub</h2>
                <span class="text-[11px] text-emerald-400 font-semibold flex items-center gap-1.5 mt-0.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Active
                </span>
              </div>
            </div>

            <nav class="flex-1 p-3 space-y-1.5 overflow-y-auto">
              {[
                { id: 'inventory', label: '1. Stock Register', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                { id: 'dashboard', label: '2. Analytics Board', icon: 'M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' },
                { id: 'reports', label: '3. Audit & Reports', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                { id: 'rights', label: '4. Privilege Control', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  class={`w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all duration-150 flex items-center gap-2.5 ${
                    activeTab === tab.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'hover:bg-slate-800/60 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d={tab.icon}></path></svg>
                  {tab.label}
                </button>
              ))}
            </nav>

            <div class="p-4 border-t border-slate-800/80 bg-slate-950/40">
              <div class="flex items-center justify-between text-xs text-slate-400">
                <span class="flex items-center gap-1.5">
                  <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                  <strong class="text-white font-semibold">{currentUser.role}</strong>
                </span>
                <button onClick={handleLogout} class="text-rose-400 font-semibold hover:underline flex items-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                  Sign Out
                </button>
              </div>
            </div>
          </aside>

          <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white border-b border-slate-200/80 px-6 py-4 flex justify-between items-center shadow-sm z-10">
              <div class="flex items-center space-x-3">
                <h1 class="text-lg font-bold text-slate-900 tracking-tight flex items-center gap-2">
                  {activeTab === 'inventory' && 'Stock Register & Asset Inventory'}
                  {activeTab === 'dashboard' && 'Analytics & Operations Executive Dashboard'}
                  {activeTab === 'reports' && 'System Audit & Inventory Ledger'}
                  {activeTab === 'rights' && 'Role Access Rights Configuration'}
                </h1>
                <span class="px-2.5 py-1 bg-blue-50 text-blue-700 font-semibold text-[11px] rounded-lg border border-blue-100 flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                  Total Assets: {assets.length}
                </span>
                <span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 font-semibold text-[11px] rounded-lg border border-emerald-100 flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  Current Month: {currentMonthRecords}
                </span>
              </div>

              <div class="flex items-center space-x-2">
                {activeTab === 'inventory' && (
                  <>
                    <input 
                      type="text" 
                      placeholder="Search Item / Brand..." 
                      value={searchQuery}
                      onChange={(e) => { setSearchQuery(e.target.value); setCurrentPage(1); }}

                  <div>
                    <label class="block font-semibold text-emerald-700 mb-1">Entry Period (Auto Detect)</label>
                    <input type="text" value={formData.entryMonth} onChange={(e) => setFormData({...formData, entryMonth: e.target.value})} class="w-full p-2 border border-emerald-200 rounded-lg bg-emerald-50/30 font-semibold text-emerald-800 outline-none focus:ring-2 focus:ring-emerald-600" required />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Serial Number / Asset Tag</label>
                    <input type="text" value={formData.serialNo} onChange={(e) => setFormData({...formData, serialNo: e.target.value})} placeholder="e.g. SN-99281-XYZ" class="w-full p-2 border border-slate-200 rounded-lg font-mono outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Procurement Vendor Name</label>
                    <input type="text" value={formData.vendor} onChange={(e) => setFormData({...formData, vendor: e.target.value})} placeholder="e.g. Tech Solutions" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Invoice / Bill Reference No.</label>
                    <input type="text" value={formData.invoiceNo} onChange={(e) => setFormData({...formData, invoiceNo: e.target.value})} placeholder="e.g. INV-2026-05" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Asset Category Classification</label>
                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600">
                      <option value="Consumable">Consumable</option>
                      <option value="Non-Consumable">Non-Consumable</option>
                    </select>
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Low Stock Alert Threshold Limit</label>
                    <input type="number" value={formData.minAlert} onChange={(e) => setFormData({...formData, minAlert: Number(e.target.value)})} class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Opening Quantity Stock</label>
                    <input type="number" value={formData.openingQty} onChange={(e) => setFormData({...formData, openingQty: Number(e.target.value)})} class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">New Purchase Quantity</label>
                    <input type="number" value={formData.newPurchase} onChange={(e) => setFormData({...formData, newPurchase: Number(e.target.value)})} class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Issued Items Total</label>
                    <input type="number" value={formData.issueItems} onChange={(e) => setFormData({...formData, issueItems: Number(e.target.value)})} class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Shortage Quantity</label>
                    <input type="number" value={formData.shortItems} onChange={(e) => setFormData({...formData, shortItems: Number(e.target.value)})} class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Dead / Faulty Quantity</label>
                    <input type="number" value={formData.deadItems} onChange={(e) => setFormData({...formData, deadItems: Number(e.target.value)})} class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div>
                    <label class="block font-semibold text-slate-700 mb-1">Warranty Expiry Date</label>
                    <input type="date" value={formData.warranty} onChange={(e) => setFormData({...formData, warranty: e.target.value})} class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div class="col-span-2">
                    <label class="block font-semibold text-slate-700 mb-1">Installation Location / User Details</label>
                    <input type="text" value={formData.location} onChange={(e) => setFormData({...formData, location: e.target.value})} placeholder="e.g. B block, Ritu HR, Shampa HR, Chandan" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>

                  <div class="col-span-2 flex justify-end space-x-2 pt-3 border-t border-slate-200">
                    <button type="button" onClick={() => setIsModalOpen(false)} class="px-3.5 py-1.5 border border-slate-200 rounded-lg text-slate-600 font-medium hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow-sm">Save Asset Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
