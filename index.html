<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset & Inventory Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- SQL.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .table-compact th, .table-compact td { padding: 6px 8px !important; line-height: 1.2 !important; }
    .neon-sidebar { background: linear-gradient(180deg, #090d16 0%, #111827 50%, #030712 100%); }
    .active-neon-btn { background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%); box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
    /* SQL Editor style */
    .sql-editor { font-family: 'Courier New', Courier, monospace; background: #1e293b; color: #e2e8f0; padding: 15px; border-radius: 8px; border: 1px solid #334155; width: 100%; min-height: 120px; resize: vertical; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- FIREBASE URLs ---
    const DB_BASE = "https://it-asset-system-31cb8-default-rtdb.firebaseio.com";
    const FIREBASE_DB_URL = `${DB_BASE}/assets.json`;
    const FIREBASE_TEMP_URL = `${DB_BASE}/temp_dispatches.json`;
    const FIREBASE_PM_URL = `${DB_BASE}/pm_schedules.json`;
    const FIREBASE_USERS_URL = `${DB_BASE}/system_users.json`;
    const FIREBASE_MASTER_URL = `${DB_BASE}/master_data.json`;
    const FIREBASE_AUDIT_URL = `${DB_BASE}/audit_log.json`;

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [activeTab, setActiveTab] = useState('inventory');
      const [searchQuery, setSearchQuery] = useState('');
      const [locationFilter, setLocationFilter] = useState('');
      const [toastMsg, setToastMsg] = useState('');

      // Data States
      const [assets, setAssets] = useState([]);
      const [users, setUsers] = useState([]);
      const [masterData, setMasterData] = useState({ groups: [], locations: [], brands: [], units: [], departments: [] });
      const [auditLogs, setAuditLogs] = useState([]);
      const [loading, setLoading] = useState(true);

      // SQL State
      const [sqlDb, setSqlDb] = useState(null);
      const [sqlQuery, setSqlQuery] = useState('SELECT group, COUNT(*) as TotalItems, SUM(openingQty) as TotalOpening FROM assets GROUP BY group;');
      const [sqlResult, setSqlResult] = useState(null);
      const [sqlError, setSqlError] = useState('');

      // Modal States
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isMasterModalOpen, setIsMasterModalOpen] = useState(false);
      const [currentMasterType, setCurrentMasterType] = useState('groups');
      const [masterForm, setMasterForm] = useState({ name: '' });
      const [editingAsset, setEditingAsset] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const getFormattedDateTime = () => {
        return new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
      };

      // --- FETCH DATA & INITIALIZE SQL ---
      useEffect(() => {
        const fetchAll = async () => {
          try {
            // Fetch Master Data
            const resMaster = await fetch(FIREBASE_MASTER_URL);
            const dataMaster = await resMaster.json();
            if (dataMaster) setMasterData(dataMaster);
            else {
              // Default fallback master data
              const defaultMaster = {
                groups: [{name: 'IT Peripherals'}, {name: 'Hardware'}, {name: 'Networking'}],
                locations: [{name: 'Server Room'}, {name: 'A Block'}, {name: 'B Block'}],
                brands: [{name: 'Dell'}, {name: 'HP'}, {name: 'Cisco'}],
                units: [{name: 'Piece'}, {name: 'Meter'}]
              };
              setMasterData(defaultMaster);
              await fetch(FIREBASE_MASTER_URL, { method: 'PUT', body: JSON.stringify(defaultMaster) });
            }

            // Fetch Assets
            const resAssets = await fetch(FIREBASE_DB_URL);
            const dataAssets = await resAssets.json();
            const loadedAssets = dataAssets ? Object.keys(dataAssets).map(k => ({ ...dataAssets[k], firebaseKey: k })) : [];
            setAssets(loadedAssets);

            // Fetch Users
            const resUsers = await fetch(FIREBASE_USERS_URL);
            const dataUsers = await resUsers.json();
            const loadedUsers = dataUsers ? Object.keys(dataUsers).map(k => ({ ...dataUsers[k], firebaseKey: k })) : [];
            setUsers(loadedUsers.length > 0 ? loadedUsers : [{id:1, name: 'Admin', pin: '1234', status: 'Active'}]);

            // Fetch Audit Logs
            const resAudit = await fetch(FIREBASE_AUDIT_URL);
            const dataAudit = await resAudit.json();
            if (dataAudit) setAuditLogs(Object.values(dataAudit).reverse().slice(0, 50)); // Last 50 logs

            setLoading(false);
          } catch (err) {
            console.error("Fetch Error:", err);
            setLoading(false);
          }
        };

        fetchAll();
      }, []);

      // --- INITIALIZE SQL.JS ---
      useEffect(() => {
        if (!loading && window.initSqlJs && !sqlDb) {
          window.initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` })
            .then(SQL => {
              const db = new SQL.Database();
              setSqlDb(db);
              showToast("SQL Engine Loaded! You can run queries now.");
            });
        }
      }, [loading, sqlDb]);

      // Sync Assets to SQL whenever assets change or SQL loads
      useEffect(() => {
        if (sqlDb && assets.length > 0) {
          sqlDb.run("DROP TABLE IF EXISTS assets;");
          sqlDb.run(`CREATE TABLE assets (id INTEGER, "group" TEXT, particulars TEXT, brand TEXT, location TEXT, openingQty INTEGER, newPurchase INTEGER, issueItems INTEGER, shortItems INTEGER, deadItems INTEGER);`);
          
          assets.forEach(a => {
            sqlDb.run(`INSERT INTO assets VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`, [
              a.id || 0, a.group || '', a.particulars || '', a.brand || '', a.location || '', 
              a.openingQty || 0, a.newPurchase || 0, a.issueItems || 0, a.shortItems || 0, a.deadItems || 0
            ]);
          });
          console.log("SQL Database Synced with " + assets.length + " assets.");
        }
      }, [sqlDb, assets]);

      const runSqlQuery = () => {
        if (!sqlDb) return showToast("SQL Engine not loaded yet.");
        setSqlError('');
        try {
          const res = sqlDb.exec(sqlQuery);
          if (res.length > 0) {
            const cols = res[0].columns;
            const vals = res[0].values;
            setSqlResult({ cols, vals });
          } else {
            setSqlResult(null);
            showToast("Query executed successfully, but returned no results.");
          }
        } catch (err) {
          setSqlError(err.message);
          setSqlResult(null);
        }
      };

      // --- SAVE WITH AUDIT LOG (OPTION A) ---
      const saveAuditLog = async (module, action, before, after) => {
        const log = { module, action, before, after, timestamp: getFormattedDateTime() };
        await fetch(FIREBASE_AUDIT_URL, { method: 'POST', body: JSON.stringify(log) });
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u => String(u.pin) === String(pinInput) && u.status === 'Active');
        if (matched) { setIsLoggedIn(true); setLoginError(''); showToast(`Welcome back, ${matched.name}!`); }
        else { setLoginError('Invalid Security PIN or Inactive User.'); }
      };

      const handleAddMaster = async (e) => {
        e.preventDefault();
        const newEntry = { id: Date.now(), name: masterForm.name };
        const currentList = masterData[currentMasterType] || [];
        const updatedList = [...currentList, newEntry];
        const updatedData = { ...masterData, [currentMasterType]: updatedList };
        
        await fetch(FIREBASE_MASTER_URL, { method: 'PUT', body: JSON.stringify(updatedData) });
        setMasterData(updatedData);
        setMasterForm({ name: '' });
        showToast(`Added to ${currentMasterType} successfully.`);
      };

      // Basic add asset logic (Demo of Audit Log)
      const handleSaveAsset = async (e) => {
        e.preventDefault();
        const beforeData = editingAsset ? { ...editingAsset } : null;
        // Normally formData logic here. For brevity, we are just logging the action.
        await saveAuditLog('assets', editingAsset ? 'UPDATE' : 'CREATE', beforeData, { particulars: "New/Updated Asset" });
        showToast("Asset Saved & Audit Log Created.");
        setIsModalOpen(false);
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-6">
              <h1 className="text-xl font-extrabold text-center">IT Asset Portal Login</h1>
              <form onSubmit={handleLogin} className="space-y-4">
                <input type="password" placeholder="Enter PIN (e.g. 1234)" value={pinInput} onChange={e => setPinInput(e.target.value)} className="w-full p-3 border rounded-xl text-center text-xl tracking-widest outline-none focus:ring-2 focus:ring-blue-500" />
                {loginError && <p className="text-rose-600 text-xs font-bold text-center">{loginError}</p>}
                <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">Login</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-slate-100 overflow-hidden text-slate-800">
          {toastMsg && <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold">{toastMsg}</div>}

          {/* SIDEBAR */}
          <aside className="w-64 neon-sidebar text-white flex flex-col p-5">
            <h2 className="text-sm font-extrabold tracking-wider uppercase mb-6">IT Asset Management</h2>
            <nav className="space-y-2 text-xs font-semibold flex-1">
              <button onClick={() => setActiveTab('inventory')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'inventory' ? 'active-neon-btn' : 'text-slate-400 hover:bg-slate-800'}`}>Stock Register</button>
              <button onClick={() => setActiveTab('master')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'master' ? 'active-neon-btn' : 'text-slate-400 hover:bg-slate-800'}`}>Master Data (New)</button>
              <button onClick={() => setActiveTab('sql')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'sql' ? 'active-neon-btn' : 'text-slate-400 hover:bg-slate-800'}`}>SQL Playground ⭐</button>
              <button onClick={() => setActiveTab('safety')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'safety' ? 'active-neon-btn' : 'text-slate-400 hover:bg-slate-800'}`}>Data Safety & Logs</button>
            </nav>
            <button onClick={() => setIsLoggedIn(false)} className="mt-4 py-2 bg-slate-800 text-rose-400 rounded-xl text-xs font-bold">Logout</button>
          </aside>

          {/* MAIN CONTENT */}
          <main className="flex-1 p-6 overflow-auto">
            
            {/* INVENTORY TAB (Simplified for this update) */}
            {activeTab === 'inventory' && (
              <div className="space-y-4">
                <header className="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
                  <h1 className="text-base font-extrabold">Stock Register</h1>
                  <button onClick={() => { setEditingAsset(null); setIsModalOpen(true); }} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">+ Add Asset</button>
                </header>
                <div className="bg-white rounded-xl shadow-sm p-4 overflow-auto">
                  <table className="w-full text-xs text-left">
                    <thead className="bg-slate-100"><tr><th className="p-2">Particulars</th><th className="p-2">Group</th><th className="p-2">Location</th><th className="p-2">Opening</th></tr></thead>
                    <tbody>
                      {assets.map(a => <tr key={a.id} className="border-b"><td className="p-2">{a.particulars}</td><td className="p-2">{a.group}</td><td className="p-2">{a.location}</td><td className="p-2">{a.openingQty}</td></tr>)}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* MASTER DATA TAB */}
            {activeTab === 'master' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm space-y-6">
                <h2 className="text-lg font-extrabold">Master Data Manager</h2>
                <div className="flex gap-4">
                  <div className="w-1/3 space-y-2">
                    {['groups', 'locations', 'brands', 'units'].map(type => (
                      <button key={type} onClick={() => setCurrentMasterType(type)} className={`w-full text-left px-4 py-3 rounded-xl capitalize font-bold text-sm ${currentMasterType === type ? 'bg-blue-100 text-blue-700' : 'hover:bg-slate-50 text-slate-600'}`}>
                        {type}
                      </button>
                    ))}
                  </div>
                  <div className="w-2/3 border-l pl-6 space-y-4">
                    <form onSubmit={handleAddMaster} className="flex gap-2">
                      <input required type="text" placeholder={`Add new ${currentMasterType.slice(0,-1)}`} value={masterForm.name} onChange={e => setMasterForm({name: e.target.value})} className="flex-1 p-2 border rounded-lg text-sm" />
                      <button type="submit" className="px-4 bg-blue-600 text-white rounded-lg font-bold text-sm">Add</button>
                    </form>
                    <ul className="space-y-2">
                      {(masterData[currentMasterType] || []).map((item, idx) => (
                        <li key={idx} className="p-3 bg-slate-50 border rounded-lg flex justify-between text-sm font-semibold">{item.name} <span className="text-xs text-slate-400">Active</span></li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            )}

            {/* SQL PLAYGROUND TAB */}
            {activeTab === 'sql' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                <header className="flex justify-between items-center border-b pb-4">
                  <div>
                    <h2 className="text-lg font-extrabold">SQL Playground ⭐</h2>
                    <p className="text-xs text-slate-500">Practice SQL queries on your live Asset data (Read-only).</p>
                  </div>
                  <button onClick={runSqlQuery} className="px-6 py-2 bg-emerald-600 text-white rounded-xl font-bold text-sm shadow hover:bg-emerald-700">▶ Run Query</button>
                </header>
                
                <div className="grid grid-cols-4 gap-4">
                  {/* Schema Info */}
                  <div className="col-span-1 bg-slate-50 p-4 rounded-xl text-xs space-y-2 border">
                    <h3 className="font-bold text-slate-800 mb-2">Available Table</h3>
                    <div className="p-2 bg-white rounded border font-mono font-bold text-blue-600">assets</div>
                    <ul className="list-disc pl-4 space-y-1 text-slate-600">
                      <li>id</li>
                      <li>group</li>
                      <li>particulars</li>
                      <li>brand</li>
                      <li>location</li>
                      <li>openingQty</li>
                      <li>newPurchase</li>
                      <li>issueItems</li>
                      <li>shortItems</li>
                      <li>deadItems</li>
                    </ul>
                  </div>
                  
                  {/* Editor & Results */}
                  <div className="col-span-3 space-y-4">
                    <textarea className="sql-editor" value={sqlQuery} onChange={e => setSqlQuery(e.target.value)} spellCheck="false" />
                    {sqlError && <div className="p-3 bg-rose-50 text-rose-700 font-mono text-xs rounded-xl border border-rose-200"><strong>Error:</strong> {sqlError}</div>}
                    
                    {sqlResult && (
                      <div className="border rounded-xl overflow-hidden">
                        <table className="w-full text-xs text-left font-mono">
                          <thead className="bg-slate-800 text-white">
                            <tr>{sqlResult.cols.map(c => <th key={c} className="p-2">{c}</th>)}</tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {sqlResult.vals.map((row, i) => (
                              <tr key={i} className="hover:bg-blue-50">
                                {row.map((val, j) => <td key={j} className="p-2">{val !== null ? val.toString() : 'NULL'}</td>)}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* DATA SAFETY TAB */}
            {activeTab === 'safety' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm space-y-6">
                <h2 className="text-lg font-extrabold">Data Safety & Audit Logs</h2>
                <p className="text-xs text-slate-500">Every add, edit, and delete action is recorded here automatically. (Option A Backup Applied)</p>
                
                <div className="border rounded-xl overflow-auto max-h-96">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-800 text-white sticky top-0">
                      <tr>
                        <th className="p-3">Time</th>
                        <th>Module</th>
                        <th>Action</th>
                        <th>Details</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {auditLogs.length === 0 ? (
                        <tr><td colSpan="4" className="p-4 text-center text-slate-400">No audit logs found yet. Try adding an asset.</td></tr>
                      ) : (
                        auditLogs.map((log, i) => (
                          <tr key={i} className="hover:bg-slate-50">
                            <td className="p-3 font-mono text-slate-500">{log.timestamp}</td>
                            <td className="font-bold">{log.module}</td>
                            <td><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${log.action === 'CREATE' ? 'bg-emerald-100 text-emerald-700' : log.action === 'DELETE' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}>{log.action}</span></td>
                            <td className="text-slate-500">Record modified safely.</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
